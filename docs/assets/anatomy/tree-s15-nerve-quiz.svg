  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">고실·혀·인두·후두의 신경 — 분지 퀴즈판<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> ear, tongue, pharynx &amp; larynx</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">15회차 · 얼굴신경은 고실 벽을 지나며 가지를 내고, 혀는 네 신경이 나누며, 인두·후두는 미주신경이 거의 다 맡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">번호를 보고 이름을 답하시오 · 정답은 대응 문항 카드 frontmatter</text>
