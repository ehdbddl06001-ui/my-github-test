  <text x="26" y="1376" fill="#93a4b7" font-size="10.5">음부신경은 <tspan fill="#e6edf3" font-weight="700">골반을 한 번 나갔다 다시 들어온다</tspan> — 궁둥구멍 두 개를 연달아 쓴다.</text>
