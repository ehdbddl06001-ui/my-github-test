<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="갈비사이공간의 세 근육층과 신경혈관다발 — 얕은층에서 깊은층 순서, 갈비사이고랑 안의 정맥·동맥·신경 배열, 갈비뼈 위모서리 천자 원칙을 그린 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn, Lane A). 카데바 사진을 본뜬 것이 아니라 교과식 구도로 새로 그렸다.
       근거: 4회차(2026-08-27) 실습주제 §가슴벽 + 4회차 서브노트(anatomy-2026-0111) 7절 표.
       핵심 ① 얕은 → 깊은: 피부 · 바깥 · 속 · [신경혈관면] · 맨속 · 가슴내근막 · 벽쪽가슴막
             ② 섬유 방향이 서로 반대 — 바깥은 뒤위→앞아래, 속은 그 반대
             ③ 다발은 속과 맨속 "사이"를 지나고, 갈비사이고랑 안에서 위→아래 정 · 동 · 신
             ④ 신경이 가장 아래·가장 얕으므로 천자는 아래갈비뼈 위모서리를 따라 넣는다 -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">갈비사이공간 — 세 층, 그리고 그 사이의 다발
    <tspan fill="#93a4b7" font-size="12" font-weight="400">intercostal space — layers &amp; neurovascular bundle</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과식 구도) · 근거: 4회차(2026-08-27) 실습주제 §가슴벽 · 오른쪽 가슴벽을 앞에서 자른 단면</text>
  <text x="20" y="68" fill="#6f8299" font-size="11">근육 <tspan fill="#7fd3a4">초록</tspan> / 깊은층 <tspan fill="#f0b56b">주황</tspan> / 신경 <tspan fill="#9cc3ff">파랑</tspan> / 동맥 <tspan fill="#e0645f">빨강</tspan> / 정맥 <tspan fill="#b49ae0">보라</tspan> / 가슴막 <tspan fill="#7fd4c8">청록</tspan></text>
  <text x="20" y="86" fill="#5d6f83" font-size="10">※ 갈비사이신경은 <tspan fill="#9cc3ff">T1–T11 앞가지</tspan> — 뒤가지가 아니다. 등 근육의 얕은·깊은층 규칙(2회차)과 헷갈리지 말 것.</text>

  <!-- ============================================================= 패널 1 : 층 순서 -->
  <rect x="30" y="100" width="470" height="460" fill="none" stroke="#2c4159" stroke-width="1.4" rx="6"/>
  <text x="44" y="124" fill="#7fd3a4" font-size="13" class="kr">1. 층 순서 <tspan fill="#6f8299" font-size="10" font-weight="400">얕은 → 깊은 (피부에서 허파 쪽으로)</tspan></text>

  <!-- 깊이 화살표 -->
  <path d="M 46,150 L 46,404" fill="none" stroke="#3d5166" stroke-width="1.2"/>
  <path d="M 46,404 l -4,-8 l 8,0 Z" fill="#3d5166"/>
  <text x="40" y="278" fill="#6f8299" font-size="9.5" text-anchor="middle" transform="rotate(-90 40 278)">깊어진다 deep →</text>

  <!-- 층 밴드 -->
  <rect x="60" y="148" width="260" height="26" fill="#2a3648" stroke="#55677d" stroke-width="1.4" rx="3"/>
  <rect x="60" y="178" width="260" height="42" fill="#2f5a44" stroke="#5aa87f" stroke-width="1.6" rx="3"/>
  <rect x="60" y="224" width="260" height="42" fill="#3d6b52" stroke="#8ed3ac" stroke-width="1.6" rx="3"/>
  <rect x="60" y="270" width="260" height="22" fill="#3a3320" stroke="#eab308" stroke-width="1.6" rx="3" stroke-dasharray="5 3"/>
  <rect x="60" y="296" width="260" height="34" fill="#5a4324" stroke="#f0b56b" stroke-width="1.6" rx="3"/>
  <rect x="60" y="334" width="260" height="20" fill="#33404f" stroke="#7b8ea3" stroke-width="1.4" rx="3"/>
  <rect x="60" y="358" width="260" height="14" fill="#1d4a46" stroke="#7fd4c8" stroke-width="1.6" rx="3"/>
  <rect x="60" y="376" width="260" height="30" fill="#141f2e" stroke="#2c4159" stroke-width="1.2" rx="3"/>

  <!-- 섬유 방향 빗금 : 바깥은 뒤위→앞아래 -->
  <g stroke="#8ed3ac" stroke-width="1.5" opacity="0.75">
    <path d="M 72,182 L 96,216"/><path d="M 108,182 L 132,216"/><path d="M 144,182 L 168,216"/>
    <path d="M 180,182 L 204,216"/><path d="M 216,182 L 240,216"/><path d="M 252,182 L 276,216"/>
  </g>
  <text x="290" y="203" fill="#cfe9db" font-size="9" text-anchor="end">뒤위 → 앞아래</text>
  <!-- 속은 반대 -->
  <g stroke="#b7ecd0" stroke-width="1.5" opacity="0.75">
    <path d="M 72,262 L 96,228"/><path d="M 108,262 L 132,228"/><path d="M 144,262 L 168,228"/>
    <path d="M 180,262 L 204,228"/><path d="M 216,262 L 240,228"/><path d="M 252,262 L 276,228"/>
  </g>
  <text x="290" y="249" fill="#cfe9db" font-size="9" text-anchor="end">앞위 → 뒤아래</text>

  <!-- 신경혈관면 안의 세 점 -->
  <circle cx="150" cy="281" r="5" fill="#b49ae0" stroke="#0e1826" stroke-width="1"/>
  <circle cx="168" cy="281" r="5" fill="#e0645f" stroke="#0e1826" stroke-width="1"/>
  <circle cx="186" cy="281" r="5" fill="#9cc3ff" stroke="#0e1826" stroke-width="1"/>
  <text x="200" y="285" fill="#eab308" font-size="9.5" class="kr">→ 배열은 오른쪽 패널</text>

  <!-- 라벨 (오른쪽 여백 열) -->
  <g stroke="#55677d" stroke-width="1">
    <path d="M 320,161 L 336,161"/><path d="M 320,199 L 336,199"/><path d="M 320,245 L 336,245"/>
    <path d="M 320,281 L 336,281"/><path d="M 320,313 L 336,313"/><path d="M 320,344 L 336,344"/>
    <path d="M 320,365 L 336,365"/><path d="M 320,391 L 336,391"/>
  </g>
  <text x="342" y="158" fill="#c6d2df" font-size="11" class="kr">피부 · 얕은근막</text>
  <text x="342" y="170" fill="#7b8ea3" font-size="8.5">skin &amp; superficial fascia</text>
  <text x="342" y="196" fill="#8ed3ac" font-size="11.5" class="kr">바깥갈비사이근</text>
  <text x="342" y="208" fill="#7b8ea3" font-size="8.5">external intercostal m.</text>
  <text x="342" y="242" fill="#b7ecd0" font-size="11.5" class="kr">속갈비사이근</text>
  <text x="342" y="254" fill="#7b8ea3" font-size="8.5">internal intercostal m.</text>
  <text x="342" y="278" fill="#eab308" font-size="11" class="kr">신경혈관면</text>
  <text x="342" y="290" fill="#7b8ea3" font-size="8.5">neurovascular plane — 정 · 동 · 신</text>
  <text x="342" y="310" fill="#f0b56b" font-size="11.5" class="kr">맨속갈비사이근</text>
  <text x="342" y="322" fill="#7b8ea3" font-size="8.5">innermost intercostal m.</text>
  <text x="342" y="347" fill="#a9b8c8" font-size="10.5" class="kr">가슴내근막 <tspan fill="#7b8ea3" font-size="8.5" font-weight="400">endothoracic f.</tspan></text>
  <text x="342" y="368" fill="#7fd4c8" font-size="10.5" class="kr">벽쪽가슴막 <tspan fill="#7b8ea3" font-size="8.5" font-weight="400">parietal pleura</tspan></text>
  <text x="342" y="394" fill="#6f8299" font-size="10.5" class="kr">가슴막안 · 허파 <tspan fill="#7b8ea3" font-size="8.5" font-weight="400">pleural cavity</tspan></text>

  <!-- 패널 1 하단 메모 -->
  <rect x="46" y="420" width="440" height="60" fill="#141f2e" stroke="#2c4159" stroke-width="1.2" rx="4"/>
  <text x="58" y="438" fill="#eab308" font-size="10.5" class="kr">앞뒤로 가면 근육이 막으로 바뀐다</text>
  <text x="58" y="454" fill="#c6d2df" font-size="10">· 바깥갈비사이근 → <tspan fill="#8ed3ac">앞쪽</tspan>에서 바깥갈비사이막 external intercostal membrane</text>
  <text x="58" y="470" fill="#c6d2df" font-size="10">· 속갈비사이근 → <tspan fill="#b7ecd0">뒤쪽</tspan>에서 속갈비사이막 internal intercostal membrane</text>

  <rect x="46" y="490" width="440" height="56" fill="#141f2e" stroke="#2c4159" stroke-width="1.2" rx="4"/>
  <text x="58" y="508" fill="#9cc3ff" font-size="10.5" class="kr">한 문장 요약</text>
  <text x="58" y="526" fill="#c6d2df" font-size="10.5">다발은 <tspan fill="#b7ecd0">속</tspan>과 <tspan fill="#f0b56b">맨속</tspan> <tspan fill="#eab308">사이</tspan>를 지난다 — 바깥과 속 사이가 아니다.</text>
  <text x="58" y="540" fill="#7b8ea3" font-size="9.5">두 번째와 세 번째 층 사이. 이 한 칸을 틀리면 천자 깊이 문항이 전부 틀린다.</text>

  <!-- ============================================================= 패널 2 : 갈비사이고랑 -->
  <rect x="515" y="100" width="335" height="460" fill="none" stroke="#2c4159" stroke-width="1.4" rx="6"/>
  <text x="529" y="124" fill="#e0645f" font-size="13" class="kr">2. 갈비사이고랑 <tspan fill="#6f8299" font-size="10" font-weight="400">costal groove — 위에서 아래로</tspan></text>

  <!-- 위갈비뼈 -->
  <rect x="560" y="150" width="250" height="52" rx="18" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <path d="M 606,202 Q 610,178 642,176 Q 676,174 686,202 Z" fill="#0e1826" stroke="#3d5166" stroke-width="1.4"/>
  <text x="583" y="170" fill="#7b8ea3" font-size="10" class="kr">위갈비뼈</text>
  <text x="583" y="181" fill="#6f8299" font-size="8.5">rib above</text>
  <text x="596" y="216" fill="#eab308" font-size="9.5" text-anchor="end">갈비사이고랑</text>
  <path d="M 600,212 L 622,201" fill="none" stroke="#eab308" stroke-width="1"/>

  <!-- 다발 : 위 → 아래 정 · 동 · 신 -->
  <circle cx="646" cy="192" r="9" fill="#b49ae0" stroke="#e6ddf7" stroke-width="1.4"/>
  <circle cx="646" cy="218" r="8" fill="#e0645f" stroke="#f5c3c1" stroke-width="1.4"/>
  <circle cx="646" cy="244" r="7.5" fill="#9cc3ff" stroke="#d9e9ff" stroke-width="1.4"/>
  <g stroke="#55677d" stroke-width="1">
    <path d="M 656,192 L 700,192"/><path d="M 655,218 L 700,218"/><path d="M 654,244 L 700,244"/>
  </g>
  <text x="706" y="189" fill="#b49ae0" font-size="11" class="kr">갈비사이정맥</text>
  <text x="706" y="201" fill="#7b8ea3" font-size="8.5">intercostal v. — 가장 위</text>
  <text x="706" y="215" fill="#e0645f" font-size="11" class="kr">갈비사이동맥</text>
  <text x="706" y="227" fill="#7b8ea3" font-size="8.5">intercostal a. — 가운데</text>
  <text x="706" y="241" fill="#9cc3ff" font-size="11" class="kr">갈비사이신경</text>
  <text x="706" y="253" fill="#7b8ea3" font-size="8.5">intercostal n. — 가장 아래</text>

  <!-- VAN 강조 -->
  <rect x="560" y="266" width="250" height="30" fill="#40201f" stroke="#e0645f" stroke-width="1.4" rx="4"/>
  <text x="685" y="286" fill="#f5c3c1" font-size="12.5" text-anchor="middle" class="kr">위 → 아래  정맥 · 동맥 · 신경  (V A N)</text>

  <!-- 근육층 (간략) -->
  <rect x="560" y="298" width="250" height="26" fill="#2f5a44" stroke="#5aa87f" stroke-width="1.4" rx="3"/>
  <text x="685" y="315" fill="#cfe9db" font-size="9.5" text-anchor="middle">바깥 · 속갈비사이근</text>
  <rect x="560" y="328" width="250" height="22" fill="#5a4324" stroke="#f0b56b" stroke-width="1.4" rx="3"/>
  <text x="685" y="343" fill="#f7dcb8" font-size="9.5" text-anchor="middle">맨속갈비사이근</text>

  <!-- 아래갈비뼈 -->
  <rect x="560" y="366" width="250" height="52" rx="18" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="685" y="397" fill="#7b8ea3" font-size="10" text-anchor="middle" class="kr">아래갈비뼈 <tspan font-weight="400" font-size="8.5">rib below</tspan></text>
  <path d="M 578,365 L 792,365" fill="none" stroke="#eab308" stroke-width="3.4" stroke-linecap="round"/>
  <text x="792" y="361" fill="#eab308" font-size="9" text-anchor="end" class="kr">위모서리 superior border</text>

  <!-- 천자 바늘 -->
  <path d="M 532,336 L 598,364" fill="none" stroke="#0e1826" stroke-width="6"/>
  <path d="M 532,336 L 598,364" fill="none" stroke="#e6edf3" stroke-width="2.4"/>
  <path d="M 598,364 l -11,-2 l 3,8 Z" fill="#e6edf3"/>
  <text x="533" y="328" fill="#e6edf3" font-size="10" class="kr">바늘</text>

  <rect x="529" y="430" width="307" height="52" fill="#141f2e" stroke="#eab308" stroke-width="1.2" rx="4"/>
  <text x="541" y="448" fill="#eab308" font-size="10.5" class="kr">천자 원칙</text>
  <text x="541" y="464" fill="#c6d2df" font-size="10">신경이 가장 아래에 있으니 <tspan fill="#eab308">아래갈비뼈의 위모서리</tspan>를</text>
  <text x="541" y="477" fill="#c6d2df" font-size="10">따라 넣는다 — 위갈비뼈 아래모서리를 긁으면 다발을 친다.</text>

  <rect x="529" y="490" width="307" height="56" fill="#141f2e" stroke="#2c4159" stroke-width="1.2" rx="4"/>
  <text x="541" y="508" fill="#7fd4c8" font-size="10.5" class="kr">임상 좌표</text>
  <text x="541" y="524" fill="#c6d2df" font-size="10">흉관 — 중간겨드랑선 4–5번 갈비사이공간(안전삼각)</text>
  <text x="541" y="538" fill="#c6d2df" font-size="10">남성 젖꼭지 — 대개 넷째 갈비사이공간 · T4 피부분절</text>

  <!-- ============================================================= 하단 : 동맥 문합 고리 -->
  <rect x="30" y="575" width="820" height="110" fill="none" stroke="#2c4159" stroke-width="1.4" rx="6"/>
  <text x="44" y="597" fill="#e0645f" font-size="12.5" class="kr">3. 동맥은 앞뒤에서 만나 고리를 이룬다 <tspan fill="#6f8299" font-size="10" font-weight="400">anastomosis — 닫힌 고리</tspan></text>

  <!-- 대동맥 (왼쪽 세로) -->
  <path d="M 120,610 L 120,672" fill="none" stroke="#e0645f" stroke-width="7"/>
  <text x="74" y="637" fill="#e0645f" font-size="10.5" text-anchor="middle" class="kr">가슴대동맥</text>
  <text x="74" y="650" fill="#7b8ea3" font-size="8.5" text-anchor="middle">thoracic aorta</text>
  <!-- 속가슴동맥 (오른쪽 세로) -->
  <path d="M 720,610 L 720,672" fill="none" stroke="#e0645f" stroke-width="7"/>
  <text x="732" y="631" fill="#e0645f" font-size="10.5" class="kr">속가슴동맥</text>
  <text x="732" y="643" fill="#7b8ea3" font-size="8.5">internal thoracic a.</text>
  <!-- 세 개의 고리 -->
  <g stroke="#e0645f" stroke-width="3.4" fill="none">
    <path d="M 124,622 L 420,622"/><path d="M 716,622 L 420,622"/>
    <path d="M 124,641 L 420,641"/><path d="M 716,641 L 420,641"/>
    <path d="M 124,660 L 420,660"/><path d="M 716,660 L 420,660"/>
  </g>
  <g fill="#eab308">
    <circle cx="420" cy="622" r="4.5"/><circle cx="420" cy="641" r="4.5"/><circle cx="420" cy="660" r="4.5"/>
  </g>
  <text x="252" y="617" fill="#c98a86" font-size="9.5" text-anchor="middle">뒤갈비사이동맥 posterior intercostal a.</text>
  <text x="576" y="617" fill="#c98a86" font-size="9.5" text-anchor="middle">앞갈비사이동맥 anterior intercostal a.</text>
  <text x="420" y="676" fill="#eab308" font-size="9.5" text-anchor="middle" class="kr">문합점</text>
  <text x="732" y="659" fill="#6f8299" font-size="8.5">1–2번 갈비사이는</text>
  <text x="732" y="670" fill="#6f8299" font-size="8.5">갈비목동맥에서 온다</text>
</svg>
