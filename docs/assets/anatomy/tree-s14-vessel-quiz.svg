  <text x="26" y="50" fill="#93a4b7" font-size="10.5">14회차 · 속엉덩동맥은 뒤줄기(벽쪽) · 앞줄기(내장+벽)로 갈리고, 골반 정맥은 얼기로 모여 속엉덩정맥으로 간다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · 번호를 보고 이름을 답하시오</text>
