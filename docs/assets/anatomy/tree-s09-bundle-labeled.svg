  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 겨드랑·허파뿌리·뒤세로칸<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> neurovascular bundles of the axilla &amp; mediastinum</tspan></text>
