<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="등 근육 3층 태깅 퀴즈판 — 번호핀 7개, 라벨 제거">
  <!-- 자체 제작 도해(claude-drawn). 층을 겹쳐 그리면 서로 가려 읽히지 않으므로
       교과서 방식대로 '층별 분할 패널'로 구성했다(뒤에서 본 모습, 3패널 동일 구도).
       근거: 2회차(0818) 실습영상 §얕은층 근육 + 해부2 인제스트 pages 카드.
       핵심 규칙: 얕은층 = 앞가지(등세모근만 XI), 중간층 = 갈비사이신경, 깊은층 = 뒤가지. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
    .en{fill:#6f8299}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <defs>
    <!-- 공통 몸통 실루엣 (200 x 340) -->
    <g id="torso">
      <path d="M 78,8 L 122,8 C 138,26 168,40 192,60 C 200,66 200,76 192,82
               C 170,98 160,130 157,160 C 154,205 153,250 157,300 L 159,332
               L 41,332 L 43,300 C 47,250 46,205 43,160 C 40,130 30,98 8,82
               C 0,76 0,66 8,60 C 32,40 62,26 78,8 Z"
            fill="#162436" stroke="#3b506a" stroke-width="1.8"/>
      <line x1="100" y1="14" x2="100" y2="326" stroke="#2b3a4d" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- ============ 패널 1 : 얕은층 ============ -->
  <rect x="18" y="82" width="272" height="452" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <g transform="translate(54,132)">
    <use href="#torso"/>
    <!-- 등세모근 (kite) -->
    <path d="M 100,12 L 24,66 L 52,92 L 100,205 L 148,92 L 176,66 Z"
          fill="#31597f" stroke="#6ba0d0" stroke-width="1.6"/>
    <!-- 넓은등근 좌우 -->
    <path d="M 100,150 L 100,302 L 42,306 C 44,242 46,182 28,118 C 60,130 84,140 100,150 Z"
          fill="#25455f" stroke="#4d7fb0" stroke-width="1.5"/>
    <path d="M 100,150 L 100,302 L 158,306 C 156,242 154,182 172,118 C 140,130 116,140 100,150 Z"
          fill="#25455f" stroke="#4d7fb0" stroke-width="1.5"/>
    <!-- 임상 삼각 -->
    <circle cx="132" cy="196" r="11" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle cx="60" cy="288" r="10" fill="none" stroke="#eab308" stroke-width="1.4" stroke-dasharray="3 3"/>
    <!-- 근육 이름 -->
    </g>

  
  <!-- ============ 패널 2 : 중간층 ============ -->
  <rect x="304" y="82" width="272" height="452" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <g transform="translate(340,132)">
    <use href="#torso"/>
    <!-- 갈비뼈 힌트 -->
    <g stroke="#2f4257" stroke-width="1.2" fill="none">
      <path d="M 96,60 C 74,64 56,74 44,88"/><path d="M 96,80 C 72,84 52,96 40,112"/>
      <path d="M 96,100 C 72,104 52,116 40,134"/><path d="M 96,206 C 74,204 58,196 48,184"/>
      <path d="M 96,226 C 74,224 56,214 46,200"/>
      <path d="M 104,60 C 126,64 144,74 156,88"/><path d="M 104,80 C 128,84 148,96 160,112"/>
      <path d="M 104,100 C 128,104 148,116 160,134"/><path d="M 104,206 C 126,204 142,196 152,184"/>
      <path d="M 104,226 C 126,224 144,214 154,200"/>
    </g>
    <!-- 위뒤톱니근 (C7–T3 → 2–5갈비뼈) -->
    <path d="M 96,44 L 96,64 C 74,72 58,86 48,104 L 36,92 C 50,70 70,52 96,44 Z"
          fill="#2c5744" stroke="#5aa87f" stroke-width="1.5"/>
    <path d="M 104,44 L 104,64 C 126,72 142,86 152,104 L 164,92 C 150,70 130,52 104,44 Z"
          fill="#2c5744" stroke="#5aa87f" stroke-width="1.5"/>
    <!-- 아래뒤톱니근 (T11–L2 → 9–12갈비뼈) -->
    <path d="M 96,244 L 96,262 C 74,254 58,240 48,222 L 36,232 C 50,252 70,268 96,244 Z"
          fill="#2c5744" stroke="#5aa87f" stroke-width="1.5"/>
    <path d="M 104,244 L 104,262 C 126,254 142,240 152,222 L 164,232 C 150,252 130,268 104,244 Z"
          fill="#2c5744" stroke="#5aa87f" stroke-width="1.5"/>
    </g>

  
  <!-- ============ 패널 3 : 깊은층 ============ -->
  <rect x="590" y="82" width="272" height="452" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <g transform="translate(626,132)">
    <use href="#torso"/>
    <!-- 척주세움근 3기둥 (좌우) : 가쪽 엉덩갈비 · 중간 가장긴 · 안쪽 가시 -->
    <path d="M 60,104 C 56,170 58,240 64,306 L 80,306 C 74,240 72,170 76,104 Z"
          fill="#6b4c2c" stroke="#c08a45" stroke-width="1.4"/>
    <path d="M 78,98 C 74,166 76,240 82,306 L 94,306 C 88,240 86,166 90,98 Z"
          fill="#7d5a33" stroke="#c08a45" stroke-width="1.4"/>
    <path d="M 92,94 C 90,164 92,240 96,306 L 100,306 L 100,94 Z"
          fill="#8e673b" stroke="#c08a45" stroke-width="1.4"/>
    <path d="M 140,104 C 144,170 142,240 136,306 L 120,306 C 126,240 128,170 124,104 Z"
          fill="#6b4c2c" stroke="#c08a45" stroke-width="1.4"/>
    <path d="M 122,98 C 126,166 124,240 118,306 L 106,306 C 112,240 114,166 110,98 Z"
          fill="#7d5a33" stroke="#c08a45" stroke-width="1.4"/>
    <path d="M 108,94 C 110,164 108,240 104,306 L 100,306 L 100,94 Z"
          fill="#8e673b" stroke="#c08a45" stroke-width="1.4"/>
    <!-- 가로돌기가시근육 (더 깊은 층) 힌트 -->
    <g stroke="#a97a3f" stroke-width="1" opacity="0.7" fill="none">
      <path d="M 100,120 L 86,146"/><path d="M 100,150 L 86,176"/><path d="M 100,180 L 86,206"/>
      <path d="M 100,210 L 86,236"/><path d="M 100,240 L 86,266"/>
      <path d="M 100,120 L 114,146"/><path d="M 100,150 L 114,176"/><path d="M 100,180 L 114,206"/>
      <path d="M 100,210 L 114,236"/><path d="M 100,240 L 114,266"/>
    </g>
    <g stroke="#7d5a33" stroke-width="1" fill="none">
      <path d="M 143,146 L 132,152"/><path d="M 143,192 L 120,198"/><path d="M 143,238 L 107,244"/>
    </g>
    <path d="M 133,284 L 112,272" stroke="#7d5a33" stroke-width="1" fill="none"/>
  </g>

  
  <!-- ============ 하단 요약 ============ -->
  
  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">등 근육 3층 — 태깅 연습판<tspan fill="#93a4b7" font-size="12" font-weight="400"> muscles of the back — tagging quiz</tspan></text><text x="20" y="50" fill="#93a4b7" font-size="11">번호핀 ①~⑦의 이름(한·영)과 <tspan fill="#e6edf3">지배신경</tspan>을 말하시오. 왼쪽 패널부터 얕은층 → 중간층 → 깊은층.</text><text x="20" y="68" fill="#6f8299" font-size="11">정답은 대응 문항 카드(anatomy-2026-0027) frontmatter에 있다.</text><text x="34" y="106" fill="#9dc7f0" font-size="13" font-weight="700">얕은층</text><text x="320" y="106" fill="#79c9a2" font-size="13" font-weight="700">중간층</text><text x="606" y="106" fill="#e3a765" font-size="13" font-weight="700">깊은층</text><circle cx="154" cy="214" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="154" y="219" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">1</text><circle cx="112" cy="368" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="112" y="373" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">2</text><circle cx="392" cy="214" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="392" y="219" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">3</text><circle cx="392" cy="368" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="392" y="373" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">4</text><circle cx="694" cy="250" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="694" y="255" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">5</text><circle cx="712" cy="320" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="712" y="325" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">6</text><circle cx="724" cy="392" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="724" y="397" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">7</text><rect x="18" y="548" width="844" height="60" rx="10" fill="#121e2e" stroke="#2b3a4d"/><text x="34" y="572" fill="#93a4b7" font-size="12" font-weight="700">답안 칸 — 근육 이름 + 지배신경</text><text x="34" y="596" fill="#eab308" font-size="12" font-weight="700">1.</text><line x1="50" y1="598" x2="142" y2="598" stroke="#3d5166" stroke-width="1.2"/><text x="152" y="596" fill="#eab308" font-size="12" font-weight="700">2.</text><line x1="168" y1="598" x2="260" y2="598" stroke="#3d5166" stroke-width="1.2"/><text x="270" y="596" fill="#eab308" font-size="12" font-weight="700">3.</text><line x1="286" y1="598" x2="378" y2="598" stroke="#3d5166" stroke-width="1.2"/><text x="388" y="596" fill="#eab308" font-size="12" font-weight="700">4.</text><line x1="404" y1="598" x2="496" y2="598" stroke="#3d5166" stroke-width="1.2"/><text x="506" y="596" fill="#eab308" font-size="12" font-weight="700">5.</text><line x1="522" y1="598" x2="614" y2="598" stroke="#3d5166" stroke-width="1.2"/><text x="624" y="596" fill="#eab308" font-size="12" font-weight="700">6.</text><line x1="640" y1="598" x2="732" y2="598" stroke="#3d5166" stroke-width="1.2"/><text x="742" y="596" fill="#eab308" font-size="12" font-weight="700">7.</text><line x1="758" y1="598" x2="850" y2="598" stroke="#3d5166" stroke-width="1.2"/>
</svg>
