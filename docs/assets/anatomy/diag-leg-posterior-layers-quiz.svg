<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="종아리 뒤칸 퀴즈판 — 라벨을 지우고 번호핀 1-12 만 남긴 태깅 연습용 도해">
  <!-- 자체 제작 도해(claude-drawn). 오른쪽 다리를 뒤에서 본 구도 — 가쪽 = 화면 왼쪽.
       근거: 3회차(0825) 실습영상 §종아리 뒤부위 + 3회차 종합정리(anatomy-2026-0022) 5절 근육표.
       카데바 사진을 본뜬 것이 아니라 교과식 구도로 새로 그린 도식이다(Lane A).
             ③ 두 층 모두 정강신경 지배 · 혈류는 뒤정강동맥(+종아리동맥)
             ④ 안쪽복사 뒤 앞→뒤 순서 Tom, Dick ANd Harry. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">종아리 뒤칸 — 번호핀 태깅 (퀴즈판)
    <tspan fill="#93a4b7" font-size="12" font-weight="400">posterior compartment of leg</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">번호핀 1–12 의 구조 이름을 한글용어 (원어) 로 답하시오 · 오른쪽 다리를 뒤에서 본 모습</text>
  <text x="20" y="68" fill="#6f8299" font-size="11">색은 층·조직 구분용이다: 초록/주황 = 근육 두 층, 파랑 = 신경, 빨강 = 동맥, 회백 = 힘줄</text>
  <text x="20" y="86" fill="#5d6f83" font-size="10">← 가쪽 lateral   |   안쪽 medial →      ※ 답안은 학습평가 시트 규정(한글용어 또는 원어, 약자 a. v. n. m.)을 따른다</text>

  <!-- ============================================================= 얕은층 패널 -->
