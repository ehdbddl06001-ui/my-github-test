  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">척수신경의 시작과 샅의 신경 — 음부신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> spinal nerve roots &amp; the pudendal nerve</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">12회차 · 척주관에서 신경이 태어나고, 샅에서는 음부신경 하나가 거의 전부를 맡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
