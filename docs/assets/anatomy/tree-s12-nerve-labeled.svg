  <rect x="26" y="758" width="180" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="778" fill="#9cc3ff" font-size="12" class="kr">12회차의 신경</text>
  <rect x="232" y="315" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="335" fill="#9cc3ff" font-size="12" class="kr">척수신경의 시작 ★</text>
  <text x="242" y="350" fill="#7f9cc4" font-size="9">roots of the spinal nerve</text>
  <text x="242" y="361" fill="#6f8299" font-size="9">척주관을 열면 보이는 순서</text>
  <rect x="232" y="845" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="865" fill="#9cc3ff" font-size="12" class="kr">음부신경 ★</text>
  <text x="242" y="880" fill="#7f9cc4" font-size="9">pudendal n.</text>
  <text x="242" y="891" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">S2–S4 앞가지</tspan> · 샅의 주인</text>
  <rect x="232" y="1170" width="174" height="77" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="1190" fill="#9cc3ff" font-size="12" class="kr">샅을 함께 맡는 곁들</text>
  <text x="242" y="1206" fill="#7f9cc4" font-size="9">other nerves reaching the</text>
  <text x="242" y="1216" fill="#7f9cc4" font-size="9">perineum</text>
  <text x="242" y="1228" fill="#6f8299" font-size="9">음부신경만으로 다 덮이지 않는</text>
  <text x="242" y="1238" fill="#6f8299" font-size="9">가장자리</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">앞뿌리 ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">ventral root</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">운동 — 척수 앞가쪽고랑에서 여러</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">뿌리실로 나온다</text>
  <rect x="432" y="168" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="188" fill="#9cc3ff" font-size="12" class="kr">뒤뿌리 ★</text>
  <text x="442" y="203" fill="#7f9cc4" font-size="9">dorsal root</text>
  <text x="442" y="214" fill="#6f8299" font-size="9">감각 — 뒤가쪽고랑으로 들어간다</text>
  <rect x="432" y="264" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="284" fill="#9cc3ff" font-size="12" class="kr">척수신경줄기 ★</text>
  <text x="442" y="299" fill="#7f9cc4" font-size="9">trunk of spinal n.</text>
  <text x="442" y="310" fill="#6f8299" font-size="9">앞뿌리+뒤뿌리가 <tspan fill="#e6edf3" font-weight="700">척추사이구멍에서</tspan></text>
  <text x="442" y="321" fill="#6f8299" font-size="9">합쳐진 짧은 줄기</text>
  <rect x="432" y="370" width="170" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="390" fill="#9cc3ff" font-size="12" class="kr">말총 ★</text>
  <text x="442" y="405" fill="#7f9cc4" font-size="9">cauda equina</text>
  <text x="442" y="416" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">척수원뿔(L1–L2) 아래</tspan></text>
  <text x="442" y="427" fill="#6f8299" font-size="9">거미막밑공간을 채운 뿌리 다발 —</text>
  <text x="442" y="438" fill="#6f8299" font-size="9">허리천자 바늘이 밀어낸다</text>
  <rect x="432" y="456" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="476" fill="#9cc3ff" font-size="12" class="kr">종말끈 ★</text>
  <text x="442" y="491" fill="#7f9cc4" font-size="9">filum terminale</text>
  <text x="442" y="502" fill="#6f8299" font-size="9">연막이 이어진 실 · 속(경막 안)과</text>
  <text x="442" y="513" fill="#6f8299" font-size="9">겉(꼬리뼈에 붙음)으로 나뉜다</text>
  <rect x="432" y="531" width="170" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="551" fill="#9cc3ff" font-size="12" class="kr">치아인대 ★</text>
  <text x="442" y="566" fill="#7f9cc4" font-size="9">denticulate lig.</text>
  <text x="442" y="577" fill="#6f8299" font-size="9">연막이 <tspan fill="#e6edf3" font-weight="700">앞뒤뿌리 사이에서</tspan> 톱니처럼</text>
  <text x="442" y="588" fill="#6f8299" font-size="9">뻗어 경막에 붙는다 — 척수를</text>
  <text x="442" y="599" fill="#6f8299" font-size="9">가운데 매단다</text>
  <rect x="432" y="639" width="170" height="88" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="659" fill="#9cc3ff" font-size="12" class="kr">골반을 나가는 길 ★</text>
  <text x="442" y="674" fill="#7f9cc4" font-size="9">course out of and back into the</text>
  <text x="442" y="685" fill="#7f9cc4" font-size="9">pelvis</text>
  <text x="442" y="696" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">큰궁둥구멍(궁둥구멍근 아래)으로</tspan></text>
  <text x="442" y="707" fill="#6f8299" font-size="9">나갔다가 엉치가시인대를 돌아</text>
  <text x="442" y="718" fill="#6f8299" font-size="9">작은궁둥구멍으로 다시 들어온다</text>
  <rect x="432" y="789" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="809" fill="#9cc3ff" font-size="12" class="kr">아래곧창자신경 ★</text>
  <text x="442" y="824" fill="#7f9cc4" font-size="9">inferior anal (rectal) n.</text>
  <text x="442" y="835" fill="#6f8299" font-size="9">관에서 <tspan fill="#e6edf3" font-weight="700">가장 먼저</tspan> 갈라져</text>
  <text x="442" y="846" fill="#6f8299" font-size="9">궁둥항문오목을 가로지른다</text>
  <rect x="432" y="925" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="945" fill="#9cc3ff" font-size="12" class="kr">샅신경 ★</text>
  <text x="442" y="960" fill="#7f9cc4" font-size="9">perineal n.</text>
  <text x="442" y="971" fill="#6f8299" font-size="9">관의 <tspan fill="#e6edf3" font-weight="700">아래쪽 끝가지</tspan> —</text>
  <text x="442" y="982" fill="#6f8299" font-size="9">얕은샅공간으로</text>
  <rect x="432" y="1034" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="1054" fill="#9cc3ff" font-size="12" class="kr">음경등신경 / 음핵등신경 ★</text>
  <text x="442" y="1069" fill="#7f9cc4" font-size="9">dorsal n. of penis / of clitoris</text>
  <text x="442" y="1080" fill="#6f8299" font-size="9">관의 <tspan fill="#e6edf3" font-weight="700">위쪽 끝가지</tspan> · 깊은샅공간을</text>
  <text x="442" y="1091" fill="#6f8299" font-size="9">지나 샅막을 뚫고 등쪽으로</text>
  <rect x="432" y="1109" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1129" fill="#9cc3ff" font-size="12" class="kr">엉덩샅굴신경 ★</text>
  <text x="442" y="1144" fill="#7f9cc4" font-size="9">ilioinguinal n.</text>
  <text x="442" y="1155" fill="#6f8299" font-size="9">L1 — 음낭·대음순 <tspan fill="#e6edf3" font-weight="700">앞쪽</tspan> 피부</text>
  <rect x="432" y="1173" width="170" height="81" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1193" fill="#9cc3ff" font-size="12" class="kr">넓적다리뒤피부신경</text>
  <text x="442" y="1208" fill="#9cc3ff" font-size="12" class="kr">샅가지</text>
  <text x="442" y="1223" fill="#7f9cc4" font-size="9">perineal br. of post. femoral</text>
  <text x="442" y="1234" fill="#7f9cc4" font-size="9">cutaneous n.</text>
  <text x="442" y="1245" fill="#6f8299" font-size="9">S1–S3 — 샅의 <tspan fill="#e6edf3" font-weight="700">가쪽</tspan> 피부</text>
  <rect x="432" y="1263" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1283" fill="#9cc3ff" font-size="12" class="kr">항문꼬리신경</text>
  <text x="442" y="1298" fill="#7f9cc4" font-size="9">anococcygeal nn.</text>
  <text x="442" y="1309" fill="#6f8299" font-size="9">S4–Co — 꼬리뼈 주위 피부</text>
  <rect x="628" y="167" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="187" fill="#9cc3ff" font-size="12" class="kr">척수신경절 ★</text>
  <text x="638" y="202" fill="#7f9cc4" font-size="9">spinal ganglion</text>
  <text x="638" y="213" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">척추사이구멍 안</tspan>에 부푼 덩이 —</text>
  <text x="638" y="224" fill="#6f8299" font-size="9">거짓홑극신경세포의 집</text>
  <rect x="628" y="242" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="262" fill="#9cc3ff" font-size="12" class="kr">앞가지 ★</text>
  <text x="638" y="277" fill="#7f9cc4" font-size="9">ventral ramus</text>
  <text x="638" y="288" fill="#6f8299" font-size="9">굵다 · 얼기를 만든다</text>
  <rect x="628" y="306" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="326" fill="#9cc3ff" font-size="12" class="kr">뒤가지 ★</text>
  <text x="638" y="341" fill="#7f9cc4" font-size="9">dorsal ramus</text>
  <text x="638" y="352" fill="#6f8299" font-size="9">가늘다 · 등 깊은층과 등 피부</text>
  <rect x="628" y="617" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="637" fill="#9cc3ff" font-size="12" class="kr">엉치가시인대 뒤 ★</text>
  <text x="638" y="652" fill="#7f9cc4" font-size="9">behind the sacrospinous lig.</text>
  <text x="638" y="663" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">음부신경 차단의 표지 —</tspan></text>
  <text x="638" y="674" fill="#6f8299" font-size="9">궁둥뼈가시</text>
  <rect x="628" y="692" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="712" fill="#9cc3ff" font-size="12" class="kr">음부신경관 ★</text>
  <text x="638" y="727" fill="#7f9cc4" font-size="9">pudendal canal (Alcock)</text>
  <text x="638" y="738" fill="#6f8299" font-size="9">속폐쇄근막이 만든 관 · <tspan fill="#e6edf3" font-weight="700">신경과</tspan></text>
  <text x="638" y="749" fill="#6f8299" font-size="9">속음부동·정맥이 함께<tspan fill="#e6edf3" font-weight="700"> 지난다</tspan></text>
  <rect x="628" y="767" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="787" fill="#9cc3ff" font-size="12" class="kr">바깥항문조임근 ★</text>
  <text x="638" y="802" fill="#7f9cc4" font-size="9">ext. anal sphincter m.</text>
  <text x="638" y="813" fill="#6f8299" font-size="9">운동</text>
  <rect x="628" y="831" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="851" fill="#9cc3ff" font-size="12" class="kr">항문 주위 피부</text>
  <text x="638" y="866" fill="#7f9cc4" font-size="9">perianal skin</text>
  <text x="638" y="877" fill="#6f8299" font-size="9">감각</text>
  <rect x="628" y="895" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="915" fill="#9cc3ff" font-size="12" class="kr">깊은(근육)가지 ★</text>
  <text x="638" y="930" fill="#7f9cc4" font-size="9">deep br.</text>
  <text x="638" y="941" fill="#6f8299" font-size="9">얕은샅가로근 · 궁둥해면체근 ·</text>
  <text x="638" y="952" fill="#6f8299" font-size="9">망울해면체근 + <tspan fill="#e6edf3" font-weight="700">바깥요도조임근</tspan></text>
  <rect x="628" y="970" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="990" fill="#9cc3ff" font-size="12" class="kr">뒤음낭신경 / 뒤음순신경 ★</text>
  <text x="638" y="1005" fill="#7f9cc4" font-size="9">post. scrotal / labial nn.</text>
  <text x="638" y="1016" fill="#6f8299" font-size="9">남·녀 바깥생식기 피부 감각</text>
  <rect x="628" y="1034" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1054" fill="#9cc3ff" font-size="12" class="kr">음경·음핵 귀두 감각 ★</text>
  <text x="638" y="1069" fill="#7f9cc4" font-size="9">glans</text>
  <text x="638" y="1080" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">성감각의 주 경로</tspan></text>
  <line x1="26" y1="1328" x2="814" y2="1328" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1340" fill="#93a4b7" font-size="10.5">척수는 <tspan fill="#e6edf3" font-weight="700">L1–L2에서 끝나지만 척주관은 계속 간다</tspan> — 그 길이차가 허리천자를 가능하게 한다.</text>
  <text x="26" y="1358" fill="#93a4b7" font-size="10.5">샅은 <tspan fill="#e6edf3" font-weight="700">음부신경(S2–S4) 하나</tspan>가 거의 전부 — 가지 셋의 이름이 그대로 답이다.</text>
  <text x="26" y="1376" fill="#93a4b7" font-size="10.5">음부신경은 <tspan fill="#e6edf3" font-weight="700">골반을 한 번 나갔다 다시 들어온다</tspan> — 궁둥구멍 두 개를 연달아 쓴다.</text>
</svg>
