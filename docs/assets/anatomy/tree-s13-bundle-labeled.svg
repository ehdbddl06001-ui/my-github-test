<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 1406" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="함께 지나는 것 — 다섯 자리 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 13회차 인제스트 섹션 a2-s12 §머리덮개의 층 · §뇌막 · §경막정맥굴 · §머리뼈 바닥면 · §눈확속의 구조물 · §가로막 · §콩팥 · §콩팥단면 + SESSION_DETAILS 응용과제(섬모체신경절 부교감 작용) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="1406" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 다섯 자리<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> five crowded places</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">13회차 · 머리덮개 · 해면정맥굴 · 눈확 입구 · 가로막 구멍 · 콩팥문 — 순서가 그대로 태깅 문제다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
