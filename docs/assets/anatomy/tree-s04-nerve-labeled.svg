<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1086" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="얼굴의 두 신경 — VII과 V — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 4회차 §얼굴신경 · 삼차신경 · 씹기근육 (부위 기준 배정) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1086" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">얼굴의 두 신경 — VII과 V<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> facial (VII) &amp; trigeminal (V) nerves</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">4회차 · 표정근육은 얼굴신경, 씹기근육과 피부감각은 삼차신경 — 인두굽이가 갈랐다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,286 H 419 V 125 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,286 H 419 V 194 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
