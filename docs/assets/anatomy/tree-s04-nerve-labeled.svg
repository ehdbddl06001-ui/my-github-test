  <rect x="26" y="496" width="180" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="516" fill="#9cc3ff" font-size="12" class="kr">얼굴에 오는 뇌신경</text>
  <text x="36" y="531" fill="#7f9cc4" font-size="9">cranial nn. of the face</text>
  <rect x="232" y="253" width="174" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="273" fill="#9cc3ff" font-size="12" class="kr">얼굴신경 VII ★</text>
  <text x="242" y="288" fill="#7f9cc4" font-size="9">facial n.</text>
  <text x="242" y="299" fill="#6f8299" font-size="9">붓꼭지구멍 → 귀밑샘 속에서 갈림 ·</text>
  <text x="242" y="310" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">운동</tspan></text>
  <rect x="232" y="723" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="743" fill="#9cc3ff" font-size="12" class="kr">삼차신경 V ★</text>
  <text x="242" y="758" fill="#7f9cc4" font-size="9">trigeminal n.</text>
  <text x="242" y="769" fill="#6f8299" font-size="9">얼굴 <tspan fill="#e6edf3" font-weight="700">피부감각</tspan> + 씹기근육 운동</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">뒤귓바퀴신경</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">post. auricular n.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">귀밑샘 들어가기 <tspan fill="#e6edf3" font-weight="700">전</tspan>에 갈린다 ·</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">뒤통수힘살</text>
  <rect x="432" y="167" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="187" fill="#9cc3ff" font-size="12" class="kr">관자가지 ★</text>
  <text x="442" y="202" fill="#7f9cc4" font-size="9">temporal br.</text>
  <text x="442" y="213" fill="#6f8299" font-size="9">이마힘살·눈둘레근 위쪽</text>
  <rect x="432" y="231" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="251" fill="#9cc3ff" font-size="12" class="kr">광대가지 ★</text>
  <text x="442" y="266" fill="#7f9cc4" font-size="9">zygomatic br.</text>
  <text x="442" y="277" fill="#6f8299" font-size="9">눈둘레근 — 각막반사 날개</text>
  <rect x="432" y="295" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="315" fill="#9cc3ff" font-size="12" class="kr">볼가지 ★</text>
  <text x="442" y="330" fill="#7f9cc4" font-size="9">buccal br.</text>
  <text x="442" y="341" fill="#6f8299" font-size="9">여러 개 · 볼근·입 주위 근육</text>
  <rect x="432" y="359" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="379" fill="#9cc3ff" font-size="12" class="kr">턱모서리가지 ★</text>
  <text x="442" y="394" fill="#7f9cc4" font-size="9">marginal mandibular br.</text>
  <text x="442" y="405" fill="#6f8299" font-size="9">턱밑샘 수술에서 손상 1순위</text>
  <rect x="432" y="423" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="443" fill="#9cc3ff" font-size="12" class="kr">목가지 ★</text>
  <text x="442" y="458" fill="#7f9cc4" font-size="9">cervical br.</text>
  <text x="442" y="469" fill="#6f8299" font-size="9">넓은목근 — 감각인 가로목신경과</text>
  <text x="442" y="480" fill="#6f8299" font-size="9">구분</text>
  <rect x="432" y="560" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="580" fill="#9cc3ff" font-size="12" class="kr">눈신경 V1</text>
  <text x="442" y="595" fill="#7f9cc4" font-size="9">ophthalmic n.</text>
  <text x="442" y="606" fill="#6f8299" font-size="9">위눈확틈새 · 순수 감각</text>
  <rect x="432" y="726" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="746" fill="#9cc3ff" font-size="12" class="kr">위턱신경 V2 ★</text>
  <text x="442" y="761" fill="#7f9cc4" font-size="9">maxillary n.</text>
  <text x="442" y="772" fill="#6f8299" font-size="9">원형구멍 · 순수 감각</text>
  <rect x="432" y="886" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="906" fill="#9cc3ff" font-size="12" class="kr">아래턱신경 V3 ★</text>
  <text x="442" y="921" fill="#7f9cc4" font-size="9">mandibular n.</text>
  <text x="442" y="932" fill="#6f8299" font-size="9">타원구멍 · <tspan fill="#e6edf3" font-weight="700">감각+운동</tspan></text>
  <rect x="628" y="498" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="518" fill="#9cc3ff" font-size="12" class="kr">눈확위신경 ★</text>
  <text x="638" y="533" fill="#7f9cc4" font-size="9">supraorbital n.</text>
  <text x="638" y="544" fill="#6f8299" font-size="9">눈확위구멍 · 이마·머리덮개 앞</text>
  <rect x="628" y="562" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="582" fill="#9cc3ff" font-size="12" class="kr">도르래위신경</text>
  <text x="638" y="597" fill="#7f9cc4" font-size="9">supratrochlear n.</text>
  <text x="638" y="608" fill="#6f8299" font-size="9">그보다 <tspan fill="#e6edf3" font-weight="700">안쪽</tspan></text>
  <rect x="628" y="626" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="646" fill="#9cc3ff" font-size="12" class="kr">눈물·코섬모체신경</text>
  <text x="638" y="661" fill="#7f9cc4" font-size="9">lacrimal/nasociliary n.</text>
  <text x="638" y="672" fill="#6f8299" font-size="9">V1↔V2 경계는 <tspan fill="#e6edf3" font-weight="700">위눈꺼풀 /</tspan></text>
  <text x="638" y="683" fill="#6f8299" font-size="9">아래눈꺼풀</text>
  <rect x="628" y="701" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="721" fill="#9cc3ff" font-size="12" class="kr">눈확아래신경 ★</text>
  <text x="638" y="736" fill="#7f9cc4" font-size="9">infraorbital n.</text>
  <text x="638" y="747" fill="#6f8299" font-size="9">눈확아래구멍 · 뺨·<tspan fill="#e6edf3" font-weight="700">윗입술</tspan></text>
  <rect x="628" y="765" width="160" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="785" fill="#9cc3ff" font-size="12" class="kr">광대얼굴·광대관자가지</text>
  <text x="638" y="800" fill="#7f9cc4" font-size="9">zygomaticofacial/temporal</text>
  <rect x="628" y="818" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="838" fill="#9cc3ff" font-size="12" class="kr">귓바퀴관자신경 ★</text>
  <text x="638" y="853" fill="#7f9cc4" font-size="9">auriculotemporal n.</text>
  <text x="638" y="864" fill="#6f8299" font-size="9">중간뇌막동맥을 두 뿌리로 감쌈</text>
  <text x="638" y="875" fill="#6f8299" font-size="9">· 귀밑샘 분비섬유를 <tspan fill="#e6edf3" font-weight="700">얹어 나름</tspan></text>
  <rect x="628" y="893" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="913" fill="#9cc3ff" font-size="12" class="kr">턱끝신경 ★</text>
  <text x="638" y="928" fill="#7f9cc4" font-size="9">mental n.</text>
  <text x="638" y="939" fill="#6f8299" font-size="9">턱끝구멍 · <tspan fill="#e6edf3" font-weight="700">아랫입술</tspan>·턱</text>
  <rect x="628" y="957" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="977" fill="#9cc3ff" font-size="12" class="kr">씹기근육 운동가지 ★</text>
  <text x="638" y="992" fill="#7f9cc4" font-size="9">nn. to muscles of mastication</text>
  <text x="638" y="1003" fill="#6f8299" font-size="9">깨물근·깊은관자·날개근신경</text>
  <line x1="26" y1="1022" x2="814" y2="1022" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1034" fill="#93a4b7" font-size="10.5">얼굴신경은 귀밑샘을 <tspan fill="#e6edf3" font-weight="700">지나가기만</tspan> 한다 — 귀밑샘 분비는 IX → 귀신경절 → 귓바퀴관자신경.</text>
  <text x="26" y="1052" fill="#93a4b7" font-size="10.5">표정근육=둘째 인두굽이=VII, 씹기근육=첫째 인두굽이=V3 — 근육의 족보가 신경을 정한다.</text>
</svg>
