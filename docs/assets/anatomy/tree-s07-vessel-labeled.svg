<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 872" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="목뿌리·종아리의 동맥과 정맥 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 7회차 §목의 뿌리 · 종아리 가쪽·뒤 · 발바닥 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="872" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">목뿌리·종아리의 동맥과 정맥<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> vessels of the root of neck &amp; leg</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">7회차 · 빗장밑동맥 3부와 오금동맥 아래 갈래를 나란히</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,208 H 419 V 120 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,208 H 419 V 184 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,208 H 419 V 248 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,208 H 419 V 306 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,392 H 419 V 364 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,392 H 419 V 428 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,563 H 419 V 498 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,563 H 419 V 568 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,563 H 419 V 637 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,734 H 419 V 706 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,734 H 419 V 770 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,470 H 219 V 208 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,470 H 219 V 392 H 232" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 206,470 H 219 V 563 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,470 H 219 V 734 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <rect x="26" y="451" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="471" fill="#7fd4a8" font-size="12" class="kr">7회차의 혈관</text>
  <rect x="232" y="181" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="201" fill="#e0645f" font-size="12" class="kr">빗장밑동맥 ★</text>
  <text x="242" y="216" fill="#c98a86" font-size="9">subclavian a.</text>
  <text x="242" y="227" fill="#6f8299" font-size="9">앞목갈비근이 3부로 나눈다</text>
  <rect x="232" y="370" width="174" height="44" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="390" fill="#b49ae0" font-size="12" class="kr">목의 정맥</text>
  <text x="242" y="405" fill="#8f79b8" font-size="9">veins of the neck</text>
  <rect x="232" y="536" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="556" fill="#e0645f" font-size="12" class="kr">오금동맥 ★</text>
  <text x="242" y="570" fill="#c98a86" font-size="9">popliteal a.</text>
  <text x="242" y="582" fill="#6f8299" font-size="9">오금근 아래모서리에서 갈린다</text>
  <rect x="232" y="712" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="732" fill="#e0645f" font-size="12" class="kr">발의 동맥활</text>
  <text x="242" y="747" fill="#c98a86" font-size="9">arches of the foot</text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="112" fill="#e0645f" font-size="12" class="kr">1부 — 척추동맥 ★</text>
  <text x="442" y="127" fill="#c98a86" font-size="9">vertebral a.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">가로구멍으로 올라간다</text>
  <rect x="432" y="156" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="176" fill="#e0645f" font-size="12" class="kr">1부 — 속가슴동맥</text>
  <text x="442" y="191" fill="#c98a86" font-size="9">internal thoracic a.</text>
  <text x="442" y="202" fill="#6f8299" font-size="9">아래로 — 앞갈비사이동맥</text>
  <rect x="432" y="220" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="240" fill="#e0645f" font-size="12" class="kr">1부 — 갑상목동맥 ★</text>
  <text x="442" y="255" fill="#c98a86" font-size="9">thyrocervical trunk</text>
  <text x="442" y="266" fill="#6f8299" font-size="9">아래갑상·어깨위·목가로동맥</text>
  <rect x="432" y="284" width="170" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="304" fill="#e0645f" font-size="12" class="kr">2부 — 갈비목동맥</text>
  <text x="442" y="319" fill="#c98a86" font-size="9">costocervical trunk</text>
  <rect x="432" y="337" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="357" fill="#b49ae0" font-size="12" class="kr">속목정맥 ★</text>
  <text x="442" y="372" fill="#8f79b8" font-size="9">internal jugular v.</text>
  <text x="442" y="383" fill="#6f8299" font-size="9">빗장밑정맥과 만나 팔머리정맥</text>
  <rect x="432" y="401" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="421" fill="#b49ae0" font-size="12" class="kr">빗장밑정맥 ★</text>
  <text x="442" y="436" fill="#8f79b8" font-size="9">subclavian v.</text>
  <text x="442" y="447" fill="#6f8299" font-size="9">앞목갈비근 <tspan fill="#e6edf3" font-weight="700">앞</tspan> — 동맥은 뒤</text>
  <rect x="432" y="465" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="485" fill="#e0645f" font-size="12" class="kr">앞정강동맥 ★</text>
  <text x="442" y="500" fill="#c98a86" font-size="9">anterior tibial a.</text>
  <text x="442" y="511" fill="#6f8299" font-size="9">뼈사이막을 <tspan fill="#e6edf3" font-weight="700">뚫고</tspan> 앞칸으로 →</text>
  <text x="442" y="522" fill="#6f8299" font-size="9">발등동맥</text>
  <rect x="432" y="540" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="560" fill="#e0645f" font-size="12" class="kr">뒤정강동맥 ★</text>
  <text x="442" y="575" fill="#c98a86" font-size="9">posterior tibial a.</text>
  <text x="442" y="586" fill="#6f8299" font-size="9">발목 안쪽면 → 안쪽·가쪽발바닥동맥</text>
  <rect x="432" y="604" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="624" fill="#e0645f" font-size="12" class="kr">종아리동맥 ★</text>
  <text x="442" y="639" fill="#c98a86" font-size="9">fibular a.</text>
  <text x="442" y="650" fill="#6f8299" font-size="9">뒤정강동맥 가지 · 가쪽칸에는 <tspan fill="#e6edf3" font-weight="700">자기</tspan></text>
  <text x="442" y="661" fill="#6f8299" font-size="9">동맥이 없다</text>
  <rect x="432" y="679" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="699" fill="#e0645f" font-size="12" class="kr">깊은발바닥동맥활 ★</text>
  <text x="442" y="714" fill="#c98a86" font-size="9">deep plantar arch</text>
  <text x="442" y="725" fill="#6f8299" font-size="9">주로 <tspan fill="#e6edf3" font-weight="700">가쪽발바닥동맥</tspan></text>
  <rect x="432" y="743" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="763" fill="#e0645f" font-size="12" class="kr">발등동맥 ★</text>
  <text x="442" y="778" fill="#c98a86" font-size="9">dorsalis pedis a.</text>
  <text x="442" y="789" fill="#6f8299" font-size="9">긴엄지폄근힘줄 <tspan fill="#e6edf3" font-weight="700">가쪽</tspan> 촉지</text>
  <line x1="26" y1="808" x2="628" y2="808" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="820" fill="#93a4b7" font-size="10.5">빗장밑동맥은 <tspan fill="#e6edf3" font-weight="700">앞목갈비근</tspan>이 1·2·3부로 나눈다 — 겨드랑동맥을 작은가슴근이 나누는 것과 같은 꼴.</text>
  <text x="26" y="838" fill="#93a4b7" font-size="10.5">발바닥동맥활은 <tspan fill="#e6edf3" font-weight="700">가쪽발바닥동맥</tspan>이 주로 만든다 — 손의 깊은손바닥동맥활에 해당.</text>
</svg>
