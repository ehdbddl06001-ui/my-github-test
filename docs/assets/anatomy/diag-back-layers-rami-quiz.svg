<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 588" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="등의 층과 척수신경 두 가지 태깅 퀴즈판 — 번호핀 8개, 라벨 제거">
  <!-- 자체 제작 도해(claude-drawn) 퀴즈판. 라벨판 diag-back-layers-rami-labeled.svg 와 같은 좌표. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
    .pin{stroke:none}
  </style>
  <rect width="880" height="588" fill="#0e1826"/>

  <!-- ================= 층 ================= -->
  <path d="M 46,126 C 160,110 300,110 414,126 L 414,150 C 300,134 160,134 46,150 Z"
        fill="#5b4436" stroke="#8a6a52" stroke-width="1.4"/>
  <path d="M 46,150 C 160,134 300,134 414,150 L 414,186 C 300,170 160,170 46,186 Z"
        fill="#4a3f30" stroke="#7a6a52" stroke-width="1.2"/>
  <path d="M 46,186 C 160,170 300,170 414,186 L 414,198 C 300,182 160,182 46,198 Z"
        fill="#3a4a52" stroke="#6a8a96" stroke-width="1.2"/>
  <!-- 얕은층 근육(등세모근·넓은등근) -->
  <path d="M 46,198 C 160,182 300,182 414,198 L 414,238 C 300,222 160,222 46,238 Z"
        fill="#2f5a44" stroke="#5aa87f" stroke-width="1.4"/>
  <!-- 등허리근막 -->
  <path d="M 60,244 C 160,230 300,230 400,244" fill="none" stroke="#c9b07a" stroke-width="3"/>

  <!-- 고유등근육(뒤가지 지배) -->
  <ellipse cx="150" cy="286" rx="52" ry="34" fill="#3d5f7f" stroke="#79a8d0" stroke-width="1.6"/>
  <ellipse cx="310" cy="286" rx="52" ry="34" fill="#3d5f7f" stroke="#79a8d0" stroke-width="1.6"/>
  <ellipse cx="216" cy="300" rx="26" ry="24" fill="#33506b" stroke="#79a8d0" stroke-width="1.4"/>
  <ellipse cx="244" cy="300" rx="26" ry="24" fill="#33506b" stroke="#79a8d0" stroke-width="1.4"/>

  <!-- ================= 척추뼈 ================= -->
  <path d="M 224,246 L 236,246 L 240,330 L 220,330 Z" fill="#22344a" stroke="#5b7690" stroke-width="1.6"/>
  <path d="M 168,352 C 184,330 210,324 230,330 C 250,324 276,330 292,352
           C 300,368 296,384 282,392 L 178,392 C 164,384 160,368 168,352 Z"
        fill="#22344a" stroke="#5b7690" stroke-width="1.6"/>
  <ellipse cx="230" cy="434" rx="66" ry="42" fill="#22344a" stroke="#5b7690" stroke-width="1.8"/>
  <!-- 척주관·척수 -->
  <ellipse cx="230" cy="362" rx="34" ry="24" fill="#101c2b" stroke="#4a5b6e" stroke-width="1.2"/>
  <ellipse cx="230" cy="362" rx="20" ry="14" fill="#3b3350" stroke="#9578c4" stroke-width="1.6"/>

  <!-- ================= 신경 ================= -->
  <!-- 뒤뿌리 + 신경절 -->
  <path d="M 248,354 C 268,352 288,356 302,364" fill="none" stroke="#c9b07a" stroke-width="2.6"/>
  <circle cx="302" cy="364" r="9" fill="#4a3f30" stroke="#c9b07a" stroke-width="2"/>
  <!-- 앞뿌리 -->
  <path d="M 248,374 C 268,378 288,378 302,374" fill="none" stroke="#c9b07a" stroke-width="2.6"/>
  <!-- 척수신경 본줄기 -->
  <path d="M 311,368 C 322,368 332,368 342,368" fill="none" stroke="#e6c98a" stroke-width="4.6"/>
  <!-- 뒤가지 -->
  <path d="M 342,368 C 350,344 350,318 344,296" fill="none" stroke="#9cc3ff" stroke-width="4"/>
  <!-- 뒤가지 가쪽가지 → 피부 -->
  <path d="M 344,300 C 356,272 366,232 372,196 C 376,172 376,152 374,136"
        fill="none" stroke="#9cc3ff" stroke-width="3"/>
  <!-- 뒤가지 안쪽가지 → 피부 -->
  <path d="M 342,300 C 322,278 300,254 286,232 C 276,214 274,190 276,150"
        fill="none" stroke="#9cc3ff" stroke-width="3" stroke-dasharray="7 4"/>
  <!-- 앞가지 -->
  <path d="M 342,368 C 372,382 396,404 410,432" fill="none" stroke="#7fd4a8" stroke-width="4.4"/>
  <path d="M 410,432 C 416,450 418,466 418,482" fill="none" stroke="#7fd4a8" stroke-width="3.4"/>


  <!-- ================= 머리말 ================= -->
  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">등의 층과 척수신경 두 가지 — 태깅 연습판<tspan fill="#93a4b7" font-size="12" font-weight="400"> quiz</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">등뼈 높이 가로단면(등이 위쪽). ①~⑤는 <tspan fill="#e6edf3">피부에서 안쪽으로 지나는 층</tspan>,</text>
  <text x="20" y="66" fill="#93a4b7" font-size="11">⑥⑦은 <tspan fill="#e6edf3">척수신경이 갈라지는 두 가지</tspan>, ⑧은 감각신경세포체가 모인 곳이다.</text>
  <text x="20" y="84" fill="#6f8299" font-size="11">정답은 대응 문항 카드(anatomy-2026-0059) frontmatter에 있다.</text>

  <!-- ================= 번호핀 ================= -->
  <circle cx="90" cy="138" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="90" y="143" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">1</text>
  <circle cx="150" cy="168" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="150" y="173" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">2</text>
  <circle cx="110" cy="192" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="110" y="197" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">3</text>
  <circle cx="170" cy="216" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="170" y="221" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">4</text>
  <circle cx="150" cy="286" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="150" y="291" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">5</text>
  <circle cx="348" cy="320" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="348" y="325" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">6</text>
  <circle cx="392" cy="410" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="392" y="415" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">7</text>
  <circle cx="302" cy="364" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/>
  <text x="302" y="369" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">8</text>

  <!-- ================= 답안 칸 ================= -->
  <rect x="446" y="96" width="416" height="332" rx="10" fill="#121e2e" stroke="#2b3a4d"/>
  <text x="462" y="120" fill="#93a4b7" font-size="12" font-weight="700">답안 칸</text>
  <text x="462" y="152" fill="#eab308" font-size="12" font-weight="700">1.</text>
  <line x1="482" y1="154" x2="846" y2="154" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="188" fill="#eab308" font-size="12" font-weight="700">2.</text>
  <line x1="482" y1="190" x2="846" y2="190" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="224" fill="#eab308" font-size="12" font-weight="700">3.</text>
  <line x1="482" y1="226" x2="846" y2="226" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="260" fill="#eab308" font-size="12" font-weight="700">4.</text>
  <line x1="482" y1="262" x2="846" y2="262" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="296" fill="#eab308" font-size="12" font-weight="700">5.</text>
  <line x1="482" y1="298" x2="846" y2="298" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="332" fill="#eab308" font-size="12" font-weight="700">6.</text>
  <line x1="482" y1="334" x2="846" y2="334" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="368" fill="#eab308" font-size="12" font-weight="700">7.</text>
  <line x1="482" y1="370" x2="846" y2="370" stroke="#3d5166" stroke-width="1.2"/>
  <text x="462" y="404" fill="#eab308" font-size="12" font-weight="700">8.</text>
  <line x1="482" y1="406" x2="846" y2="406" stroke="#3d5166" stroke-width="1.2"/>

  <!-- ================= 추가 질문 ================= -->
  <rect x="446" y="444" width="416" height="120" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="462" y="468" fill="#e6edf3" font-size="12" font-weight="700">이어서 답하시오</text>
  <text x="462" y="492" fill="#93a4b7" font-size="10.5">· ⑥과 ⑦의 차이를 <tspan fill="#e6edf3">굵기·얼기·지배 영역</tspan> 세 가지로 답하시오.</text>
  <text x="462" y="512" fill="#93a4b7" font-size="10.5">· ⑤는 어느 가지의 지배를 받는가? 예외가 되는 근육은?</text>
  <text x="462" y="532" fill="#93a4b7" font-size="10.5">· 피부신경·피부정맥은 ①~⑤ 중 어느 층에 있는가?</text>
  <text x="462" y="552" fill="#93a4b7" font-size="10.5">· ⑧이 손상되면 운동과 감각 중 무엇이 어떻게 되는가?</text>
</svg>
