<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 1346" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="붙잡는 것 — 관절 안정 구조와 골반 복막 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 14회차 인제스트 섹션 a2-s14 §봉우리빗장관절 · §어깨관절 · §팔꿉관절 · §손목관절 · §남자골반안 · §여자골반안 · §방광 겉모습 · §골반가로막 + SESSION_DETAILS 응용과제(어깨관절 안정화 구조 · 골반장기-복막 관계) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="1346" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">붙잡는 것 — 관절 안정 구조와 골반 복막<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> stabilizers &amp; pelvic pouches</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">14회차 · 어깨는 근육이, 팔꿉은 인대가 붙잡고, 골반장기는 복막 오목과 골반가로막이 받친다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,278 H 419 V 125 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,278 H 419 V 200 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
