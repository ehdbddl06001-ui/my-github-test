<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 1512" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="위팔에서 손까지의 혈관과 배벽의 혈관 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 10회차 §위팔동맥 · 노동맥 · 자동맥 · 손바닥동맥활 · 얕은근막 · 배곧은근집 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="1026" height="1512" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">위팔에서 손까지의 혈관과 배벽의 혈관<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> arteries &amp; veins of the arm, forearm, hand and abdominal wall</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">10회차 · 위팔동맥이 팔오금에서 둘로 갈리고, 손에서 두 개의 활로 다시 만난다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
