  <text x="442" y="350" fill="#7f9cc4" font-size="9">ansa cervicalis</text>
  <text x="442" y="361" fill="#6f8299" font-size="9">위뿌리 C1 + 아래뿌리 C2–3</text>
  <rect x="432" y="379" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="399" fill="#9cc3ff" font-size="12" class="kr">가로막신경 C3–5 ★</text>
  <text x="442" y="414" fill="#7f9cc4" font-size="9">phrenic n.</text>
  <text x="442" y="425" fill="#6f8299" font-size="9">C3·4·5 keeps the diaphragm alive</text>
  <rect x="432" y="443" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="463" fill="#9cc3ff" font-size="12" class="kr">목가지 ★</text>
  <text x="442" y="478" fill="#7f9cc4" font-size="9">cervical br.</text>
  <text x="442" y="489" fill="#6f8299" font-size="9">넓은목근(표정근육)</text>
  <rect x="432" y="558" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
