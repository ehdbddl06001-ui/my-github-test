  <text x="824" y="795" fill="#7f9cc4" font-size="9">연관통</text>
  <rect x="814" y="813" width="160" height="48" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="833" fill="#9cc3ff" font-size="12" class="kr">바깥폐쇄근·큰모음근</text>
  <text x="824" y="848" fill="#9cc3ff" font-size="12" class="kr">모음부분</text>
  <line x1="26" y1="942" x2="1000" y2="942" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="954" fill="#93a4b7" font-size="10.5">넓은목근은 목신경이 아니라 <tspan fill="#e6edf3" font-weight="700">얼굴신경 목가지</tspan> — 운동이면 얼굴신경, 감각이면 가로목신경.</text>
  <text x="26" y="972" fill="#93a4b7" font-size="10.5">폐쇄신경 앞가지는 짧은모음근 <tspan fill="#e6edf3" font-weight="700">앞면</tspan>, 뒤가지는 <tspan fill="#e6edf3" font-weight="700">뒷면</tspan> — 층을 가르는 지표.</text>
