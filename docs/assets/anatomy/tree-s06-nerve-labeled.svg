  <text x="638" y="734" fill="#9cc3ff" font-size="12" class="kr">앞가지 ★</text>
  <text x="638" y="749" fill="#7f9cc4" font-size="9">anterior br.</text>
  <text x="638" y="760" fill="#6f8299" font-size="9">짧은모음근 <tspan fill="#e6edf3" font-weight="700">앞면</tspan></text>
