  <text x="242" y="764" fill="#6f8299" font-size="9">L1–L4 · 큰허리근 뒤</text>
  <rect x="432" y="172" width="170" height="44" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
