  <text x="442" y="208" fill="#7f9cc4" font-size="9">신경점(Erb point)에서 한 점처럼</text>
  <rect x="432" y="315" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
