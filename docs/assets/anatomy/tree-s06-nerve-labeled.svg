  <text x="442" y="604" fill="#6f8299" font-size="9">넙다리삼각에서 가장 가쪽(NAVEL)</text>
  <rect x="432" y="762" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="782" fill="#9cc3ff" font-size="12" class="kr">폐쇄신경 L2–L4 ★</text>
  <text x="442" y="797" fill="#7f9cc4" font-size="9">obturator n.</text>
  <text x="442" y="808" fill="#6f8299" font-size="9">폐쇄관 통과</text>
  <rect x="432" y="877" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
