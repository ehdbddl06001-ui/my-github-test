  <text x="242" y="291" fill="#9cc3ff" font-size="12" class="kr">목신경얼기 ★</text>
  <text x="242" y="306" fill="#7f9cc4" font-size="9">cervical plexus</text>
  <text x="242" y="317" fill="#6f8299" font-size="9">C1–C4 앞가지</text>
  <rect x="232" y="443" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="463" fill="#9cc3ff" font-size="12" class="kr">얼굴신경 VII</text>
  <text x="242" y="478" fill="#7f9cc4" font-size="9">facial n.</text>
  <text x="242" y="489" fill="#6f8299" font-size="9">붓꼭지구멍 → 귀밑샘 속에서 5가지</text>
  <rect x="232" y="718" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="738" fill="#9cc3ff" font-size="12" class="kr">허리신경얼기 ★</text>
