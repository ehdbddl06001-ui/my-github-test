  <rect x="26" y="596" width="180" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="616" fill="#9cc3ff" font-size="12" class="kr">15회차의 신경</text>
  <rect x="232" y="162" width="174" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="182" fill="#9cc3ff" font-size="12" class="kr">얼굴신경 — 고실 부분 ★</text>
  <text x="242" y="198" fill="#7f9cc4" font-size="9">facial n. (CN VII) in temporal</text>
  <text x="242" y="208" fill="#7f9cc4" font-size="9">bone</text>
  <text x="242" y="220" fill="#6f8299" font-size="9">속귀길 → 얼굴신경관 → 붓꼭지구멍</text>
  <rect x="232" y="398" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="418" fill="#9cc3ff" font-size="12" class="kr">혀의 신경 ★</text>
  <text x="242" y="434" fill="#7f9cc4" font-size="9">nerves of the tongue</text>
  <text x="242" y="444" fill="#6f8299" font-size="9">운동 하나 · 감각 셋</text>
  <rect x="232" y="583" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="603" fill="#9cc3ff" font-size="12" class="kr">인두신경얼기 ★</text>
  <text x="242" y="618" fill="#7f9cc4" font-size="9">pharyngeal plexus</text>
  <text x="242" y="629" fill="#6f8299" font-size="9">중간인두수축근 바깥면</text>
  <rect x="232" y="809" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="829" fill="#9cc3ff" font-size="12" class="kr">후두의 신경 ★</text>
  <text x="242" y="844" fill="#7f9cc4" font-size="9">laryngeal nerves (CN X)</text>
  <text x="242" y="855" fill="#6f8299" font-size="9">성대주름이 감각의 경계</text>
  <rect x="232" y="1008" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="1028" fill="#9cc3ff" font-size="12" class="kr">엉덩관절의 신경</text>
  <text x="242" y="1043" fill="#7f9cc4" font-size="9">nerves of the hip joint</text>
  <text x="242" y="1054" fill="#6f8299" font-size="9">Hilton 법칙</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">무릎신경절 ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">geniculate ganglion</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">얼굴신경관이 뒤로 꺾이는 곳 — 맛</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">감각세포체</text>
  <rect x="432" y="167" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="187" fill="#9cc3ff" font-size="12" class="kr">등자근신경</text>
  <text x="442" y="202" fill="#7f9cc4" font-size="9">n. to stapedius</text>
  <text x="442" y="213" fill="#6f8299" font-size="9">등자근 마비 = <tspan fill="#e6edf3" font-weight="700">소리</tspan></text>
  <text x="442" y="224" fill="#6f8299" font-size="9">과민<tspan fill="#e6edf3" font-weight="700">(hyperacusis)</tspan></text>
  <rect x="432" y="242" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="262" fill="#9cc3ff" font-size="12" class="kr">고실끈신경 ★</text>
  <text x="442" y="277" fill="#7f9cc4" font-size="9">chorda tympani</text>
  <text x="442" y="288" fill="#6f8299" font-size="9">고실을 가로질러 <tspan fill="#e6edf3" font-weight="700">망치뼈·모루뼈</tspan></text>
  <text x="442" y="299" fill="#6f8299" font-size="9">사이<tspan fill="#e6edf3" font-weight="700"> → 혀신경에 합류</tspan></text>
  <rect x="432" y="317" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="337" fill="#9cc3ff" font-size="12" class="kr">혀신경 ★</text>
  <text x="442" y="352" fill="#7f9cc4" font-size="9">lingual n. (V3)</text>
  <text x="442" y="363" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">셋째큰어금니</tspan> 안쪽 잇몸 바로 밑 —</text>
  <text x="442" y="374" fill="#6f8299" font-size="9">혀 앞 2/3 일반감각</text>
  <rect x="432" y="392" width="170" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="412" fill="#9cc3ff" font-size="12" class="kr">혀밑신경 ★</text>
  <text x="442" y="427" fill="#7f9cc4" font-size="9">hypoglossal n. (CN XII)</text>
  <text x="442" y="438" fill="#6f8299" font-size="9">혀 근육 <tspan fill="#e6edf3" font-weight="700">전부</tspan>(입천장혀근만</text>
  <text x="442" y="449" fill="#6f8299" font-size="9">미주신경) — 마비 쪽으로 혀가</text>
  <text x="442" y="460" fill="#6f8299" font-size="9">쏠린다</text>
  <rect x="432" y="478" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="498" fill="#9cc3ff" font-size="12" class="kr">혀인두신경 — 혀가지 ★</text>
  <text x="442" y="513" fill="#7f9cc4" font-size="9">glossopharyngeal n. (CN IX)</text>
  <text x="442" y="524" fill="#6f8299" font-size="9">혀 <tspan fill="#e6edf3" font-weight="700">뒤 1/3</tspan> 일반감각 + 맛 ·</text>
  <text x="442" y="535" fill="#6f8299" font-size="9">붓인두근</text>
  <rect x="432" y="553" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="573" fill="#9cc3ff" font-size="12" class="kr">혀인두신경 인두가지 ★</text>
  <text x="442" y="588" fill="#7f9cc4" font-size="9">pharyngeal br. of CN IX</text>
  <text x="442" y="599" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">감각</tspan> — 구역반사의 들신경</text>
  <rect x="432" y="617" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="637" fill="#9cc3ff" font-size="12" class="kr">미주신경 인두가지 ★</text>
  <text x="442" y="652" fill="#7f9cc4" font-size="9">pharyngeal br. of CN X</text>
  <text x="442" y="663" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">운동</tspan> — 인두수축근 · 입천장근 ·</text>
  <text x="442" y="674" fill="#6f8299" font-size="9">입천장혀근</text>
  <rect x="432" y="730" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="750" fill="#9cc3ff" font-size="12" class="kr">위후두신경 ★</text>
  <text x="442" y="766" fill="#7f9cc4" font-size="9">superior laryngeal n.</text>
  <text x="442" y="776" fill="#6f8299" font-size="9">목뿔뼈 높이에서 둘로</text>
  <rect x="432" y="879" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="899" fill="#9cc3ff" font-size="12" class="kr">아래후두신경 ★</text>
  <text x="442" y="914" fill="#7f9cc4" font-size="9">inferior laryngeal n.</text>
  <text x="442" y="925" fill="#6f8299" font-size="9">되돌이후두신경의 끝 ·</text>
  <text x="442" y="936" fill="#6f8299" font-size="9">반지방패관절 뒤로 들어온다</text>
  <rect x="432" y="1007" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1027" fill="#9cc3ff" font-size="12" class="kr">폐쇄신경 ★</text>
  <text x="442" y="1042" fill="#7f9cc4" font-size="9">obturator n. (L2–L4)</text>
  <text x="442" y="1053" fill="#6f8299" font-size="9">엉덩관절 + <tspan fill="#e6edf3" font-weight="700">무릎 안쪽</tspan> — 아이의</text>
  <text x="442" y="1064" fill="#6f8299" font-size="9">엉덩관절 병이 무릎 통증으로</text>
  <rect x="628" y="92" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="112" fill="#9cc3ff" font-size="12" class="kr">큰바위신경 ★</text>
  <text x="638" y="127" fill="#7f9cc4" font-size="9">greater petrosal n.</text>
  <text x="638" y="138" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">부교감</tspan> → 날개입천장신경절 →</text>
  <text x="638" y="149" fill="#6f8299" font-size="9">눈물샘 · 코·입천장샘</text>
  <rect x="628" y="317" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="337" fill="#9cc3ff" font-size="12" class="kr">턱밑신경절 ★</text>
  <text x="638" y="352" fill="#7f9cc4" font-size="9">submandibular ganglion</text>
  <text x="638" y="363" fill="#6f8299" font-size="9">혀신경에 매달린 부교감 신경절</text>
  <text x="638" y="374" fill="#6f8299" font-size="9">→ 턱밑샘 · 혀밑샘</text>
  <rect x="628" y="692" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="712" fill="#9cc3ff" font-size="12" class="kr">속후두신경 ★</text>
  <text x="638" y="727" fill="#7f9cc4" font-size="9">internal laryngeal n.</text>
  <text x="638" y="738" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">방패목뿔막</tspan>을 뚫는다 — 성대주름</text>
  <text x="638" y="749" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">위</tspan> 점막 감각</text>
  <rect x="628" y="767" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="787" fill="#9cc3ff" font-size="12" class="kr">바깥후두신경 ★</text>
  <text x="638" y="802" fill="#7f9cc4" font-size="9">external laryngeal n.</text>
  <text x="638" y="813" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">반지방패근</tspan> — 성대를 당겨 높은</text>
  <text x="638" y="824" fill="#6f8299" font-size="9">소리 · 위갑상동맥 곁</text>
  <rect x="628" y="842" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="862" fill="#9cc3ff" font-size="12" class="kr">뒤반지모뿔근 ★</text>
  <text x="638" y="877" fill="#7f9cc4" font-size="9">posterior cricoarytenoid</text>
  <text x="638" y="888" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">유일한 성대 벌림근</tspan> — 양쪽 마비</text>
  <text x="638" y="899" fill="#6f8299" font-size="9">= 기도 폐쇄</text>
  <rect x="628" y="917" width="160" height="81" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="937" fill="#9cc3ff" font-size="12" class="kr">나머지 후두근 ·</text>
  <text x="638" y="952" fill="#9cc3ff" font-size="12" class="kr">성대주름 아래 감각</text>
  <text x="638" y="967" fill="#7f9cc4" font-size="9">other intrinsic muscles</text>
  <text x="638" y="978" fill="#6f8299" font-size="9">가쪽반지모뿔 · 모뿔 ·</text>
  <text x="638" y="989" fill="#6f8299" font-size="9">방패모뿔(성대근)</text>
  <line x1="26" y1="1083" x2="814" y2="1083" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1095" fill="#93a4b7" font-size="10.5"><tspan fill="#e6edf3" font-weight="700">고실끈신경</tspan>은 고실을 가로질러(망치뼈·모루뼈 사이) 나가 <tspan fill="#e6edf3" font-weight="700">혀신경</tspan>에 붙는다 — 혀 앞 2/3 맛 + 턱밑·혀밑샘.</text>
  <text x="26" y="1113" fill="#93a4b7" font-size="10.5">인두근·입천장근은 <tspan fill="#e6edf3" font-weight="700">미주신경</tspan>(인두신경얼기) — 예외는 <tspan fill="#e6edf3" font-weight="700">붓인두근(IX)</tspan> · <tspan fill="#e6edf3" font-weight="700">입천장긴장근(V3)</tspan>.</text>
  <text x="26" y="1131" fill="#93a4b7" font-size="10.5">후두근은 <tspan fill="#e6edf3" font-weight="700">아래후두신경</tspan> — 예외는 <tspan fill="#e6edf3" font-weight="700">반지방패근(바깥후두신경)</tspan>. 성대를 여는 근육은 <tspan fill="#e6edf3" font-weight="700">뒤반지모뿔근</tspan> 하나뿐.</text>
</svg>
