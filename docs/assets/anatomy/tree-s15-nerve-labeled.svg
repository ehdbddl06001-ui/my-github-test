<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1165" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="고실·혀·인두·후두의 신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 15회차 실습주제(머리 시상절단·입안·후두 / 인두·후두 / 다리의 관절) + 인제스트 섹션 a2-s15 §고실열기 · §고실 · §혀의신경1·2 · §목구멍편도 · §인두의 신경 · §후두바깥·후두속 자체기원근육 · §후두절단면 · §엉덩관절 속구조 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1165" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">고실·혀·인두·후두의 신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> ear, tongue, pharynx &amp; larynx</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">15회차 · 얼굴신경은 고실 벽을 지나며 가지를 내고, 혀는 네 신경이 나누며, 인두·후두는 미주신경이 거의 다 맡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
