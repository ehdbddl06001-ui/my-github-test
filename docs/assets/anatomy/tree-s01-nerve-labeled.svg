  <text x="36" y="291" fill="#9cc3ff" font-size="12" class="kr">척수신경</text>
  <text x="36" y="306" fill="#7f9cc4" font-size="9">spinal n.</text>
  <text x="36" y="317" fill="#6f8299" font-size="9">앞뿌리(운동)+뒤뿌리(감각)가 합쳐진</text>
  <text x="36" y="328" fill="#6f8299" font-size="9">것</text>
  <rect x="232" y="136" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="156" fill="#9cc3ff" font-size="12" class="kr">뒤가지 ★</text>
  <text x="242" y="170" fill="#7f9cc4" font-size="9">dorsal ramus</text>
  <text x="242" y="182" fill="#6f8299" font-size="9">가늘다 · 얼기 없음</text>
  <rect x="232" y="442" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="462" fill="#9cc3ff" font-size="12" class="kr">앞가지 ★</text>
  <text x="242" y="477" fill="#7f9cc4" font-size="9">ventral ramus</text>
  <text x="242" y="488" fill="#6f8299" font-size="9">굵다 · 얼기를 이룬다</text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">안쪽가지</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">medial br.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">위쪽 등에서 피부로</text>
  <rect x="432" y="184" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="204" fill="#9cc3ff" font-size="12" class="kr">가쪽가지</text>
  <text x="442" y="218" fill="#7f9cc4" font-size="9">lateral br.</text>
  <text x="442" y="230" fill="#6f8299" font-size="9">아래쪽 등·허리에서 피부로</text>
  <rect x="432" y="370" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
