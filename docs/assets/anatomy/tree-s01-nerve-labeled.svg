  <text x="442" y="405" fill="#7f9cc4" font-size="9">sacral plexus</text>
  <text x="442" y="416" fill="#6f8299" font-size="9">L4–S4</text>
  <rect x="432" y="519" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
