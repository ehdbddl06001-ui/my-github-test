  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">척수신경에서 피부신경까지<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> spinal nerve → cutaneous nerves</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">1회차 · 등·다리 얕은층 — 앞가지/뒤가지가 갈린 뒤로는 영역이 겹치지 않는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
