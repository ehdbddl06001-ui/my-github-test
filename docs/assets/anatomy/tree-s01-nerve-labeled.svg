  <text x="638" y="255" fill="#7f9cc4" font-size="9">middle cluneal nn.</text>
  <text x="638" y="266" fill="#6f8299" font-size="9">S1–S3 · 뒤엉치구멍</text>
  <rect x="628" y="312" width="160" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="638" y="332" fill="#9cc3ff" font-size="12" class="kr">뒤넙다리피부신경 ★</text>
  <text x="638" y="346" fill="#7f9cc4" font-size="9">post. cut. n. of thigh</text>
  <text x="638" y="358" fill="#6f8299" font-size="9">S1–S3 · 궁둥구멍근 아래구멍</text>
  <rect x="628" y="428" width="160" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="638" y="448" fill="#9cc3ff" font-size="12" class="kr">궁둥신경</text>
  <text x="638" y="464" fill="#7f9cc4" font-size="9">sciatic n.</text>
  <text x="638" y="474" fill="#6f8299" font-size="9">L4–S3</text>
  <rect x="628" y="518" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="538" fill="#9cc3ff" font-size="12" class="kr">넙다리신경 → 두렁신경</text>
  <text x="638" y="553" fill="#7f9cc4" font-size="9">femoral → saphenous n.</text>
  <text x="638" y="564" fill="#6f8299" font-size="9">종아리·발 안쪽 피부(뒤칸</text>
  <text x="638" y="575" fill="#6f8299" font-size="9">신경이 아니다)</text>
  <rect x="814" y="284" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="304" fill="#9cc3ff" font-size="12" class="kr">아래볼기피부신경 ★</text>
  <text x="824" y="319" fill="#7f9cc4" font-size="9">inferior cluneal nn.</text>
  <text x="824" y="330" fill="#6f8299" font-size="9">큰볼기근 아래모서리를 감아</text>
  <rect x="814" y="348" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
