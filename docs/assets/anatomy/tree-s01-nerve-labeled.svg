<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212 658" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="척수신경에서 피부신경까지 — 분지 계보 구조도">
