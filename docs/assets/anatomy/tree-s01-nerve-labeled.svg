  <text x="824" y="432" fill="#9cc3ff" font-size="12" class="kr">정강신경</text>
  <text x="824" y="447" fill="#7f9cc4" font-size="9">tibial n.</text>
  <rect x="814" y="465" width="160" height="44" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="824" y="485" fill="#9cc3ff" font-size="12" class="kr">온종아리신경</text>
  <text x="824" y="500" fill="#7f9cc4" font-size="9">common fibular n.</text>
  <rect x="1000" y="412" width="160" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="1010" y="432" fill="#9cc3ff" font-size="12" class="kr">안쪽장딴지피부신경</text>
  <text x="1010" y="447" fill="#7f9cc4" font-size="9">medial sural cut. n.</text>
  <rect x="1000" y="465" width="160" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="1010" y="485" fill="#9cc3ff" font-size="12" class="kr">장딴지신경교통가지</text>
  <text x="1010" y="500" fill="#7f9cc4" font-size="9">sural communicating br.</text>
  <line x1="26" y1="594" x2="1186" y2="594" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="606" fill="#93a4b7" font-size="10.5">뒤가지 계열은 얼기를 만들지 않는다 — 분절 배열이 그대로 유지된다.</text>
  <text x="26" y="624" fill="#93a4b7" font-size="10.5">볼기피부신경 3형제 중 아래볼기만 앞가지 계열 — 이름이 같아도 뿌리가 다르다.</text>
