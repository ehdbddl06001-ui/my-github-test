  <text x="638" y="191" fill="#7f9cc4" font-size="9">superior cluneal nn.</text>
  <text x="638" y="202" fill="#6f8299" font-size="9">L1–L3 · 엉덩뼈능선을 넘는다</text>
  <rect x="628" y="220" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
