  <text x="442" y="554" fill="#7f9cc4" font-size="9">lumbar plexus</text>
  <text x="442" y="565" fill="#6f8299" font-size="9">L1–L4</text>
  <rect x="628" y="92" width="160" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="112" fill="#9cc3ff" font-size="12" class="kr">등 피부</text>
  <rect x="628" y="156" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
