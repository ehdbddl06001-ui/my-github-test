<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 349" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="등·볼기의 동맥 계보 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 2회차 §볼기부위 혈관 · 등 얕은층 혈관 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="1026" height="349" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">등·볼기의 동맥 계보<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> arteries of the back &amp;amp; gluteal region</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">2회차 · 속엉덩동맥은 앞갈래/뒤갈래로, 겨드랑동맥은 3부로 나눠 외운다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
