  <text x="26" y="1879" fill="#93a4b7" font-size="10.5">다발 이름은 겨드랑동맥 <tspan fill="#e6edf3" font-weight="700">2부</tspan>를 기준으로 붙는다 — 가쪽·안쪽·뒤.</text>
  <text x="26" y="1897" fill="#93a4b7" font-size="10.5">뿌리에서 바로 나오는 가지(긴가슴·등쪽어깨)는 다발을 거치지 않는다 — 그래서 따로 다친다.</text>
