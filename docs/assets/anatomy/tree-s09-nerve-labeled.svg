  <text x="26" y="50" fill="#93a4b7" font-size="10.5">9회차 · 다섯 단계(뿌리–줄기–갈래–다발–가지)와 뒤세로칸의 자율신경</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
