  <text x="638" y="1634" fill="#7f9cc4" font-size="9">greater splanchnic n.</text>
  <text x="638" y="1645" fill="#6f8299" font-size="9">T5–T9 → <tspan fill="#e6edf3" font-weight="700">복강신경절</tspan></text>
