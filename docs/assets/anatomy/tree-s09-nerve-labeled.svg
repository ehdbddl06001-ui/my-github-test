  <rect x="26" y="1084" width="180" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="1104" fill="#9cc3ff" font-size="12" class="kr">9회차의 신경</text>
  <rect x="232" y="590" width="174" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="610" fill="#9cc3ff" font-size="12" class="kr">팔신경얼기 ★</text>
  <text x="242" y="624" fill="#7f9cc4" font-size="9">brachial plexus</text>
  <text x="242" y="636" fill="#6f8299" font-size="9">C5–T1 앞가지 · 목갈비근틈새 →</text>
  <text x="242" y="646" fill="#6f8299" font-size="9">겨드랑</text>
  <rect x="232" y="1477" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="1497" fill="#9cc3ff" font-size="12" class="kr">뒤세로칸의 신경 ★</text>
  <text x="242" y="1512" fill="#7f9cc4" font-size="9">nerves of the posterior</text>
  <text x="242" y="1523" fill="#7f9cc4" font-size="9">mediastinum</text>
  <rect x="432" y="122" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="142" fill="#9cc3ff" font-size="12" class="kr">뿌리 ★</text>
  <text x="442" y="157" fill="#7f9cc4" font-size="9">roots, C5–T1</text>
  <text x="442" y="168" fill="#6f8299" font-size="9">곧바로 나오는 가지 2개</text>
  <rect x="432" y="261" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="281" fill="#9cc3ff" font-size="12" class="kr">줄기 ★</text>
  <text x="442" y="296" fill="#7f9cc4" font-size="9">trunks</text>
  <text x="442" y="307" fill="#6f8299" font-size="9">위 C5+C6 · 중간 C7 · 아래 C8+T1</text>
  <rect x="432" y="370" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="390" fill="#9cc3ff" font-size="12" class="kr">갈래 ★</text>
  <text x="442" y="405" fill="#7f9cc4" font-size="9">divisions</text>
  <text x="442" y="416" fill="#6f8299" font-size="9">앞갈래=굽힘근 / 뒤갈래=폄근 ·</text>
  <text x="442" y="427" fill="#6f8299" font-size="9">첫째갈비뼈 뒤에서</text>
  <rect x="432" y="510" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="530" fill="#9cc3ff" font-size="12" class="kr">가쪽다발 ★</text>
  <text x="442" y="545" fill="#7f9cc4" font-size="9">lateral cord</text>
  <text x="442" y="556" fill="#6f8299" font-size="9">앞갈래(위+중간)</text>
  <rect x="432" y="763" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="783" fill="#9cc3ff" font-size="12" class="kr">안쪽다발 ★</text>
  <text x="442" y="798" fill="#7f9cc4" font-size="9">medial cord</text>
  <text x="442" y="809" fill="#6f8299" font-size="9">아래줄기 앞갈래(C8–T1)</text>
  <rect x="432" y="1065" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="1085" fill="#9cc3ff" font-size="12" class="kr">뒤다발 ★</text>
  <text x="442" y="1100" fill="#7f9cc4" font-size="9">posterior cord</text>
  <text x="442" y="1111" fill="#6f8299" font-size="9">세 줄기의 뒤갈래가 모두 모인다</text>
  <rect x="432" y="1322" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="1342" fill="#9cc3ff" font-size="12" class="kr">미주신경 ★</text>
  <text x="442" y="1357" fill="#7f9cc4" font-size="9">vagus n. (X)</text>
  <text x="442" y="1368" fill="#6f8299" font-size="9">허파뿌리 <tspan fill="#e6edf3" font-weight="700">뒤</tspan>를 지나 식도로</text>
  <rect x="432" y="1629" width="170" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="1649" fill="#9cc3ff" font-size="12" class="kr">교감신경줄기 ★</text>
  <text x="442" y="1664" fill="#7f9cc4" font-size="9">sympathetic trunk</text>
  <text x="442" y="1675" fill="#6f8299" font-size="9">갈비뼈머리 앞 · 척추뼈몸통 가쪽</text>
  <rect x="628" y="92" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="112" fill="#9cc3ff" font-size="12" class="kr">등쪽어깨신경 ★</text>
  <text x="638" y="127" fill="#7f9cc4" font-size="9">dorsal scapular n.</text>
  <text x="638" y="138" fill="#6f8299" font-size="9">C5 · 마름근·어깨올림근</text>
  <rect x="628" y="156" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="176" fill="#9cc3ff" font-size="12" class="kr">긴가슴신경 ★</text>
  <text x="638" y="191" fill="#7f9cc4" font-size="9">long thoracic n.</text>
  <text x="638" y="202" fill="#6f8299" font-size="9">C5–C7 · <tspan fill="#e6edf3" font-weight="700">앞톱니근</tspan> · 다치면</text>
  <text x="638" y="213" fill="#6f8299" font-size="9">날개어깨</text>
  <rect x="628" y="231" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="251" fill="#9cc3ff" font-size="12" class="kr">빗장밑근신경</text>
  <text x="638" y="266" fill="#7f9cc4" font-size="9">n. to subclavius</text>
  <text x="638" y="277" fill="#6f8299" font-size="9">위줄기</text>
  <rect x="628" y="295" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="315" fill="#9cc3ff" font-size="12" class="kr">어깨위신경 ★</text>
  <text x="638" y="330" fill="#7f9cc4" font-size="9">suprascapular n.</text>
  <text x="638" y="341" fill="#6f8299" font-size="9">위줄기 · 가시위근·가시아래근 ·</text>
  <text x="638" y="352" fill="#6f8299" font-size="9">어깨뼈패임을 지난다</text>
  <rect x="628" y="445" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="465" fill="#9cc3ff" font-size="12" class="kr">가쪽가슴근신경</text>
  <text x="638" y="480" fill="#7f9cc4" font-size="9">lateral pectoral n.</text>
  <text x="638" y="491" fill="#6f8299" font-size="9">큰가슴근</text>
  <rect x="628" y="509" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="529" fill="#9cc3ff" font-size="12" class="kr">근육피부신경 ★</text>
  <text x="638" y="544" fill="#7f9cc4" font-size="9">musculocutaneous n.</text>
  <text x="638" y="555" fill="#6f8299" font-size="9">위팔 앞칸 3근 →</text>
  <text x="638" y="566" fill="#6f8299" font-size="9">가쪽아래팔피부신경</text>
  <rect x="628" y="584" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="604" fill="#9cc3ff" font-size="12" class="kr">정중신경 가쪽뿌리 ★</text>
  <text x="638" y="619" fill="#7f9cc4" font-size="9">lateral root of median n.</text>
  <text x="638" y="630" fill="#6f8299" font-size="9">감각 위주</text>
  <rect x="628" y="648" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="668" fill="#9cc3ff" font-size="12" class="kr">안쪽가슴근신경</text>
  <text x="638" y="683" fill="#7f9cc4" font-size="9">medial pectoral n.</text>
  <text x="638" y="694" fill="#6f8299" font-size="9">작은가슴근+큰가슴근</text>
  <rect x="628" y="712" width="160" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="732" fill="#9cc3ff" font-size="12" class="kr">안쪽위팔피부신경</text>
  <text x="638" y="747" fill="#7f9cc4" font-size="9">medial brachial cut. n.</text>
  <rect x="628" y="765" width="160" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="785" fill="#9cc3ff" font-size="12" class="kr">안쪽아래팔피부신경</text>
  <text x="638" y="800" fill="#7f9cc4" font-size="9">medial antebrachial cut. n.</text>
  <rect x="628" y="818" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="838" fill="#9cc3ff" font-size="12" class="kr">자신경 ★</text>
  <text x="638" y="853" fill="#7f9cc4" font-size="9">ulnar n.</text>
  <text x="638" y="864" fill="#6f8299" font-size="9">손 내재근의 주인 · C8–T1</text>
  <rect x="628" y="882" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="902" fill="#9cc3ff" font-size="12" class="kr">정중신경 안쪽뿌리 ★</text>
  <text x="638" y="917" fill="#7f9cc4" font-size="9">medial root of median n.</text>
  <text x="638" y="928" fill="#6f8299" font-size="9">두 뿌리가 겨드랑동맥 앞에서</text>
  <text x="638" y="939" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">M자</tspan>를 만든다</text>
  <rect x="628" y="957" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="977" fill="#9cc3ff" font-size="12" class="kr">위·아래 어깨밑신경</text>
  <text x="638" y="992" fill="#7f9cc4" font-size="9">upper &amp; lower subscapular nn.</text>
  <text x="638" y="1003" fill="#6f8299" font-size="9">어깨밑근 · 큰원근</text>
  <rect x="628" y="1021" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1041" fill="#9cc3ff" font-size="12" class="kr">가슴등신경 ★</text>
  <text x="638" y="1056" fill="#7f9cc4" font-size="9">thoracodorsal n.</text>
  <text x="638" y="1067" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">넓은등근</tspan> · 겨드랑 뒤벽 수술</text>
  <text x="638" y="1078" fill="#6f8299" font-size="9">주의</text>
  <rect x="628" y="1096" width="160" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1116" fill="#9cc3ff" font-size="12" class="kr">겨드랑신경 ★</text>
  <text x="638" y="1131" fill="#7f9cc4" font-size="9">axillary n.</text>
  <text x="638" y="1142" fill="#6f8299" font-size="9">위팔뼈 <tspan fill="#e6edf3" font-weight="700">외과목</tspan>을 감는다 ·</text>
  <text x="638" y="1153" fill="#6f8299" font-size="9">어깨세모근 ·</text>
  <text x="638" y="1164" fill="#6f8299" font-size="9">어깨탈구·외과목골절에 취약</text>
  <rect x="628" y="1182" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1202" fill="#9cc3ff" font-size="12" class="kr">노신경 ★</text>
  <text x="638" y="1217" fill="#7f9cc4" font-size="9">radial n.</text>
  <text x="638" y="1228" fill="#6f8299" font-size="9">위팔뼈 <tspan fill="#e6edf3" font-weight="700">노신경고랑</tspan> · 모든 폄근</text>
  <rect x="628" y="1246" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1266" fill="#9cc3ff" font-size="12" class="kr">식도신경얼기 ★</text>
  <text x="638" y="1281" fill="#7f9cc4" font-size="9">esophageal plexus</text>
  <text x="638" y="1292" fill="#6f8299" font-size="9">앞·뒤미주줄기로 다시 모인다 ·</text>
  <text x="638" y="1303" fill="#6f8299" font-size="9">앞=왼미주, 뒤=오른미주</text>
  <rect x="628" y="1321" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1341" fill="#9cc3ff" font-size="12" class="kr">왼되돌이후두신경 ★</text>
  <text x="638" y="1356" fill="#7f9cc4" font-size="9">left recurrent laryngeal n.</text>
  <text x="638" y="1367" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">대동맥활</tspan>(동맥관인대)을 감아</text>
  <text x="638" y="1378" fill="#6f8299" font-size="9">올라간다</text>
  <rect x="628" y="1396" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1416" fill="#9cc3ff" font-size="12" class="kr">오른되돌이후두신경 ★</text>
  <text x="638" y="1431" fill="#7f9cc4" font-size="9">right recurrent laryngeal n.</text>
  <text x="638" y="1442" fill="#6f8299" font-size="9">오른<tspan fill="#e6edf3" font-weight="700">빗장밑동맥</tspan>을 감는다 —</text>
  <text x="638" y="1453" fill="#6f8299" font-size="9">가슴으로 내려오지 않는다</text>
  <rect x="628" y="1471" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1491" fill="#9cc3ff" font-size="12" class="kr">백색교통가지 ★</text>
  <text x="638" y="1506" fill="#7f9cc4" font-size="9">white ramus communicans</text>
  <text x="638" y="1517" fill="#6f8299" font-size="9">T1–L2만 · 절전(말이집)</text>
  <rect x="628" y="1535" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
