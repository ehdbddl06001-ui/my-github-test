  <text x="638" y="1773" fill="#6f8299" font-size="9">T12 → 콩팥신경얼기</text>
  <rect x="628" y="1791" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
