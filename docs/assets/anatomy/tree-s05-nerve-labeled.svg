<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 1300" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="가슴안과 관자아래우묵의 신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 5회차 §가슴안·세로칸·심장 · 관자아래부위 (부위 기준 배정) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="1026" height="1300" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">가슴안과 관자아래우묵의 신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> nerves of the thoracic cavity &amp; infratemporal fossa</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">5회차 · 목에서 내려온 신경이 허파뿌리를 앞뒤로 가르고, V3가 관자아래우묵을 채운다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
