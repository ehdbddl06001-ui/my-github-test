  <path d="M 406,804 H 419 V 804 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,529 H 219 V 262 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,529 H 219 V 540 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,529 H 219 V 698 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,529 H 219 V 804 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <rect x="26" y="510" width="180" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="530" fill="#9cc3ff" font-size="12" class="kr">5회차의 신경</text>
  <rect x="232" y="235" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="255" fill="#9cc3ff" font-size="12" class="kr">아래턱신경 V3 ★</text>
  <text x="242" y="270" fill="#7f9cc4" font-size="9">mandibular n.</text>
  <text x="242" y="281" fill="#6f8299" font-size="9">타원구멍 → 관자아래우묵</text>
  <rect x="232" y="513" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="533" fill="#9cc3ff" font-size="12" class="kr">미주신경 X ★</text>
  <text x="242" y="548" fill="#7f9cc4" font-size="9">vagus n.</text>
  <text x="242" y="559" fill="#6f8299" font-size="9">허파뿌리 <tspan fill="#e6edf3" font-weight="700">뒤</tspan>로 내려간다</text>
  <rect x="232" y="664" width="174" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="684" fill="#9cc3ff" font-size="12" class="kr">가로막신경 ★</text>
  <text x="242" y="700" fill="#7f9cc4" font-size="9">phrenic n.</text>
  <text x="242" y="710" fill="#6f8299" font-size="9">C3–5 · 허파뿌리 <tspan fill="#e6edf3" font-weight="700">앞</tspan> · 심장막에</text>
  <text x="242" y="722" fill="#6f8299" font-size="9">붙어 내려감</text>
  <rect x="232" y="776" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="796" fill="#9cc3ff" font-size="12" class="kr">교감신경줄기</text>
  <text x="242" y="811" fill="#7f9cc4" font-size="9">sympathetic trunk</text>
  <text x="242" y="822" fill="#6f8299" font-size="9">갈비뼈 목 앞 · 내장신경을 낸다</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">씹기근육 운동가지 ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">nn. to mastication</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">깨물근·깊은관자·안쪽/가쪽날개근신</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">경</text>
  <rect x="432" y="167" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="187" fill="#9cc3ff" font-size="12" class="kr">볼신경 ★</text>
  <text x="442" y="202" fill="#7f9cc4" font-size="9">buccal n.</text>
  <text x="442" y="213" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">감각</tspan> — 볼 점막·피부(볼근 운동은</text>
  <text x="442" y="224" fill="#6f8299" font-size="9">VII)</text>
  <rect x="432" y="242" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="262" fill="#9cc3ff" font-size="12" class="kr">혀신경 ★</text>
  <text x="442" y="277" fill="#7f9cc4" font-size="9">lingual n.</text>
  <text x="442" y="288" fill="#6f8299" font-size="9">고실끈신경(VII)을 받아 혀 앞 2/3</text>
  <text x="442" y="299" fill="#6f8299" font-size="9">미각·침샘</text>
  <rect x="432" y="317" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="337" fill="#9cc3ff" font-size="12" class="kr">아래이틀신경 ★</text>
  <text x="442" y="352" fill="#7f9cc4" font-size="9">inferior alveolar n.</text>
  <text x="442" y="363" fill="#6f8299" font-size="9">아래턱뼈 속 → <tspan fill="#e6edf3" font-weight="700">턱끝신경</tspan>으로 나온다</text>
  <rect x="432" y="381" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="401" fill="#9cc3ff" font-size="12" class="kr">귓바퀴관자신경</text>
  <text x="442" y="416" fill="#7f9cc4" font-size="9">auriculotemporal n.</text>
  <text x="442" y="427" fill="#6f8299" font-size="9">중간뇌막동맥을 두 뿌리로 감쌈</text>
  <rect x="432" y="445" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="465" fill="#9cc3ff" font-size="12" class="kr">왼되돌이후두신경 ★</text>
  <text x="442" y="480" fill="#7f9cc4" font-size="9">left recurrent laryngeal n.</text>
  <text x="442" y="491" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">대동맥활</tspan>(동맥관인대)을 감아</text>
  <text x="442" y="502" fill="#6f8299" font-size="9">올라감</text>
  <rect x="432" y="520" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="540" fill="#9cc3ff" font-size="12" class="kr">심장가지</text>
  <text x="442" y="555" fill="#7f9cc4" font-size="9">cardiac brr.</text>
  <text x="442" y="566" fill="#6f8299" font-size="9">심장신경얼기 — 부교감(느리게)</text>
  <rect x="432" y="584" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="604" fill="#9cc3ff" font-size="12" class="kr">식도신경얼기</text>
  <text x="442" y="619" fill="#7f9cc4" font-size="9">esophageal plexus</text>
  <text x="442" y="630" fill="#6f8299" font-size="9">뒤세로칸으로</text>
  <rect x="432" y="648" width="170" height="44" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="668" fill="#9cc3ff" font-size="12" class="kr">가로막 운동</text>
  <text x="442" y="683" fill="#7f9cc4" font-size="9">motor to diaphragm</text>
  <rect x="432" y="701" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="721" fill="#9cc3ff" font-size="12" class="kr">심장막·세로칸가슴막 감각 ★</text>
  <text x="442" y="736" fill="#7f9cc4" font-size="9">sensory</text>
  <text x="442" y="747" fill="#6f8299" font-size="9">연관통이 <tspan fill="#e6edf3" font-weight="700">어깨끝(C4 피부분절)</tspan> 으로</text>
  <text x="442" y="758" fill="#6f8299" font-size="9">간다</text>
  <rect x="432" y="776" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="796" fill="#9cc3ff" font-size="12" class="kr">심장가지</text>
  <text x="442" y="811" fill="#7f9cc4" font-size="9">cardiac brr.</text>
  <text x="442" y="822" fill="#6f8299" font-size="9">심장신경얼기 — 교감(빠르게)</text>
  <line x1="26" y1="841" x2="628" y2="841" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="853" fill="#93a4b7" font-size="10.5">V3만 감각+운동 — 씹기근육 넷은 전부 여기서 나온다.</text>
  <text x="26" y="871" fill="#93a4b7" font-size="10.5">허파뿌리 기준: 가로막신경은 <tspan fill="#e6edf3" font-weight="700">앞</tspan>, 미주신경은 <tspan fill="#e6edf3" font-weight="700">뒤</tspan> — 세로칸 태깅의 축.</text>
</svg>
