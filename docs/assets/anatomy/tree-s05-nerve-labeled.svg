  <path d="M 406,262 H 419 V 408 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,540 H 419 V 478 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,540 H 419 V 548 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,540 H 419 V 612 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
