<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 905" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="아래턱신경과 가슴의 신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 5회차 §관자아래부위 · 위세로칸 · 심장막 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="905" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">아래턱신경과 가슴의 신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> mandibular n. &amp; nerves of the thorax</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">5회차 · 관자아래우묵의 V3와, 세로칸을 지나는 미주·가로막신경</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,262 H 419 V 125 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,262 H 419 V 200 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,262 H 419 V 275 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
