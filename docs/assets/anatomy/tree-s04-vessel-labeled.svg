  <text x="638" y="286" fill="#c98a86" font-size="9">angular a.</text>
  <text x="638" y="297" fill="#6f8299" font-size="9">종말가지 — 눈동맥과 문합</text>
  <rect x="628" y="315" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
