  <text x="36" y="642" fill="#7fd4a8" font-size="12" class="kr">얼굴·가슴벽의 혈관</text>
  <rect x="232" y="337" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="357" fill="#e0645f" font-size="12" class="kr">바깥목동맥 ★</text>
  <text x="242" y="372" fill="#c98a86" font-size="9">external carotid a.</text>
  <text x="242" y="383" fill="#6f8299" font-size="9">방패연골 위모서리(C4)에서 갈린 뒤</text>
  <rect x="232" y="646" width="174" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="666" fill="#b49ae0" font-size="12" class="kr">얼굴의 정맥 ★</text>
  <text x="242" y="680" fill="#8f79b8" font-size="9">veins of the face</text>
  <text x="242" y="692" fill="#6f8299" font-size="9">판막 없음</text>
  <rect x="232" y="942" width="174" height="44" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="962" fill="#7fd4a8" font-size="12" class="kr">가슴벽의 혈관</text>
  <text x="242" y="977" fill="#5fae87" font-size="9">vessels of the thoracic wall</text>
  <rect x="432" y="159" width="170" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="179" fill="#e0645f" font-size="12" class="kr">얼굴동맥 ★</text>
  <text x="442" y="194" fill="#c98a86" font-size="9">facial a.</text>
  <text x="442" y="205" fill="#6f8299" font-size="9">깨물근 앞모서리에서 <tspan fill="#e6edf3" font-weight="700">아래턱뼈를</tspan></text>
  <text x="442" y="216" fill="#6f8299" font-size="9">넘어<tspan fill="#e6edf3" font-weight="700"> 올라온다 · 구불구불</tspan></text>
  <rect x="432" y="366" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="386" fill="#e0645f" font-size="12" class="kr">얕은관자동맥 ★</text>
  <text x="442" y="401" fill="#c98a86" font-size="9">superficial temporal a.</text>
  <text x="442" y="412" fill="#6f8299" font-size="9">귀 앞 박동 촉지점</text>
  <rect x="432" y="510" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="530" fill="#e0645f" font-size="12" class="kr">위턱동맥</text>
  <text x="442" y="545" fill="#c98a86" font-size="9">maxillary a.</text>
  <text x="442" y="556" fill="#6f8299" font-size="9">관자아래우묵으로</text>
  <rect x="432" y="602" width="170" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="442" y="622" fill="#b49ae0" font-size="12" class="kr">얼굴정맥 ★</text>
  <text x="442" y="637" fill="#8f79b8" font-size="9">facial v.</text>
  <text x="442" y="648" fill="#6f8299" font-size="9">동맥 <tspan fill="#e6edf3" font-weight="700">뒤</tspan>를 곧게</text>
  <rect x="432" y="694" width="170" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="442" y="714" fill="#b49ae0" font-size="12" class="kr">아래턱뒤정맥 ★</text>
  <text x="442" y="728" fill="#8f79b8" font-size="9">retromandibular v.</text>
  <text x="442" y="740" fill="#6f8299" font-size="9">얕은관자정맥 + 위턱정맥</text>
  <rect x="432" y="830" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="850" fill="#e0645f" font-size="12" class="kr">겨드랑동맥 ★</text>
  <text x="442" y="865" fill="#c98a86" font-size="9">axillary a.</text>
  <text x="442" y="876" fill="#6f8299" font-size="9">작은가슴근이 1·2·3부로 나눈다</text>
  <rect x="432" y="947" width="170" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="967" fill="#e0645f" font-size="12" class="kr">속가슴동맥 ★</text>
  <text x="442" y="982" fill="#c98a86" font-size="9">internal thoracic a.</text>
  <text x="442" y="993" fill="#6f8299" font-size="9">빗장밑동맥 가지 · 복장뼈 가쪽</text>
  <text x="442" y="1004" fill="#6f8299" font-size="9">1–2 cm</text>
