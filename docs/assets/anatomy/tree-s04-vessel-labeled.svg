  <text x="638" y="520" fill="#c98a86" font-size="9">middle meningeal a.</text>
  <text x="638" y="531" fill="#6f8299" font-size="9">경막외혈종</text>
  <rect x="628" y="549" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="569" fill="#e0645f" font-size="12" class="kr">눈확아래동맥</text>
  <text x="638" y="584" fill="#c98a86" font-size="9">infraorbital a.</text>
  <rect x="628" y="602" width="160" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="638" y="622" fill="#b49ae0" font-size="12" class="kr">온얼굴정맥</text>
  <text x="638" y="637" fill="#8f79b8" font-size="9">common facial v.</text>
  <text x="638" y="648" fill="#6f8299" font-size="9">속목정맥으로</text>
  <rect x="628" y="666" width="160" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="638" y="686" fill="#b49ae0" font-size="12" class="kr">앞가지</text>
  <text x="638" y="701" fill="#8f79b8" font-size="9">ant. division</text>
  <text x="638" y="712" fill="#6f8299" font-size="9">얼굴정맥과 합류</text>
  <rect x="628" y="730" width="160" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="638" y="750" fill="#b49ae0" font-size="12" class="kr">뒤가지 ★</text>
  <text x="638" y="765" fill="#8f79b8" font-size="9">post. division</text>
  <text x="638" y="776" fill="#6f8299" font-size="9">뒤귓바퀴정맥과 → <tspan fill="#e6edf3" font-weight="700">바깥목정맥</tspan></text>
  <rect x="628" y="794" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="814" fill="#e0645f" font-size="12" class="kr">가슴봉우리동맥 ★</text>
  <text x="638" y="829" fill="#c98a86" font-size="9">thoracoacromial a.</text>
  <text x="638" y="840" fill="#6f8299" font-size="9">2부 ·</text>
  <text x="638" y="851" fill="#6f8299" font-size="9">가슴근·봉우리·빗장·어깨세모</text>
  <rect x="628" y="869" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="889" fill="#e0645f" font-size="12" class="kr">가쪽가슴동맥</text>
  <text x="638" y="904" fill="#c98a86" font-size="9">lateral thoracic a.</text>
  <text x="638" y="915" fill="#6f8299" font-size="9">2부 · 앞톱니근·젖샘</text>
  <rect x="628" y="933" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="953" fill="#e0645f" font-size="12" class="kr">앞갈비사이동맥</text>
  <text x="638" y="968" fill="#c98a86" font-size="9">ant. intercostal aa.</text>
  <rect x="628" y="986" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1006" fill="#e0645f" font-size="12" class="kr">근육가로막·위배벽동맥</text>
  <text x="638" y="1021" fill="#c98a86" font-size="9">musculophrenic / sup.</text>
  <text x="638" y="1032" fill="#c98a86" font-size="9">epigastric a.</text>
  <rect x="628" y="1050" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1070" fill="#e0645f" font-size="12" class="kr">뒤갈비사이동맥 ★</text>
  <text x="638" y="1085" fill="#c98a86" font-size="9">post. intercostal aa.</text>
  <text x="638" y="1096" fill="#6f8299" font-size="9">3–11번 · 갈비사이고랑으로</text>
  <line x1="26" y1="1115" x2="814" y2="1115" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1127" fill="#93a4b7" font-size="10.5">가로얼굴동맥은 <tspan fill="#e6edf3" font-weight="700">얕은관자동맥</tspan> 가지 — 얼굴동맥 가지가 아니다(태깅 단골 함정).</text>
  <text x="26" y="1145" fill="#93a4b7" font-size="10.5">얼굴정맥은 판막이 없어 눈구석정맥–위눈정맥을 거쳐 <tspan fill="#e6edf3" font-weight="700">해면정맥굴</tspan>과 통한다(위험삼각).</text>
</svg>
