  <text x="638" y="350" fill="#c98a86" font-size="9">transverse facial a.</text>
  <text x="638" y="361" fill="#6f8299" font-size="9">귀밑샘관 <tspan fill="#e6edf3" font-weight="700">위</tspan>를 가로로</text>
