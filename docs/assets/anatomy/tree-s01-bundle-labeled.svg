  <text x="26" y="461" fill="#93a4b7" font-size="10.5">짝을 외우면 하나를 찾으면 다른 하나가 따라온다 — 피부벗기기의 요령.</text>
  <text x="26" y="479" fill="#93a4b7" font-size="10.5">복사 기준: 큰두렁정맥은 안쪽복사 <tspan fill="#e6edf3" font-weight="700">앞</tspan>, 작은두렁정맥은 가쪽복사 <tspan fill="#e6edf3" font-weight="700">뒤</tspan>.</text>
