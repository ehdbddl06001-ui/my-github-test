  <rect x="26" y="516" width="180" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="1.3"/>
  <text x="36" y="536" fill="#e0645f" font-size="12" class="kr">온목동맥 / 넙다리동맥</text>
  <text x="36" y="551" fill="#c98a86" font-size="9">두 계통을 한 장에</text>
  <rect x="232" y="218" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="238" fill="#e0645f" font-size="12" class="kr">온목동맥 ★</text>
  <text x="242" y="253" fill="#c98a86" font-size="9">common carotid a.</text>
  <text x="242" y="264" fill="#6f8299" font-size="9">가지 없음 · C4에서 갈림</text>
  <rect x="232" y="736" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="756" fill="#e0645f" font-size="12" class="kr">넙다리동맥 ★</text>
  <text x="242" y="772" fill="#c98a86" font-size="9">femoral a.</text>
  <text x="242" y="782" fill="#6f8299" font-size="9">고샅인대 중간점 아래에서 촉지</text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="112" fill="#e0645f" font-size="12" class="kr">속목동맥 ★</text>
  <text x="442" y="127" fill="#c98a86" font-size="9">internal carotid a.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">목에서는 가지 없음 → 머리속으로</text>
  <rect x="432" y="370" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="390" fill="#e0645f" font-size="12" class="kr">바깥목동맥 ★</text>
  <text x="442" y="404" fill="#c98a86" font-size="9">external carotid a.</text>
  <rect x="432" y="675" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="695" fill="#e0645f" font-size="12" class="kr">깊은넙다리동맥 ★</text>
  <text x="442" y="710" fill="#c98a86" font-size="9">profunda femoris a.</text>
  <text x="442" y="721" fill="#6f8299" font-size="9">고샅인대 아래 ~4 cm</text>
  <rect x="432" y="806" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="826" fill="#e0645f" font-size="12" class="kr">모음근구멍 통과</text>
  <text x="442" y="841" fill="#c98a86" font-size="9">adductor hiatus</text>
  <rect x="628" y="218" width="160" height="38" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="238" fill="#e0645f" font-size="12" class="kr">앞가지</text>
  <rect x="628" y="362" width="160" height="38" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="382" fill="#e0645f" font-size="12" class="kr">뒤가지</text>
  <rect x="628" y="443" width="160" height="38" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="463" fill="#e0645f" font-size="12" class="kr">안쪽가지</text>
  <rect x="628" y="529" width="160" height="38" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="549" fill="#e0645f" font-size="12" class="kr">종말가지</text>
  <rect x="628" y="613" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="633" fill="#e0645f" font-size="12" class="kr">안쪽넙다리휘돌이동맥 ★</text>
  <text x="638" y="648" fill="#c98a86" font-size="9">medial circumflex femoral a.</text>
  <text x="638" y="659" fill="#6f8299" font-size="9">엉덩허리근·두덩근 사이 →</text>
  <text x="638" y="670" fill="#6f8299" font-size="9">넙다리뼈 머리·목</text>
  <rect x="628" y="688" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="708" fill="#e0645f" font-size="12" class="kr">가쪽넙다리휘돌이동맥</text>
  <text x="638" y="723" fill="#c98a86" font-size="9">lat. circumflex femoral a.</text>
  <rect x="628" y="741" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="761" fill="#e0645f" font-size="12" class="kr">관통동맥 3–4개</text>
  <text x="638" y="776" fill="#c98a86" font-size="9">perforating aa.</text>
  <text x="638" y="787" fill="#6f8299" font-size="9">큰모음근을 뚫고 뒤칸으로</text>
  <rect x="628" y="805" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="825" fill="#e0645f" font-size="12" class="kr">오금동맥 ★</text>
  <text x="638" y="840" fill="#c98a86" font-size="9">popliteal a.</text>
  <text x="638" y="851" fill="#6f8299" font-size="9">이름이 바뀐다</text>
  <rect x="814" y="156" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="176" fill="#e0645f" font-size="12" class="kr">위갑상동맥 ★</text>
  <text x="824" y="191" fill="#c98a86" font-size="9">superior thyroid a.</text>
  <text x="824" y="202" fill="#6f8299" font-size="9">첫 가지 · 위후두동맥을 냄</text>
  <rect x="814" y="220" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="240" fill="#e0645f" font-size="12" class="kr">혀동맥</text>
  <text x="824" y="255" fill="#c98a86" font-size="9">lingual a.</text>
  <rect x="814" y="273" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="293" fill="#e0645f" font-size="12" class="kr">얼굴동맥 ★</text>
  <text x="824" y="308" fill="#c98a86" font-size="9">facial a.</text>
  <text x="824" y="319" fill="#6f8299" font-size="9">턱밑샘을 파고 지나간다</text>
  <rect x="814" y="337" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="357" fill="#e0645f" font-size="12" class="kr">뒤통수동맥</text>
  <text x="824" y="372" fill="#c98a86" font-size="9">occipital a.</text>
  <rect x="814" y="390" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="410" fill="#e0645f" font-size="12" class="kr">뒤귓바퀴동맥</text>
  <text x="824" y="425" fill="#c98a86" font-size="9">post. auricular a.</text>
  <rect x="814" y="443" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="463" fill="#e0645f" font-size="12" class="kr">오름인두동맥</text>
  <text x="824" y="478" fill="#c98a86" font-size="9">ascending pharyngeal a.</text>
  <rect x="814" y="496" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="516" fill="#e0645f" font-size="12" class="kr">위턱동맥</text>
  <text x="824" y="531" fill="#c98a86" font-size="9">maxillary a.</text>
  <text x="824" y="542" fill="#6f8299" font-size="9">중간뇌막동맥을 냄</text>
  <rect x="814" y="560" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="580" fill="#e0645f" font-size="12" class="kr">얕은관자동맥</text>
  <text x="824" y="595" fill="#c98a86" font-size="9">superficial temporal a.</text>
  <line x1="26" y1="870" x2="1000" y2="870" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="882" fill="#93a4b7" font-size="10.5">온목동맥은 갈리기 전까지 **가지를 내지 않는다** — 방패연골 위모서리(C4)에서 갈림.</text>
  <text x="26" y="900" fill="#93a4b7" font-size="10.5">안쪽넙다리휘돌이동맥이 넙다리뼈 머리·목의 주 공급원 — 끊기면 무혈성괴사.</text>
</svg>
