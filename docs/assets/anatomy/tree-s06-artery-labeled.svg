<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 934" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="바깥목동맥과 넙다리동맥 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 6회차 §목동맥삼각 · 넙다리삼각 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="1026" height="934" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">바깥목동맥과 넙다리동맥<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> external carotid &amp;amp; femoral arteries</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">6회차 · 목동맥삼각에서 갈리고, 넙다리삼각에서 갈린다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 788,238 H 801 V 184 H 814" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
