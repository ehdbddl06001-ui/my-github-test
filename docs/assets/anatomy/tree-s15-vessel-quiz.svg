  <text x="26" y="1102" fill="#93a4b7" font-size="10.5">편도절제술 뒤 출혈은 동맥보다 <tspan fill="#e6edf3" font-weight="700">편도바깥정맥</tspan>(paratonsillar v.)이 흔하다.</text>
  <text x="26" y="1120" fill="#93a4b7" font-size="10.5">어른 넙다리뼈머리는 <tspan fill="#e6edf3" font-weight="700">안쪽넙다리휘돌이동맥</tspan>이 먹인다 — 목 골절에서 <tspan fill="#e6edf3" font-weight="700">무혈괴사</tspan>.</text>
