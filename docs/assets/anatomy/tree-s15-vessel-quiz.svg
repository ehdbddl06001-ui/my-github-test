  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">코·편도·후두의 혈관과 다리 관절의 동맥 — 분지 퀴즈판<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> head &amp; joint vessels</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">15회차 · 머리 쪽은 바깥목동맥 가지가, 넙다리뼈머리는 휘돌이동맥이, 무릎은 오금동맥의 무릎동맥 고리가 맡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · 번호를 보고 이름을 답하시오</text>
