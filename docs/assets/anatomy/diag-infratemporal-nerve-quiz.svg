<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="관자아래부위 신경 약도 퀴즈판 — 아래턱신경 V3의 앞갈래·뒤갈래 가지 위치. 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn, Lane A). 오른쪽 머리 가쪽면, 턱뼈가지 제거 구도 —
       동맥 약도(diag-infratemporal-artery-labeled.svg)와 같은 지형 배경을 쓴다.
       근거: 5회차 실사 스캔 P039(V3 가지 종합) + 인정 교재 표준.
       핵심 ① V3 = 타원구멍 ② 앞갈래=운동(예외 볼신경=감각) / 뒤갈래=감각(예외 턱목뿔근신경=운동)
             ③ 혀신경이 아래이틀신경보다 앞·안쪽 ④ 고실끈신경(VII)은 혀신경에 뒤·위에서 합류
             ⑤ 귓바퀴관자신경 두 뿌리가 중간뇌막동맥을 감싼다 -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="720" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">관자아래부위 신경 약도 퀴즈판 — 아래턱신경 V3
    <tspan fill="#93a4b7" font-size="12" font-weight="400">mandibular n. in the infratemporal fossa</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과식 구도) · 오른쪽 머리 가쪽면 · 턱뼈가지(점선)는 제거하고 본 것 · 근거: 5회차 실습영상 §관자아래부위</text>
  <text x="20" y="68" fill="#6f8299" font-size="11">감각 <tspan fill="#9cc3ff">파랑</tspan> · 운동 <tspan fill="#f0b56b">주황</tspan> · 얼굴신경 VII <tspan fill="#c9a5f0">보라</tspan> · 동맥(참고) <tspan fill="#a05450">어두운 빨강</tspan> · ★ = 태깅 빈출 · 점선 = 뼈관·구멍 속</text>
  <text x="20" y="86" fill="#5d6f83" font-size="10">← 앞 anterior   |   뒤 posterior →</text>

  <!-- ================= 머리뼈바닥 선 + 구멍 ================= -->
  <line x1="240" y1="235" x2="640" y2="235" stroke="#3d5166" stroke-width="3"/>
  <ellipse cx="408" cy="235" rx="9" ry="5" fill="#0e1826" stroke="#eab308" stroke-width="2.4"/>
  <ellipse cx="462" cy="235" rx="7" ry="4.5" fill="#0e1826" stroke="#93a4b7" stroke-width="2"/>
  <text x="330" y="216" fill="#eab308" font-size="10.5" text-anchor="end" class="kr">타원구멍 foramen ovale ★</text>
  <line x1="334" y1="213" x2="400" y2="231" stroke="#eab308" stroke-width="1"/>
  <text x="478" y="224" fill="#93a4b7" font-size="10">가시구멍 foramen spinosum</text>
  <line x1="474" y1="226" x2="466" y2="231" stroke="#93a4b7" stroke-width="1"/>

  <!-- ================= 관자근(부채꼴) ================= -->
  <path d="M 300,116 Q 430,96 560,126 Q 520,220 476,302 L 452,302 Q 380,200 300,116 Z"
        fill="#22344a" fill-opacity="0.55" stroke="#3a4f68" stroke-width="1.5"/>
  <text x="382" y="130" fill="#7b8ea3" font-size="11" class="kr">관자근 temporalis m.</text>

  <!-- ================= 위턱뼈 · 가쪽날개판 · 우묵 ================= -->
  <path d="M 236,258 L 276,258 L 272,430 L 240,430 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="250" y="398" fill="#7b8ea3" font-size="10" text-anchor="middle" transform="rotate(-90 250,398)" class="kr">위턱뼈 maxilla</text>
  <path d="M 306,258 L 330,258 L 336,382 L 314,382 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <rect x="278" y="262" width="26" height="150" fill="#060c14"/>

  <!-- ================= 광대활 ================= -->
  <path d="M 250,262 L 576,262 L 582,280 L 250,280 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="262" y="304" fill="#7b8ea3" font-size="10.5" class="kr">광대활 zygomatic arch</text>
  <line x1="300" y1="294" x2="308" y2="281" stroke="#7b8ea3" stroke-width="1"/>

  <!-- ================= 바깥귀길 ================= -->
  <circle cx="614" cy="300" r="15" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <circle cx="614" cy="300" r="6" fill="#060c14"/>

  <!-- ================= 턱뼈가지(점선 = 제거) ================= -->
  <path d="M 470,310 Q 510,296 528,302 Q 546,290 562,300 Q 572,308 566,322 L 552,342
           Q 540,470 528,596 L 452,600 Q 458,470 470,310 Z"
        fill="none" stroke="#5d6f83" stroke-width="2" stroke-dasharray="7 6"/>
  <ellipse cx="498" cy="432" rx="8" ry="6" fill="none" stroke="#93a4b7" stroke-width="2"/>
  <text x="560" y="418" fill="#93a4b7" font-size="10.5">턱뼈구멍</text>
  <text x="560" y="431" fill="#93a4b7" font-size="9.5">mandibular foramen</text>
  <line x1="556" y1="422" x2="508" y2="431" stroke="#93a4b7" stroke-width="1"/>

  <!-- ================= 가쪽·안쪽날개근 ================= -->
  <path d="M 332,266 L 396,262 L 552,296 L 548,310 L 336,282 Z" fill="#33465e" stroke="#4a6076" stroke-width="1.5"/>
  <path d="M 330,318 L 394,312 L 556,320 L 552,338 L 334,342 Z" fill="#33465e" stroke="#4a6076" stroke-width="1.5"/>
  <path d="M 338,358 L 378,352 L 512,580 L 470,592 Z" fill="#2c3d54" stroke="#41576f" stroke-width="1.5"/>
  <text x="352" y="278" fill="#c3d2e2" font-size="9.5" class="kr">가쪽날개근 위갈래</text>
  <text x="352" y="334" fill="#c3d2e2" font-size="9.5" class="kr">가쪽날개근 아래갈래 <tspan fill="#8fa5bd" font-weight="400">lateral pterygoid m.</tspan></text>
  <text x="660" y="608" fill="#8fa5bd" font-size="11" class="kr">안쪽날개근</text>
  <text x="660" y="622" fill="#6f8299" font-size="9.5">medial pterygoid m.</text>
  <line x1="656" y1="610" x2="498" y2="560" stroke="#6f8299" stroke-width="1"/>

  <!-- ================= 동맥(참고, 어둡게) ================= -->
  <path d="M 602,340 L 520,330 L 404,300 C 366,294 340,292 306,290" fill="none" stroke="#a05450" stroke-width="3.4" stroke-linecap="round" opacity="0.75"/>
  <path d="M 552,332 C 538,300 498,262 466,240" fill="none" stroke="#a05450" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <text x="588" y="356" fill="#a05450" font-size="9.5">위턱동맥(참고)</text>
  <text x="536" y="262" fill="#a05450" font-size="9.5">중간뇌막동맥(참고)</text>
  <line x1="533" y1="264" x2="514" y2="284" stroke="#a05450" stroke-width="1"/>

  <!-- ================= V3 ================= -->
  <!-- 줄기: 타원구멍에서 하행 -->
  <path d="M 408,240 L 415,284" fill="none" stroke="#9cc3ff" stroke-width="6" stroke-linecap="round"/>
  <!-- 뇌막가지(가시신경): 가시구멍으로 회귀 -->
  <path d="M 411,258 C 428,252 446,246 458,240" fill="none" stroke="#9cc3ff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
  <!-- 귀신경절(안쪽면) -->
  <circle cx="396" cy="266" r="8" fill="none" stroke="#c9a5f0" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- 안쪽날개근신경 -->
  <path d="M 412,276 C 420,330 444,410 470,470" fill="none" stroke="#f0b56b" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 앞갈래 -->
  <path d="M 415,284 L 424,289" fill="none" stroke="#f0b56b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 424,289 C 462,292 502,294 524,299" fill="none" stroke="#f0b56b" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 524,299 L 540,290" fill="none" stroke="#f0b56b" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 440,288 C 446,238 450,192 452,152" fill="none" stroke="#f0b56b" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 426,287 C 420,240 416,196 413,158" fill="none" stroke="#f0b56b" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 430,290 L 448,306" fill="none" stroke="#f0b56b" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 볼신경(감각): 가쪽날개근 두 갈래 사이로 -->
  <path d="M 432,286 C 408,300 372,336 344,370 C 330,386 318,398 308,408" fill="none" stroke="#9cc3ff" stroke-width="3" stroke-linecap="round"/>

  <!-- 뒤갈래 -->
  <!-- 귓바퀴관자신경: 두 뿌리가 중간뇌막동맥을 감싼다 -->
  <path d="M 417,278 C 448,266 478,264 496,268" fill="none" stroke="#9cc3ff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 419,288 C 450,284 478,282 496,280" fill="none" stroke="#9cc3ff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 496,268 C 503,271 503,277 496,280" fill="none" stroke="#9cc3ff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 500,274 C 538,278 572,286 596,284 C 606,278 610,258 611,238" fill="none" stroke="#9cc3ff" stroke-width="2.8" stroke-linecap="round"/>
  <!-- 혀신경(앞·안쪽) -->
  <path d="M 417,290 C 426,344 430,392 421,440 C 416,472 404,498 388,518" fill="none" stroke="#9cc3ff" stroke-width="3.4" stroke-linecap="round"/>
  <!-- 고실끈신경(VII): 뒤·위에서 혀신경에 합류 -->
  <path d="M 560,262 C 520,304 466,344 430,368" fill="none" stroke="#c9a5f0" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 아래이틀신경: 턱뼈구멍으로 -->
  <path d="M 419,292 C 448,352 482,398 497,428" fill="none" stroke="#9cc3ff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 500,436 C 480,472 446,502 408,522" fill="none" stroke="#9cc3ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 5"/>
  <!-- 턱목뿔근신경(운동) -->
  <path d="M 492,416 C 482,446 472,462 462,476" fill="none" stroke="#f0b56b" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ================= 라벨 ================= -->
  <!-- 위 열 -->
  <line x1="394" y1="150" x2="414" y2="166" stroke="#f0b56b" stroke-width="1"/>
  <line x1="428" y1="150" x2="450" y2="160" stroke="#f0b56b" stroke-width="1"/>

  <line x1="504" y1="178" x2="446" y2="248" stroke="#9cc3ff" stroke-width="1"/>

  <!-- 오른쪽 열 -->
  <line x1="696" y1="152" x2="606" y2="252" stroke="#9cc3ff" stroke-width="1"/>

  <line x1="696" y1="264" x2="566" y2="266" stroke="#c9a5f0" stroke-width="1"/>

  <text x="700" y="336" fill="#e6edf3" font-size="11">바깥귀길</text>
  <text x="700" y="349" fill="#93a4b7" font-size="9.5">ext. acoustic meatus</text>
  <line x1="696" y1="332" x2="630" y2="302" stroke="#7b8ea3" stroke-width="1"/>

  <line x1="696" y1="388" x2="536" y2="294" stroke="#f0b56b" stroke-width="1"/>

  <line x1="696" y1="444" x2="452" y2="306" stroke="#f0b56b" stroke-width="1"/>

  <line x1="696" y1="498" x2="462" y2="452" stroke="#f0b56b" stroke-width="1"/>

  <!-- 왼쪽 열 -->
  <line x1="82" y1="248" x2="390" y2="264" stroke="#c9a5f0" stroke-width="1"/>

  <line x1="78" y1="326" x2="342" y2="372" stroke="#9cc3ff" stroke-width="1"/>

  <line x1="72" y1="416" x2="416" y2="420" stroke="#9cc3ff" stroke-width="1"/>

  <!-- 아래 열 -->
  <line x1="330" y1="532" x2="452" y2="502" stroke="#9cc3ff" stroke-width="1"/>

  <line x1="410" y1="580" x2="464" y2="474" stroke="#f0b56b" stroke-width="1"/>

  <!-- ================= 갈래 요약 ================= -->
  <line x1="240" y1="646" x2="640" y2="646" stroke="#3d5166" stroke-width="1"/>
  <!-- 번호핀: 대응 문항 카드 정답 순서와 1:1 (임의 변경 금지) -->
  <line x1="352" y1="196" x2="409" y2="250" stroke="#eab308" stroke-width="1.6"/>
  <circle cx="352" cy="196" r="12" fill="#eab308"/>
  <text x="352" y="200.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">1</text>
  <circle cx="522.0" cy="184.0" r="12" fill="#eab308"/>
  <text x="522.0" y="188.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">2</text>
  <circle cx="714.0" cy="509.0" r="12" fill="#eab308"/>
  <text x="714.0" y="513.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">3</text>
  <circle cx="314.0" cy="155.0" r="12" fill="#eab308"/>
  <text x="314.0" y="159.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">4</text>
  <circle cx="714.0" cy="399.0" r="12" fill="#eab308"/>
  <text x="714.0" y="403.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">5</text>
  <circle cx="714.0" cy="455.0" r="12" fill="#eab308"/>
  <text x="714.0" y="459.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">6</text>
  <circle cx="34.0" cy="339.0" r="12" fill="#eab308"/>
  <text x="34.0" y="343.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">7</text>
  <circle cx="714.0" cy="159.0" r="12" fill="#eab308"/>
  <text x="714.0" y="163.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">8</text>
  <circle cx="34.0" cy="429.0" r="12" fill="#eab308"/>
  <text x="34.0" y="433.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">9</text>
  <circle cx="714.0" cy="271.0" r="12" fill="#eab308"/>
  <text x="714.0" y="275.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">10</text>
  <circle cx="250.0" cy="545.0" r="12" fill="#eab308"/>
  <text x="250.0" y="549.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">11</text>
  <circle cx="374.0" cy="598.0" r="12" fill="#eab308"/>
  <text x="374.0" y="602.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">12</text>
  <circle cx="34.0" cy="261.0" r="12" fill="#eab308"/>
  <text x="34.0" y="265.5" fill="#0e1826" font-size="13" font-weight="700" text-anchor="middle" style="paint-order:normal;stroke:none">13</text>
</svg>