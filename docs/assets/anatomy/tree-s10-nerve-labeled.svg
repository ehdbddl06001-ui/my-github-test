<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1851" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="위팔에서 손까지의 신경과 배벽의 신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 10회차 실습주제(위팔 앞칸·팔오금·아래팔 앞칸·손바닥 / 배벽·고샅관) + e-Anatomy Upper limb — Arm·Forearm·Hand / Abdomen — Abdominal wall -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1851" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">위팔에서 손까지의 신경과 배벽의 신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> nerves of the arm, forearm, hand &amp; abdominal wall</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">10회차 · 세 신경이 칸을 나눠 갖고, 배벽은 갈비사이신경이 이어진다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
