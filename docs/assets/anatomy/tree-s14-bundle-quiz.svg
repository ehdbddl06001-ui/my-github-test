  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">붙잡는 것 — 관절 안정 구조와 골반 복막 — 분지 퀴즈판<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> stabilizers &amp; pelvic pouches</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">14회차 · 어깨는 근육이, 팔꿉은 인대가 붙잡고, 골반장기는 복막 오목과 골반가로막이 받친다</text>
