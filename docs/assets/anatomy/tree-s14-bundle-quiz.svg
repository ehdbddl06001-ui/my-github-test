  <text x="26" y="1276" fill="#93a4b7" font-size="10.5">어깨관절은 접시가 얕아 <tspan fill="#e6edf3" font-weight="700">돌림근띠(SITS)</tspan>가 붙잡는다 — 아래쪽만 띠가 없어 <tspan fill="#e6edf3" font-weight="700">앞아래로</tspan> 빠진다.</text>
  <text x="26" y="1294" fill="#93a4b7" font-size="10.5">복막의 가장 낮은 곳: 남 = <tspan fill="#e6edf3" font-weight="700">곧창자방광오목</tspan>, 여 = <tspan fill="#e6edf3" font-weight="700">곧창자자궁오목(Douglas)</tspan> — 고름·피가 고인다.</text>
  <text x="26" y="1312" fill="#93a4b7" font-size="10.5">골반가로막 = <tspan fill="#e6edf3" font-weight="700">항문올림근(두덩곧창자 · 두덩꼬리 · 엉덩꼬리) + 꼬리근</tspan>.</text>
