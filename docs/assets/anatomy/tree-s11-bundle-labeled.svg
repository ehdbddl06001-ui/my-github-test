  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 폄근지지띠 · 코담배갑 · 간세동이<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> retinaculum compartments, snuffbox &amp; portal triad</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">11회차 · 칸과 경계가 그대로 태깅 문제가 되는 다섯 자리</text>
