<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1821" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="함께 지나는 것 — 폄근지지띠 · 코담배갑 · 간세동이 — 분지 계보 구조도">
