<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1337" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="뒤칸의 신경과 배안의 자율신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 11회차 실습주제(위팔 뒤칸·아래팔 뒤칸·손등 / 복막·위·지라·간·작은창자·큰창자·샘창자·이자) + 인제스트 섹션 a2-s11 §노신경 · §손뒤침근 · §손등표면 · §주변혈관관찰 · §위창자간막동맥 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1337" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">뒤칸의 신경과 배안의 자율신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> radial nerve in the posterior compartment &amp; autonomic plexuses of the abdomen</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">11회차 · 팔 뒤칸은 노신경 하나가 다 맡고, 배안은 얼기가 동맥을 타고 간다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 602,190 H 615 V 125 H 628" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 602,190 H 615 V 194 H 628" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 602,190 H 615 V 264 H 628" fill="none" stroke="#4a6483" stroke-width="1.6"/>
