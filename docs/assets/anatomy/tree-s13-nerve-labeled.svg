<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 1675" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="눈확의 신경과 허리신경얼기 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 13회차 실습주제(머리덮개·머리뼈 속구조·뇌 적출·눈확 / 부신·콩팥·배대동맥·복막·가로막·뒤배벽) + 인제스트 섹션 a2-s12 §눈확속의 구조물 · §눈확 앞모습 · §경막정맥굴 · §뒤배벽의 근육 · §허리신경얼기 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="1026" height="1675" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">눈확의 신경과 허리신경얼기<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> nerves of the orbit &amp; the lumbar plexus</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">13회차 · 눈확은 뇌신경 넷(II·III·IV·VI)과 V1 가지, 뒤배벽은 L1–L4 앞가지가 큰허리근을 뚫고 나온다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
