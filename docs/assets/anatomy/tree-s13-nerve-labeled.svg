  <rect x="26" y="840" width="180" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="860" fill="#9cc3ff" font-size="12" class="kr">13회차의 신경</text>
  <rect x="232" y="363" width="174" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="383" fill="#9cc3ff" font-size="12" class="kr">눈확의 신경 ★</text>
  <text x="242" y="398" fill="#7f9cc4" font-size="9">nerves of the orbit</text>
  <text x="242" y="409" fill="#6f8299" font-size="9">머리뼈 바닥의 구멍 둘(시각신경관</text>
  <text x="242" y="420" fill="#6f8299" font-size="9">· 위눈확틈새)로 들어온다</text>
  <rect x="232" y="1196" width="174" height="77" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="1216" fill="#9cc3ff" font-size="12" class="kr">뒤배벽의 신경 ★</text>
  <text x="242" y="1231" fill="#7f9cc4" font-size="9">nerves of the posterior</text>
  <text x="242" y="1242" fill="#7f9cc4" font-size="9">abdominal wall</text>
  <text x="242" y="1253" fill="#6f8299" font-size="9">L1–L4 앞가지 — 큰허리근 속에서</text>
  <text x="242" y="1264" fill="#6f8299" font-size="9">얼기를 만든다</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">시각신경 ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">optic n. (CN II)</text>
  <text x="442" y="138" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">시각신경관</tspan>으로 — 눈동맥과 함께 ·</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">뇌막이 싸고 있다</text>
  <rect x="432" y="197" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="217" fill="#9cc3ff" font-size="12" class="kr">눈돌림신경 ★</text>
  <text x="442" y="232" fill="#7f9cc4" font-size="9">oculomotor n. (CN III)</text>
  <text x="442" y="243" fill="#6f8299" font-size="9">온힘줄고리 <tspan fill="#e6edf3" font-weight="700">안</tspan>으로 들어와 위·아래</text>
  <text x="442" y="254" fill="#6f8299" font-size="9">두 갈래</text>
  <rect x="432" y="328" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="348" fill="#9cc3ff" font-size="12" class="kr">도르래신경 ★</text>
  <text x="442" y="363" fill="#7f9cc4" font-size="9">trochlear n. (CN IV)</text>
  <text x="442" y="374" fill="#6f8299" font-size="9">온힘줄고리 <tspan fill="#e6edf3" font-weight="700">밖</tspan> · 위빗근 하나</text>
  <rect x="432" y="392" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="412" fill="#9cc3ff" font-size="12" class="kr">갓돌림신경 ★</text>
  <text x="442" y="427" fill="#7f9cc4" font-size="9">abducens n. (CN VI)</text>
  <text x="442" y="438" fill="#6f8299" font-size="9">온힘줄고리 <tspan fill="#e6edf3" font-weight="700">안</tspan> · 가쪽곧은근 하나 —</text>
  <text x="442" y="449" fill="#6f8299" font-size="9">해면정맥굴 <tspan fill="#e6edf3" font-weight="700">속</tspan>을 지난다</text>
  <rect x="432" y="623" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="643" fill="#9cc3ff" font-size="12" class="kr">눈신경 (V1) ★</text>
  <text x="442" y="658" fill="#7f9cc4" font-size="9">ophthalmic n.</text>
  <text x="442" y="669" fill="#6f8299" font-size="9">삼차신경 첫째 가지 · 감각 —</text>
  <text x="442" y="680" fill="#6f8299" font-size="9">셋으로 갈린다</text>
  <rect x="432" y="895" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="915" fill="#9cc3ff" font-size="12" class="kr">갈비밑신경 ★</text>
  <text x="442" y="930" fill="#7f9cc4" font-size="9">subcostal n. (T12)</text>
  <text x="442" y="941" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">가쪽활꼴인대 뒤</tspan>로 들어와</text>
  <text x="442" y="952" fill="#6f8299" font-size="9">허리네모근 앞을 지난다</text>
  <rect x="432" y="970" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="990" fill="#9cc3ff" font-size="12" class="kr">엉덩아랫배신경 ★</text>
  <text x="442" y="1005" fill="#7f9cc4" font-size="9">iliohypogastric n. (L1)</text>
  <text x="442" y="1016" fill="#6f8299" font-size="9">큰허리근 <tspan fill="#e6edf3" font-weight="700">가쪽모서리</tspan> · 두덩 위</text>
  <text x="442" y="1027" fill="#6f8299" font-size="9">피부</text>
  <rect x="432" y="1045" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1065" fill="#9cc3ff" font-size="12" class="kr">엉덩고샅신경 ★</text>
  <text x="442" y="1080" fill="#7f9cc4" font-size="9">ilioinguinal n. (L1)</text>
  <text x="442" y="1091" fill="#6f8299" font-size="9">가쪽모서리 · 샅굴을 지나</text>
  <text x="442" y="1102" fill="#6f8299" font-size="9">음낭/대음순 <tspan fill="#e6edf3" font-weight="700">앞쪽</tspan></text>
  <rect x="432" y="1158" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="1178" fill="#9cc3ff" font-size="12" class="kr">음부넙다리신경 ★</text>
  <text x="442" y="1194" fill="#7f9cc4" font-size="9">genitofemoral n. (L1–L2)</text>
  <text x="442" y="1204" fill="#6f8299" font-size="9">큰허리근 <tspan fill="#e6edf3" font-weight="700">앞면을 뚫고</tspan> 나오는</text>
  <text x="442" y="1216" fill="#6f8299" font-size="9">유일한 가지</text>
  <rect x="432" y="1270" width="170" height="88" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1290" fill="#9cc3ff" font-size="12" class="kr">가쪽넙다리피부신경 ★</text>
  <text x="442" y="1305" fill="#7f9cc4" font-size="9">lat. cutaneous n. of thigh</text>
  <text x="442" y="1316" fill="#7f9cc4" font-size="9">(L2–L3)</text>
  <text x="442" y="1327" fill="#6f8299" font-size="9">가쪽모서리 → 위앞엉덩뼈가시 안쪽</text>
  <text x="442" y="1338" fill="#6f8299" font-size="9">· 샅굴인대 밑 — 눌리면</text>
  <text x="442" y="1349" fill="#6f8299" font-size="9">이상감각넙다리통</text>
  <rect x="432" y="1367" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1387" fill="#9cc3ff" font-size="12" class="kr">넙다리신경 ★</text>
  <text x="442" y="1402" fill="#7f9cc4" font-size="9">femoral n. (L2–L4)</text>
  <text x="442" y="1413" fill="#6f8299" font-size="9">가쪽모서리 · 큰허리근과 엉덩근</text>
  <text x="442" y="1424" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">사이 고랑</tspan> — 얼기의 가장 큰 가지</text>
  <rect x="432" y="1442" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="1462" fill="#9cc3ff" font-size="12" class="kr">폐쇄신경 ★</text>
  <text x="442" y="1477" fill="#7f9cc4" font-size="9">obturator n. (L2–L4)</text>
  <text x="442" y="1488" fill="#6f8299" font-size="9">큰허리근 <tspan fill="#e6edf3" font-weight="700">안쪽모서리</tspan> → 폐쇄관 ·</text>
  <text x="442" y="1499" fill="#6f8299" font-size="9">넙다리 안쪽 칸</text>
  <rect x="432" y="1517" width="170" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="442" y="1537" fill="#9cc3ff" font-size="12" class="kr">허리교감줄기</text>
  <text x="442" y="1552" fill="#7f9cc4" font-size="9">lumbar sympathetic trunk</text>
  <text x="442" y="1563" fill="#6f8299" font-size="9">척추뼈몸통 앞가쪽 · <tspan fill="#e6edf3" font-weight="700">안쪽활꼴인대</tspan></text>
  <text x="442" y="1574" fill="#6f8299" font-size="9">뒤<tspan fill="#e6edf3" font-weight="700">로 들어온다</tspan></text>
  <rect x="628" y="167" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="187" fill="#9cc3ff" font-size="12" class="kr">위갈래 ★</text>
  <text x="638" y="202" fill="#7f9cc4" font-size="9">superior division</text>
  <text x="638" y="213" fill="#6f8299" font-size="9">위곧은근 · <tspan fill="#e6edf3" font-weight="700">위눈꺼풀올림근</tspan></text>
  <rect x="628" y="238" width="160" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="638" y="258" fill="#9cc3ff" font-size="12" class="kr">아래갈래 ★</text>
  <text x="638" y="272" fill="#7f9cc4" font-size="9">inferior division</text>
  <text x="638" y="284" fill="#6f8299" font-size="9">안쪽곧은근 · 아래곧은근 ·</text>
  <text x="638" y="294" fill="#6f8299" font-size="9">아래빗근</text>
  <rect x="628" y="497" width="160" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="638" y="517" fill="#9cc3ff" font-size="12" class="kr">이마신경 ★</text>
  <text x="638" y="532" fill="#7f9cc4" font-size="9">frontal n.</text>
  <text x="638" y="543" fill="#6f8299" font-size="9">눈확천장 바로 밑 · 가장 먼저</text>
  <text x="638" y="554" fill="#6f8299" font-size="9">보인다</text>
  <rect x="628" y="606" width="160" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="626" fill="#9cc3ff" font-size="12" class="kr">눈물샘신경 ★</text>
  <text x="638" y="641" fill="#7f9cc4" font-size="9">lacrimal n.</text>
  <text x="638" y="652" fill="#6f8299" font-size="9">가쪽벽을 따라 눈물샘으로 —</text>
  <text x="638" y="663" fill="#6f8299" font-size="9">분비 섬유는 얼굴신경에서 얻어</text>
  <text x="638" y="674" fill="#6f8299" font-size="9">탄다</text>
  <rect x="628" y="754" width="160" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="638" y="774" fill="#9cc3ff" font-size="12" class="kr">코섬모체신경 ★</text>
  <text x="638" y="789" fill="#7f9cc4" font-size="9">nasociliary n.</text>
  <text x="638" y="800" fill="#6f8299" font-size="9">온힘줄고리 <tspan fill="#e6edf3" font-weight="700">안</tspan> · 시각신경을</text>
  <text x="638" y="811" fill="#6f8299" font-size="9">넘어 안쪽으로</text>
  <rect x="628" y="1120" width="160" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1140" fill="#9cc3ff" font-size="12" class="kr">음부가지 ★</text>
  <text x="638" y="1155" fill="#7f9cc4" font-size="9">genital br.</text>
  <text x="638" y="1166" fill="#6f8299" font-size="9">깊은샅굴구멍 →</text>
  <text x="638" y="1177" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">고환올림근</tspan>(고환올림근반사</text>
  <text x="638" y="1188" fill="#6f8299" font-size="9">날신경)</text>
  <rect x="628" y="1206" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1226" fill="#9cc3ff" font-size="12" class="kr">넙다리가지</text>
  <text x="638" y="1241" fill="#7f9cc4" font-size="9">femoral br.</text>
  <text x="638" y="1252" fill="#6f8299" font-size="9">넙다리삼각 피부</text>
  <rect x="628" y="1517" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="1537" fill="#9cc3ff" font-size="12" class="kr">허리신경절 · 교통가지</text>
  <text x="638" y="1552" fill="#7f9cc4" font-size="9">lumbar ganglia · rami</text>
  <text x="638" y="1563" fill="#7f9cc4" font-size="9">communicantes</text>
  <text x="638" y="1574" fill="#6f8299" font-size="9">흰교통가지는 <tspan fill="#e6edf3" font-weight="700">L1–L2까지만</tspan></text>
  <rect x="814" y="231" width="160" height="88" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="251" fill="#9cc3ff" font-size="12" class="kr">섬모체신경절 부교감뿌리 ★</text>
  <text x="824" y="266" fill="#7f9cc4" font-size="9">parasympathetic root to</text>
  <text x="824" y="277" fill="#7f9cc4" font-size="9">ciliary ganglion</text>
  <text x="824" y="288" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">여기서만 시냅스</tspan> →</text>
  <text x="824" y="299" fill="#6f8299" font-size="9">짧은섬모체신경 → 동공조임근 ·</text>
  <text x="824" y="310" fill="#6f8299" font-size="9">섬모체근(가까이 보기)</text>
  <rect x="814" y="467" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="487" fill="#9cc3ff" font-size="12" class="kr">눈확위신경 ★</text>
  <text x="824" y="502" fill="#7f9cc4" font-size="9">supraorbital n.</text>
  <text x="824" y="513" fill="#6f8299" font-size="9">더 크고 곧게 ·</text>
  <text x="824" y="524" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">눈확위구멍/패임</tspan>으로 이마 피부</text>
  <rect x="814" y="542" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="562" fill="#9cc3ff" font-size="12" class="kr">도르래위신경</text>
  <text x="824" y="577" fill="#7f9cc4" font-size="9">supratrochlear n.</text>
  <text x="824" y="588" fill="#6f8299" font-size="9">더 안쪽 · 이마 안쪽 피부</text>
  <rect x="814" y="692" width="160" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="712" fill="#9cc3ff" font-size="12" class="kr">긴섬모체신경 ★</text>
  <text x="824" y="727" fill="#7f9cc4" font-size="9">long ciliary nn.</text>
  <text x="824" y="738" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">각막 감각</tspan> + 동공확대근 교감</text>
  <text x="824" y="749" fill="#6f8299" font-size="9">섬유 — 각막반사 들신경</text>
  <rect x="814" y="767" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="787" fill="#9cc3ff" font-size="12" class="kr">뒤벌집신경 · 앞벌집신경</text>
  <text x="824" y="802" fill="#7f9cc4" font-size="9">post. / ant. ethmoidal nn.</text>
  <text x="824" y="813" fill="#6f8299" font-size="9">벌집굴 · 코안 · 코끝 피부</text>
  <rect x="814" y="831" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="824" y="851" fill="#9cc3ff" font-size="12" class="kr">도르래아래신경</text>
  <text x="824" y="866" fill="#7f9cc4" font-size="9">infratrochlear n.</text>
  <text x="824" y="877" fill="#6f8299" font-size="9">안쪽눈구석 피부</text>
  <line x1="26" y1="1593" x2="1000" y2="1593" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1605" fill="#93a4b7" font-size="10.5">눈근육 신경은 <tspan fill="#e6edf3" font-weight="700">LR6 · SO4 · 나머지 R3</tspan> — 가쪽곧은근=갓돌림, 위빗근=도르래, 나머지 전부 눈돌림.</text>
  <text x="26" y="1623" fill="#93a4b7" font-size="10.5">섬모체신경절에서 <tspan fill="#e6edf3" font-weight="700">시냅스하는 것은 부교감(눈돌림신경) 하나뿐</tspan>이다 — 교감·감각은 그냥 지나간다.</text>
  <text x="26" y="1641" fill="#93a4b7" font-size="10.5">허리신경얼기는 <tspan fill="#e6edf3" font-weight="700">큰허리근 속에서</tspan> 만들어진다 — 가쪽모서리 넷 · 앞면 하나(음부넙다리) · 안쪽모서리 하나(폐쇄).</text>
</svg>
