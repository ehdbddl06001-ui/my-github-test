  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">눈확의 신경과 허리신경얼기 — 분지 퀴즈판<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> nerves of the orbit &amp; the lumbar plexus</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">13회차 · 눈확은 뇌신경 넷(II·III·IV·VI)과 V1 가지, 뒤배벽은 L1–L4 앞가지가 큰허리근을 뚫고 나온다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">번호를 보고 이름을 답하시오 · 정답은 대응 문항 카드 frontmatter</text>
