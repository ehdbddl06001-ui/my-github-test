  <text x="26" y="1238" fill="#93a4b7" font-size="10.5"><tspan fill="#e6edf3" font-weight="700">교감은 저장(참기), 부교감은 배출(누기)</tspan> — 골반내장신경(S2–S4)이 방광 배뇨근을 짜고 속조임근을 푼다.</text>
  <text x="26" y="1256" fill="#93a4b7" font-size="10.5">바깥조임근(요도·항문)은 <tspan fill="#e6edf3" font-weight="700">음부신경(S2–S4)</tspan> — 뜻대로 참는 근육은 몸신경이다.</text>
  <text x="26" y="1274" fill="#93a4b7" font-size="10.5">관절의 신경은 <tspan fill="#e6edf3" font-weight="700">Hilton 법칙</tspan> — 관절을 움직이는 근육의 신경이 관절주머니와 그 위 피부도 맡는다.</text>
