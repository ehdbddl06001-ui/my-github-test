<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="척수신경 앞가지·뒤가지 분기와 피부신경 태깅 연습판 — 번호핀만 남긴 퀴즈판">
  <!-- 퀴즈판. 번호 1–12는 문항 anatomy-2026-0040 의 정답 순서와 1:1 (임의 변경 금지).
       라벨판: diag-dorsal-rami-labeled.svg -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
    .b{fill:#1b2a3c;stroke:#3b506a}
    .pin{fill:#2a2416;stroke:#eab308;stroke-width:1.6}
    .pn{fill:#eab308;font-size:11.5;font-weight:700;text-anchor:middle}
  </style>
  <rect width="880" height="660" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">태깅 연습 — 척수신경 가지와 등·볼기 피부신경
    <tspan fill="#93a4b7" font-size="12" font-weight="400">quiz sheet</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">1–12의 이름을 한·영으로 답하고, 각각이 <tspan fill="#e6edf3">앞가지 계열인지 뒤가지 계열인지</tspan>도 함께 말하시오.</text>
  <text x="20" y="68" fill="#6f8299" font-size="11">정답 확인은 라벨판(diag-dorsal-rami-labeled.svg)과 문항 카드에서.</text>

  <!-- ================= 패널 A ================= -->
  <rect x="18" y="82" width="430" height="348" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="34" y="106" fill="#9dc7f0" font-size="14" class="kr">A. 갈라지는 순서</text>

  <rect x="163" y="118" width="140" height="30" rx="6" fill="#2b3f57" stroke="#6f8299"/>
  <text x="233" y="137" fill="#e6edf3" font-size="12" class="kr" text-anchor="middle">척수 spinal cord</text>

  <line x1="200" y1="148" x2="140" y2="172" stroke="#93a4b7" stroke-width="2"/>
  <line x1="266" y1="148" x2="326" y2="172" stroke="#93a4b7" stroke-width="2"/>
  <rect x="46" y="172" width="176" height="46" rx="6" class="b"/>
  <circle cx="76" cy="195" r="13" class="pin"/><text x="76" y="199" class="pn">1</text>
  <text x="98" y="192" fill="#6f8299" font-size="9.5">신경절이 붙는 쪽</text>
  <text x="98" y="206" fill="#6f8299" font-size="9.5">기능(감각/운동)도 답할 것</text>

  <rect x="244" y="172" width="176" height="46" rx="6" class="b"/>
  <circle cx="274" cy="195" r="13" class="pin"/><text x="274" y="199" class="pn">2</text>
  <text x="296" y="192" fill="#6f8299" font-size="9.5">신경절이 없는 쪽</text>
  <text x="296" y="206" fill="#6f8299" font-size="9.5">기능(감각/운동)도 답할 것</text>

  <line x1="134" y1="218" x2="196" y2="238" stroke="#93a4b7" stroke-width="1.6"/>
  <line x1="332" y1="218" x2="270" y2="238" stroke="#93a4b7" stroke-width="1.6"/>
  <rect x="146" y="238" width="174" height="32" rx="6" fill="#243b52" stroke="#7f9ab5"/>
  <circle cx="176" cy="254" r="13" class="pin"/><text x="176" y="258" class="pn">3</text>
  <text x="198" y="258" fill="#6f8299" font-size="9.5">둘이 합쳐진 이 신경은?</text>

  <line x1="190" y1="270" x2="128" y2="292" stroke="#93a4b7" stroke-width="2.4"/>
  <line x1="276" y1="270" x2="338" y2="292" stroke="#93a4b7" stroke-width="3.4"/>
  <rect x="34" y="292" width="188" height="36" rx="6" class="b"/>
  <circle cx="64" cy="310" r="13" class="pin"/><text x="64" y="314" class="pn">4</text>
  <text x="86" y="314" fill="#6f8299" font-size="9.5">가늘다 · 얼기를 안 만든다</text>

  <rect x="244" y="292" width="188" height="36" rx="6" class="b"/>
  <circle cx="274" cy="310" r="13" class="pin"/><text x="274" y="314" class="pn">5</text>
  <text x="296" y="314" fill="#6f8299" font-size="9.5">굵다 · 얼기를 만든다</text>

  <line x1="88" y1="328" x2="80" y2="348" stroke="#93a4b7" stroke-width="1.8"/>
  <line x1="168" y1="328" x2="176" y2="348" stroke="#93a4b7" stroke-width="1.8"/>
  <rect x="34" y="348" width="92" height="28" rx="5" class="b"/>
  <circle cx="80" cy="362" r="12" class="pin"/><text x="80" y="366" class="pn">6</text>
  <rect x="130" y="348" width="92" height="28" rx="5" class="b"/>
  <circle cx="176" cy="362" r="12" class="pin"/><text x="176" y="366" class="pn">7</text>

  <text x="34" y="394" fill="#6f8299" font-size="9.5">6·7 중 <tspan fill="#e6edf3">T1–T6</tspan>에서 피부로 가는 쪽은?</text>
  <text x="34" y="408" fill="#6f8299" font-size="9.5">T7–T12에서는 어느 쪽인가?</text>
  <text x="252" y="394" fill="#6f8299" font-size="9.5">5가 만드는 얼기 3개는?</text>
  <text x="252" y="408" fill="#6f8299" font-size="9.5">가슴에서 5의 이름은?</text>

  <!-- ================= 패널 B ================= -->
  <rect x="462" y="82" width="400" height="348" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="478" y="106" fill="#9dc7f0" font-size="14" class="kr">B. 등·볼기 피부신경 <tspan fill="#93a4b7" font-size="10.5" font-weight="400">뒤에서 본 모습</tspan></text>

  <g transform="translate(486,110) scale(0.86)">
    <circle cx="86" cy="24" r="20" fill="#162436" stroke="#3b506a" stroke-width="1.5"/>
    <path d="M 74,44 L 98,44 L 98,54 L 74,54 Z" fill="#162436" stroke="#3b506a" stroke-width="1.3"/>
    <path d="M 74,54 C 52,60 34,70 28,82 L 24,112 L 34,116 L 40,92
             C 44,132 44,166 48,194 L 124,194 C 128,166 128,132 132,92
             L 138,116 L 148,112 L 144,82 C 138,70 120,60 98,54 Z"
          fill="#162436" stroke="#3b506a" stroke-width="1.6"/>
    <path d="M 48,194 L 124,194 C 128,218 126,242 120,256 L 52,256 C 46,242 44,218 48,194 Z"
          fill="#18293d" stroke="#3b506a" stroke-width="1.5"/>
    <line x1="86" y1="56" x2="86" y2="194" stroke="#2b3a4d" stroke-width="1.3"/>

    <path d="M 86,44 C 76,34 70,26 72,16" fill="none" stroke="#f0b56b" stroke-width="2.4"/>
    <circle cx="72" cy="16" r="3.4" fill="#f0b56b"/>

    <g stroke="#f0b56b" stroke-width="2" fill="none">
      <path d="M 86,72 L 66,78"/><path d="M 86,92 L 64,99"/><path d="M 86,112 L 62,120"/>
      <path d="M 86,132 L 60,142"/><path d="M 86,152 L 58,164"/><path d="M 86,172 L 58,186"/>
      <path d="M 86,72 L 106,78"/><path d="M 86,92 L 108,99"/><path d="M 86,112 L 110,120"/>
      <path d="M 86,132 L 112,142"/><path d="M 86,152 L 114,164"/><path d="M 86,172 L 114,186"/>
    </g>

    <g stroke="#f0b56b" stroke-width="2.6" fill="none">
      <path d="M 78,190 C 74,200 70,208 66,218"/>
      <path d="M 92,190 C 96,200 100,208 104,218"/>
      <path d="M 86,190 L 86,216"/>
    </g>
    <line x1="48" y1="194" x2="124" y2="194" stroke="#eab308" stroke-width="1.6" stroke-dasharray="4 3"/>

    <g stroke="#f0b56b" stroke-width="2.2" fill="none">
      <path d="M 86,214 L 74,228"/><path d="M 86,224 L 76,240"/>
      <path d="M 86,214 L 98,228"/><path d="M 86,224 L 96,240"/>
    </g>

    <g stroke="#9cc3ff" stroke-width="3.4" fill="none" stroke-linecap="round">
      <path d="M 56,268 C 60,252 68,244 80,244"/>
      <path d="M 116,268 C 112,252 104,244 92,244"/>
      <path d="M 66,272 C 70,258 76,252 84,252"/>
      <path d="M 106,272 C 102,258 96,252 88,252"/>
    </g>
    <line x1="52" y1="256" x2="120" y2="256" stroke="#4fb3c9" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>

  <line x1="550" y1="126" x2="668" y2="126" stroke="#4a5f78" stroke-width="0.9"/>
  <circle cx="684" cy="126" r="13" class="pin"/><text x="684" y="130" class="pn">8</text>

  <line x1="592" y1="216" x2="668" y2="180" stroke="#4a5f78" stroke-width="0.9"/>
  <circle cx="684" cy="180" r="13" class="pin"/><text x="684" y="184" class="pn">9</text>

  <line x1="574" y1="290" x2="668" y2="234" stroke="#4a5f78" stroke-width="0.9"/>
  <circle cx="684" cy="234" r="13" class="pin"/><text x="684" y="238" class="pn">10</text>

  <line x1="572" y1="312" x2="668" y2="288" stroke="#4a5f78" stroke-width="0.9"/>
  <circle cx="684" cy="288" r="13" class="pin"/><text x="684" y="292" class="pn">11</text>

  <line x1="545" y1="336" x2="668" y2="342" stroke="#4a5f78" stroke-width="0.9"/>
  <circle cx="684" cy="342" r="13" class="pin"/><text x="684" y="346" class="pn">12</text>

  <text x="706" y="130" fill="#6f8299" font-size="9">어느 분절의 뒤가지?</text>
  <text x="706" y="184" fill="#6f8299" font-size="9">정중선 옆 세로 띠</text>
  <text x="706" y="238" fill="#6f8299" font-size="9">노란 파선을 넘는다</text>
  <text x="706" y="292" fill="#6f8299" font-size="9">그 아래 구역</text>
  <text x="706" y="346" fill="#6f8299" font-size="9">색이 다른 이유는?</text>

  <rect x="478" y="378" width="368" height="40" rx="5" fill="#1a2f47" stroke="#4d7fb0"/>
  <text x="488" y="395" fill="#9cc3ff" font-size="10" class="kr">12만 색이 다르다 — 유래가 다르기 때문이다. 무엇에서 나오나?</text>
  <text x="488" y="409" fill="#6f8299" font-size="9">노란 파선이 뜻하는 뼈 지표도 함께 답한다</text>

  <!-- ================= 패널 C ================= -->
  <rect x="18" y="440" width="844" height="204" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="34" y="464" fill="#9dc7f0" font-size="14" class="kr">C. 말로 설명하기 <tspan fill="#93a4b7" font-size="10.5" font-weight="400">보지 않고 답해 보자</tspan></text>

  <g font-size="11">
    <rect x="34" y="476" width="404" height="34" rx="5" class="b"/>
    <text x="46" y="497" fill="#e6edf3">1. 4가 운동으로 지배하는 근육은 어느 층인가?</text>
    <rect x="34" y="516" width="404" height="34" rx="5" class="b"/>
    <text x="46" y="537" fill="#e6edf3">2. 등 얕은층 근육은 4와 5 중 어느 쪽 지배인가?</text>
    <rect x="34" y="556" width="404" height="34" rx="5" class="b"/>
    <text x="46" y="577" fill="#e6edf3">3. 4는 신경얼기를 만드는가?</text>

    <rect x="450" y="476" width="412" height="34" rx="5" class="b"/>
    <text x="462" y="497" fill="#e6edf3">4. C1의 4는 무엇이라 부르며 왜 특별한가?</text>
    <rect x="450" y="516" width="412" height="34" rx="5" class="b"/>
    <text x="462" y="537" fill="#e6edf3">5. 등세모근의 지배신경은? (함정)</text>
    <rect x="450" y="556" width="412" height="34" rx="5" class="b"/>
    <text x="462" y="577" fill="#e6edf3">6. 등 피부를 벗길 때 살려 두는 신경은 4·5 중?</text>
  </g>
  <text x="34" y="614" fill="#6f8299" font-size="9.5">힌트: 정중선 가까이에서 얕은근막을 뚫고 나오는 신경 = 뒤가지 계열. 가쪽으로 갈수록 앞가지 계열이다.</text>
  <text x="34" y="632" fill="#6f8299" font-size="9.5">답을 소리 내어 말한 뒤 라벨판으로 채점한다 — 태깅은 눈이 아니라 입으로 익힌다.</text>
</svg>
