  <path d="M 602,1008 H 615 V 1003 H 628" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 602,1114 H 615 V 1084 H 628" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 602,1114 H 615 V 1153 H 628" fill="none" stroke="#584a76" stroke-width="1.6"/>
