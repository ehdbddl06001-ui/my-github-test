<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1540" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="속엉덩동맥 · 골반의 정맥 · 어깨관절 둘레 고리 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 14회차 인제스트 섹션 a2-s14 §속엉덩동맥 · §남자골반안 · §여자골반안 · §항문관 · §전립샘 · §어깨관절 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1540" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">속엉덩동맥 · 골반의 정맥 · 어깨관절 둘레 고리<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> internal iliac a. &amp; pelvic veins</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">14회차 · 속엉덩동맥은 뒤줄기(벽쪽) · 앞줄기(내장+벽)로 갈리고, 골반 정맥은 얼기로 모여 속엉덩정맥으로 간다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 602,182 H 615 V 120 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,182 H 615 V 184 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
