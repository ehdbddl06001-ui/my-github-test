<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 883" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="함께 지나는 것 — 귀밑샘·갈비사이 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 4회차 §귀밑샘 · 가슴벽 갈비사이 · 세모가슴근고랑 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="883" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 귀밑샘·갈비사이<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> neurovascular bundles</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">4회차 · 귀밑샘은 얕은 것부터 신경–정맥–동맥, 갈비사이고랑은 위부터 정맥–동맥–신경</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,187 H 419 V 125 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,187 H 419 V 194 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,187 H 419 V 258 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,382 H 419 V 322 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,382 H 419 V 386 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,382 H 419 V 450 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,542 H 419 V 514 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,542 H 419 V 578 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
