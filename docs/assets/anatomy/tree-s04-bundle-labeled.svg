  <path d="M 406,705 H 419 V 706 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,705 H 419 V 776 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,446 H 219 V 187 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,446 H 219 V 382 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,446 H 219 V 542 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,446 H 219 V 705 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <rect x="26" y="427" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="447" fill="#7fd4a8" font-size="12" class="kr">네 개의 통로</text>
  <rect x="232" y="160" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="180" fill="#7fd4a8" font-size="12" class="kr">귀밑샘 속 ★</text>
  <text x="242" y="195" fill="#5fae87" font-size="9">within the parotid gland</text>
  <text x="242" y="206" fill="#6f8299" font-size="9">얕은 → 깊은</text>
  <rect x="232" y="354" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="374" fill="#7fd4a8" font-size="12" class="kr">갈비사이고랑 ★</text>
  <text x="242" y="390" fill="#5fae87" font-size="9">costal groove</text>
  <text x="242" y="400" fill="#6f8299" font-size="9">위 → 아래 · VAN</text>
  <rect x="232" y="514" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="534" fill="#7fd4a8" font-size="12" class="kr">세모가슴근고랑 ★</text>
  <text x="242" y="550" fill="#5fae87" font-size="9">deltopectoral groove</text>
  <text x="242" y="560" fill="#6f8299" font-size="9">빗장뼈 아래 삼각</text>
  <rect x="232" y="677" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="697" fill="#7fd4a8" font-size="12" class="kr">얼굴의 구멍 짝</text>
  <text x="242" y="712" fill="#5fae87" font-size="9">foramina of the face</text>
  <text x="242" y="723" fill="#6f8299" font-size="9">신경과 동맥이 같은 이름으로 함께</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">① 얼굴신경 VII ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">facial n.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">가장 얕다 · 샘을 얕은/깊은엽으로</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">가른다</text>
  <rect x="432" y="167" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="187" fill="#b49ae0" font-size="12" class="kr">② 아래턱뒤정맥</text>
  <text x="442" y="202" fill="#8f79b8" font-size="9">retromandibular v.</text>
  <text x="442" y="213" fill="#6f8299" font-size="9">중간</text>
  <rect x="432" y="231" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="251" fill="#e0645f" font-size="12" class="kr">③ 바깥목동맥 ★</text>
  <text x="442" y="266" fill="#c98a86" font-size="9">external carotid a.</text>
  <text x="442" y="277" fill="#6f8299" font-size="9">가장 깊다</text>
  <rect x="432" y="295" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="315" fill="#b49ae0" font-size="12" class="kr">① 갈비사이정맥</text>
  <text x="442" y="330" fill="#8f79b8" font-size="9">post. intercostal v.</text>
  <text x="442" y="341" fill="#6f8299" font-size="9">가장 <tspan fill="#e6edf3" font-weight="700">위</tspan></text>
  <rect x="432" y="359" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="379" fill="#e0645f" font-size="12" class="kr">② 갈비사이동맥</text>
  <text x="442" y="394" fill="#c98a86" font-size="9">post. intercostal a.</text>
  <text x="442" y="405" fill="#6f8299" font-size="9">가운데</text>
  <rect x="432" y="423" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="443" fill="#9cc3ff" font-size="12" class="kr">③ 갈비사이신경 ★</text>
  <text x="442" y="458" fill="#7f9cc4" font-size="9">intercostal n.</text>
  <text x="442" y="469" fill="#6f8299" font-size="9">가장 <tspan fill="#e6edf3" font-weight="700">아래</tspan>·가장 얕다 — 천자 주의</text>
  <rect x="432" y="487" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="507" fill="#b49ae0" font-size="12" class="kr">노쪽피부정맥 ★</text>
  <text x="442" y="522" fill="#8f79b8" font-size="9">cephalic v.</text>
  <text x="442" y="533" fill="#6f8299" font-size="9">겨드랑정맥으로 합류</text>
  <rect x="432" y="551" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="571" fill="#e0645f" font-size="12" class="kr">어깨세모가지</text>
  <text x="442" y="586" fill="#c98a86" font-size="9">deltoid br. of thoracoacromial</text>
  <text x="442" y="597" fill="#c98a86" font-size="9">a.</text>
  <rect x="432" y="615" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="635" fill="#9cc3ff" font-size="12" class="kr">눈확위구멍 ★</text>
  <text x="442" y="650" fill="#7f9cc4" font-size="9">supraorbital foramen</text>
  <text x="442" y="661" fill="#6f8299" font-size="9">눈확위신경(V1) + 눈확위동맥</text>
  <rect x="432" y="679" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="699" fill="#9cc3ff" font-size="12" class="kr">눈확아래구멍 ★</text>
  <text x="442" y="714" fill="#7f9cc4" font-size="9">infraorbital foramen</text>
  <text x="442" y="725" fill="#6f8299" font-size="9">눈확아래신경(V2) + 눈확아래동맥</text>
  <rect x="432" y="743" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="763" fill="#9cc3ff" font-size="12" class="kr">턱끝구멍 ★</text>
  <text x="442" y="778" fill="#7f9cc4" font-size="9">mental foramen</text>
  <text x="442" y="789" fill="#6f8299" font-size="9">턱끝신경(V3) + 턱끝동맥 · 세</text>
  <text x="442" y="800" fill="#6f8299" font-size="9">구멍은 거의 수직선</text>
  <line x1="26" y1="819" x2="628" y2="819" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="831" fill="#93a4b7" font-size="10.5">귀밑샘 속 순서 '신–정–동'(얕은→깊은) — 다리오금과 같은 순서로 묶어 외운다.</text>
  <text x="26" y="849" fill="#93a4b7" font-size="10.5">갈비사이고랑은 위부터 '정–동–신'(VAN) — 천자는 반드시 갈비뼈 <tspan fill="#e6edf3" font-weight="700">위모서리</tspan>를 따라.</text>
</svg>
