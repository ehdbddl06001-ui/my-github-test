<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 863" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="목뿌리·발목의 신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 7회차 §목의 뿌리·인두 · 종아리 가쪽 · 발목 안쪽면 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="863" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">목뿌리·발목의 신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> nerves of the root of neck &amp; ankle</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">7회차 · 위가슴문을 지나는 신경과, 굽힘근지지띠 밑을 지나는 신경</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,184 H 419 V 120 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,184 H 419 V 189 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,184 H 419 V 258 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,328 H 419 V 322 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,404 H 419 V 408 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,519 H 419 V 489 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,519 H 419 V 558 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,685 H 419 V 622 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,685 H 419 V 686 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,685 H 419 V 756 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,436 H 219 V 184 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,436 H 219 V 328 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,436 H 219 V 404 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,436 H 219 V 519 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,436 H 219 V 685 H 232" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <rect x="26" y="417" width="180" height="38" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="1.3"/>
  <text x="36" y="437" fill="#9cc3ff" font-size="12" class="kr">7회차의 신경</text>
  <rect x="232" y="157" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="177" fill="#9cc3ff" font-size="12" class="kr">미주신경 X ★</text>
  <text x="242" y="192" fill="#7f9cc4" font-size="9">vagus n.</text>
  <text x="242" y="203" fill="#6f8299" font-size="9">목혈관신경집 안에서 내려간다</text>
  <rect x="232" y="295" width="174" height="66" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="315" fill="#9cc3ff" font-size="12" class="kr">가로막신경 ★</text>
  <text x="242" y="330" fill="#7f9cc4" font-size="9">phrenic n.</text>
  <text x="242" y="341" fill="#6f8299" font-size="9">C3–5 · <tspan fill="#e6edf3" font-weight="700">앞목갈비근 앞면</tspan>을 타고</text>
  <text x="242" y="352" fill="#6f8299" font-size="9">내려간다</text>
  <rect x="232" y="376" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="396" fill="#9cc3ff" font-size="12" class="kr">팔신경얼기 ★</text>
  <text x="242" y="412" fill="#7f9cc4" font-size="9">brachial plexus</text>
  <text x="242" y="422" fill="#6f8299" font-size="9">앞·중간목갈비근 <tspan fill="#e6edf3" font-weight="700">사이</tspan>(목갈비근틈새)</text>
  <rect x="232" y="492" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="512" fill="#9cc3ff" font-size="12" class="kr">온종아리신경 ★</text>
  <text x="242" y="527" fill="#7f9cc4" font-size="9">common fibular n.</text>
  <text x="242" y="538" fill="#6f8299" font-size="9">종아리뼈목을 감아 돈다 — 발처짐</text>
  <rect x="232" y="657" width="174" height="55" rx="7" fill="#1d3552" stroke="#4a6483" stroke-width="1.3"/>
  <text x="242" y="677" fill="#9cc3ff" font-size="12" class="kr">정강신경 ★</text>
  <text x="242" y="692" fill="#7f9cc4" font-size="9">tibial n.</text>
  <text x="242" y="703" fill="#6f8299" font-size="9">굽힘근지지띠 밑 <tspan fill="#e6edf3" font-weight="700">발목굴</tspan>을 지난다</text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">되돌이후두신경(오른) ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">right recurrent laryngeal n.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">빗장밑동맥</tspan>을 감아 올라간다</text>
  <rect x="432" y="156" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="176" fill="#9cc3ff" font-size="12" class="kr">되돌이후두신경(왼) ★</text>
  <text x="442" y="191" fill="#7f9cc4" font-size="9">left recurrent laryngeal n.</text>
  <text x="442" y="202" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">대동맥활</tspan>(동맥관인대)을 감아 — 더</text>
  <text x="442" y="213" fill="#6f8299" font-size="9">길다</text>
  <rect x="432" y="231" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="251" fill="#9cc3ff" font-size="12" class="kr">위후두신경</text>
  <text x="442" y="266" fill="#7f9cc4" font-size="9">superior laryngeal n.</text>
  <text x="442" y="277" fill="#6f8299" font-size="9">속가지(감각)+바깥가지(반지방패근)</text>
  <rect x="432" y="295" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="315" fill="#9cc3ff" font-size="12" class="kr">가로막</text>
  <text x="442" y="330" fill="#7f9cc4" font-size="9">diaphragm</text>
  <text x="442" y="341" fill="#6f8299" font-size="9">C3-4-5 keeps the diaphragm alive</text>
  <rect x="432" y="370" width="170" height="77" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="390" fill="#9cc3ff" font-size="12" class="kr">위가슴문 통과 ★</text>
  <text x="442" y="405" fill="#7f9cc4" font-size="9">through superior thoracic</text>
  <text x="442" y="416" fill="#7f9cc4" font-size="9">aperture</text>
  <text x="442" y="427" fill="#6f8299" font-size="9">빗장밑동맥과 같은 틈새 — 정맥은</text>
  <text x="442" y="438" fill="#6f8299" font-size="9">앞목갈비근 <tspan fill="#e6edf3" font-weight="700">앞</tspan></text>
  <rect x="432" y="456" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="476" fill="#9cc3ff" font-size="12" class="kr">얕은종아리신경 ★</text>
  <text x="442" y="491" fill="#7f9cc4" font-size="9">superficial fibular n.</text>
  <text x="442" y="502" fill="#6f8299" font-size="9">가쪽칸(긴·짧은종아리근) + 발등</text>
  <text x="442" y="513" fill="#6f8299" font-size="9">피부</text>
  <rect x="432" y="531" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="551" fill="#9cc3ff" font-size="12" class="kr">깊은종아리신경 ★</text>
  <text x="442" y="566" fill="#7f9cc4" font-size="9">deep fibular n.</text>
  <text x="442" y="577" fill="#6f8299" font-size="9">앞칸 근육 + <tspan fill="#e6edf3" font-weight="700">첫째 발가락사이 피부</tspan></text>
  <rect x="432" y="595" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="615" fill="#9cc3ff" font-size="12" class="kr">안쪽발바닥신경 ★</text>
  <text x="442" y="630" fill="#7f9cc4" font-size="9">medial plantar n.</text>
  <text x="442" y="641" fill="#6f8299" font-size="9">손의 정중신경에 해당</text>
  <rect x="432" y="659" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="679" fill="#9cc3ff" font-size="12" class="kr">가쪽발바닥신경 ★</text>
  <text x="442" y="694" fill="#7f9cc4" font-size="9">lateral plantar n.</text>
  <text x="442" y="705" fill="#6f8299" font-size="9">손의 자신경에 해당</text>
  <rect x="432" y="723" width="170" height="66" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="743" fill="#9cc3ff" font-size="12" class="kr">안쪽발꿈치가지</text>
  <text x="442" y="758" fill="#7f9cc4" font-size="9">medial calcaneal br.</text>
  <text x="442" y="769" fill="#6f8299" font-size="9">지지띠를 <tspan fill="#e6edf3" font-weight="700">뚫고</tspan> 나온다 — 발꿈치</text>
  <text x="442" y="780" fill="#6f8299" font-size="9">감각</text>
  <line x1="26" y1="799" x2="628" y2="799" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="811" fill="#93a4b7" font-size="10.5">되돌이후두신경은 좌우 경로가 다르다 — 오른쪽 빗장밑동맥 / 왼쪽 대동맥활.</text>
  <text x="26" y="829" fill="#93a4b7" font-size="10.5">정강신경은 굽힘근지지띠 <tspan fill="#e6edf3" font-weight="700">아래</tspan>에서 안쪽·가쪽 발바닥신경으로 갈린다(발목굴증후군).</text>
</svg>
