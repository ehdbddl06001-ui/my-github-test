<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1004" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="위턱동맥과 심장의 혈관 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 5회차 §관자아래부위 · 위세로칸 · 심장 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1004" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">위턱동맥과 심장의 혈관<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> maxillary a. &amp; vessels of the heart</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">5회차 · 가쪽날개근이 위턱동맥을 3부로 나누고, 심장동맥은 두 개에서 시작한다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 602,147 H 615 V 120 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,147 H 615 V 184 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,248 H 615 V 250 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,335 H 615 V 310 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,335 H 615 V 368 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,242 H 419 V 147 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,242 H 419 V 248 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,242 H 419 V 335 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,495 H 419 V 432 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,495 H 419 V 496 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,495 H 419 V 566 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 602,671 H 615 V 641 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,671 H 615 V 710 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,808 H 615 V 780 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,808 H 615 V 844 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,783 H 419 V 671 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,783 H 419 V 808 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,783 H 419 V 902 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 206,502 H 219 V 242 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,502 H 219 V 495 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,502 H 219 V 783 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <rect x="26" y="483" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="503" fill="#7fd4a8" font-size="12" class="kr">5회차의 혈관</text>
  <rect x="232" y="209" width="174" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="229" fill="#e0645f" font-size="12" class="kr">위턱동맥 ★</text>
  <text x="242" y="244" fill="#c98a86" font-size="9">maxillary a.</text>
  <text x="242" y="255" fill="#6f8299" font-size="9">바깥목동맥 종말가지 · 가쪽날개근이</text>
  <text x="242" y="266" fill="#6f8299" font-size="9">3부로</text>
  <rect x="232" y="473" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="493" fill="#e0645f" font-size="12" class="kr">위세로칸의 큰 혈관 ★</text>
  <text x="242" y="508" fill="#c98a86" font-size="9">great vessels</text>
  <rect x="232" y="756" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="776" fill="#e0645f" font-size="12" class="kr">심장동맥 ★</text>
  <text x="242" y="791" fill="#c98a86" font-size="9">coronary aa.</text>
  <text x="242" y="802" fill="#6f8299" font-size="9">대동맥판막 바로 위 대동맥굴에서</text>
  <rect x="432" y="120" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="140" fill="#e0645f" font-size="12" class="kr">1부(아래턱부)</text>
  <text x="442" y="154" fill="#c98a86" font-size="9">mandibular part</text>
  <text x="442" y="166" fill="#6f8299" font-size="9">뼈로 간다</text>
  <rect x="432" y="220" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="240" fill="#e0645f" font-size="12" class="kr">2부(날개근부)</text>
  <text x="442" y="255" fill="#c98a86" font-size="9">pterygoid part</text>
  <text x="442" y="266" fill="#6f8299" font-size="9">근육으로 간다</text>
  <rect x="432" y="307" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="327" fill="#e0645f" font-size="12" class="kr">3부(날개입천장부) ★</text>
  <text x="442" y="342" fill="#c98a86" font-size="9">pterygopalatine part</text>
  <text x="442" y="353" fill="#6f8299" font-size="9">날개위턱틈새를 지나</text>
  <rect x="432" y="405" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="425" fill="#e0645f" font-size="12" class="kr">대동맥활 ★</text>
  <text x="442" y="440" fill="#c98a86" font-size="9">aortic arch</text>
  <text x="442" y="451" fill="#6f8299" font-size="9">팔머리·왼온목·왼빗장밑동맥 3가지</text>
  <rect x="432" y="469" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="489" fill="#b49ae0" font-size="12" class="kr">위대정맥 ★</text>
  <text x="442" y="504" fill="#8f79b8" font-size="9">superior vena cava</text>
  <text x="442" y="515" fill="#6f8299" font-size="9">좌우 팔머리정맥이 합쳐</text>
  <rect x="432" y="533" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="553" fill="#b49ae0" font-size="12" class="kr">왼팔머리정맥 ★</text>
  <text x="442" y="568" fill="#8f79b8" font-size="9">left brachiocephalic v.</text>
  <text x="442" y="579" fill="#6f8299" font-size="9">복장뼈 뒤를 <tspan fill="#e6edf3" font-weight="700">가로질러</tspan> 오른쪽으로 —</text>
  <text x="442" y="590" fill="#6f8299" font-size="9">그래서 더 길다</text>
  <rect x="432" y="649" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="669" fill="#e0645f" font-size="12" class="kr">왼심장동맥 ★</text>
  <text x="442" y="684" fill="#c98a86" font-size="9">left coronary a.</text>
  <rect x="432" y="786" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="806" fill="#e0645f" font-size="12" class="kr">오른심장동맥 ★</text>
  <text x="442" y="820" fill="#c98a86" font-size="9">right coronary a.</text>
  <rect x="432" y="875" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="895" fill="#b49ae0" font-size="12" class="kr">심장정맥굴 ★</text>
  <text x="442" y="910" fill="#8f79b8" font-size="9">coronary sinus</text>
  <text x="442" y="921" fill="#6f8299" font-size="9">방실사이고랑 뒤 → 오른심방</text>
  <rect x="628" y="92" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="112" fill="#e0645f" font-size="12" class="kr">중간뇌막동맥 ★</text>
  <text x="638" y="127" fill="#c98a86" font-size="9">middle meningeal a.</text>
  <text x="638" y="138" fill="#6f8299" font-size="9">가시구멍 → <tspan fill="#e6edf3" font-weight="700">경막외혈종</tspan></text>
  <rect x="628" y="156" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="176" fill="#e0645f" font-size="12" class="kr">아래이틀동맥 ★</text>
  <text x="638" y="191" fill="#c98a86" font-size="9">inferior alveolar a.</text>
  <text x="638" y="202" fill="#6f8299" font-size="9">아래이틀신경 동반</text>
  <rect x="628" y="220" width="160" height="59" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="240" fill="#e0645f" font-size="12" class="kr">깊은관자·날개근·깨물근·</text>
  <text x="638" y="255" fill="#e0645f" font-size="12" class="kr">볼동맥</text>
  <text x="638" y="270" fill="#c98a86" font-size="9">muscular brr.</text>
  <rect x="628" y="288" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="308" fill="#e0645f" font-size="12" class="kr">눈확아래동맥</text>
  <text x="638" y="323" fill="#c98a86" font-size="9">infraorbital a.</text>
  <rect x="628" y="341" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="361" fill="#e0645f" font-size="12" class="kr">나비입천장동맥 ★</text>
  <text x="638" y="376" fill="#c98a86" font-size="9">sphenopalatine a.</text>
  <text x="638" y="387" fill="#6f8299" font-size="9">코피(Little 부위)의 주범</text>
  <rect x="628" y="608" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="628" fill="#e0645f" font-size="12" class="kr">앞심실사이가지 ★</text>
  <text x="638" y="643" fill="#c98a86" font-size="9">ant. interventricular (LAD)</text>
  <text x="638" y="654" fill="#6f8299" font-size="9">심실사이막 앞 2/3 — 막힘이</text>
  <text x="638" y="665" fill="#6f8299" font-size="9">가장 치명적</text>
  <rect x="628" y="683" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="703" fill="#e0645f" font-size="12" class="kr">휘돌이가지</text>
  <text x="638" y="718" fill="#c98a86" font-size="9">circumflex br.</text>
  <text x="638" y="729" fill="#6f8299" font-size="9">왼모서리가지</text>
  <rect x="628" y="747" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="767" fill="#e0645f" font-size="12" class="kr">뒤심실사이가지 ★</text>
  <text x="638" y="782" fill="#c98a86" font-size="9">post. interventricular</text>
  <text x="638" y="793" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">우세 판정 기준</tspan> ·</text>
  <text x="638" y="804" fill="#6f8299" font-size="9">굴심방·방실결절가지</text>
  <rect x="628" y="822" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="842" fill="#e0645f" font-size="12" class="kr">오른모서리가지</text>
  <text x="638" y="857" fill="#c98a86" font-size="9">right marginal br.</text>
  <line x1="26" y1="940" x2="814" y2="940" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="952" fill="#93a4b7" font-size="10.5">위턱동맥 3부의 기준은 <tspan fill="#e6edf3" font-weight="700">가쪽날개근</tspan> — 근육이 동맥을 나누는 또 하나의 예.</text>
  <text x="26" y="970" fill="#93a4b7" font-size="10.5">우세(dominance)는 <tspan fill="#e6edf3" font-weight="700">뒤심실사이가지</tspan>를 누가 내느냐로 정한다 — 한국인 대부분 오른쪽.</text>
</svg>
