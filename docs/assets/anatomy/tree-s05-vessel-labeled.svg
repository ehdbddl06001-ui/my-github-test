  <rect x="26" y="772" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="792" fill="#7fd4a8" font-size="12" class="kr">5회차의 혈관</text>
  <rect x="232" y="188" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="208" fill="#e0645f" font-size="12" class="kr">대동맥활 ★</text>
  <text x="242" y="224" fill="#c98a86" font-size="9">aortic arch</text>
  <text x="242" y="234" fill="#6f8299" font-size="9">위세로칸 · 가지 3개</text>
  <rect x="232" y="471" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="491" fill="#e0645f" font-size="12" class="kr">오름대동맥 ★</text>
  <text x="242" y="506" fill="#c98a86" font-size="9">ascending aorta</text>
  <text x="242" y="517" fill="#6f8299" font-size="9">대동맥동굴에서 심장동맥이 나온다</text>
  <rect x="232" y="722" width="174" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="742" fill="#b49ae0" font-size="12" class="kr">심장의 정맥 ★</text>
  <text x="242" y="757" fill="#8f79b8" font-size="9">cardiac veins</text>
  <text x="242" y="768" fill="#6f8299" font-size="9">심장정맥굴로 모인다</text>
  <rect x="232" y="849" width="174" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="869" fill="#b49ae0" font-size="12" class="kr">위대정맥 ★</text>
  <text x="242" y="884" fill="#8f79b8" font-size="9">superior vena cava</text>
  <text x="242" y="895" fill="#6f8299" font-size="9">왼·오른 팔머리정맥이 합쳐</text>
  <rect x="232" y="1084" width="174" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="1104" fill="#e0645f" font-size="12" class="kr">위턱동맥 ★</text>
  <text x="242" y="1119" fill="#c98a86" font-size="9">maxillary a.</text>
  <text x="242" y="1130" fill="#6f8299" font-size="9">바깥목동맥 종말가지 ·</text>
  <text x="242" y="1141" fill="#6f8299" font-size="9">아래턱뼈목에서</text>
  <rect x="232" y="1356" width="174" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="1376" fill="#b49ae0" font-size="12" class="kr">날개정맥얼기 ★</text>
  <text x="242" y="1390" fill="#8f79b8" font-size="9">pterygoid venous plexus</text>
  <text x="242" y="1402" fill="#6f8299" font-size="9">가쪽날개근 주위 · 판막 없음</text>
  <rect x="432" y="111" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="131" fill="#e0645f" font-size="12" class="kr">팔머리동맥 ★</text>
  <text x="442" y="146" fill="#c98a86" font-size="9">brachiocephalic trunk</text>
  <text x="442" y="157" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">오른쪽만</tspan> 있다</text>
  <rect x="432" y="209" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="229" fill="#e0645f" font-size="12" class="kr">왼온목동맥 ★</text>
  <text x="442" y="244" fill="#c98a86" font-size="9">left common carotid a.</text>
  <text x="442" y="255" fill="#6f8299" font-size="9">활에서 <tspan fill="#e6edf3" font-weight="700">직접</tspan></text>
  <rect x="432" y="273" width="170" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="293" fill="#e0645f" font-size="12" class="kr">왼빗장밑동맥</text>
  <text x="442" y="308" fill="#c98a86" font-size="9">left subclavian a.</text>
  <rect x="432" y="383" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="403" fill="#e0645f" font-size="12" class="kr">오른심장동맥 ★</text>
  <text x="442" y="418" fill="#c98a86" font-size="9">right coronary a.</text>
  <text x="442" y="429" fill="#6f8299" font-size="9">오른심방귀와 허파동맥줄기 사이</text>
  <rect x="432" y="562" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="582" fill="#e0645f" font-size="12" class="kr">왼심장동맥 ★</text>
  <text x="442" y="597" fill="#c98a86" font-size="9">left coronary a.</text>
  <text x="442" y="608" fill="#6f8299" font-size="9">짧은 줄기 뒤 곧 갈린다</text>
  <rect x="432" y="725" width="170" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="442" y="745" fill="#b49ae0" font-size="12" class="kr">심장정맥굴 ★</text>
  <text x="442" y="760" fill="#8f79b8" font-size="9">coronary sinus</text>
  <text x="442" y="771" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">오른심방</tspan>으로 열린다</text>
  <rect x="432" y="849" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="869" fill="#b49ae0" font-size="12" class="kr">홀정맥 ★</text>
  <text x="442" y="884" fill="#8f79b8" font-size="9">azygos v.</text>
  <text x="442" y="895" fill="#6f8299" font-size="9">허파뿌리 <tspan fill="#e6edf3" font-weight="700">위</tspan>를 활처럼 넘어 합류</text>
  <rect x="432" y="943" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="963" fill="#e0645f" font-size="12" class="kr">1부 아래턱부 ★</text>
  <text x="442" y="978" fill="#c98a86" font-size="9">1st (mandibular) part</text>
  <text x="442" y="989" fill="#6f8299" font-size="9">아래턱뼈가지 <tspan fill="#e6edf3" font-weight="700">안쪽</tspan> · 구멍으로 간다</text>
  <rect x="432" y="1095" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="1115" fill="#e0645f" font-size="12" class="kr">2부 날개근부</text>
  <text x="442" y="1130" fill="#c98a86" font-size="9">2nd (pterygoid) part</text>
  <text x="442" y="1141" fill="#6f8299" font-size="9">씹기근육으로만 간다</text>
  <rect x="432" y="1230" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="1250" fill="#e0645f" font-size="12" class="kr">3부 날개입천장부 ★</text>
  <text x="442" y="1265" fill="#c98a86" font-size="9">3rd (pterygopalatine) part</text>
  <text x="442" y="1276" fill="#6f8299" font-size="9">날개위턱틈새 → 우묵으로</text>
  <rect x="432" y="1328" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1348" fill="#b49ae0" font-size="12" class="kr">위턱정맥</text>
  <text x="442" y="1363" fill="#8f79b8" font-size="9">maxillary v.</text>
  <text x="442" y="1374" fill="#6f8299" font-size="9">→ 아래턱뒤정맥</text>
  <rect x="432" y="1392" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1412" fill="#b49ae0" font-size="12" class="kr">해면정맥굴과 교통 ★</text>
  <text x="442" y="1427" fill="#8f79b8" font-size="9">→ cavernous sinus</text>
  <text x="442" y="1438" fill="#6f8299" font-size="9">감염 전파 경로</text>
  <rect x="628" y="92" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="112" fill="#e0645f" font-size="12" class="kr">오른온목동맥</text>
  <text x="638" y="127" fill="#c98a86" font-size="9">right common carotid a.</text>
  <rect x="628" y="145" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="165" fill="#e0645f" font-size="12" class="kr">오른빗장밑동맥 ★</text>
  <text x="638" y="180" fill="#c98a86" font-size="9">right subclavian a.</text>
  <text x="638" y="191" fill="#6f8299" font-size="9">오른되돌이후두신경이 감는다</text>
  <rect x="628" y="326" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="346" fill="#e0645f" font-size="12" class="kr">굴심방결절가지 ★</text>
  <text x="638" y="361" fill="#c98a86" font-size="9">SA nodal br.</text>
  <text x="638" y="372" fill="#6f8299" font-size="9">약 60%에서 오른쪽 기원</text>
  <rect x="628" y="390" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="410" fill="#e0645f" font-size="12" class="kr">오른모서리가지</text>
  <text x="638" y="425" fill="#c98a86" font-size="9">right marginal br.</text>
  <rect x="628" y="443" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="463" fill="#e0645f" font-size="12" class="kr">뒤심실사이가지 ★</text>
  <text x="638" y="478" fill="#c98a86" font-size="9">post. interventricular br.</text>
  <text x="638" y="489" fill="#6f8299" font-size="9">약 70%가 오른쪽 우세(right</text>
  <text x="638" y="500" fill="#6f8299" font-size="9">dominance)</text>
  <rect x="628" y="518" width="160" height="77" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="538" fill="#e0645f" font-size="12" class="kr">앞심실사이가지 ★</text>
  <text x="638" y="553" fill="#c98a86" font-size="9">ant. interventricular br.</text>
  <text x="638" y="564" fill="#c98a86" font-size="9">(LAD)</text>
  <text x="638" y="575" fill="#6f8299" font-size="9">'widow-maker' · 심실사이막 앞</text>
  <text x="638" y="586" fill="#6f8299" font-size="9">2/3</text>
  <rect x="628" y="604" width="160" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="624" fill="#e0645f" font-size="12" class="kr">휘돌이가지 ★</text>
  <text x="638" y="639" fill="#c98a86" font-size="9">circumflex br.</text>
  <text x="638" y="650" fill="#6f8299" font-size="9">왼방실고랑을 돌아 뒤로</text>
  <rect x="628" y="668" width="160" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="638" y="688" fill="#b49ae0" font-size="12" class="kr">큰심장정맥</text>
  <text x="638" y="703" fill="#8f79b8" font-size="9">great cardiac v.</text>
  <text x="638" y="714" fill="#6f8299" font-size="9">앞심실사이가지와 동행</text>
  <rect x="628" y="732" width="160" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="638" y="752" fill="#b49ae0" font-size="12" class="kr">중간심장정맥</text>
  <text x="638" y="767" fill="#8f79b8" font-size="9">middle cardiac v.</text>
  <text x="638" y="778" fill="#6f8299" font-size="9">뒤심실사이가지와 동행</text>
  <rect x="628" y="796" width="160" height="44" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="638" y="816" fill="#b49ae0" font-size="12" class="kr">작은심장정맥</text>
  <text x="638" y="831" fill="#8f79b8" font-size="9">small cardiac v.</text>
  <rect x="628" y="913" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="933" fill="#e0645f" font-size="12" class="kr">중간뇌막동맥 ★</text>
  <text x="638" y="948" fill="#c98a86" font-size="9">middle meningeal a.</text>
  <text x="638" y="959" fill="#6f8299" font-size="9">가시구멍 · <tspan fill="#e6edf3" font-weight="700">경막외혈종</tspan></text>
  <rect x="628" y="977" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="997" fill="#e0645f" font-size="12" class="kr">아래이틀동맥 ★</text>
  <text x="638" y="1012" fill="#c98a86" font-size="9">inferior alveolar a.</text>
  <text x="638" y="1023" fill="#6f8299" font-size="9">턱뼈구멍 — 같은 이름 신경과</text>
  <text x="638" y="1034" fill="#6f8299" font-size="9">동행</text>
  <rect x="628" y="1052" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1072" fill="#e0645f" font-size="12" class="kr">깊은관자동맥</text>
  <text x="638" y="1087" fill="#c98a86" font-size="9">deep temporal aa.</text>
  <rect x="628" y="1105" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1125" fill="#e0645f" font-size="12" class="kr">깨물동맥·날개근가지</text>
  <text x="638" y="1140" fill="#c98a86" font-size="9">masseteric/pterygoid br.</text>
  <rect x="628" y="1158" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1178" fill="#e0645f" font-size="12" class="kr">볼동맥</text>
  <text x="638" y="1193" fill="#c98a86" font-size="9">buccal a.</text>
  <rect x="628" y="1211" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1231" fill="#e0645f" font-size="12" class="kr">눈확아래동맥</text>
  <text x="638" y="1246" fill="#c98a86" font-size="9">infraorbital a.</text>
  <rect x="628" y="1264" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="1284" fill="#e0645f" font-size="12" class="kr">나비입천장동맥 ★</text>
  <text x="638" y="1299" fill="#c98a86" font-size="9">sphenopalatine a.</text>
  <text x="638" y="1310" fill="#6f8299" font-size="9">코피(epistaxis)의 주범</text>
  <rect x="814" y="604" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="624" fill="#e0645f" font-size="12" class="kr">왼모서리가지</text>
  <text x="824" y="639" fill="#c98a86" font-size="9">left marginal br.</text>
  <line x1="26" y1="1457" x2="1000" y2="1457" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1469" fill="#93a4b7" font-size="10.5">위턱동맥은 아래턱뼈목에서 갈려 <tspan fill="#e6edf3" font-weight="700">3부</tspan>로 나뉜다 — 1부는 구멍으로, 2부는 근육으로, 3부는 우묵으로.</text>
  <text x="26" y="1487" fill="#93a4b7" font-size="10.5">심장정맥굴은 <tspan fill="#e6edf3" font-weight="700">왼심방 뒤 방실고랑</tspan>을 지나 오른심방으로 — 동맥과 반대 방향으로 훑는다.</text>
