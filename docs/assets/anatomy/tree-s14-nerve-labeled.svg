<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1308" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="배뇨·배변의 신경과 관절의 신경 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 14회차 실습주제(팔의 관절 / 골반 복막·골반 절단·남녀 내부생식기관·골반가로막) + 인제스트 섹션 a2-s14 §남자골반안 · §골반가로막 · §곧창자 · §항문관 · §어깨관절 · §팔꿉관절 · §손목관절 + SESSION_DETAILS 응용과제(배뇨·배변 기전) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1308" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">배뇨·배변의 신경과 관절의 신경<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> continence &amp; articular nerves</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">14회차 · 골반장기는 교감(T11–L2)·부교감(S2–S4)·몸신경(음부, S2–S4) 세 줄로, 관절은 그 위를 지나는 근육의 신경이 맡는다(Hilton)</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
