  <text x="26" y="1354" fill="#93a4b7" font-size="10.5">해면정맥굴은 <tspan fill="#e6edf3" font-weight="700">벽에 III·IV·V1·V2, 속에 속목동맥과 VI</tspan> — 속에 있는 VI가 가장 먼저 다친다.</text>
  <text x="26" y="1372" fill="#93a4b7" font-size="10.5">가로막 구멍은 <tspan fill="#e6edf3" font-weight="700">8 · 10 · 12</tspan> — 대정맥 · 식도 · 대동맥(I ate 10 eggs at 12).</text>
