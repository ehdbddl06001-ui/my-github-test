  <text x="26" y="809" fill="#93a4b7" font-size="10.5">목혈관신경집: 동맥 안쪽 · 정맥 가쪽 · 미주신경은 둘 사이 <tspan fill="#e6edf3" font-weight="700">뒤</tspan>.</text>
  <text x="26" y="827" fill="#93a4b7" font-size="10.5">넙다리삼각 NAVEL: 가쪽부터 신경–동맥–정맥–빈공간–림프. 정맥이 동맥 <tspan fill="#e6edf3" font-weight="700">안쪽</tspan>이다.</text>
