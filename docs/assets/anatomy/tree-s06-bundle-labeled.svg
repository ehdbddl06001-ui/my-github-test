  <text x="442" y="511" fill="#5fae87" font-size="9">femoral canal</text>
  <text x="442" y="522" fill="#6f8299" font-size="9">안쪽칸 — 넙다리탈장 입구</text>
  <rect x="432" y="540" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="560" fill="#e0645f" font-size="12" class="kr">넙다리동·정맥</text>
