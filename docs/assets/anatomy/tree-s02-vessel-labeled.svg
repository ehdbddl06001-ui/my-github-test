  <path d="M 206,275 H 219 V 179 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,275 H 219 V 368 H 232" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <rect x="26" y="253" width="180" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="1.3"/>
  <text x="36" y="273" fill="#e0645f" font-size="12" class="kr">배대동맥</text>
  <text x="36" y="288" fill="#c98a86" font-size="9">abdominal aorta</text>
  <rect x="232" y="157" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="177" fill="#e0645f" font-size="12" class="kr">온엉덩동맥</text>
  <text x="242" y="192" fill="#c98a86" font-size="9">common iliac a.</text>
  <rect x="232" y="341" width="174" height="55" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="361" fill="#b49ae0" font-size="12" class="kr">속엉덩정맥 ★</text>
  <text x="242" y="376" fill="#8f79b8" font-size="9">internal iliac v.</text>
  <text x="242" y="387" fill="#6f8299" font-size="9">동맥과 짝을 이뤄 되돌아온다</text>
  <rect x="432" y="141" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="161" fill="#e0645f" font-size="12" class="kr">속엉덩동맥 ★</text>
  <text x="442" y="176" fill="#c98a86" font-size="9">internal iliac a.</text>
  <rect x="432" y="284" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="304" fill="#b49ae0" font-size="12" class="kr">위·아래볼기정맥</text>
  <text x="442" y="319" fill="#8f79b8" font-size="9">gluteal vv.</text>
  <text x="442" y="330" fill="#6f8299" font-size="9">같은 구멍으로</text>
  <rect x="432" y="348" width="170" height="44" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="368" fill="#b49ae0" font-size="12" class="kr">속음부정맥</text>
  <text x="442" y="383" fill="#8f79b8" font-size="9">internal pudendal v.</text>
  <rect x="432" y="401" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="421" fill="#b49ae0" font-size="12" class="kr">엉치정맥얼기 ★</text>
  <text x="442" y="436" fill="#8f79b8" font-size="9">sacral venous plexus</text>
  <text x="442" y="447" fill="#6f8299" font-size="9">판막이 없어 골반↔척주 사이 역류</text>
  <text x="442" y="458" fill="#6f8299" font-size="9">가능(Batson 얼기)</text>
  <rect x="628" y="93" width="160" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="113" fill="#e0645f" font-size="12" class="kr">뒤갈래</text>
  <text x="638" y="128" fill="#c98a86" font-size="9">posterior division</text>
  <rect x="628" y="189" width="160" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="209" fill="#e0645f" font-size="12" class="kr">앞갈래</text>
  <text x="638" y="224" fill="#c98a86" font-size="9">anterior division</text>
  <rect x="814" y="92" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="112" fill="#e0645f" font-size="12" class="kr">위볼기동맥 ★</text>
  <text x="824" y="127" fill="#c98a86" font-size="9">superior gluteal a.</text>
  <text x="824" y="138" fill="#6f8299" font-size="9">궁둥구멍근 <tspan fill="#e6edf3" font-weight="700">위</tspan>구멍</text>
  <rect x="814" y="156" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="176" fill="#e0645f" font-size="12" class="kr">아래볼기동맥</text>
  <text x="824" y="191" fill="#c98a86" font-size="9">inferior gluteal a.</text>
  <text x="824" y="202" fill="#6f8299" font-size="9">아래구멍</text>
  <rect x="814" y="220" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="240" fill="#e0645f" font-size="12" class="kr">속음부동맥 ★</text>
  <text x="824" y="255" fill="#c98a86" font-size="9">internal pudendal a.</text>
  <text x="824" y="266" fill="#6f8299" font-size="9">아래구멍 → 작은궁둥구멍 재진입</text>
  <line x1="26" y1="477" x2="1000" y2="477" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="489" fill="#93a4b7" font-size="10.5">위볼기동맥만 속엉덩동맥 <tspan fill="#e6edf3" font-weight="700">뒤갈래</tspan> — 아래볼기·속음부는 앞갈래.</text>
  <text x="26" y="507" fill="#93a4b7" font-size="10.5">볼기부위 정맥은 동맥과 같은 이름·같은 구멍으로 되돌아와 속엉덩정맥으로 모인다.</text>
</svg>
