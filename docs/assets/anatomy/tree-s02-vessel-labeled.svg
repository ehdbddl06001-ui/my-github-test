  <path d="M 602,163 H 615 V 211 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,179 H 419 V 163 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,368 H 419 V 312 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
