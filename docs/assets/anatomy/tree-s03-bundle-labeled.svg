<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 594" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="함께 지나는 것 — 오금·어깨뼈 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 3회차 §다리오금 · 어깨뼈부위 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="594" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 오금·어깨뼈<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> neurovascular bundles</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">3회차 · 다리오금은 얕은 것부터 신경–정맥–동맥 순으로 겹쳐 있다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,179 H 419 V 120 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,179 H 419 V 184 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,179 H 419 V 248 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,331 H 419 V 306 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,331 H 419 V 364 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,456 H 419 V 428 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,456 H 419 V 492 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 206,318 H 219 V 179 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,318 H 219 V 331 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,318 H 219 V 456 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <rect x="26" y="298" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="318" fill="#7fd4a8" font-size="12" class="kr">세 자리</text>
  <rect x="232" y="152" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="172" fill="#7fd4a8" font-size="12" class="kr">다리오금 ★</text>
  <text x="242" y="186" fill="#5fae87" font-size="9">popliteal fossa</text>
  <text x="242" y="198" fill="#6f8299" font-size="9">뒤(얕은) → 앞(깊은) 순서</text>
  <rect x="232" y="303" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="323" fill="#7fd4a8" font-size="12" class="kr">네모공간 ★</text>
  <text x="242" y="338" fill="#5fae87" font-size="9">quadrangular space</text>
  <text x="242" y="349" fill="#6f8299" font-size="9">위팔세갈래근 긴갈래 <tspan fill="#e6edf3" font-weight="700">가쪽</tspan></text>
  <rect x="232" y="428" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="448" fill="#7fd4a8" font-size="12" class="kr">어깨뼈패임 ★</text>
  <text x="242" y="464" fill="#5fae87" font-size="9">scapular notch</text>
  <text x="242" y="474" fill="#6f8299" font-size="9">위가로어깨인대가 덮어 구멍이 된다</text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">① 정강신경 ★</text>
  <text x="442" y="127" fill="#7f9cc4" font-size="9">tibial n.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">가장 얕다</text>
  <rect x="432" y="156" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="176" fill="#b49ae0" font-size="12" class="kr">② 오금정맥</text>
  <text x="442" y="191" fill="#8f79b8" font-size="9">popliteal v.</text>
  <text x="442" y="202" fill="#6f8299" font-size="9">중간</text>
  <rect x="432" y="220" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="240" fill="#e0645f" font-size="12" class="kr">③ 오금동맥 ★</text>
  <text x="442" y="255" fill="#c98a86" font-size="9">popliteal a.</text>
  <text x="442" y="266" fill="#6f8299" font-size="9">가장 깊다</text>
  <rect x="432" y="284" width="170" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="304" fill="#e0645f" font-size="12" class="kr">뒤위팔휘돌이동맥</text>
  <text x="442" y="319" fill="#c98a86" font-size="9">post. circumflex humeral a.</text>
  <rect x="432" y="337" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="357" fill="#9cc3ff" font-size="12" class="kr">겨드랑신경 ★</text>
  <text x="442" y="372" fill="#7f9cc4" font-size="9">axillary n.</text>
  <text x="442" y="383" fill="#6f8299" font-size="9">외과목 골절에서 손상</text>
  <rect x="432" y="401" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="421" fill="#e0645f" font-size="12" class="kr">어깨위동맥 ★</text>
  <text x="442" y="436" fill="#c98a86" font-size="9">suprascapular a.</text>
  <text x="442" y="447" fill="#6f8299" font-size="9">인대 <tspan fill="#e6edf3" font-weight="700">위</tspan>로</text>
  <rect x="432" y="465" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="485" fill="#9cc3ff" font-size="12" class="kr">어깨위신경 ★</text>
  <text x="442" y="500" fill="#7f9cc4" font-size="9">suprascapular n.</text>
  <text x="442" y="511" fill="#6f8299" font-size="9">인대 <tspan fill="#e6edf3" font-weight="700">아래</tspan> 구멍으로</text>
  <line x1="26" y1="530" x2="628" y2="530" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="542" fill="#93a4b7" font-size="10.5">오금의 깊이 순서 '신–정–동' — 맥박이 안 잡히는 이유가 동맥이 가장 깊어서다.</text>
  <text x="26" y="560" fill="#93a4b7" font-size="10.5">어깨뼈패임: 동맥은 인대 <tspan fill="#e6edf3" font-weight="700">위</tspan>, 신경은 인대 <tspan fill="#e6edf3" font-weight="700">아래</tspan> — 같은 이름인데 층이 갈린다.</text>
</svg>
