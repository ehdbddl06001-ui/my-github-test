  <text x="242" y="442" fill="#5fae87" font-size="9">tarsal tunnel</text>
  <text x="242" y="454" fill="#6f8299" font-size="9">안쪽복사 뒤 · 앞→뒤 순서</text>
  <rect x="232" y="664" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="684" fill="#7fd4a8" font-size="12" class="kr">종아리근지지띠 밑 ★</text>
  <text x="242" y="698" fill="#5fae87" font-size="9">fibular retinacula</text>
  <text x="242" y="710" fill="#6f8299" font-size="9">가쪽복사 뒤</text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="112" fill="#b49ae0" font-size="12" class="kr">빗장밑정맥 ★</text>
  <text x="442" y="127" fill="#8f79b8" font-size="9">subclavian v.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">앞목갈비근 <tspan fill="#e6edf3" font-weight="700">앞</tspan> — 틈새 밖</text>
  <rect x="432" y="156" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="176" fill="#e0645f" font-size="12" class="kr">빗장밑동맥 2부 ★</text>
  <text x="442" y="191" fill="#c98a86" font-size="9">subclavian a.</text>
  <text x="442" y="202" fill="#6f8299" font-size="9">틈새 <tspan fill="#e6edf3" font-weight="700">안</tspan></text>
  <rect x="432" y="220" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="240" fill="#9cc3ff" font-size="12" class="kr">팔신경얼기 ★</text>
  <text x="442" y="255" fill="#7f9cc4" font-size="9">brachial plexus</text>
  <text x="442" y="266" fill="#6f8299" font-size="9">동맥과 같은 틈새</text>
  <rect x="432" y="284" width="170" height="55" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="2.2"/>
  <text x="442" y="304" fill="#7fd4a8" font-size="12" class="kr">① 뒤정강근 힘줄</text>
  <text x="442" y="319" fill="#5fae87" font-size="9">Tibialis posterior</text>
  <text x="442" y="330" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">T</tspan>om</text>
  <rect x="432" y="348" width="170" height="55" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="2.2"/>
  <text x="442" y="368" fill="#7fd4a8" font-size="12" class="kr">② 긴발가락굽힘근 힘줄</text>
  <text x="442" y="383" fill="#5fae87" font-size="9">flexor Digitorum longus</text>
  <text x="442" y="394" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">D</tspan>ick</text>
  <rect x="432" y="412" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="432" fill="#e0645f" font-size="12" class="kr">③ 뒤정강동맥 ★</text>
  <text x="442" y="447" fill="#c98a86" font-size="9">posterior tibial Artery</text>
  <text x="442" y="458" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">A</tspan>nd</text>
  <rect x="432" y="476" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="496" fill="#9cc3ff" font-size="12" class="kr">④ 정강신경 ★</text>
  <text x="442" y="511" fill="#7f9cc4" font-size="9">tibial Nerve</text>
  <text x="442" y="522" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">V</tspan>ery <tspan fill="#e6edf3" font-weight="700">N</tspan>ervous</text>
  <rect x="432" y="540" width="170" height="55" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="2.2"/>
  <text x="442" y="560" fill="#7fd4a8" font-size="12" class="kr">⑤ 긴엄지굽힘근 힘줄 ★</text>
  <text x="442" y="575" fill="#5fae87" font-size="9">flexor Hallucis longus</text>
  <text x="442" y="586" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">H</tspan>arry</text>
  <rect x="432" y="604" width="170" height="55" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="2.2"/>
  <text x="442" y="624" fill="#7fd4a8" font-size="12" class="kr">긴종아리근 힘줄 ★</text>
  <text x="442" y="639" fill="#5fae87" font-size="9">fibularis longus</text>
  <text x="442" y="650" fill="#6f8299" font-size="9">발바닥을 가로질러 첫째 발허리뼈로</text>
  <rect x="432" y="668" width="170" height="55" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="2.2"/>
  <text x="442" y="688" fill="#7fd4a8" font-size="12" class="kr">짧은종아리근 힘줄</text>
  <text x="442" y="703" fill="#5fae87" font-size="9">fibularis brevis</text>
  <text x="442" y="714" fill="#6f8299" font-size="9">다섯째 발허리뼈 거친면</text>
  <rect x="432" y="732" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="752" fill="#9cc3ff" font-size="12" class="kr">얕은종아리신경 ★</text>
  <text x="442" y="767" fill="#7f9cc4" font-size="9">superficial fibular n.</text>
  <text x="442" y="778" fill="#6f8299" font-size="9">가쪽칸을 지배 — <tspan fill="#e6edf3" font-weight="700">동맥은 없다</tspan></text>
  <line x1="26" y1="797" x2="628" y2="797" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="809" fill="#93a4b7" font-size="10.5">앞목갈비근이 기준: <tspan fill="#e6edf3" font-weight="700">정맥은 앞, 동맥·팔신경얼기는 뒤</tspan>(목갈비근틈새).</text>
  <text x="26" y="827" fill="#93a4b7" font-size="10.5">발목굴 앞→뒤 'Tom, Dick, And Very Nervous Harry' — 동맥·신경이 가운데 낀다.</text>
