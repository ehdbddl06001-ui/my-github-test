  <rect x="26" y="416" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="436" fill="#7fd4a8" font-size="12" class="kr">세 개의 통로</text>
  <rect x="232" y="152" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="172" fill="#7fd4a8" font-size="12" class="kr">목갈비근틈새 ★</text>
  <text x="242" y="186" fill="#5fae87" font-size="9">scalene triangle</text>
  <text x="242" y="198" fill="#6f8299" font-size="9">앞·중간목갈비근 사이</text>
  <rect x="232" y="408" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
