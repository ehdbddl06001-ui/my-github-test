  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="861" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 위가슴문·발목<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> neurovascular bundles</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">7회차 · 목갈비근이 가르는 목의 통로와, 굽힘근지지띠 밑 발목굴</text>
