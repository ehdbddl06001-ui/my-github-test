<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="넓적다리 앞·안쪽 약도 — 근육 패널과 넙다리삼각·모음근굴 신경혈관 패널. 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn, Lane A). 오른쪽 넓적다리 앞면, 두 패널(근육 / 신경혈관).
       근거: 6회차 실습영상 §Anterior & medial thigh + 인정 교재 표준. 카데바 트레이싱 아님.
       핵심 ① 넙다리삼각 경계 = 샅고랑인대·넙다리빗근·긴모음근, 안에서 가쪽→안쪽 NAVEL
             ② 넙다리동맥 → 깊은넙다리동맥(휘돌이 2 + 관통동맥) ③ 모음근굴 → 모음근구멍 → 오금
             ④ 앞칸=넙다리신경 / 안쪽칸=폐쇄신경 (두덩근·큰모음근이 경계 예외) -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="720" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">넓적다리 앞·안쪽 약도 — 근육과 넙다리삼각·모음근굴
    <tspan fill="#93a4b7" font-size="12" font-weight="400">anterior &amp; medial thigh</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과식 구도) · 오른쪽 넓적다리 앞면 · 근거: 6회차 실습영상 §Anterior &amp; medial thigh</text>
  <text x="20" y="68" fill="#6f8299" font-size="11">동맥 <tspan fill="#e0645f">빨강</tspan> · 정맥 <tspan fill="#8f79c4">보라</tspan> · 신경 <tspan fill="#9cc3ff">파랑</tspan> · 지배: <tspan fill="#9cc3ff">■ 넙다리신경</tspan> / <tspan fill="#f0b56b">■ 폐쇄신경</tspan> · ★ = 태깅·임상 빈출</text>
  <text x="20" y="86" fill="#5d6f83" font-size="10">← 가쪽 lateral   |   안쪽 medial →</text>

  <!-- ================================ 패널 A: 근육 ================================ -->
  <rect x="24" y="100" width="400" height="588" fill="none" stroke="#26374c" stroke-width="1.5"/>
  <text x="36" y="122" fill="#e6edf3" font-size="13" class="kr">A. 근육 — 앞칸(폄) + 안쪽칸(모음)</text>

  <!-- 골반·다리 윤곽 -->
  <path d="M 120,140 L 300,140 L 322,168 L 338,196" fill="none" stroke="#3d5166" stroke-width="3"/>
  <text x="132" y="136" fill="#7b8ea3" font-size="9.5">위앞엉덩뼈가시 ASIS</text>
  <circle cx="120" cy="140" r="5" fill="#3d5166"/>
  <text x="330" y="212" fill="#7b8ea3" font-size="9.5" text-anchor="end">두덩결절</text>
  <circle cx="338" cy="196" r="5" fill="#3d5166"/>
  <!-- 넓적다리 윤곽 -->
  <path d="M 118,146 C 100,300 108,470 140,650 M 344,202 C 356,340 340,520 300,650" fill="none" stroke="#31445c" stroke-width="2"/>

  <!-- 엉덩허리근 -->
  <path d="M 150,142 L 196,142 L 216,236 L 188,248 Z" fill="#3a5068" stroke="#4a6076" stroke-width="1.5"/>
  <text x="60" y="176" fill="#c3d2e2" font-size="10" class="kr">엉덩허리근</text>
  <text x="60" y="188" fill="#8fa5bd" font-size="8.5">iliopsoas</text>
  <circle cx="52" cy="172" r="3.5" fill="#9cc3ff"/>
  <line x1="112" y1="176" x2="170" y2="186" stroke="#6f8299" stroke-width="1"/>

  <!-- 두덩근 -->
  <path d="M 300,204 L 332,208 L 262,290 L 240,272 Z" fill="#3a5068" stroke="#4a6076" stroke-width="1.5"/>
  <!-- 긴모음근 -->
  <path d="M 322,214 L 344,222 L 286,420 L 262,404 Z" fill="#405a75" stroke="#4a6076" stroke-width="1.5"/>
  <!-- 두덩정강근 -->
  <path d="M 344,230 L 356,234 L 316,630 L 300,626 Z" fill="#33465e" stroke="#4a6076" stroke-width="1.5"/>
  <!-- 큰모음근(깊은층 표시) -->
  <path d="M 336,250 L 352,258 L 322,540 L 300,530 Z" fill="#2c3d54" stroke="#41576f" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 넙다리빗근: ASIS → 안쪽 무릎 사선 띠 -->
  <path d="M 122,146 L 142,150 L 322,600 L 300,612 Z" fill="#4a6382" stroke="#5d7899" stroke-width="1.5"/>
  <!-- 넙다리곧은근 -->
  <path d="M 196,170 L 236,170 L 244,470 L 196,470 Z" fill="#3f5872" stroke="#4a6076" stroke-width="1.5"/>
  <!-- 가쪽넓은근 -->
  <path d="M 148,220 L 186,236 L 178,500 L 142,470 Z" fill="#33465e" stroke="#4a6076" stroke-width="1.5"/>
  <!-- 안쪽넓은근 -->
  <path d="M 252,300 L 282,330 L 276,520 L 238,510 Z" fill="#33465e" stroke="#4a6076" stroke-width="1.5"/>
  <!-- 무릎뼈·힘줄 -->
  <path d="M 200,470 L 244,470 L 250,540 L 196,540 Z" fill="none" stroke="#4a6076" stroke-width="1.5"/>
  <circle cx="222" cy="566" r="17" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <text x="222" y="604" fill="#7b8ea3" font-size="9" text-anchor="middle">무릎뼈 patella</text>

  <!-- 근육 라벨 (왼쪽 열) -->
  <text x="36" y="252" fill="#c3d2e2" font-size="10" class="kr">가쪽넓은근</text>
  <text x="36" y="264" fill="#8fa5bd" font-size="8.5">vastus lateralis</text>
  <circle cx="30" cy="248" r="3.5" fill="#9cc3ff"/>
  <line x1="86" y1="252" x2="152" y2="280" stroke="#6f8299" stroke-width="1"/>

  <text x="36" y="308" fill="#c3d2e2" font-size="10" class="kr">넙다리곧은근</text>
  <text x="36" y="320" fill="#8fa5bd" font-size="8.5">rectus femoris</text>
  <circle cx="30" cy="304" r="3.5" fill="#9cc3ff"/>
  <line x1="98" y1="308" x2="200" y2="320" stroke="#6f8299" stroke-width="1"/>

  <text x="36" y="364" fill="#c3d2e2" font-size="10" class="kr">넙다리빗근 ★</text>
  <text x="36" y="376" fill="#8fa5bd" font-size="8.5">sartorius — 모음근굴 지붕</text>
  <circle cx="30" cy="360" r="3.5" fill="#9cc3ff"/>
  <line x1="96" y1="364" x2="238" y2="404" stroke="#6f8299" stroke-width="1"/>

  <text x="36" y="420" fill="#c3d2e2" font-size="10" class="kr">안쪽넓은근</text>
  <text x="36" y="432" fill="#8fa5bd" font-size="8.5">vastus medialis</text>
  <circle cx="30" cy="416" r="3.5" fill="#9cc3ff"/>
  <line x1="86" y1="420" x2="248" y2="430" stroke="#6f8299" stroke-width="1"/>

  <text x="36" y="470" fill="#93a4b7" font-size="9">중간넓은근 vastus intermedius =</text>
  <text x="36" y="482" fill="#93a4b7" font-size="9">곧은근 깊은층(그림 생략) <tspan fill="#9cc3ff">●넙다리신경</tspan></text>

  <!-- 근육 라벨 (오른쪽 열, 패널 안) -->
  <text x="366" y="248" fill="#c3d2e2" font-size="10" class="kr" text-anchor="end">두덩근</text>
  <text x="366" y="260" fill="#8fa5bd" font-size="8.5" text-anchor="end">pectineus</text>
  <circle cx="372" cy="244" r="3.5" fill="#9cc3ff"/>
  <text x="366" y="272" fill="#93a4b7" font-size="8" text-anchor="end">(넙다리+폐쇄 이중)</text>
  <line x1="330" y1="252" x2="286" y2="258" stroke="#6f8299" stroke-width="1"/>

  <text x="380" y="318" fill="#c3d2e2" font-size="10" class="kr" text-anchor="end">긴모음근</text>
  <text x="380" y="330" fill="#8fa5bd" font-size="8.5" text-anchor="end">adductor longus</text>
  <circle cx="388" cy="314" r="3.5" fill="#f0b56b"/>
  <line x1="336" y1="322" x2="304" y2="330" stroke="#6f8299" stroke-width="1"/>
  <text x="388" y="356" fill="#93a4b7" font-size="8.5" text-anchor="end">짧은모음근은 그 깊은층</text>

  <text x="386" y="420" fill="#c3d2e2" font-size="10" class="kr" text-anchor="end">큰모음근</text>
  <text x="386" y="432" fill="#8fa5bd" font-size="8.5" text-anchor="end">adductor magnus</text>
  <circle cx="392" cy="416" r="3.5" fill="#f0b56b"/>
  <text x="386" y="444" fill="#93a4b7" font-size="8" text-anchor="end">(뒤부분=정강신경 이중)</text>
  <line x1="342" y1="424" x2="318" y2="430" stroke="#6f8299" stroke-width="1"/>

  <text x="382" y="500" fill="#c3d2e2" font-size="10" class="kr" text-anchor="end">두덩정강근</text>
  <text x="382" y="512" fill="#8fa5bd" font-size="8.5" text-anchor="end">gracilis</text>
  <circle cx="388" cy="496" r="3.5" fill="#f0b56b"/>
  <line x1="338" y1="504" x2="312" y2="512" stroke="#6f8299" stroke-width="1"/>

  <text x="36" y="640" fill="#eab308" font-size="9.5">거위발 pes anserinus = 빗근+두덩정강근+반힘줄근 ★</text>
  <line x1="130" y1="628" x2="308" y2="618" stroke="#eab308" stroke-width="1"/>
  <text x="36" y="662" fill="#93a4b7" font-size="9">앞칸 = <tspan fill="#9cc3ff">넙다리신경</tspan> · 안쪽칸 = <tspan fill="#f0b56b">폐쇄신경</tspan></text>
  <text x="36" y="676" fill="#93a4b7" font-size="9">이중지배 = 두덩근·큰모음근 ★</text>

  <!-- ================================ 패널 B: 신경혈관 ================================ -->
  <rect x="448" y="100" width="408" height="588" fill="none" stroke="#26374c" stroke-width="1.5"/>
  <text x="460" y="115" fill="#e6edf3" font-size="12" class="kr">B. 신경혈관 — 넙다리삼각 → 모음근굴 → 모음근구멍</text>

  <!-- 샅고랑인대 -->
  <path d="M 540,150 L 760,208" fill="none" stroke="#3d5166" stroke-width="4"/>
  <text x="470" y="146" fill="#7b8ea3" font-size="9.5">샅고랑인대 inguinal lig.</text>
  <line x1="548" y1="150" x2="580" y2="158" stroke="#7b8ea3" stroke-width="1"/>
  <!-- 삼각 경계: 빗근(가쪽) · 긴모음근(안쪽) -->
  <path d="M 545,153 L 700,400" fill="none" stroke="#4a6382" stroke-width="7" opacity="0.8"/>
  <path d="M 752,212 L 676,420" fill="none" stroke="#405a75" stroke-width="7" opacity="0.8"/>
  <text x="486" y="266" fill="#8fa5bd" font-size="9.5">넙다리빗근</text>
  <line x1="530" y1="262" x2="580" y2="212" stroke="#6f8299" stroke-width="1"/>
  <text x="470" y="238" fill="#e0645f" font-size="8.5">얕은가지 3 = 얕은배벽·얕은엉덩휘돌이·바깥음부</text>
  <line x1="600" y1="228" x2="652" y2="180" stroke="#e0645f" stroke-width="0.9"/>
  <text x="790" y="300" fill="#8fa5bd" font-size="9.5">긴모음근</text>
  <line x1="786" y1="296" x2="724" y2="290" stroke="#6f8299" stroke-width="1"/>
  <!-- 모음근굴(빗근 아래 통로) 표시 -->
  <path d="M 690,408 L 724,500" fill="none" stroke="#31445c" stroke-width="16" opacity="0.55"/>
  <!-- 모음근구멍 -->
  <ellipse cx="724" cy="508" rx="12" ry="8" fill="none" stroke="#eab308" stroke-width="2.4"/>

  <!-- NAVEL: 가쪽 → 안쪽 = 신경·동맥·정맥·(림프) -->
  <!-- 넙다리신경 -->
  <path d="M 618,132 L 622,172 C 624,196 626,214 628,232" fill="none" stroke="#9cc3ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 628,232 L 600,290 M 628,232 L 616,300 M 628,232 L 640,296" fill="none" stroke="#9cc3ff" stroke-width="2" stroke-linecap="round"/>
  <!-- 두렁신경: 굴을 따라 → 구멍은 통과하지 않고 얕게 나옴 -->
  <path d="M 628,232 C 654,300 682,380 700,440 C 706,458 706,476 700,494 C 694,512 684,528 672,544 C 660,562 650,580 646,600" fill="none" stroke="#9cc3ff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 넙다리동맥 -->
  <path d="M 660,146 C 668,200 680,260 694,320 C 704,364 714,420 722,468 L 726,502" fill="none" stroke="#e0645f" stroke-width="6" stroke-linecap="round"/>
  <!-- 구멍 통과 후 오금(점선) -->
  <path d="M 728,514 C 734,548 738,580 740,610" fill="none" stroke="#e0645f" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"/>
  <!-- 얕은 가지 3 -->
  <path d="M 656,168 L 618,152 M 658,178 L 690,158 M 660,190 L 700,186" fill="none" stroke="#e0645f" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 깊은넙다리동맥 -->
  <path d="M 672,222 C 656,262 648,320 652,380 C 655,420 660,452 666,478" fill="none" stroke="#e0645f" stroke-width="4" stroke-linecap="round"/>
  <!-- 안쪽넙다리휘돌이 -->
  <path d="M 668,236 C 690,240 712,252 728,268" fill="none" stroke="#e0645f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 가쪽넙다리휘돌이 -->
  <path d="M 664,246 C 636,252 610,262 588,276" fill="none" stroke="#e0645f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 관통동맥 1-3 -->
  <path d="M 652,320 L 688,332 M 650,360 L 686,374 M 654,404 L 690,418" fill="none" stroke="#e0645f" stroke-width="2" stroke-linecap="round"/>
  <!-- 무릎내림동맥 -->
  <path d="M 716,440 C 700,472 688,510 682,548" fill="none" stroke="#e0645f" stroke-width="2" stroke-linecap="round"/>
  <!-- 넙다리정맥 -->
  <path d="M 692,158 C 700,220 712,300 724,380 C 730,420 734,450 736,478" fill="none" stroke="#8f79c4" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>
  <!-- 큰두렁정맥 → 두렁구멍 유입 -->
  <path d="M 760,620 C 752,540 740,420 726,320 C 720,276 708,232 698,196" fill="none" stroke="#8f79c4" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="700" cy="192" rx="9" ry="6" fill="none" stroke="#8f79c4" stroke-width="2"/>
  <!-- 폐쇄신경(안쪽 위에서 등장, 앞·뒤갈래) -->
  <path d="M 782,232 C 778,258 772,284 764,310" fill="none" stroke="#f0b56b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 764,310 C 756,348 748,388 742,428 M 764,310 C 768,352 768,392 764,432" fill="none" stroke="#f0b56b" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== 패널 B 라벨 ===== -->
  <text x="560" y="132" fill="#9cc3ff" font-size="10.5" class="kr" text-anchor="end">넙다리신경 ★</text>
  <line x1="564" y1="128" x2="612" y2="130" stroke="#9cc3ff" stroke-width="1"/>
  <text x="500" y="160" fill="#93a4b7" font-size="8.5">femoral n. — 인대 아래</text>
  <text x="500" y="171" fill="#93a4b7" font-size="8.5">근육칸(혈관집 밖)</text>

  <text x="648" y="134" fill="#e0645f" font-size="10.5" class="kr">넙다리동맥 <tspan fill="#93a4b7" font-size="8.5" font-weight="400">femoral a.</tspan></text>
  <line x1="660" y1="138" x2="660" y2="146" stroke="#e0645f" stroke-width="1"/>

  <text x="786" y="152" fill="#8f79c4" font-size="10.5" class="kr">넙다리정맥</text>
  <text x="786" y="164" fill="#93a4b7" font-size="8.5">femoral v.</text>
  <line x1="782" y1="154" x2="698" y2="160" stroke="#8f79c4" stroke-width="1"/>

  <text x="470" y="196" fill="#eab308" font-size="9">가쪽→안쪽 = N·A·V·(E)·L ★</text>
  <text x="470" y="209" fill="#93a4b7" font-size="8.5">신경–동맥–정맥–림프</text>

  <text x="470" y="290" fill="#9cc3ff" font-size="9.5">앞피부가지·근육가지</text>
  <line x1="546" y1="286" x2="606" y2="288" stroke="#9cc3ff" stroke-width="1"/>

  <text x="470" y="330" fill="#e0645f" font-size="10" class="kr">깊은넙다리동맥 ★</text>
  <text x="470" y="342" fill="#93a4b7" font-size="8.5">deep femoral a. — 뒤가쪽에서 기시</text>
  <line x1="560" y1="326" x2="648" y2="330" stroke="#e0645f" stroke-width="1"/>

  <text x="470" y="372" fill="#e0645f" font-size="9.5">가쪽넙다리휘돌이동맥</text>
  <line x1="560" y1="368" x2="596" y2="274" stroke="#e0645f" stroke-width="1"/>
  <text x="762" y="256" fill="#e0645f" font-size="9">안쪽넙다리휘돌이동맥 ★</text>
  <text x="762" y="268" fill="#93a4b7" font-size="8">넙다리뼈머리 주 혈행</text>
  <line x1="770" y1="260" x2="732" y2="266" stroke="#e0645f" stroke-width="1"/>

  <text x="470" y="412" fill="#e0645f" font-size="9.5">관통동맥 1–3</text>
  <text x="470" y="424" fill="#93a4b7" font-size="8.5">perforating aa. — 뒤칸으로</text>
  <line x1="540" y1="408" x2="682" y2="416" stroke="#e0645f" stroke-width="1"/>

  <text x="470" y="470" fill="#9cc3ff" font-size="10" class="kr">두렁신경 ★</text>
  <text x="470" y="482" fill="#93a4b7" font-size="8.5">saphenous n. — 굴은 지나지만</text>
  <text x="470" y="493" fill="#93a4b7" font-size="8.5">모음근구멍은 통과하지 않음</text>
  <line x1="530" y1="466" x2="694" y2="482" stroke="#9cc3ff" stroke-width="1"/>

  <text x="470" y="540" fill="#e6edf3" font-size="10" class="kr">모음근굴</text>
  <text x="470" y="552" fill="#93a4b7" font-size="8.5">adductor canal — 지붕=넙다리빗근</text>
  <line x1="516" y1="536" x2="700" y2="452" stroke="#6f8299" stroke-width="1"/>

  <text x="790" y="500" fill="#eab308" font-size="10" class="kr">모음근구멍 ★</text>
  <text x="790" y="512" fill="#93a4b7" font-size="8.5">adductor hiatus</text>
  <text x="790" y="524" fill="#93a4b7" font-size="8.5">(큰모음근) → 오금</text>
  <line x1="786" y1="502" x2="738" y2="508" stroke="#eab308" stroke-width="1"/>

  <text x="600" y="580" fill="#e0645f" font-size="9.5">무릎내림동맥</text>
  <text x="600" y="592" fill="#93a4b7" font-size="8">descending genicular a.</text>
  <line x1="640" y1="570" x2="684" y2="540" stroke="#e0645f" stroke-width="1"/>

