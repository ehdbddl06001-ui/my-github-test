<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="다리 얕은정맥(큰두렁정맥·작은두렁정맥)과 동반 피부신경 — 1회차 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn). 1회차 '다리 피부벗기기' 범위에서 얕은근막 안에
       살려 두어야 하는 구조. 근거: 수업계획서 확정본 §1회차(실습지침 307p·311p,
       e-Anatomy Lower limb — Superficial layer 02:44–03:39 / 12:02–13:34).
       앞·뒤를 한 그림에 겹치면 두 정맥이 교차해 안 읽히므로 앞/뒤 패널로 분리했다. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
    .b{fill:#1b2a3c;stroke:#3b506a}
    .limb{fill:#162436;stroke:#3b506a;stroke-width:1.7}
  </style>
  <rect width="880" height="660" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">다리 얕은정맥과 동반 피부신경
    <tspan fill="#93a4b7" font-size="12" font-weight="400">superficial veins of the lower limb</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">1회차(2026-08-18) 다리 피부벗기기 · 자체 제작 · <tspan fill="#3f6fbf">굵은 파랑 = 정맥</tspan> / <tspan fill="#9cc3ff">연한 파랑 = 신경</tspan></text>
  <text x="20" y="68" fill="#6f8299" font-size="11">둘 다 <tspan fill="#f2d98b">얕은근막 안</tspan>을 달린다 — 피부만 벗기면 그대로 남는다. 짝지어 다니는 신경까지 함께 외운다.</text>

  <!-- ================= 패널 A : 큰두렁정맥 ================= -->
  <rect x="18" y="82" width="310" height="468" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="34" y="106" fill="#9dc7f0" font-size="14" class="kr">A. 큰두렁정맥 great saphenous v.</text>
  <text x="34" y="122" fill="#6f8299" font-size="9.5">오른다리 · 앞에서 본 모습 (안쪽이 왼쪽)</text>

  <g transform="translate(44,132)">
    <path d="M 50,0 L 130,0 C 132,56 128,116 114,164 C 118,220 116,272 108,326 L 106,344
             C 112,348 128,352 132,360 L 128,370 L 72,370 L 70,344 L 68,326
             C 60,272 58,220 62,164 C 48,116 44,56 50,0 Z" class="limb"/>
    <line x1="50" y1="166" x2="128" y2="162" stroke="#2b3a4d" stroke-width="1.3"/>
    <text x="136" y="160" fill="#4a5f78" font-size="8.5">무릎</text>

    <!-- 안쪽복사 -->
    <circle cx="72" cy="338" r="7" fill="#3d5166" stroke="#7f9ab5" stroke-width="1.3"/>

    <!-- 큰두렁정맥 -->
    <path d="M 88,364 C 78,356 72,348 66,336 C 62,316 64,290 66,264
             C 68,224 66,196 64,172 C 66,140 70,108 76,76 C 80,48 84,30 90,18"
          fill="none" stroke="#3f6fbf" stroke-width="5" stroke-linecap="round"/>
    <!-- 발등정맥활 -->
    <path d="M 88,364 C 100,368 116,366 126,360" fill="none" stroke="#3f6fbf" stroke-width="3.4"/>
    <!-- 두렁구멍 -->
    <circle cx="92" cy="16" r="9" fill="none" stroke="#eab308" stroke-width="2"/>
    <!-- 지류들 -->
    <g stroke="#3f6fbf" stroke-width="2.4" fill="none">
      <path d="M 90,22 L 66,8"/><path d="M 92,24 L 120,10"/><path d="M 90,30 L 68,34"/>
    </g>
    <!-- 두렁신경 (무릎 아래부터 동반) -->
    <path d="M 70,168 C 72,206 70,240 72,268 C 74,296 76,318 80,336"
          fill="none" stroke="#9cc3ff" stroke-width="2.8" stroke-linecap="round"/>
    <!-- 관통정맥 -->
    <g stroke="#3f6fbf" stroke-width="2" fill="none">
      <path d="M 66,300 L 86,300"/><path d="M 65,246 L 85,246"/>
    </g>
    <circle cx="86" cy="300" r="4" fill="none" stroke="#eab308" stroke-width="1.4"/>
    <circle cx="85" cy="246" r="4" fill="none" stroke="#eab308" stroke-width="1.4"/>
  </g>

  <!-- 라벨 (위→아래 = 구조의 실제 높이 순) -->
  <line x1="136" y1="148" x2="186" y2="160" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="190" y="147" fill="#eab308" font-size="10.5" class="kr">두렁정맥구멍</text>
  <text x="190" y="159" fill="#93a4b7" font-size="9">saphenous opening</text>
  <text x="190" y="171" fill="#6f8299" font-size="8.5">넓은근막의 구멍 · 두덩결절</text>
  <text x="190" y="182" fill="#6f8299" font-size="8.5">아래가쪽 약 4 cm</text>
  <text x="190" y="196" fill="#93a4b7" font-size="9">→ 넙다리정맥 femoral v.</text>

  <line x1="114" y1="242" x2="186" y2="252" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="190" y="247" fill="#3f6fbf" font-size="10.5" class="kr">큰두렁정맥</text>
  <text x="190" y="259" fill="#93a4b7" font-size="9">great saphenous v.</text>
  <text x="190" y="271" fill="#6f8299" font-size="8.5">몸에서 가장 긴 정맥</text>

  <line x1="118" y1="422" x2="186" y2="368" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="190" y="352" fill="#9cc3ff" font-size="10.5" class="kr">두렁신경 saphenous n.</text>
  <text x="190" y="364" fill="#93a4b7" font-size="9">넙다리신경의 <tspan fill="#e6edf3">감각</tspan> 가지</text>
  <text x="190" y="376" fill="#6f8299" font-size="8.5">무릎 아래부터 정맥과 나란히</text>
  <text x="190" y="387" fill="#6f8299" font-size="8.5">종아리 안쪽·발 안쪽 피부</text>

  <line x1="116" y1="470" x2="186" y2="436" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="190" y="420" fill="#e6edf3" font-size="10.5" class="kr">안쪽복사 <tspan fill="#6f8299" font-size="9" font-weight="400">medial malleolus</tspan></text>
  <text x="190" y="432" fill="#eab308" font-size="9" class="kr">정맥은 복사 '앞'을 지난다</text>
  <text x="190" y="443" fill="#6f8299" font-size="8.5">응급 정맥절개(cut-down) 자리</text>

  <text x="34" y="512" fill="#eab308" font-size="9.5" class="kr">○ 관통정맥 <tspan fill="#93a4b7" font-weight="400">perforating v. — 깊은정맥으로만 흐른다</tspan></text>
  <text x="34" y="528" fill="#6f8299" font-size="9">두렁구멍 직전 지류 3: 얕은배벽정맥 · 얕은엉덩휘돌이정맥 · 바깥음부정맥</text>
  <text x="34" y="542" fill="#6f8299" font-size="9">(+ 덧두렁정맥 accessory saphenous v.)</text>

  <!-- ================= 패널 B : 작은두렁정맥 ================= -->
  <rect x="340" y="82" width="310" height="468" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="356" y="106" fill="#9dc7f0" font-size="14" class="kr">B. 작은두렁정맥 small saphenous v.</text>
  <text x="356" y="122" fill="#6f8299" font-size="9.5">오른다리 · 뒤에서 본 모습 (가쪽이 왼쪽)</text>

  <g transform="translate(366,132)">
    <path d="M 50,0 L 130,0 C 132,56 128,116 114,164 C 118,220 116,272 108,326 L 106,344
             C 112,348 128,352 132,360 L 128,370 L 72,370 L 70,344 L 68,326
             C 60,272 58,220 62,164 C 48,116 44,56 50,0 Z" class="limb"/>
    <line x1="50" y1="166" x2="128" y2="162" stroke="#2b3a4d" stroke-width="1.3"/>
    <text x="136" y="160" fill="#4a5f78" font-size="8.5">오금</text>
    <!-- 오금 마름모 -->
    <path d="M 90,150 L 106,164 L 90,180 L 74,164 Z" fill="none" stroke="#7f9ab5" stroke-width="1.2" stroke-dasharray="3 2"/>

    <!-- 가쪽복사 -->
    <circle cx="74" cy="338" r="7" fill="#3d5166" stroke="#7f9ab5" stroke-width="1.3"/>

    <!-- 작은두렁정맥: 가쪽복사 뒤 → 종아리 뒤 정중 → 오금 -->
    <path d="M 92,366 C 82,358 74,350 70,340 C 70,322 76,306 84,290
             C 90,268 90,240 90,212 C 90,196 90,184 90,172"
          fill="none" stroke="#3f6fbf" stroke-width="5" stroke-linecap="round"/>
    <path d="M 92,366 C 104,368 116,366 126,360" fill="none" stroke="#3f6fbf" stroke-width="3.4"/>
    <!-- 깊은근막 관통점 -->
    <circle cx="90" cy="176" r="9" fill="none" stroke="#eab308" stroke-width="2"/>

    <!-- 장딴지신경 -->
    <path d="M 96,214 C 92,246 86,274 78,300 C 74,318 72,330 72,342"
          fill="none" stroke="#9cc3ff" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 아킬레스힘줄 -->
    <line x1="90" y1="292" x2="90" y2="336" stroke="#4a5f78" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>

  <line x1="456" y1="308" x2="512" y2="180" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="516" y="165" fill="#eab308" font-size="10.5" class="kr">깊은근막을 뚫는 곳</text>
  <text x="516" y="177" fill="#93a4b7" font-size="9">오금에서 <tspan fill="#e6edf3">오금정맥</tspan>으로</text>
  <text x="516" y="189" fill="#6f8299" font-size="8.5">popliteal v. · 높이는 사람마다 다르다</text>

  <line x1="456" y1="352" x2="512" y2="268" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="516" y="252" fill="#3f6fbf" font-size="10.5" class="kr">작은두렁정맥</text>
  <text x="516" y="264" fill="#93a4b7" font-size="9">small saphenous v.</text>
  <text x="516" y="276" fill="#6f8299" font-size="8.5">종아리 뒤 정중선을 따라 오른다</text>

  <line x1="444" y1="432" x2="512" y2="352" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="516" y="336" fill="#9cc3ff" font-size="10.5" class="kr">장딴지신경 sural n.</text>
  <text x="516" y="348" fill="#93a4b7" font-size="9">정강신경 + 온종아리신경 교통가지</text>
  <text x="516" y="360" fill="#6f8299" font-size="8.5">종아리 뒤가쪽·발 가쪽 피부</text>
  <text x="516" y="372" fill="#6f8299" font-size="8.5">신경생검(biopsy)으로 자주 쓴다</text>

  <line x1="440" y1="470" x2="512" y2="428" stroke="#4a5f78" stroke-width="0.9"/>
  <text x="516" y="412" fill="#e6edf3" font-size="10.5" class="kr">가쪽복사 <tspan fill="#6f8299" font-size="9" font-weight="400">lateral malleolus</tspan></text>
  <text x="516" y="424" fill="#eab308" font-size="9" class="kr">정맥은 복사 '뒤'를 지난다</text>

  <rect x="356" y="506" width="278" height="40" rx="5" fill="#1a2f47" stroke="#4d7fb0"/>
  <text x="366" y="522" fill="#9cc3ff" font-size="10" class="kr">복사 규칙: 큰두렁 = 안쪽복사 <tspan fill="#e6edf3">앞</tspan> / 작은두렁 = 가쪽복사 <tspan fill="#e6edf3">뒤</tspan></text>
  <text x="366" y="536" fill="#6f8299" font-size="9">'큰-안-앞 / 작-가-뒤' 로 외운다</text>

  <!-- ================= 패널 C : 흐름·임상 ================= -->
  <rect x="662" y="82" width="200" height="468" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="676" y="106" fill="#9dc7f0" font-size="13" class="kr">C. 흐름과 임상</text>

  <text x="676" y="132" fill="#e6edf3" font-size="10.5" class="kr">피가 가는 길</text>
  <g font-size="9.5">
    <rect x="676" y="140" width="172" height="22" rx="4" class="b"/>
    <text x="684" y="155" fill="#93a4b7">얕은정맥 (얕은근막)</text>
    <text x="756" y="174" fill="#eab308" font-size="11">↓</text>
    <rect x="676" y="180" width="172" height="22" rx="4" class="b"/>
    <text x="684" y="195" fill="#93a4b7">관통정맥 perforating</text>
    <text x="756" y="214" fill="#eab308" font-size="11">↓</text>
    <rect x="676" y="220" width="172" height="22" rx="4" fill="#152538" stroke="#9cc3ff"/>
    <text x="684" y="235" fill="#9cc3ff">깊은정맥 (근육 사이)</text>
  </g>
  <text x="676" y="262" fill="#6f8299" font-size="9">판막이 <tspan fill="#e6edf3">한 방향</tspan>만 허용한다.</text>
  <text x="676" y="275" fill="#6f8299" font-size="9">장딴지근이 펌프 역할을 한다.</text>

  <line x1="676" y1="290" x2="848" y2="290" stroke="#2b3a4d"/>
  <text x="676" y="310" fill="#e6edf3" font-size="10.5" class="kr">임상 연결</text>
  <text x="676" y="328" fill="#93a4b7" font-size="9.5">· 판막부전 → <tspan fill="#e6edf3">정맥류</tspan></text>
  <text x="676" y="341" fill="#6f8299" font-size="8.5">varicose veins · 큰두렁계에 흔하다</text>
  <text x="676" y="358" fill="#93a4b7" font-size="9.5">· 큰두렁정맥 = 이식편</text>
  <text x="676" y="371" fill="#6f8299" font-size="8.5">관상동맥우회술(CABG)·말초우회</text>
  <text x="676" y="388" fill="#93a4b7" font-size="9.5">· 안쪽복사 앞 정맥절개</text>
  <text x="676" y="401" fill="#6f8299" font-size="8.5">쇼크로 정맥이 안 보일 때 확보</text>
  <text x="676" y="418" fill="#93a4b7" font-size="9.5">· 채취 시 신경 손상 주의</text>
  <text x="676" y="431" fill="#6f8299" font-size="8.5">큰두렁 → 두렁신경 / 작은두렁 →</text>
  <text x="676" y="443" fill="#6f8299" font-size="8.5">장딴지신경</text>

  <line x1="676" y1="458" x2="848" y2="458" stroke="#2b3a4d"/>
  <text x="676" y="478" fill="#e6edf3" font-size="10.5" class="kr">실습 주의</text>
  <text x="676" y="496" fill="#6f8299" font-size="9">피부만 벗기고 <tspan fill="#f2d98b">얕은근막은</tspan></text>
  <text x="676" y="508" fill="#6f8299" font-size="9"><tspan fill="#f2d98b">남긴다</tspan> — 두 정맥과 짝 신경이</text>
  <text x="676" y="520" fill="#6f8299" font-size="9">그 안에 들어 있다.</text>
  <text x="676" y="538" fill="#6f8299" font-size="9">한 번 끊으면 복원되지 않는다.</text>

  <!-- ================= 아래 띠 ================= -->
  <rect x="18" y="562" width="844" height="82" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="34" y="586" fill="#9dc7f0" font-size="13" class="kr">한 줄 정리 <tspan fill="#93a4b7" font-size="10" font-weight="400">태깅에서 물어보는 축</tspan></text>
  <text x="34" y="608" fill="#93a4b7" font-size="10">① 어디서 시작해 어디로 끝나는가 — 큰두렁: 발등정맥활 안쪽 끝 → 두렁정맥구멍 → 넙다리정맥 / 작은두렁: 발등정맥활 가쪽 끝 → 깊은근막 뚫고 → 오금정맥</text>
  <text x="34" y="626" fill="#93a4b7" font-size="10">② 어느 복사를 어느 쪽으로 지나는가 ③ 어떤 신경과 함께 다니는가 ④ 그 신경이 다치면 어디 감각이 사라지는가</text>
</svg>
