<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1202" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="척주관의 정맥얼기와 샅의 동맥 — 속음부동맥 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 12회차 인제스트 섹션 a2-s13 §척주관열기 · §궁둥항문오목의 혈관과 신경 · §깊은샅공간 · §음경 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1202" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">척주관의 정맥얼기와 샅의 동맥 — 속음부동맥<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> vertebral venous plexuses &amp; the internal pudendal artery</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">12회차 · 경막바깥공간은 정맥얼기로 차 있고, 샅의 피는 속엉덩동맥 앞가지에서 온다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 602,158 H 615 V 125 H 628" fill="none" stroke="#584a76" stroke-width="1.6"/>
