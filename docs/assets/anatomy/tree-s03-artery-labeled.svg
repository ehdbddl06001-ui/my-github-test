<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 808" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="빗장밑동맥과 오금동맥 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 3회차 §뒤통수밑삼각·어깨뼈부위·다리오금 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="808" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">빗장밑동맥과 오금동맥<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> subclavian &amp;amp; popliteal arteries</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">3회차 · 어깨동맥그물과 무릎동맥그물 — 곁순환이 만들어지는 두 자리</text>
  <text x="26" y="68" fill="#6f8299" font-size="10">★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
