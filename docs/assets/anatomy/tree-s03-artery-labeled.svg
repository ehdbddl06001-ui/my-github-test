  <rect x="26" y="400" width="180" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="1.3"/>
  <text x="36" y="420" fill="#e0645f" font-size="12" class="kr">빗장밑동맥 / 넙다리동맥</text>
  <text x="36" y="435" fill="#c98a86" font-size="9">두 계통을 한 장에</text>
  <rect x="232" y="192" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="212" fill="#e0645f" font-size="12" class="kr">빗장밑동맥 ★</text>
  <text x="242" y="227" fill="#c98a86" font-size="9">subclavian a.</text>
  <rect x="232" y="424" width="174" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="444" fill="#e0645f" font-size="12" class="kr">겨드랑동맥</text>
  <text x="242" y="458" fill="#c98a86" font-size="9">axillary a.</text>
  <text x="242" y="470" fill="#6f8299" font-size="9">작은가슴근 기준 3부</text>
  <rect x="232" y="602" width="174" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="622" fill="#e0645f" font-size="12" class="kr">오금동맥 ★</text>
  <text x="242" y="637" fill="#c98a86" font-size="9">popliteal a.</text>
  <text x="242" y="648" fill="#6f8299" font-size="9">넙다리동맥이 모음근구멍을 지나</text>
  <text x="242" y="659" fill="#6f8299" font-size="9">개명</text>
  <rect x="432" y="92" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="112" fill="#e0645f" font-size="12" class="kr">척추동맥 ★</text>
  <text x="442" y="127" fill="#c98a86" font-size="9">vertebral a.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">C6–C1 가로돌기구멍 →</text>
  <text x="442" y="149" fill="#6f8299" font-size="9">뒤통수밑삼각</text>
  <rect x="432" y="197" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="217" fill="#e0645f" font-size="12" class="kr">갑상목동맥</text>
  <text x="442" y="232" fill="#c98a86" font-size="9">thyrocervical trunk</text>
  <rect x="432" y="284" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="304" fill="#e0645f" font-size="12" class="kr">등쪽어깨동맥</text>
  <text x="442" y="319" fill="#c98a86" font-size="9">dorsal scapular a.</text>
  <text x="442" y="330" fill="#6f8299" font-size="9">마름근 깊은면</text>
  <rect x="432" y="376" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="396" fill="#e0645f" font-size="12" class="kr">어깨밑동맥</text>
  <text x="442" y="410" fill="#c98a86" font-size="9">subscapular a.</text>
  <text x="442" y="422" fill="#6f8299" font-size="9">3부</text>
  <rect x="432" y="476" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="496" fill="#e0645f" font-size="12" class="kr">뒤위팔휘돌이동맥 ★</text>
  <text x="442" y="511" fill="#c98a86" font-size="9">post. circumflex humeral a.</text>
  <text x="442" y="522" fill="#6f8299" font-size="9">네모공간 · 겨드랑신경 동반</text>
  <rect x="432" y="541" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="561" fill="#e0645f" font-size="12" class="kr">무릎동맥 5가지</text>
  <text x="442" y="576" fill="#c98a86" font-size="9">genicular aa.</text>
  <text x="442" y="587" fill="#6f8299" font-size="9">위·아래 각 2 + 중간 1</text>
  <rect x="432" y="615" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="635" fill="#e0645f" font-size="12" class="kr">앞정강동맥</text>
  <text x="442" y="650" fill="#c98a86" font-size="9">anterior tibial a.</text>
  <text x="442" y="661" fill="#6f8299" font-size="9">종아리 앞칸 → 발등동맥</text>
  <rect x="432" y="679" width="170" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="699" fill="#e0645f" font-size="12" class="kr">뒤정강동맥</text>
  <text x="442" y="714" fill="#c98a86" font-size="9">posterior tibial a.</text>
  <text x="442" y="725" fill="#6f8299" font-size="9">뒤칸 → 발바닥동맥</text>
  <rect x="628" y="167" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="187" fill="#e0645f" font-size="12" class="kr">어깨위동맥 ★</text>
  <text x="638" y="202" fill="#c98a86" font-size="9">suprascapular a.</text>
  <text x="638" y="213" fill="#6f8299" font-size="9">위가로어깨인대 **위**로</text>
  <rect x="628" y="231" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="251" fill="#e0645f" font-size="12" class="kr">가로목동맥</text>
  <text x="638" y="266" fill="#c98a86" font-size="9">transverse cervical a.</text>
  <rect x="628" y="348" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="368" fill="#e0645f" font-size="12" class="kr">어깨휘돌이동맥 ★</text>
  <text x="638" y="383" fill="#c98a86" font-size="9">circumflex scapular a.</text>
  <text x="638" y="394" fill="#6f8299" font-size="9">세모공간</text>
  <rect x="628" y="412" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="432" fill="#e0645f" font-size="12" class="kr">가슴등동맥</text>
  <text x="638" y="447" fill="#c98a86" font-size="9">thoracodorsal a.</text>
  <text x="638" y="458" fill="#6f8299" font-size="9">넓은등근</text>
  <rect x="628" y="540" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="560" fill="#e0645f" font-size="12" class="kr">중간무릎동맥 ★</text>
  <text x="638" y="575" fill="#c98a86" font-size="9">middle genicular a.</text>
  <text x="638" y="586" fill="#6f8299" font-size="9">유일하게 관절주머니 관통 →</text>
  <text x="638" y="597" fill="#6f8299" font-size="9">십자인대</text>
  <rect x="628" y="679" width="160" height="44" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="699" fill="#e0645f" font-size="12" class="kr">종아리동맥</text>
  <text x="638" y="714" fill="#c98a86" font-size="9">fibular a.</text>
  <line x1="26" y1="744" x2="814" y2="744" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="756" fill="#93a4b7" font-size="10.5">무릎동맥 5가지 중 **중간무릎동맥만** 관절주머니를 뚫고 십자인대로 간다.</text>
  <text x="26" y="774" fill="#93a4b7" font-size="10.5">어깨위동맥은 위가로어깨인대 **위**로, 어깨위신경은 인대 **아래**로 — 짝지어 외운다.</text>
</svg>
