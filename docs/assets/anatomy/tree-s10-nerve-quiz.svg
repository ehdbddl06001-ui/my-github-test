  <text x="26" y="1781" fill="#93a4b7" font-size="10.5">칸이 신경을 정한다 — 앞칸은 <tspan fill="#e6edf3" font-weight="700">정중·자</tspan>, 뒤칸은 <tspan fill="#e6edf3" font-weight="700">노</tspan>(뒤뼈사이)가 맡는다.</text>
  <text x="26" y="1799" fill="#93a4b7" font-size="10.5">손의 근육은 <tspan fill="#e6edf3" font-weight="700">자신경 깊은가지</tspan>가 거의 다 맡고, 정중신경은 엄지두덩 3근 + 벌레근 1·2뿐이다.</text>
  <text x="26" y="1817" fill="#93a4b7" font-size="10.5">배벽 신경은 새로 생기지 않는다 — 갈비사이신경(T7–T11)이 그대로 내려와 이름만 바뀐다.</text>
