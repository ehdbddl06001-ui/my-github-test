<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="속엉덩동맥 분지 — 오른반골반 안쪽면(시상단면) 교과서식 자체 제작 도해, 강의 14차시 근거">
  <!-- 자체 제작 도해(claude-drawn). 교과서 표준 구도(오른반골반 안쪽면, 앞=왼쪽·뒤=오른쪽)를 따라
       뼈 실루엣 위에 동맥 주행을 배치했다. 근거: 14차시 강의 '속엉덩동맥' 절 + tagging 2차 [골반 동맥]. -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3.5px;stroke-linejoin:round}</style>
  <rect width="880" height="660" fill="#0e1826"/>
  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">속엉덩동맥 분지 — 오른반골반 안쪽면
    <tspan fill="#93a4b7" font-size="12" font-weight="400">internal iliac artery, medial view of right hemipelvis</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과서식 구도) · 근거: 14차시 강의 §속엉덩동맥 · ★ = tagging 답 후보 · 앞(두덩뼈)=왼쪽 / 뒤(엉치뼈)=오른쪽</text>
  <text x="70" y="88" fill="#5d6f83" font-size="11">앞 anterior ◀</text>
  <text x="760" y="88" fill="#5d6f83" font-size="11">▶ 뒤 posterior</text>

  <!-- ===== 뼈 실루엣 ===== -->
  <!-- 엉치뼈(sacrum): 뒤쪽 기둥, 앞면이 오목. 앞엉치뼈구멍 4개 -->
  <path d="M 640 120 C 610 180 600 250 612 320 C 620 370 636 410 660 445 L 700 445 C 690 400 682 340 684 270 C 686 200 700 150 716 120 Z"
        fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <circle cx="650" cy="200" r="6" fill="#0e1826" stroke="#3d5166"/>
  <circle cx="644" cy="250" r="6" fill="#0e1826" stroke="#3d5166"/>
  <circle cx="642" cy="300" r="6" fill="#0e1826" stroke="#3d5166"/>
  <circle cx="646" cy="348" r="5" fill="#0e1826" stroke="#3d5166"/>
  <text x="712" y="180" fill="#8fa3b8" font-size="13" font-weight="700">엉치뼈</text>
  <text x="712" y="195" fill="#5d6f83" font-size="10">sacrum</text>
  <text x="700" y="230" fill="#5d6f83" font-size="10">앞엉치뼈구멍</text>
  <text x="700" y="243" fill="#4a5b6e" font-size="9">anterior sacral foramina</text>
  <!-- 꼬리뼈(coccyx) -->
  <path d="M 660 445 C 664 470 660 490 648 505 L 634 498 C 644 482 648 462 646 445 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="668" y="500" fill="#8fa3b8" font-size="12" font-weight="700">꼬리뼈</text>
  <text x="668" y="514" fill="#5d6f83" font-size="10">coccyx</text>
  <!-- 엉치뼈곶(promontory) -->
  <text x="596" y="106" fill="#8fa3b8" font-size="11" font-weight="700">엉치뼈곶</text>
  <text x="596" y="119" fill="#5d6f83" font-size="9">promontory</text>
  <!-- 골반 가장자리(위골반문 선) : 곶 → 두덩뼈 -->
  <path d="M 630 128 C 480 180 300 240 175 318" fill="none" stroke="#2b3a4d" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="486" y="196" fill="#4a5b6e" font-size="10">위골반문 pelvic brim</text>
  <!-- 두덩뼈·두덩결합(pubis, symphysis) -->
  <path d="M 175 318 C 150 330 138 350 140 378 L 168 388 C 170 362 180 342 196 330 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="52" y="330" fill="#8fa3b8" font-size="12" font-weight="700">두덩결합</text>
  <text x="52" y="344" fill="#5d6f83" font-size="10">pubic symphysis</text>
  <path d="M 108 348 L 140 360" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 폐쇄구멍(obturator foramen) + 폐쇄관 -->
  <ellipse cx="248" cy="400" rx="52" ry="38" fill="#0e1826" stroke="#3d5166" stroke-width="2"/>
  <text x="212" y="470" fill="#8fa3b8" font-size="11" font-weight="700">폐쇄구멍</text>
  <text x="212" y="483" fill="#5d6f83" font-size="9">obturator foramen</text>
  <circle cx="262" cy="366" r="7" fill="none" stroke="#2f4a72" stroke-width="2"/>
  <text x="150" y="288" fill="#9cc3ff" font-size="12" font-weight="700">폐쇄관</text>
  <text x="150" y="301" fill="#5d6f83" font-size="10">obturator canal</text>
  <path d="M 216 292 L 258 360" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 궁둥뼈가시(ischial spine) + 엉치가시인대 -->
  <path d="M 560 402 L 540 416 L 562 424 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="452" y="452" fill="#eab308" font-size="12" font-weight="700">궁둥뼈가시</text>
  <text x="452" y="465" fill="#b7962e" font-size="10">ischial spine</text>
  <path d="M 510 444 L 546 418" stroke="#8b7a2e" stroke-width="1"/>
  <path d="M 560 414 C 590 424 620 440 640 460" fill="none" stroke="#3d5166" stroke-width="5"/>
  <text x="700" y="452" fill="#7f93a8" font-size="10">엉치가시인대</text>
  <text x="700" y="464" fill="#5d6f83" font-size="9">sacrospinous ligament</text>
  <path d="M 696 449 L 616 440" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 궁둥구멍근(piriformis): 엉치뼈 앞면 → 큰궁둥구멍 -->
  <path d="M 636 235 C 596 262 560 300 534 342 L 556 356 C 582 316 614 282 648 258 Z"
        fill="#243b52" stroke="#41608a" stroke-width="1.5" opacity="0.9"/>
  <text x="588" y="316" fill="#7fa3cf" font-size="11" font-weight="700" transform="rotate(-38 588 316)">궁둥구멍근 piriformis</text>
  <!-- 큰궁둥구멍 위/아래 표기 -->
  <text x="470" y="300" fill="#c9bcff" font-size="10">큰궁둥구멍 윗부분</text>
  <text x="470" y="312" fill="#8f84c2" font-size="9">suprapiriform</text>
  <text x="446" y="392" fill="#c9bcff" font-size="10">큰궁둥구멍 아랫부분</text>
  <text x="446" y="404" fill="#8f84c2" font-size="9">infrapiriform</text>

  <!-- ===== 장기 참조 ===== -->
  <!-- 방광 -->
  <path d="M 190 400 C 168 418 164 452 186 472 C 214 494 268 494 292 470 C 310 450 304 416 282 402 C 254 388 214 386 190 400 Z"
        fill="#16283c" stroke="#2f4a72" stroke-width="2"/>
  <text x="212" y="444" fill="#9cc3ff" font-size="12" font-weight="700">방광</text>
  <text x="212" y="458" fill="#5d6f83" font-size="10">urinary bladder</text>
  <!-- 곧창자 -->
  <path d="M 560 448 C 548 480 552 516 572 540 L 616 540 C 604 512 602 478 610 450 Z"
        fill="#16283c" stroke="#2f4a72" stroke-width="2"/>
  <text x="566" y="562" fill="#9cc3ff" font-size="12" font-weight="700">곧창자</text>
  <text x="566" y="576" fill="#5d6f83" font-size="10">rectum</text>

  <!-- ===== 동맥 ===== -->
  <!-- 온엉덩동맥 -->
  <path d="M 400 66 L 408 122" stroke="#ef6a6a" stroke-width="11" fill="none" stroke-linecap="round"/>
  <text x="288" y="80" fill="#ffb4b4" font-size="13" font-weight="700">온엉덩동맥</text>
  <text x="288" y="94" fill="#c98b8b" font-size="10">common iliac artery</text>
  <!-- 바깥엉덩동맥: 골반가장자리 따라 앞아래로 -->
  <path d="M 408 122 C 340 170 240 240 178 310" stroke="#c96a6a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="212" y="176" fill="#d39b9b" font-size="12" font-weight="700">바깥엉덩동맥</text>
  <text x="212" y="190" fill="#a97777" font-size="10">external iliac artery</text>
  <path d="M 268 194 L 300 222" stroke="#8a5f5f" stroke-width="1"/>
  <!-- 속엉덩동맥 본줄기 -->
  <path d="M 408 122 C 424 160 436 196 442 232" stroke="#ef6a6a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="446" y="94" fill="#ffb4b4" font-size="14" font-weight="700">속엉덩동맥 ★</text>
  <text x="446" y="108" fill="#c98b8b" font-size="10">internal iliac artery</text>
  <path d="M 452 114 L 424 140" stroke="#8a5f5f" stroke-width="1"/>

  <!-- 뒤갈래(posterior division) -->
  <path d="M 442 232 C 466 226 494 216 520 202" stroke="#e08585" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="486" y="150" fill="#e6edf3" font-size="11" font-weight="700">뒤갈래</text>
  <text x="486" y="162" fill="#93a4b7" font-size="9">posterior division</text>
  <path d="M 500 166 L 508 196" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 엉덩허리동맥: 위가쪽으로 -->
  <path d="M 520 202 C 546 178 574 152 606 132" stroke="#ef8f8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 574 156 C 592 150 612 148 632 150" stroke="#ef8f8f" stroke-width="3" fill="none"/>
  <text x="556" y="120" fill="#e6edf3" font-size="12" font-weight="700">엉덩허리동맥</text>
  <text x="556" y="133" fill="#93a4b7" font-size="10">iliolumbar artery</text>
  <!-- 가쪽엉치동맥: 앞엉치뼈구멍 따라 아래로, 2가지 -->
  <path d="M 520 202 C 566 212 606 224 634 240 C 646 266 646 306 650 344" stroke="#ef8f8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 634 240 C 624 274 622 312 628 348" stroke="#ef8f8f" stroke-width="3" fill="none"/>
  <text x="700" y="300" fill="#e6edf3" font-size="12" font-weight="700">가쪽엉치동맥 ★</text>
  <text x="700" y="313" fill="#93a4b7" font-size="10">lateral sacral artery</text>
  <text x="700" y="326" fill="#5d6f83" font-size="9">엉치뼈 앞면 · 보통 2개</text>
  <path d="M 696 296 L 654 290" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 위볼기동맥: 궁둥구멍근 위로 나감 -->
  <path d="M 520 202 C 536 232 548 262 552 290" stroke="#ef8f8f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 552 290 L 566 302" stroke="#ef8f8f" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="6 3"/>
  <text x="704" y="352" fill="#e6edf3" font-size="12" font-weight="700">위볼기동맥</text>
  <text x="704" y="365" fill="#93a4b7" font-size="10">superior gluteal artery</text>
  <text x="704" y="378" fill="#5d6f83" font-size="9">궁둥구멍근 위로 나감</text>
  <path d="M 700 349 L 566 300" stroke="#4a5b6e" stroke-width="1"/>

  <!-- 앞갈래(anterior division) 본줄기 -->
  <path d="M 442 232 C 446 264 446 296 442 328" stroke="#e08585" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="360" y="206" fill="#e6edf3" font-size="11" font-weight="700">앞갈래</text>
  <text x="360" y="218" fill="#93a4b7" font-size="9">anterior division</text>
  <path d="M 408 212 L 440 244" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 배꼽동맥 → 위방광동맥 -->
  <path d="M 444 250 C 380 232 300 220 222 226 C 190 230 164 240 146 254" stroke="#ef8f8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 262 224 C 254 270 250 330 252 384" stroke="#ef8f8f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="128" y="200" fill="#e6edf3" font-size="12" font-weight="700">배꼽동맥</text>
  <text x="128" y="213" fill="#93a4b7" font-size="10">umbilical artery</text>
  <text x="128" y="226" fill="#5d6f83" font-size="9">배꼽 쪽으로(폐쇄부분)</text>
  <text x="296" y="330" fill="#e6edf3" font-size="12" font-weight="700">위방광동맥</text>
  <text x="296" y="343" fill="#93a4b7" font-size="10">superior vesical artery</text>
  <path d="M 292 328 L 256 320" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 폐쇄동맥: 폐쇄관으로 (신경 동행) -->
  <path d="M 442 282 C 384 296 316 322 268 362" stroke="#ef8f8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 452 262 C 392 278 326 306 276 350" stroke="#eab308" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
  <text x="322" y="252" fill="#eab308" font-size="10">폐쇄신경(위) obturator nerve</text>
  <text x="300" y="386" fill="#e6edf3" font-size="12" font-weight="700">폐쇄동맥 ★</text>
  <text x="300" y="399" fill="#93a4b7" font-size="10">obturator artery</text>
  <text x="300" y="412" fill="#5d6f83" font-size="9">신경과 함께 폐쇄관으로</text>
  <!-- 아래방광동맥 -->
  <path d="M 442 310 C 400 330 348 356 304 388" stroke="#ef8f8f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="352" y="440" fill="#e6edf3" font-size="12" font-weight="700">아래방광동맥</text>
  <text x="352" y="453" fill="#93a4b7" font-size="10">inferior vesical artery</text>
  <text x="352" y="466" fill="#5d6f83" font-size="9">방광 아랫부분·전립샘</text>
  <path d="M 366 428 L 326 398" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 중간곧창자동맥 -->
  <path d="M 442 328 C 480 366 526 406 572 440" stroke="#ef8f8f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="430" y="520" fill="#e6edf3" font-size="12" font-weight="700">중간곧창자동맥</text>
  <text x="430" y="533" fill="#93a4b7" font-size="10">middle rectal artery</text>
  <path d="M 500 508 L 540 428" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 아래볼기동맥: 궁둥구멍근 아래로 -->
  <path d="M 442 328 C 462 350 486 368 510 380" stroke="#ef8f8f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 510 380 L 528 390" stroke="#ef8f8f" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="6 3"/>
  <text x="704" y="400" fill="#e6edf3" font-size="12" font-weight="700">아래볼기동맥</text>
  <text x="704" y="413" fill="#93a4b7" font-size="10">inferior gluteal artery</text>
  <path d="M 700 398 L 532 388" stroke="#4a5b6e" stroke-width="1"/>
  <!-- 속음부동맥: 궁둥뼈가시 바로 위로 나가 감아돎 -->
  <path d="M 442 328 C 468 362 496 388 526 404 C 544 412 552 420 548 432" stroke="#ef8f8f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="300" y="560" fill="#e6edf3" font-size="12" font-weight="700">속음부동맥</text>
  <text x="300" y="573" fill="#93a4b7" font-size="10">internal pudendal artery</text>
  <text x="300" y="586" fill="#5d6f83" font-size="9">궁둥뼈가시 바로 위 → 아랫부분으로 나감</text>
  <path d="M 388 550 L 520 408" stroke="#4a5b6e" stroke-width="1"/>

  <!-- 하단 요약 -->
  <rect x="20" y="600" width="840" height="46" rx="8" fill="#121f30" stroke="#22344a"/>
  <text x="34" y="619" fill="#93a4b7" font-size="11">행선지로 묶기 — <tspan fill="#e6edf3">앞·내장</tspan>: 배꼽→위방광 · 아래방광 · 중간곧창자 / <tspan fill="#e6edf3">뒤·벽</tspan>: 엉덩허리 · 가쪽엉치★ / <tspan fill="#e6edf3">큰궁둥구멍</tspan>: 위볼기(위)·아래볼기·속음부(아래) / <tspan fill="#e6edf3">폐쇄관</tspan>: 폐쇄동맥★</text>
  <text x="34" y="637" fill="#93a4b7" font-size="11">혼동 주의: 위곧창자동맥(superior rectal a.)은 속엉덩동맥이 아니라 <tspan fill="#e6edf3">아래창자간막동맥의 가지</tspan> — 중간곧창자동맥과 문합한다.</text>
</svg>
