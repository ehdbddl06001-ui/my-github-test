  <text x="26" y="1267" fill="#93a4b7" font-size="10.5">팔 뒤칸에는 신경이 <tspan fill="#e6edf3" font-weight="700">하나뿐이다</tspan> — 노신경. 앞칸의 정중·자처럼 나눠 갖지 않는다.</text>
  <text x="26" y="1285" fill="#93a4b7" font-size="10.5">노신경은 손뒤침근에서 <tspan fill="#e6edf3" font-weight="700">둘로 갈린다</tspan> — 깊은가지(뒤뼈사이, 운동)와 얕은가지(감각).</text>
  <text x="26" y="1303" fill="#93a4b7" font-size="10.5">배안의 자율신경은 길을 따로 내지 않는다 — <tspan fill="#e6edf3" font-weight="700">동맥을 감싸고 같은 이름으로</tspan> 따라간다.</text>
