  <text x="26" y="1749" fill="#93a4b7" font-size="10.5">정맥굴의 흐름은 <tspan fill="#e6edf3" font-weight="700">위시상 → 합류 → 가로 → 구불 → 속목정맥</tspan> 한 줄 — 나머지는 이 줄에 붙는다.</text>
  <text x="26" y="1767" fill="#93a4b7" font-size="10.5">배대동맥 가지는 <tspan fill="#e6edf3" font-weight="700">앞 홑(복강·위창자간막·아래창자간막) · 옆 짝(가로막·부신·콩팥·생식샘) · 뒤 짝(허리)</tspan>.</text>
  <text x="26" y="1785" fill="#93a4b7" font-size="10.5">왼쪽 생식샘정맥·부신정맥은 <tspan fill="#e6edf3" font-weight="700">왼콩팥정맥으로</tspan>, 오른쪽은 <tspan fill="#e6edf3" font-weight="700">아래대정맥으로 곧장</tspan> 간다.</text>
