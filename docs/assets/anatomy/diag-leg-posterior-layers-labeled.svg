  <path d="M 172,204 C 181,272 202,352 227,432 C 237,462 237,472 236,488"
        fill="none" stroke="#0e1826" stroke-width="5"/>
  <path d="M 172,204 C 181,272 202,352 227,432 C 237,462 237,472 236,488"
        fill="none" stroke="#d9f5e6" stroke-width="2.4"/>
