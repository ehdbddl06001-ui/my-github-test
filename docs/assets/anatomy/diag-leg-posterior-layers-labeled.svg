  <path d="M 608,232 L 632,232 M 608,258 L 632,258 M 608,284 L 632,284 M 608,310 L 632,310
           M 608,336 L 632,336 M 608,362 L 632,362 M 608,388 L 632,388"
        stroke="#33465c" stroke-width="1.2"/>

