  <path d="M 205,394 L 245,394 L 241,488 L 209,488 Z" fill="#8fa89a" stroke="#c3d6c9" stroke-width="1.6"/>
  <path d="M 194,488 L 256,488 L 266,522 L 184,522 Z" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <text x="225" y="538" fill="#7b8ea3" font-size="9.5" text-anchor="middle" class="kr">발꿈치뼈 calcaneus</text>

  <!-- 지시선 -->
  <path d="M 152,232 L 182,246" fill="none" stroke="#5d7089" stroke-width="1.1"/>
  <path d="M 302,232 L 270,246" fill="none" stroke="#5d7089" stroke-width="1.1"/>
  <path d="M 132,394 L 149,381" fill="none" stroke="#5d7089" stroke-width="1.1"/>
  <path d="M 302,450 L 240,452" fill="none" stroke="#5d7089" stroke-width="1.1"/>
  <path d="M 118,176 L 161,185" fill="none" stroke="#5d7089" stroke-width="1.1"/>

  <!-- 라벨 -->
  <text x="38" y="224" fill="#a8e6c4" font-size="11.5" class="kr">장딴지근 가쪽갈래</text>
  <text x="38" y="237" fill="#7f9bb0" font-size="9">gastrocnemius, lat. head</text>
  <text x="306" y="224" fill="#a8e6c4" font-size="11.5" class="kr">장딴지근 안쪽갈래</text>
  <text x="306" y="237" fill="#7f9bb0" font-size="9">gastrocnemius, med. head</text>
  <text x="38" y="396" fill="#9cc9ef" font-size="11.5" class="kr">가자미근</text>
  <text x="38" y="409" fill="#7f9bb0" font-size="9">soleus · 무릎 아래 기시</text>
  <text x="306" y="446" fill="#dbe7de" font-size="11.5" class="kr">발꿈치힘줄</text>
  <text x="306" y="459" fill="#7f9bb0" font-size="9">calcaneal tendon</text>
  <text x="38" y="170" fill="#a8e6c4" font-size="11.5" class="kr">장딴지빗근</text>
  <text x="38" y="183" fill="#7f9bb0" font-size="9">plantaris</text>
  <text x="306" y="300" fill="#6f8299" font-size="9.5">장딴지근 = 무릎 <tspan fill="#a8e6c4">위</tspan> 기시</text>
  <text x="306" y="314" fill="#6f8299" font-size="9.5">→ 무릎 굽힘에도 관여</text>
  <text x="306" y="336" fill="#6f8299" font-size="9.5">가자미근 = 무릎 <tspan fill="#9cc9ef">아래</tspan> 기시</text>
  <text x="306" y="350" fill="#6f8299" font-size="9.5">→ "제2의 심장"(정맥펌프)</text>

  <!-- ============================================================= 깊은층 패널 -->
  <rect x="460" y="100" width="390" height="445" fill="none" stroke="#2c4159" stroke-width="1.4" rx="6"/>
  <text x="474" y="122" fill="#d69a72" font-size="13" class="kr">깊은층 <tspan fill="#6f8299" font-size="10" font-weight="400">deep — 발바닥에서 교차한다</tspan></text>

  <!-- 뼈 -->
  <circle cx="626" cy="152" r="24" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
