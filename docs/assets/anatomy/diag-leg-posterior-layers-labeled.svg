<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="종아리 뒤칸 — 얕은층과 깊은층 근육, 정강신경·뒤정강동맥·종아리동맥의 주행, 안쪽복사 뒤 통과 순서를 그린 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn). 오른쪽 다리를 뒤에서 본 구도 — 가쪽 = 화면 왼쪽.
       근거: 3회차(0825) 실습영상 §종아리 뒤부위 + 3회차 종합정리(anatomy-2026-0022) 5절 근육표.
       카데바 사진을 본뜬 것이 아니라 교과식 구도로 새로 그린 도식이다(Lane A).
       핵심 ① 얕은층 = 장딴지근 두 갈래 + 가자미근 + 장딴지빗근 → 발꿈치힘줄 한 점으로 모인다
             ② 깊은층 = 오금근 + 뒤정강근(가장 깊음) + FDL(안쪽 기시) + FHL(가쪽 기시) → 발바닥에서 교차
             ③ 두 층 모두 정강신경 지배 · 혈류는 뒤정강동맥(+종아리동맥)
             ④ 안쪽복사 뒤 앞→뒤 순서 Tom, Dick ANd Harry. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">종아리 뒤칸 — 두 층, 한 신경
    <tspan fill="#93a4b7" font-size="12" font-weight="400">posterior compartment of leg</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과식 구도) · 근거: 3회차 실습영상 §종아리 뒤부위 · 오른쪽 다리를 뒤에서 본 모습</text>
  <text x="20" y="68" fill="#6f8299" font-size="11">얕은층 <tspan fill="#7fd3a4">초록</tspan> / 깊은층 <tspan fill="#d69a72">주황</tspan> / 신경 <tspan fill="#9cc3ff">파랑</tspan> / 동맥 <tspan fill="#e0645f">빨강</tspan> · 힘줄 <tspan fill="#c3d6c9">회백</tspan></text>
  <text x="20" y="86" fill="#5d6f83" font-size="10">← 가쪽 lateral   |   안쪽 medial →      ※ 두 층 모두 <tspan fill="#9cc3ff">정강신경 tibial n.</tspan> 지배 — 앞칸(깊은종아리) · 가쪽칸(얕은종아리)과 대비</text>

  <!-- ============================================================= 얕은층 패널 -->
  <rect x="30" y="100" width="390" height="445" fill="none" stroke="#2c4159" stroke-width="1.4" rx="6"/>
  <text x="44" y="122" fill="#7fd3a4" font-size="13" class="kr">얕은층 <tspan fill="#6f8299" font-size="10" font-weight="400">superficial — 발꿈치힘줄로 모인다</tspan></text>

  <!-- 뼈 -->
  <circle cx="196" cy="152" r="24" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <circle cx="254" cy="152" r="24" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <text x="225" y="140" fill="#7b8ea3" font-size="9.5" text-anchor="middle" class="kr">넙다리뼈 관절융기</text>
  <path d="M 202,182 L 250,182 L 244,500 L 208,500 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <ellipse cx="168" cy="196" rx="15" ry="12" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <path d="M 159,208 L 178,208 L 174,500 L 161,500 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>

  <!-- 가자미근 (깊게 있지만 가장자리가 보인다) -->
  <path d="M 150,242 C 137,318 145,382 168,424 L 282,424 C 305,382 313,318 300,242
           C 300,242 270,226 225,226 C 180,226 150,242 150,242 Z"
        fill="#35597a" stroke="#79a8d0" stroke-width="1.6"/>
