  <!-- 라벨 -->
  <text x="730" y="196" fill="#e8b48f" font-size="11.5" class="kr">오금근 <tspan fill="#7f9bb0" font-size="9" font-weight="400">popliteus</tspan></text>
  <text x="730" y="209" fill="#6f8299" font-size="9">무릎 잠금 해제</text>
  <text x="468" y="266" fill="#e8b48f" font-size="11.5" class="kr">뒤정강근 <tspan fill="#7f9bb0" font-size="9" font-weight="400">tibialis post.</tspan></text>
  <text x="468" y="279" fill="#6f8299" font-size="9">가장 깊음 · 발바닥활 유지</text>
  <text x="730" y="316" fill="#e8b48f" font-size="11.5" class="kr">긴발가락굽힘근 <tspan fill="#7f9bb0" font-size="9" font-weight="400">FDL</tspan></text>
  <text x="730" y="329" fill="#6f8299" font-size="9">안쪽(정강뼈)에서 기시</text>
  <text x="468" y="336" fill="#e8b48f" font-size="11.5" class="kr">긴엄지굽힘근 <tspan fill="#7f9bb0" font-size="9" font-weight="400">FHL</tspan></text>
