  <rect x="26" y="832" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="852" fill="#7fd4a8" font-size="12" class="kr">9회차의 혈관</text>
  <rect x="232" y="336" width="174" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="356" fill="#e0645f" font-size="12" class="kr">겨드랑동맥 ★</text>
  <text x="242" y="371" fill="#c98a86" font-size="9">axillary a.</text>
  <text x="242" y="382" fill="#6f8299" font-size="9">첫째갈비뼈 가쪽모서리 ~ 큰원근</text>
  <text x="242" y="393" fill="#6f8299" font-size="9">아래모서리</text>
  <rect x="232" y="789" width="174" height="44" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="809" fill="#7fd4a8" font-size="12" class="kr">허파순환·기관지동맥 ★</text>
  <text x="242" y="824" fill="#5fae87" font-size="9">pulmonary &amp; bronchial vessels</text>
  <rect x="232" y="1081" width="174" height="66" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="1101" fill="#b49ae0" font-size="12" class="kr">홀정맥계통 ★</text>
  <text x="242" y="1116" fill="#8f79b8" font-size="9">azygos system</text>
  <text x="242" y="1127" fill="#6f8299" font-size="9">가슴벽의 피를 위대정맥으로</text>
  <text x="242" y="1138" fill="#6f8299" font-size="9">되돌린다</text>
  <rect x="232" y="1300" width="174" height="66" rx="7" fill="#2c2542" stroke="#584a76" stroke-width="1.3"/>
  <text x="242" y="1320" fill="#b49ae0" font-size="12" class="kr">가슴림프관 ★</text>
  <text x="242" y="1335" fill="#8f79b8" font-size="9">thoracic duct</text>
  <text x="242" y="1346" fill="#6f8299" font-size="9">가슴우리 오른쪽에서 시작해 T5에서</text>
  <text x="242" y="1357" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">왼쪽으로</tspan> 건넌다</text>
  <rect x="432" y="93" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="113" fill="#e0645f" font-size="12" class="kr">1부 (가지 1) ★</text>
  <text x="442" y="128" fill="#c98a86" font-size="9">medial to pec. minor</text>
  <rect x="432" y="206" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="226" fill="#e0645f" font-size="12" class="kr">2부 (가지 2) ★</text>
  <text x="442" y="240" fill="#c98a86" font-size="9">posterior to pec. minor</text>
  <rect x="432" y="436" width="170" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="442" y="456" fill="#e0645f" font-size="12" class="kr">3부 (가지 3) ★</text>
  <text x="442" y="470" fill="#c98a86" font-size="9">lateral to pec. minor</text>
  <rect x="432" y="595" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="615" fill="#e0645f" font-size="12" class="kr">→ 위팔동맥 ★</text>
  <text x="442" y="630" fill="#c98a86" font-size="9">brachial a.</text>
  <text x="442" y="641" fill="#6f8299" font-size="9">큰원근 아래모서리에서 이름이</text>
  <text x="442" y="652" fill="#6f8299" font-size="9">바뀐다</text>
  <rect x="432" y="670" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="690" fill="#e0645f" font-size="12" class="kr">허파동맥줄기 ★</text>
  <text x="442" y="705" fill="#c98a86" font-size="9">pulmonary trunk</text>
  <text x="442" y="716" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">정맥혈</tspan>을 허파로</text>
  <rect x="432" y="734" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="754" fill="#b49ae0" font-size="12" class="kr">허파정맥 4개 ★</text>
  <text x="442" y="769" fill="#8f79b8" font-size="9">pulmonary vv.</text>
  <text x="442" y="780" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">동맥혈</tspan>을 왼심방으로 · 구역 사이를</text>
  <text x="442" y="791" fill="#6f8299" font-size="9">달린다</text>
  <rect x="432" y="809" width="170" height="88" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="829" fill="#e0645f" font-size="12" class="kr">기관지동맥 ★</text>
  <text x="442" y="844" fill="#c98a86" font-size="9">bronchial aa.</text>
  <text x="442" y="855" fill="#6f8299" font-size="9">오른 1개(대개 3번</text>
  <text x="442" y="866" fill="#6f8299" font-size="9">뒤갈비사이동맥에서) · 왼</text>
  <text x="442" y="877" fill="#6f8299" font-size="9">2개(가슴대동맥에서) — 허파조직</text>
  <text x="442" y="888" fill="#6f8299" font-size="9">자체를 먹인다</text>
  <rect x="432" y="906" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="926" fill="#b49ae0" font-size="12" class="kr">기관지정맥</text>
  <text x="442" y="941" fill="#8f79b8" font-size="9">bronchial vv.</text>
  <text x="442" y="952" fill="#6f8299" font-size="9">오른→홀정맥 · 왼→반홀정맥</text>
  <rect x="432" y="970" width="170" height="77" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="990" fill="#b49ae0" font-size="12" class="kr">홀정맥 ★</text>
  <text x="442" y="1005" fill="#8f79b8" font-size="9">azygos v.</text>
  <text x="442" y="1016" fill="#6f8299" font-size="9">오른허리올림정맥 + 오른갈비밑정맥</text>
  <text x="442" y="1027" fill="#6f8299" font-size="9">→ 오른쪽을 올라 <tspan fill="#e6edf3" font-weight="700">T4에서 활을 그려</tspan></text>
  <text x="442" y="1038" fill="#6f8299" font-size="9">위대정맥으로</text>
  <rect x="432" y="1056" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1076" fill="#b49ae0" font-size="12" class="kr">반홀정맥 ★</text>
  <text x="442" y="1091" fill="#8f79b8" font-size="9">hemiazygos v.</text>
  <text x="442" y="1102" fill="#6f8299" font-size="9">왼쪽 아래(T9–T11) → <tspan fill="#e6edf3" font-weight="700">T9에서</tspan></text>
  <text x="442" y="1113" fill="#6f8299" font-size="9">건너가<tspan fill="#e6edf3" font-weight="700"> 홀정맥으로</tspan></text>
  <rect x="432" y="1131" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1151" fill="#b49ae0" font-size="12" class="kr">덧반홀정맥 ★</text>
  <text x="442" y="1166" fill="#8f79b8" font-size="9">accessory hemiazygos v.</text>
  <text x="442" y="1177" fill="#6f8299" font-size="9">왼쪽 위(T5–T8) → T8에서 건너간다</text>
  <rect x="432" y="1195" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1215" fill="#b49ae0" font-size="12" class="kr">대정맥 우회로 ★</text>
  <text x="442" y="1230" fill="#8f79b8" font-size="9">cavocaval anastomosis</text>
  <text x="442" y="1241" fill="#6f8299" font-size="9">아래대정맥이 막히면 이 길이</text>
  <text x="442" y="1252" fill="#6f8299" font-size="9">커진다</text>
  <rect x="432" y="1270" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1290" fill="#b49ae0" font-size="12" class="kr">왼정맥각 ★</text>
  <text x="442" y="1305" fill="#8f79b8" font-size="9">left venous angle</text>
  <text x="442" y="1316" fill="#6f8299" font-size="9">왼속목정맥 + 왼빗장밑정맥이</text>
  <text x="442" y="1327" fill="#6f8299" font-size="9">만나는 자리 — 종착</text>
  <rect x="432" y="1345" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="1365" fill="#b49ae0" font-size="12" class="kr">오른림프관</text>
  <text x="442" y="1380" fill="#8f79b8" font-size="9">right lymphatic duct</text>
  <text x="442" y="1391" fill="#6f8299" font-size="9">오른쪽 위반신만 · 오른정맥각으로</text>
  <rect x="628" y="92" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="112" fill="#e0645f" font-size="12" class="kr">위가슴동맥</text>
  <text x="638" y="127" fill="#c98a86" font-size="9">superior thoracic a.</text>
  <text x="638" y="138" fill="#6f8299" font-size="9">1–2번 갈비사이</text>
  <rect x="628" y="156" width="160" height="77" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="176" fill="#e0645f" font-size="12" class="kr">가슴봉우리동맥 ★</text>
  <text x="638" y="191" fill="#c98a86" font-size="9">thoracoacromial a.</text>
  <text x="638" y="202" fill="#6f8299" font-size="9">네 가지:</text>
  <text x="638" y="213" fill="#6f8299" font-size="9">봉우리·빗장·어깨세모·가슴 —</text>
  <text x="638" y="224" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">ABCD</tspan></text>
  <rect x="628" y="242" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="262" fill="#e0645f" font-size="12" class="kr">가쪽가슴동맥 ★</text>
  <text x="638" y="277" fill="#c98a86" font-size="9">lateral thoracic a.</text>
  <text x="638" y="288" fill="#6f8299" font-size="9">앞톱니근·유방 가쪽</text>
  <rect x="628" y="336" width="160" height="55" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="638" y="356" fill="#e0645f" font-size="12" class="kr">어깨밑동맥 ★</text>
  <text x="638" y="371" fill="#c98a86" font-size="9">subscapular a.</text>
  <text x="638" y="382" fill="#6f8299" font-size="9">겨드랑동맥의 <tspan fill="#e6edf3" font-weight="700">가장 굵은</tspan> 가지</text>
  <rect x="628" y="445" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="465" fill="#e0645f" font-size="12" class="kr">뒤위팔휘돌이동맥 ★</text>
  <text x="638" y="480" fill="#c98a86" font-size="9">post. circumflex humeral a.</text>
  <text x="638" y="491" fill="#6f8299" font-size="9">겨드랑신경과 함께 <tspan fill="#e6edf3" font-weight="700">네모공간</tspan>을</text>
  <text x="638" y="502" fill="#6f8299" font-size="9">지난다</text>
  <rect x="628" y="520" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="638" y="540" fill="#e0645f" font-size="12" class="kr">앞위팔휘돌이동맥</text>
  <text x="638" y="555" fill="#c98a86" font-size="9">ant. circumflex humeral a.</text>
  <text x="638" y="566" fill="#6f8299" font-size="9">위팔뼈 외과목 앞 ·</text>
  <text x="638" y="577" fill="#6f8299" font-size="9">위팔두갈래근 긴갈래에 가지</text>
  <rect x="814" y="306" width="160" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="326" fill="#e0645f" font-size="12" class="kr">가슴등동맥</text>
  <text x="824" y="341" fill="#c98a86" font-size="9">thoracodorsal a.</text>
  <text x="824" y="352" fill="#6f8299" font-size="9">넓은등근</text>
  <rect x="814" y="370" width="160" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="824" y="390" fill="#e0645f" font-size="12" class="kr">어깨휘돌이동맥 ★</text>
  <text x="824" y="405" fill="#c98a86" font-size="9">circumflex scapular a.</text>
  <text x="824" y="416" fill="#6f8299" font-size="9">세모공간을 지나 어깨뼈 뒤</text>
  <text x="824" y="427" fill="#6f8299" font-size="9">문합에 낀다</text>
  <line x1="26" y1="1410" x2="1000" y2="1410" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1422" fill="#93a4b7" font-size="10.5">겨드랑동맥의 부(part) 번호 = 작은가슴근 기준 <tspan fill="#e6edf3" font-weight="700">안쪽 1 · 뒤 2 · 가쪽 3</tspan> 이고 가지 수도 1–2–3개다.</text>
  <text x="26" y="1440" fill="#93a4b7" font-size="10.5">홀정맥은 위대정맥으로, 가슴림프관은 <tspan fill="#e6edf3" font-weight="700">왼정맥각</tspan>으로 — 액체 둘의 종착이 다르다.</text>
</svg>
