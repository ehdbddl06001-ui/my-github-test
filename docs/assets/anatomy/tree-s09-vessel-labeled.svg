<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 1474" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="겨드랑동맥과 홀정맥계통 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 9회차 실습주제 + e-Anatomy Upper limb — Axilla · Thorax — Posterior mediastinum -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="1026" height="1474" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">겨드랑동맥과 홀정맥계통<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> axillary artery &amp; azygos system</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">9회차 · 근육이 동맥을 셋으로 나누고, 홀정맥이 가슴의 피를 되받는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
