  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과서식 구도) 퀴즈판 · 뼈·장기 라벨만 제공 · 앞(두덩뼈)=왼쪽 / 뒤(엉치뼈)=오른쪽</text>
