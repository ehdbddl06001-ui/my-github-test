  <text x="34" y="619" fill="#93a4b7" font-size="11">힌트 — ① 방광 쪽 첫 가지 ② 엉치뼈 앞면·보통 2개 ③ 큰궁둥구멍 윗부분으로 나감 ④ 큰궁둥구멍 아랫부분·궁둥뼈가시 바로 위 ⑤ 폐쇄관으로 신경과 동행</text>
  <text x="34" y="637" fill="#5d6f83" font-size="11">정답·해설은 문항 카드(anatomy-2026-0013)의 정답 영역에 분리 저장 — 라벨판과 비교해서 채점하기.</text>
