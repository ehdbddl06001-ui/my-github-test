<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="어깨뼈부위 3공간 태깅 퀴즈판 — 번호핀 7개, 라벨 제거">
  <!-- 자체 제작 도해(claude-drawn). 오른쪽 어깨를 뒤에서 본 구도.
       근거: 3회차(0825) 실습영상 §어깨뼈부위 + 3회차 종합정리(anatomy-2026-0022).
       핵심: 위·아래 경계는 작은원근/큰원근으로 공통, 가르는 것은 위팔세갈래근 긴갈래.
       긴갈래 안쪽 = 세모공간, 가쪽 = 네모공간, 큰원근 아래 = 세모간격. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
    .pin{stroke:none}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <!-- ================= 뼈 ================= -->
  <!-- 어깨뼈 -->
  <path d="M 60,150 L 214,176 L 236,300 L 206,318 L 150,404 L 96,300 Z"
        fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <path d="M 62,196 L 226,214" stroke="#3d5166" stroke-width="7"/>
  <!-- 접시오목 아래결절 -->
  <circle cx="232" cy="292" r="6" fill="#0e1826" stroke="#5b7690" stroke-width="2"/>
  <!-- 위팔뼈 -->
  <circle cx="272" cy="238" r="34" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <path d="M 258,268 C 250,300 254,340 262,392 L 306,392 C 300,340 298,300 304,268 Z"
        fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <path d="M 262,392 C 268,450 276,500 282,548 L 320,548 C 314,500 308,450 306,392 Z"
        fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <!-- ================= 근육 ================= -->
  <!-- 작은원근 (위 경계) -->
  <path d="M 214,262 C 234,250 250,240 268,232 L 276,258 C 256,266 238,276 222,288 Z"
        fill="#2f5a44" stroke="#5aa87f" stroke-width="1.6"/>
  <!-- 큰원근 (아래 경계) -->
  <path d="M 186,348 C 216,330 244,318 268,310 L 276,338 C 250,346 224,358 198,376 Z"
        fill="#2f5a44" stroke="#5aa87f" stroke-width="1.6"/>
  <!-- 위팔세갈래근 긴갈래 (세로 기둥) -->
  <path d="M 222,296 C 218,340 220,392 226,446 L 254,442 C 248,390 246,340 250,300 Z"
        fill="#3d5f7f" stroke="#79a8d0" stroke-width="1.6"/>

  <!-- ================= 3공간 ================= -->
  <!-- 세모공간 (긴갈래 안쪽) -->
  <path d="M 206,300 C 200,320 196,340 192,352 C 206,344 216,336 220,326 C 220,316 214,306 206,300 Z"
        fill="#4a3520" stroke="#c08a45" stroke-width="1.6" opacity="0.95"/>
  <!-- 네모공간 (긴갈래 가쪽) -->
  <path d="M 252,288 C 268,282 274,278 276,268 L 276,318 C 272,314 262,300 252,296 Z"
        fill="#5c2b2b" stroke="#c96b66" stroke-width="1.6" opacity="0.95"/>
  <!-- 세모간격 (큰원근 아래) -->
  <path d="M 236,392 C 248,382 262,376 276,372 L 288,404 C 268,408 250,414 238,422 Z"
        fill="#3d3050" stroke="#9578c4" stroke-width="1.6" opacity="0.95"/>

  <!-- 통과 구조물 -->
  <!-- 네모공간: 겨드랑신경 + 뒤위팔휘돌이동맥 -->
  <path d="M 240,286 C 268,282 296,290 318,306" fill="none" stroke="#9cc3ff" stroke-width="3.4"/>
  <path d="M 240,300 C 270,298 298,308 320,324" fill="none" stroke="#e0645f" stroke-width="3"/>
  <!-- 세모공간: 어깨휘돌이동맥 -->
  <path d="M 216,322 C 190,334 166,344 140,348" fill="none" stroke="#e0645f" stroke-width="3"/>
  <!-- 세모간격: 노신경 + 깊은위팔동맥 -->
  <path d="M 252,398 C 282,398 306,414 322,444" fill="none" stroke="#9cc3ff" stroke-width="3.4"/>
  <path d="M 250,412 C 280,414 302,430 316,458" fill="none" stroke="#e0645f" stroke-width="3"/>

  <!-- 공간 라벨 -->
  <!-- ===== 개념 인셋: 세 공간의 배치 ===== -->
  
  <!-- ================= 오른쪽: 경계 표 ================= -->
  
  <!-- ================= 오른쪽 아래: 어깨동맥그물 + 임상 ================= -->
  
  <!-- ================= 하단 요약 ================= -->
  
  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">어깨뼈부위 3공간 — 태깅 연습판<tspan fill="#93a4b7" font-size="12" font-weight="400"> scapular spaces — quiz</tspan></text><text x="20" y="50" fill="#93a4b7" font-size="11">오른쪽 어깨를 뒤에서 본 모습. ①~③은 <tspan fill="#e6edf3">경계 근육</tspan>, ④·⑥·⑦은 <tspan fill="#e6edf3">공간 이름과 통과 구조물</tspan>, ⑤는 지나가는 신경이다.</text><text x="20" y="68" fill="#6f8299" font-size="11">정답은 대응 문항 카드(anatomy-2026-0031) frontmatter에 있다.</text><circle cx="244" cy="250" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="244" y="255" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">1</text><circle cx="196" cy="360" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="196" y="365" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">2</text><circle cx="240" cy="440" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="240" y="445" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">3</text><circle cx="268" cy="306" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="268" y="311" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">4</text><circle cx="312" cy="306" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="312" y="311" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">5</text><circle cx="207" cy="326" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="207" y="331" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">6</text><circle cx="258" cy="402" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="258" y="407" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" class="pin">7</text><rect x="536" y="96" width="326" height="300" rx="10" fill="#121e2e" stroke="#2b3a4d"/><text x="552" y="120" fill="#93a4b7" font-size="12" font-weight="700">답안 칸</text><text x="552" y="152" fill="#eab308" font-size="12" font-weight="700">1.</text><line x1="572" y1="154" x2="846" y2="154" stroke="#3d5166" stroke-width="1.2"/><text x="552" y="184" fill="#eab308" font-size="12" font-weight="700">2.</text><line x1="572" y1="186" x2="846" y2="186" stroke="#3d5166" stroke-width="1.2"/><text x="552" y="216" fill="#eab308" font-size="12" font-weight="700">3.</text><line x1="572" y1="218" x2="846" y2="218" stroke="#3d5166" stroke-width="1.2"/><text x="552" y="248" fill="#eab308" font-size="12" font-weight="700">4.</text><line x1="572" y1="250" x2="846" y2="250" stroke="#3d5166" stroke-width="1.2"/><text x="552" y="280" fill="#eab308" font-size="12" font-weight="700">5.</text><line x1="572" y1="282" x2="846" y2="282" stroke="#3d5166" stroke-width="1.2"/><text x="552" y="312" fill="#eab308" font-size="12" font-weight="700">6.</text><line x1="572" y1="314" x2="846" y2="314" stroke="#3d5166" stroke-width="1.2"/><text x="552" y="344" fill="#eab308" font-size="12" font-weight="700">7.</text><line x1="572" y1="346" x2="846" y2="346" stroke="#3d5166" stroke-width="1.2"/>
</svg>
