<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="골반가로막 spotter 퀴즈판 — 번호가 가리키는 구조 이름 맞히기 (자체 제작 도해)">
  <!-- 자체 제작 도해(claude-drawn) 퀴즈판: 근육·구멍 라벨을 번호핀 ①~⑤로 대체.
       번호 배정은 anatomy-2026-0014 문항 카드와 1:1 — ①두덩곧창자근 ②비뇨생식구멍 ③항문올림근힘줄활 ④엉덩꼬리근 ⑤꼬리근 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3.5px;stroke-linejoin:round}</style>
  <rect width="880" height="660" fill="#0e1826"/>
  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">Spotter — 번호 ①~⑤ 구조의 이름은?
    <tspan fill="#93a4b7" font-size="12" font-weight="400">pelvic diaphragm, superior view</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과서식 구도) 퀴즈판 · 뼈·기준 구조 라벨만 제공 · 앞(두덩결합)=위 / 뒤(엉치·꼬리뼈)=아래</text>
  <text x="410" y="72" fill="#5d6f83" font-size="11">▲ 앞 anterior</text>

  <!-- 골반 테두리 -->
  <path d="M 440 95 C 560 95 690 150 720 280 C 735 370 690 450 620 500 C 560 545 500 560 440 560 C 380 560 320 545 260 500 C 190 450 145 370 160 280 C 190 150 320 95 440 95 Z"
        fill="#101c2b" stroke="#3d5166" stroke-width="4"/>
  <rect x="418" y="96" width="44" height="30" rx="8" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="330" y="88" fill="#8fa3b8" font-size="12" font-weight="700">두덩결합</text>
  <text x="252" y="102" fill="#5d6f83" font-size="10">pubic symphysis</text>
  <path d="M 388 92 L 416 104" stroke="#4a5b6e" stroke-width="1"/>

  <!-- ===== 좌우 대칭 절반 (라벨판과 동일 지오메트리) ===== -->
  <g id="halfL">
    <path d="M 236 168 C 196 230 178 310 192 390 C 198 420 208 442 220 460" fill="none" stroke="#3d5166" stroke-width="26"/>
    <path d="M 236 168 C 196 230 178 310 192 390 C 198 420 208 442 220 460" fill="none" stroke="#54708c" stroke-width="3"/>
    <circle cx="336" cy="150" r="7" fill="#eab308"/>
    <circle cx="214" cy="418" r="7" fill="#eab308"/>
    <path d="M 336 150 C 272 226 228 320 214 418" fill="none" stroke="#eab308" stroke-width="3" stroke-dasharray="8 5"/>
    <path d="M 414 140 C 398 240 400 330 416 366 C 424 380 432 388 440 390" fill="none" stroke="#7fb3f6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 424 142 C 410 240 412 322 424 354 C 430 366 436 372 440 374" fill="none" stroke="#7fb3f6" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 398 142 C 358 262 386 414 436 486" fill="none" stroke="#5f8fd6" stroke-width="6" stroke-linecap="round"/>
    <path d="M 386 148 C 344 268 376 420 432 496" fill="none" stroke="#5f8fd6" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 330 208 C 380 320 410 420 438 468" fill="none" stroke="#41729f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 298 258 C 360 360 404 440 438 482" fill="none" stroke="#41729f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 270 308 C 344 396 400 456 438 494" fill="none" stroke="#41729f" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 246 358 C 330 430 396 472 438 506" fill="none" stroke="#41729f" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 220 424 C 290 470 360 500 428 512" fill="none" stroke="#31567d" stroke-width="7" stroke-linecap="round"/>
    <path d="M 214 436 C 286 482 356 512 424 524" fill="none" stroke="#31567d" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M 414 544 C 340 552 268 540 216 506" fill="none" stroke="#46586c" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <path d="M 420 556 C 340 566 262 556 206 522" fill="none" stroke="#46586c" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>
  <use href="#halfL" transform="translate(880 0) scale(-1 1)"/>

  <path d="M 440 366 L 440 466" stroke="#2f4a72" stroke-width="7"/>
  <ellipse cx="440" cy="478" rx="12" ry="14" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <path d="M 396 560 C 402 522 418 498 440 490 C 462 498 478 522 484 560 Z" fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <text x="330" y="466" fill="#8fa3b8" font-size="11" font-weight="700">꼬리뼈</text>
  <text x="330" y="479" fill="#5d6f83" font-size="9">coccyx</text>
  <path d="M 366 470 L 426 476" stroke="#4a5b6e" stroke-width="1"/>
  <text x="496" y="556" fill="#8fa3b8" font-size="11" font-weight="700">엉치뼈</text>
  <text x="496" y="569" fill="#5d6f83" font-size="9">sacrum</text>

  <!-- 구멍들 -->
  <ellipse cx="440" cy="212" rx="27" ry="54" fill="none" stroke="#c9bcff" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="440" cy="185" r="9" fill="#0e1826" stroke="#9cc3ff" stroke-width="2"/>
  <ellipse cx="440" cy="243" rx="7" ry="17" fill="#0e1826" stroke="#9cc3ff" stroke-width="2"/>
  <circle cx="440" cy="343" r="17" fill="#0e1826" stroke="#9cc3ff" stroke-width="2.5"/>
  <text x="474" y="189" fill="#9cc3ff" font-size="10">요도 urethra</text>
  <text x="474" y="246" fill="#9cc3ff" font-size="10">질 vagina</text>
  <text x="482" y="348" fill="#9cc3ff" font-size="11" font-weight="700">항문관 <tspan font-weight="400" font-size="9" fill="#6f87a3">anal canal</tspan></text>

  <!-- 기준 라벨(정답 아님) -->
  <text x="120" y="126" fill="#eab308" font-size="12" font-weight="700">폐쇄관</text>
  <text x="120" y="139" fill="#b7962e" font-size="10">obturator canal</text>
  <path d="M 186 130 L 330 148" stroke="#8b7a2e" stroke-width="1"/>
  <text x="34" y="248" fill="#8fa3b8" font-size="12" font-weight="700">속폐쇄근 + 속폐쇄근막</text>
  <text x="34" y="261" fill="#5d6f83" font-size="10">obturator internus &amp; fascia</text>
  <path d="M 116 268 L 196 292" stroke="#4a5b6e" stroke-width="1"/>
  <text x="70" y="452" fill="#eab308" font-size="12" font-weight="700">궁둥뼈가시</text>
  <text x="70" y="465" fill="#b7962e" font-size="10">ischial spine</text>
  <path d="M 140 444 L 208 422" stroke="#8b7a2e" stroke-width="1"/>

  <!-- ===== 번호핀 ===== -->
  <!-- ① 두덩곧창자근 -->
  <circle cx="566" cy="176" r="14" fill="#eab308"/>
  <text x="566" y="181" fill="#0e1826" font-size="15" font-weight="800" text-anchor="middle" stroke="none">1</text>
  <path d="M 552 180 L 460 218" stroke="#eab308" stroke-width="1.5"/>
  <!-- ② 비뇨생식구멍 -->
  <circle cx="336" cy="110" r="14" fill="#eab308"/>
  <text x="336" y="115" fill="#0e1826" font-size="15" font-weight="800" text-anchor="middle" stroke="none">2</text>
  <path d="M 348 118 L 420 168" stroke="#eab308" stroke-width="1.5"/>
  <!-- ③ 항문올림근힘줄활(노란 점선) -->
  <circle cx="152" cy="330" r="14" fill="#eab308"/>
  <text x="152" y="335" fill="#0e1826" font-size="15" font-weight="800" text-anchor="middle" stroke="none">3</text>
  <path d="M 165 324 L 246 300" stroke="#eab308" stroke-width="1.5"/>
  <!-- ④ 엉덩꼬리근 -->
  <circle cx="688" cy="356" r="14" fill="#eab308"/>
  <text x="688" y="361" fill="#0e1826" font-size="15" font-weight="800" text-anchor="middle" stroke="none">4</text>
  <path d="M 674 360 L 556 388" stroke="#eab308" stroke-width="1.5"/>
  <!-- ⑤ 꼬리근 -->
  <circle cx="700" cy="444" r="14" fill="#eab308"/>
  <text x="700" y="449" fill="#0e1826" font-size="15" font-weight="800" text-anchor="middle" stroke="none">5</text>
  <path d="M 688 452 L 606 470" stroke="#eab308" stroke-width="1.5"/>

  <!-- 힌트 -->
  <rect x="20" y="600" width="840" height="46" rx="8" fill="#121f30" stroke="#22344a"/>
  <text x="34" y="619" fill="#93a4b7" font-size="11">힌트 — ① 항문관을 감싸는 가장 앞안쪽 근육 ② 그 사이 틈새 ③ 궁둥뼈가시-폐쇄관을 잇는 노란 점선 ④ 힘줄활에서 일어나는 가장 가쪽 항문올림근 ⑤ 궁둥뼈가시→꼬리뼈</text>
  <text x="34" y="637" fill="#5d6f83" font-size="11">정답·해설은 문항 카드(anatomy-2026-0014)의 정답 영역에 분리 저장 — 라벨판과 비교해서 채점하기.</text>
</svg>
