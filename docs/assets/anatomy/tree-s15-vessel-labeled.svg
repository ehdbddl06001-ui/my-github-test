<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 1154" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="코·편도·후두의 혈관과 다리 관절의 동맥 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 15회차 인제스트 섹션 a2-s15 §코중격 시상면 · §목구멍편도 · §후두절단면 · §엉덩관절 속구조 · §무릎관절 뒷면 + SESSION_DETAILS 응용과제(뇌하수체 접근법) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="1154" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">코·편도·후두의 혈관과 다리 관절의 동맥<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> head &amp; joint vessels</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">15회차 · 머리 쪽은 바깥목동맥 가지가, 넙다리뼈머리는 휘돌이동맥이, 무릎은 오금동맥의 무릎동맥 고리가 맡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,184 H 419 V 120 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,184 H 419 V 184 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,184 H 419 V 258 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,412 H 419 V 339 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,412 H 419 V 414 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,412 H 419 V 494 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,608 H 419 V 575 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,608 H 419 V 650 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,790 H 419 V 725 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,790 H 419 V 794 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,790 H 419 V 864 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,983 H 419 V 946 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,983 H 419 V 1029 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,585 H 219 V 184 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,585 H 219 V 412 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,585 H 219 V 608 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,585 H 219 V 790 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 206,585 H 219 V 983 H 232" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <rect x="26" y="566" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="586" fill="#7fd4a8" font-size="12" class="kr">15회차의 혈관</text>
  <rect x="232" y="162" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="182" fill="#e0645f" font-size="12" class="kr">코안의 동맥 ★</text>
  <text x="242" y="198" fill="#c98a86" font-size="9">arteries of the nasal cavity</text>
  <rect x="232" y="390" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="410" fill="#e0645f" font-size="12" class="kr">입천장·편도의 혈관 ★</text>
  <text x="242" y="425" fill="#c98a86" font-size="9">palate &amp; tonsil</text>
  <rect x="232" y="586" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="606" fill="#e0645f" font-size="12" class="kr">후두의 혈관 ★</text>
  <text x="242" y="621" fill="#c98a86" font-size="9">laryngeal vessels</text>
  <rect x="232" y="768" width="174" height="44" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="788" fill="#e0645f" font-size="12" class="kr">엉덩관절의 동맥 ★</text>
  <text x="242" y="803" fill="#c98a86" font-size="9">arteries of the hip joint</text>
  <rect x="232" y="950" width="174" height="66" rx="7" fill="#40201f" stroke="#7a3a38" stroke-width="1.3"/>
  <text x="242" y="970" fill="#e0645f" font-size="12" class="kr">무릎의 동맥 ★</text>
  <text x="242" y="985" fill="#c98a86" font-size="9">genicular anastomosis</text>
  <text x="242" y="996" fill="#6f8299" font-size="9">오금동맥의 무릎동맥 다섯 +</text>
  <text x="242" y="1007" fill="#6f8299" font-size="9">넙다리·정강 가지가 <tspan fill="#e6edf3" font-weight="700">고리</tspan></text>
  <rect x="432" y="92" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="112" fill="#e0645f" font-size="12" class="kr">나비입천장동맥 ★</text>
  <text x="442" y="127" fill="#c98a86" font-size="9">sphenopalatine a.</text>
  <text x="442" y="138" fill="#6f8299" font-size="9">위턱동맥의 끝 — <tspan fill="#e6edf3" font-weight="700">뒤 코피</tspan>의 주범</text>
  <rect x="432" y="156" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="176" fill="#e0645f" font-size="12" class="kr">앞·뒤벌집동맥</text>
  <text x="442" y="191" fill="#c98a86" font-size="9">ant. / post. ethmoidal aa.</text>
  <text x="442" y="202" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">눈동맥</tspan>(속목동맥계) — 위쪽 코안</text>
  <rect x="432" y="220" width="170" height="77" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="240" fill="#e0645f" font-size="12" class="kr">Kiesselbach 부위 ★</text>
  <text x="442" y="255" fill="#c98a86" font-size="9">Kiesselbach's area</text>
  <text x="442" y="266" fill="#6f8299" font-size="9">코중격 <tspan fill="#e6edf3" font-weight="700">앞아래</tspan> —</text>
  <text x="442" y="277" fill="#6f8299" font-size="9">나비입천장·앞벌집·큰입천장·윗입술</text>
  <text x="442" y="288" fill="#6f8299" font-size="9">동맥 문합</text>
  <rect x="432" y="306" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="326" fill="#e0645f" font-size="12" class="kr">큰입천장동맥 ★</text>
  <text x="442" y="341" fill="#c98a86" font-size="9">greater palatine a.</text>
  <text x="442" y="352" fill="#6f8299" font-size="9">큰입천장구멍 → 단단입천장 앞으로</text>
  <text x="442" y="363" fill="#6f8299" font-size="9">→ <tspan fill="#e6edf3" font-weight="700">앞니관</tspan>으로 코중격</text>
  <rect x="432" y="381" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="401" fill="#e0645f" font-size="12" class="kr">얼굴동맥 편도가지 ★</text>
  <text x="442" y="416" fill="#c98a86" font-size="9">tonsillar br. of facial a.</text>
  <text x="442" y="427" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">위인두수축근</tspan>을 뚫고 편도로 —</text>
  <text x="442" y="438" fill="#6f8299" font-size="9">편도의 주동맥</text>
  <rect x="432" y="456" width="170" height="77" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="476" fill="#b49ae0" font-size="12" class="kr">편도바깥정맥 ★</text>
  <text x="442" y="491" fill="#8f79b8" font-size="9">external palatine</text>
  <text x="442" y="502" fill="#8f79b8" font-size="9">(paratonsillar) v.</text>
  <text x="442" y="513" fill="#6f8299" font-size="9">편도 바깥면 → 인두정맥얼기 —</text>
  <text x="442" y="524" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">편도절제 출혈</tspan></text>
  <rect x="432" y="542" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="562" fill="#e0645f" font-size="12" class="kr">위후두동맥 ★</text>
  <text x="442" y="577" fill="#c98a86" font-size="9">superior laryngeal a.</text>
  <text x="442" y="588" fill="#6f8299" font-size="9">위갑상동맥 가지 — <tspan fill="#e6edf3" font-weight="700">속후두신경과</tspan></text>
  <text x="442" y="599" fill="#6f8299" font-size="9">함께 방패목뿔막<tspan fill="#e6edf3" font-weight="700">을 뚫는다</tspan></text>
  <rect x="432" y="617" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="637" fill="#e0645f" font-size="12" class="kr">아래후두동맥</text>
  <text x="442" y="652" fill="#c98a86" font-size="9">inferior laryngeal a.</text>
  <text x="442" y="663" fill="#6f8299" font-size="9">아래갑상동맥 가지 —</text>
  <text x="442" y="674" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">아래후두신경과 함께</tspan></text>
  <rect x="432" y="692" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="712" fill="#e0645f" font-size="12" class="kr">안쪽넙다리휘돌이동맥 ★</text>
  <text x="442" y="727" fill="#c98a86" font-size="9">medial circumflex femoral a.</text>
  <text x="442" y="738" fill="#6f8299" font-size="9">넙다리뼈 목 뒤 <tspan fill="#e6edf3" font-weight="700">고리지지띠동맥</tspan> —</text>
  <text x="442" y="749" fill="#6f8299" font-size="9">머리의 주공급</text>
  <rect x="432" y="767" width="170" height="55" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="787" fill="#e0645f" font-size="12" class="kr">가쪽넙다리휘돌이동맥</text>
  <text x="442" y="802" fill="#c98a86" font-size="9">lateral circumflex femoral a.</text>
  <text x="442" y="813" fill="#6f8299" font-size="9">목 앞 — 안쪽 것과 고리를 만든다</text>
  <rect x="432" y="831" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="851" fill="#e0645f" font-size="12" class="kr">폐쇄동맥 절구가지 ★</text>
  <text x="442" y="866" fill="#c98a86" font-size="9">acetabular br. of obturator a.</text>
  <text x="442" y="877" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">폐쇄관</tspan> → 절구패임(절구가로인대</text>
  <text x="442" y="888" fill="#6f8299" font-size="9">밑) → 넙다리뼈머리인대</text>
  <rect x="432" y="906" width="170" height="81" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="926" fill="#e0645f" font-size="12" class="kr">위·아래</text>
  <text x="442" y="941" fill="#e0645f" font-size="12" class="kr">안쪽·가쪽무릎동맥 ★</text>
  <text x="442" y="956" fill="#c98a86" font-size="9">sup. / inf. medial &amp; lateral</text>
  <text x="442" y="967" fill="#c98a86" font-size="9">genicular aa.</text>
  <text x="442" y="978" fill="#6f8299" font-size="9">무릎 둘레 네 귀퉁이</text>
  <rect x="432" y="996" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="1016" fill="#e0645f" font-size="12" class="kr">가운데무릎동맥 ★</text>
  <text x="442" y="1031" fill="#c98a86" font-size="9">middle genicular a.</text>
  <text x="442" y="1042" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">빗오금인대</tspan>를 뚫고 들어가</text>
  <text x="442" y="1053" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">십자인대</tspan>로</text>
  <line x1="26" y1="1072" x2="628" y2="1072" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="1084" fill="#93a4b7" font-size="10.5">코피의 90 %는 코중격 앞 <tspan fill="#e6edf3" font-weight="700">Kiesselbach 부위</tspan> — 네 동맥이 만나는 문합이다.</text>
  <text x="26" y="1102" fill="#93a4b7" font-size="10.5">편도절제술 뒤 출혈은 동맥보다 <tspan fill="#e6edf3" font-weight="700">편도바깥정맥</tspan>(paratonsillar v.)이 흔하다.</text>
  <text x="26" y="1120" fill="#93a4b7" font-size="10.5">어른 넙다리뼈머리는 <tspan fill="#e6edf3" font-weight="700">안쪽넙다리휘돌이동맥</tspan>이 먹인다 — 목 골절에서 <tspan fill="#e6edf3" font-weight="700">무혈괴사</tspan>.</text>
</svg>
