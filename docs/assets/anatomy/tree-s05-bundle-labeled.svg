<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1408" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="함께 지나는 것 — 허파뿌리·심장막굴·관자아래우묵 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 5회차 §허파뿌리 · 심장막 · 관자아래우묵 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="840" height="1408" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 허파뿌리·심장막굴·관자아래우묵<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> neurovascular bundles &amp; spaces</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">5회차 · 배열 순서가 그대로 태깅 문제가 되는 세 자리</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 602,174 H 615 V 120 H 628" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 602,174 H 615 V 178 H 628" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 602,174 H 615 V 236 H 628" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,336 H 419 V 174 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,336 H 419 V 300 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,336 H 419 V 370 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,336 H 419 V 440 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,336 H 419 V 504 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,649 H 419 V 578 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,649 H 419 V 659 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,649 H 419 V 728 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,938 H 419 V 798 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,938 H 419 V 868 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,938 H 419 V 937 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,938 H 419 V 1012 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,938 H 419 V 1087 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,1230 H 419 V 1162 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
