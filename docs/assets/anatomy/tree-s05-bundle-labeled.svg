  <path d="M 206,767 H 219 V 336 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,767 H 219 V 649 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
