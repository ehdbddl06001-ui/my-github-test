<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 789" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="함께 지나는 것 — 관자아래·세로칸 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 5회차 §관자아래우묵 · 가슴막 · 심장막 -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="789" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">함께 지나는 것 — 관자아래·세로칸<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> neurovascular bundles</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">5회차 · 관자아래우묵의 신경–동맥 짝과, 허파뿌리를 앞뒤로 지나는 두 신경</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,196 H 419 V 127 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,196 H 419 V 200 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,196 H 419 V 274 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,373 H 419 V 346 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,373 H 419 V 410 H 432" fill="none" stroke="#4a6483" stroke-width="1.6"/>
  <path d="M 406,509 H 419 V 479 H 432" fill="none" stroke="#7a3a38" stroke-width="1.6"/>
  <path d="M 406,509 H 419 V 548 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,648 H 419 V 618 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 406,648 H 419 V 688 H 432" fill="none" stroke="#584a76" stroke-width="1.6"/>
  <path d="M 206,421 H 219 V 196 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,421 H 219 V 373 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,421 H 219 V 509 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,421 H 219 V 648 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <rect x="26" y="402" width="180" height="38" rx="7" fill="#24402f" stroke="#7fd4a8" stroke-width="1.3"/>
  <text x="36" y="422" fill="#7fd4a8" font-size="12" class="kr">세 자리</text>
  <rect x="232" y="168" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="188" fill="#7fd4a8" font-size="12" class="kr">관자아래우묵 ★</text>
  <text x="242" y="204" fill="#5fae87" font-size="9">infratemporal fossa</text>
  <text x="242" y="214" fill="#6f8299" font-size="9">가쪽날개근 주위</text>
  <rect x="232" y="346" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="366" fill="#7fd4a8" font-size="12" class="kr">허파뿌리 ★</text>
  <text x="242" y="380" fill="#5fae87" font-size="9">root of lung</text>
  <text x="242" y="392" fill="#6f8299" font-size="9">앞뒤로 지나는 두 신경</text>
  <rect x="232" y="482" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="502" fill="#7fd4a8" font-size="12" class="kr">심장막굴 ★</text>
  <text x="242" y="517" fill="#5fae87" font-size="9">pericardial sinuses</text>
  <text x="242" y="528" fill="#6f8299" font-size="9">손가락이 들어가는 두 틈</text>
  <rect x="232" y="621" width="174" height="55" rx="7" fill="#24402f" stroke="#3f7a5e" stroke-width="1.3"/>
  <text x="242" y="641" fill="#7fd4a8" font-size="12" class="kr">가슴막안의 오목</text>
  <text x="242" y="656" fill="#5fae87" font-size="9">pleural recesses</text>
  <text x="242" y="667" fill="#6f8299" font-size="9">허파가 안 들어차는 여분 공간</text>
  <rect x="432" y="92" width="170" height="70" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="112" fill="#9cc3ff" font-size="12" class="kr">아래이틀신경 +</text>
  <text x="442" y="127" fill="#9cc3ff" font-size="12" class="kr">아래이틀동맥 ★</text>
  <text x="442" y="142" fill="#7f9cc4" font-size="9">inf. alveolar n. &amp; a.</text>
  <text x="442" y="153" fill="#6f8299" font-size="9">아래턱구멍으로 함께 들어간다</text>
  <rect x="432" y="171" width="170" height="59" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="191" fill="#9cc3ff" font-size="12" class="kr">깊은관자신경 +</text>
  <text x="442" y="206" fill="#9cc3ff" font-size="12" class="kr">깊은관자동맥</text>
  <text x="442" y="221" fill="#7f9cc4" font-size="9">deep temporal n. &amp; a.</text>
  <rect x="432" y="239" width="170" height="70" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="259" fill="#e0645f" font-size="12" class="kr">귓바퀴관자신경 ↔</text>
  <text x="442" y="274" fill="#e0645f" font-size="12" class="kr">중간뇌막동맥 ★</text>
  <text x="442" y="289" fill="#c98a86" font-size="9">auriculotemporal n.</text>
  <text x="442" y="300" fill="#6f8299" font-size="9">신경의 <tspan fill="#e6edf3" font-weight="700">두 뿌리가 동맥을 감싼다</tspan></text>
  <rect x="432" y="318" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="338" fill="#9cc3ff" font-size="12" class="kr">가로막신경 ★</text>
  <text x="442" y="353" fill="#7f9cc4" font-size="9">phrenic n.</text>
  <text x="442" y="364" fill="#6f8299" font-size="9">허파뿌리 <tspan fill="#e6edf3" font-weight="700">앞</tspan> (Phrenic = Pre)</text>
  <rect x="432" y="382" width="170" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="442" y="402" fill="#9cc3ff" font-size="12" class="kr">미주신경 ★</text>
  <text x="442" y="417" fill="#7f9cc4" font-size="9">vagus n.</text>
  <text x="442" y="428" fill="#6f8299" font-size="9">허파뿌리 <tspan fill="#e6edf3" font-weight="700">뒤</tspan></text>
  <rect x="432" y="446" width="170" height="66" rx="7" fill="#40201f" stroke="#e0645f" stroke-width="2.2"/>
  <text x="442" y="466" fill="#e0645f" font-size="12" class="kr">가로심장막굴 ★</text>
  <text x="442" y="481" fill="#c98a86" font-size="9">transverse sinus</text>
  <text x="442" y="492" fill="#6f8299" font-size="9">오름대동맥·허파동맥 <tspan fill="#e6edf3" font-weight="700">뒤</tspan> — 동맥을</text>
  <text x="442" y="503" fill="#6f8299" font-size="9">한 번에 묶는 자리</text>
  <rect x="432" y="521" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="541" fill="#b49ae0" font-size="12" class="kr">빗심장막굴</text>
  <text x="442" y="556" fill="#8f79b8" font-size="9">oblique sinus</text>
  <text x="442" y="567" fill="#6f8299" font-size="9">오른심방 뒤·식도 앞 — 막다른 골목</text>
  <rect x="432" y="585" width="170" height="66" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="605" fill="#b49ae0" font-size="12" class="kr">갈비가로막오목 ★</text>
  <text x="442" y="620" fill="#8f79b8" font-size="9">costodiaphragmatic recess</text>
  <text x="442" y="631" fill="#6f8299" font-size="9"><tspan fill="#e6edf3" font-weight="700">가장 깊다</tspan> — 가슴막천자·삼출액이</text>
  <text x="442" y="642" fill="#6f8299" font-size="9">고이는 자리</text>
  <rect x="432" y="660" width="170" height="55" rx="7" fill="#2c2542" stroke="#b49ae0" stroke-width="2.2"/>
  <text x="442" y="680" fill="#b49ae0" font-size="12" class="kr">갈비세로칸오목</text>
  <text x="442" y="695" fill="#8f79b8" font-size="9">costomediastinal recess</text>
  <text x="442" y="706" fill="#6f8299" font-size="9">왼쪽 심장패임 앞</text>
  <line x1="26" y1="725" x2="628" y2="725" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="737" fill="#93a4b7" font-size="10.5">관자아래우묵은 '신경과 같은 이름의 동맥' 이 짝을 이룬다 — 아래이틀·깊은관자·볼.</text>
  <text x="26" y="755" fill="#93a4b7" font-size="10.5">심장막굴 둘: 가로굴은 <tspan fill="#e6edf3" font-weight="700">동맥 뒤</tspan>, 빗굴은 <tspan fill="#e6edf3" font-weight="700">오른심방 뒤</tspan> — 손가락이 어디까지 들어가나로 외운다.</text>
</svg>
