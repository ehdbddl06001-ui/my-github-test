  <rect x="628" y="357" width="160" height="55" rx="7" fill="#1d3552" stroke="#9cc3ff" stroke-width="2.2"/>
  <text x="638" y="377" fill="#9cc3ff" font-size="12" class="kr">장딴지신경 ★</text>
  <text x="638" y="392" fill="#7f9cc4" font-size="9">sural n.</text>
  <text x="638" y="403" fill="#6f8299" font-size="9">둘이 합쳐진 것</text>
  <line x1="26" y1="550" x2="814" y2="550" stroke="#2b3a4d" stroke-width="1"/>
  <text x="26" y="562" fill="#93a4b7" font-size="10.5">온종아리신경이 종아리뼈목을 감아도는 자리가 가장 흔한 손상 부위 → 발처짐.</text>
  <text x="26" y="580" fill="#93a4b7" font-size="10.5">장딴지신경 = 안쪽장딴지피부신경(정강) + 교통가지(온종아리) — 순수 감각, 공여신경.</text>
