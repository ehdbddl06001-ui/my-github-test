  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">통로와 칸 — 머리의 길과 다리 관절 — 분지 퀴즈판<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> passages &amp; ligaments</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">15회차 · 머리는 공기·음식이 지나는 길을 칸으로 나누고, 다리 관절은 인대가 칸 없이 붙잡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · 번호를 보고 이름을 답하시오</text>
