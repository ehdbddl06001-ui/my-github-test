<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="등의 층 구조와 척수신경 앞가지·뒤가지 — 가로단면으로 그린 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn). 등뼈 높이 가로단면(위에서 본 모습, 등이 위쪽).
       근거: 1회차(0818) 문용석pf 과제 §척수신경 앞가지·뒤가지 차이 + §등·다리 피부벗기기
             + e-Anatomy Back — Superficial layer.
       핵심 ① 피부벗기기에서 지나는 층 순서 ② 뒤가지는 얼기를 만들지 않고 등만 담당
             ③ 뒤가지의 안쪽·가쪽 가지가 피부가지를 낸다 -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">등의 층과 척수신경 두 가지
    <tspan fill="#93a4b7" font-size="12" font-weight="400">layers of the back &amp; dorsal / ventral rami</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과식 구도) · 근거: 1회차 과제 §앞가지·뒤가지 · 등뼈 높이 가로단면(등이 위쪽)</text>
  <text x="20" y="68" fill="#6f8299" font-size="11"><tspan fill="#9cc3ff">파랑</tspan> 뒤가지 / <tspan fill="#7fd4a8">초록</tspan> 앞가지 · ★ = 시험 포인트</text>

  <!-- ================= 층 ================= -->
  <path d="M 46,126 C 160,110 300,110 414,126 L 414,150 C 300,134 160,134 46,150 Z"
        fill="#5b4436" stroke="#8a6a52" stroke-width="1.4"/>
  <path d="M 46,150 C 160,134 300,134 414,150 L 414,186 C 300,170 160,170 46,186 Z"
        fill="#4a3f30" stroke="#7a6a52" stroke-width="1.2"/>
  <path d="M 46,186 C 160,170 300,170 414,186 L 414,198 C 300,182 160,182 46,198 Z"
        fill="#3a4a52" stroke="#6a8a96" stroke-width="1.2"/>
  <!-- 얕은층 근육(등세모근·넓은등근) -->
  <path d="M 46,198 C 160,182 300,182 414,198 L 414,238 C 300,222 160,222 46,238 Z"
        fill="#2f5a44" stroke="#5aa87f" stroke-width="1.4"/>
  <!-- 등허리근막 -->
  <path d="M 60,244 C 160,230 300,230 400,244" fill="none" stroke="#c9b07a" stroke-width="3"/>

  <!-- 고유등근육(뒤가지 지배) -->
  <ellipse cx="150" cy="286" rx="52" ry="34" fill="#3d5f7f" stroke="#79a8d0" stroke-width="1.6"/>
  <ellipse cx="310" cy="286" rx="52" ry="34" fill="#3d5f7f" stroke="#79a8d0" stroke-width="1.6"/>
  <ellipse cx="216" cy="300" rx="26" ry="24" fill="#33506b" stroke="#79a8d0" stroke-width="1.4"/>
  <ellipse cx="244" cy="300" rx="26" ry="24" fill="#33506b" stroke="#79a8d0" stroke-width="1.4"/>

  <!-- ================= 척추뼈 ================= -->
  <path d="M 224,246 L 236,246 L 240,330 L 220,330 Z" fill="#22344a" stroke="#5b7690" stroke-width="1.6"/>
  <path d="M 168,352 C 184,330 210,324 230,330 C 250,324 276,330 292,352
           C 300,368 296,384 282,392 L 178,392 C 164,384 160,368 168,352 Z"
        fill="#22344a" stroke="#5b7690" stroke-width="1.6"/>
  <ellipse cx="230" cy="434" rx="66" ry="42" fill="#22344a" stroke="#5b7690" stroke-width="1.8"/>
  <!-- 척주관·척수 -->
  <ellipse cx="230" cy="362" rx="34" ry="24" fill="#101c2b" stroke="#4a5b6e" stroke-width="1.2"/>
  <ellipse cx="230" cy="362" rx="20" ry="14" fill="#3b3350" stroke="#9578c4" stroke-width="1.6"/>

  <!-- ================= 신경 ================= -->
  <!-- 뒤뿌리 + 신경절 -->
  <path d="M 248,354 C 268,352 288,356 302,364" fill="none" stroke="#c9b07a" stroke-width="2.6"/>
  <circle cx="302" cy="364" r="9" fill="#4a3f30" stroke="#c9b07a" stroke-width="2"/>
  <!-- 앞뿌리 -->
  <path d="M 248,374 C 268,378 288,378 302,374" fill="none" stroke="#c9b07a" stroke-width="2.6"/>
  <!-- 척수신경 본줄기 -->
  <path d="M 311,368 C 322,368 332,368 342,368" fill="none" stroke="#e6c98a" stroke-width="4.6"/>
  <!-- 뒤가지 -->
  <path d="M 342,368 C 350,344 350,318 344,296" fill="none" stroke="#9cc3ff" stroke-width="4"/>
  <!-- 뒤가지 가쪽가지 → 피부 -->
  <path d="M 344,300 C 356,272 366,232 372,196 C 376,172 376,152 374,136"
        fill="none" stroke="#9cc3ff" stroke-width="3"/>
  <!-- 뒤가지 안쪽가지 → 피부 -->
  <path d="M 342,300 C 322,278 300,254 286,232 C 276,214 274,190 276,150"
        fill="none" stroke="#9cc3ff" stroke-width="3" stroke-dasharray="7 4"/>
  <!-- 앞가지 -->
  <path d="M 342,368 C 372,382 396,404 410,432" fill="none" stroke="#7fd4a8" stroke-width="4.4"/>
  <path d="M 410,432 C 416,450 418,466 418,482" fill="none" stroke="#7fd4a8" stroke-width="3.4"/>

  <!-- ================= 라벨 ================= -->
  <text x="20" y="118" fill="#d7b79a" font-size="11" class="kr">피부 skin</text>
  <text x="20" y="168" fill="#c9b18a" font-size="11" class="kr">얕은근막</text>
  <text x="20" y="180" fill="#8a7a5e" font-size="9">superficial fascia — 피부밑지방</text>
  <text x="20" y="212" fill="#8fc9ad" font-size="10" class="kr">깊은근막 → 얕은층 근육</text>
  <text x="20" y="252" fill="#c9b07a" font-size="10" class="kr">등허리근막</text>
  <text x="20" y="300" fill="#cfe4f7" font-size="11" class="kr">고유등근육</text>
  <text x="20" y="312" fill="#8fb6d8" font-size="9">intrinsic back mm.</text>
  <text x="20" y="324" fill="#eab308" font-size="9.5" class="kr">전부 뒤가지 지배 ★</text>
  <path d="M 94,296 L 106,290" stroke="#4a6483" stroke-width="1"/>

  <text x="20" y="392" fill="#8fa3b8" font-size="10" class="kr">척추뼈 · 가시돌기</text>
  <path d="M 116,388 L 176,384" stroke="#4a5b6e" stroke-width="1"/>
  <text x="20" y="452" fill="#b49ae0" font-size="10.5" class="kr">척수</text>
  <text x="20" y="464" fill="#6f8299" font-size="9">spinal cord</text>
  <path d="M 62,448 L 200,376" stroke="#584a76" stroke-width="1"/>

  <text x="318" y="104" fill="#9cc3ff" font-size="11" class="kr">가쪽피부가지</text>
  <text x="318" y="116" fill="#6f8299" font-size="9">lateral cutaneous br.</text>
  <path d="M 372,110 L 374,126" stroke="#4a6483" stroke-width="1"/>
  <text x="150" y="104" fill="#9cc3ff" font-size="11" class="kr">안쪽피부가지</text>
  <text x="150" y="116" fill="#6f8299" font-size="9">medial cutaneous br.</text>
  <path d="M 236,110 L 274,140" stroke="#4a6483" stroke-width="1"/>

  <text x="330" y="252" fill="#9cc3ff" font-size="12" class="kr">뒤가지 ★</text>
  <text x="330" y="264" fill="#7f9cc4" font-size="9">dorsal ramus</text>
  <text x="330" y="276" fill="#6f8299" font-size="9">고유등근육 + 등 피부</text>
  <path d="M 348,268 L 346,292" stroke="#4a6483" stroke-width="1"/>

  <text x="330" y="336" fill="#e6c98a" font-size="10.5" class="kr">척수신경</text>
  <text x="330" y="348" fill="#8a7a5e" font-size="9">spinal n.</text>
  <path d="M 340,342 L 340,362" stroke="#8a7a5e" stroke-width="1"/>
  <text x="316" y="424" fill="#c9b07a" font-size="10" class="kr">뒤뿌리신경절</text>
  <path d="M 340,418 L 306,374" stroke="#8a7a5e" stroke-width="1"/>

  <text x="240" y="516" fill="#7fd4a8" font-size="12" class="kr">앞가지 ★</text>
  <text x="240" y="528" fill="#5fae87" font-size="9">ventral ramus</text>
  <text x="240" y="540" fill="#6f8299" font-size="9">얼기(목·팔·허리·엉치)를 이뤄 팔다리·몸통 앞으로</text>
  <path d="M 348,522 L 408,474" stroke="#3f7a5e" stroke-width="1"/>

  <!-- ================= 오른쪽 위: 앞가지 vs 뒤가지 ================= -->
  <rect x="446" y="96" width="416" height="212" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="462" y="120" fill="#e6edf3" font-size="13" class="kr">앞가지 vs 뒤가지 — 과제 답안</text>
  <line x1="462" y1="132" x2="846" y2="132" stroke="#2b3a4d" stroke-width="1"/>
  <text x="462" y="154" fill="#9cc3ff" font-size="11" class="kr">뒤가지</text>
  <text x="566" y="154" fill="#93a4b7" font-size="10.5">가늘다 · <tspan fill="#e6edf3">얼기를 만들지 않는다</tspan></text>
  <text x="566" y="170" fill="#93a4b7" font-size="10.5">고유등근육 + 척주 옆 <tspan fill="#e6edf3">등 피부</tspan>만</text>
  <text x="566" y="186" fill="#6f8299" font-size="9.5">분절 배열이 그대로 유지된다</text>
  <text x="462" y="214" fill="#7fd4a8" font-size="11" class="kr">앞가지</text>
  <text x="566" y="214" fill="#93a4b7" font-size="10.5">굵다 · <tspan fill="#e6edf3">얼기를 이룬다</tspan>(목·팔·허리·엉치)</text>
  <text x="566" y="230" fill="#93a4b7" font-size="10.5">몸통 앞·가쪽 + <tspan fill="#e6edf3">팔다리 전체</tspan></text>
  <text x="566" y="246" fill="#6f8299" font-size="9.5">갈비사이신경만 얼기 없이 분절을 지킨다</text>
  <text x="462" y="276" fill="#eab308" font-size="11" class="kr">예외</text>
  <text x="566" y="276" fill="#93a4b7" font-size="10.5">등세모근은 등에 있어도 <tspan fill="#e6edf3">더부신경(XI)</tspan> 지배 —</text>
  <text x="566" y="292" fill="#93a4b7" font-size="10.5">얕은층 근육은 뒤가지 지배가 아니다(이주근육)</text>

  <!-- ================= 오른쪽 아래: 벗겨 나가는 순서 ================= -->
  <rect x="446" y="320" width="416" height="244" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="462" y="344" fill="#e6edf3" font-size="13" class="kr">피부벗기기 — 지나는 층 순서</text>
  <path d="M 470,358 L 470,506" stroke="#5a4a3a" stroke-width="1.8"/>
  <path d="M 470,374 L 492,374" stroke="#5a4a3a" stroke-width="1.6"/>
  <text x="500" y="378" fill="#d7b79a" font-size="10.5" class="kr">① 피부</text>
  <text x="580" y="378" fill="#6f8299" font-size="9.5">표피 + 진피 — 칼날을 눕혀 얇게</text>
  <path d="M 470,404 L 492,404" stroke="#5a4a3a" stroke-width="1.6"/>
  <text x="500" y="408" fill="#c9b18a" font-size="10.5" class="kr">② 얕은근막</text>
  <text x="580" y="408" fill="#6f8299" font-size="9.5">피부밑지방 — <tspan fill="#93a4b7">피부신경·피부정맥이 여기 있다</tspan></text>
  <path d="M 470,434 L 492,434" stroke="#5a4a3a" stroke-width="1.6"/>
  <text x="500" y="438" fill="#8fb6d8" font-size="10.5" class="kr">③ 깊은근막</text>
  <text x="580" y="438" fill="#6f8299" font-size="9.5">근육을 싸는 흰 막 — 여기서 멈춘다</text>
  <path d="M 470,464 L 492,464" stroke="#5a4a3a" stroke-width="1.6"/>
  <text x="500" y="468" fill="#8fc9ad" font-size="10.5" class="kr">④ 얕은층 근육</text>
  <text x="580" y="468" fill="#6f8299" font-size="9.5">등세모근 · 넓은등근</text>
  <path d="M 470,494 L 492,494" stroke="#5a4a3a" stroke-width="1.6"/>
  <text x="500" y="498" fill="#cfe4f7" font-size="10.5" class="kr">⑤ 등허리근막 → 고유등근육</text>
  <text x="462" y="528" fill="#eab308" font-size="11" class="kr">주의</text>
  <text x="546" y="528" fill="#93a4b7" font-size="10.5">②에서 너무 깊이 들어가면 <tspan fill="#e6edf3">피부신경이 잘려</tspan></text>
  <text x="546" y="544" fill="#93a4b7" font-size="10.5">나중에 분절 분포를 확인할 수 없다</text>

  <!-- ================= 하단 요약 ================= -->
  <rect x="18" y="580" width="844" height="100" rx="10" fill="#121e2e" stroke="#2b3a4d"/>
  <text x="34" y="604" fill="#e6edf3" font-size="12.5" font-weight="700">한 줄 정리 — 척수신경은 나오자마자 둘로 갈리고, 그 뒤로는 영역이 겹치지 않는다</text>
  <text x="34" y="628" fill="#9cc3ff" font-size="11" class="kr">뒤가지</text>
  <text x="130" y="628" fill="#93a4b7" font-size="11">고유등근육 + 등 피부 · <tspan fill="#e6edf3">안쪽가지</tspan>(위쪽에서 피부로) · <tspan fill="#e6edf3">가쪽가지</tspan>(아래쪽에서 피부로)</text>
  <text x="34" y="650" fill="#7fd4a8" font-size="11" class="kr">앞가지</text>
  <text x="130" y="650" fill="#93a4b7" font-size="11">얼기 → 팔다리·몸통 앞 · 볼기의 <tspan fill="#e6edf3">아래볼기피부신경</tspan>도 결국 앞가지 계열이다</text>
  <text x="34" y="672" fill="#eab308" font-size="11" class="kr">시험</text>
  <text x="130" y="672" fill="#93a4b7" font-size="11">"등에 있으니 뒤가지 지배"는 함정 — <tspan fill="#e6edf3">이주근육(등세모근·넓은등근·마름근)</tspan>은 앞가지·더부신경 지배</text>
</svg>
