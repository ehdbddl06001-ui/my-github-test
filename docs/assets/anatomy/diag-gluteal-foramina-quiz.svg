<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="큰궁둥구멍 통과 구조물 태깅 퀴즈판 — 번호핀 7개, 라벨 제거">
  <!-- 자체 제작 도해(claude-drawn). 오른쪽 볼기부위를 뒤에서 본 구도(큰볼기근 젖힘).
       근거: 2회차(0818) 실습영상 §볼기부위 + tagging 2차 [볼기 신경·혈관].
       핵심: 궁둥구멍근이 큰궁둥구멍을 위·아래로 나눈다 → 위구멍엔 위볼기 A/V/N만,
       나머지는 전부 아래구멍. 음부신경·속음부동맥은 작은궁둥구멍으로 되돌아 들어간다. -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <!-- ================= 뼈 ================= -->
  <!-- 엉치뼈 -->
  <path d="M 150,120 C 128,180 124,250 138,318 C 146,362 160,396 178,424 L 232,424
           C 214,388 202,340 200,280 C 198,214 210,160 226,120 Z"
        fill="#1b2a3c" stroke="#3d5166" stroke-width="2"/>
  <!-- 엉덩뼈 (날개) -->
  <path d="M 226,120 C 300,104 396,116 452,152 C 486,174 496,214 486,252
           C 476,290 444,312 404,316 L 236,300 C 214,240 216,170 226,120 Z"
        fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <!-- 궁둥뼈가시 + 엉치가시인대 -->
  <path d="M 236,392 L 214,404 L 238,414 Z" fill="#2c4054" stroke="#5b7690" stroke-width="1.6"/>
  <path d="M 236,404 C 214,420 196,428 178,430" fill="none" stroke="#4a6076" stroke-width="5"/>
  <!-- 궁둥뼈결절 -->
  <ellipse cx="268" cy="500" rx="46" ry="30" fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <!-- 넙다리뼈 큰돌기 -->
  <path d="M 470,392 C 500,382 528,392 536,416 C 544,442 528,466 500,470 L 470,462 Z"
        fill="#22344a" stroke="#3d5166" stroke-width="2"/>
  <!-- ================= 궁둥구멍근 ================= -->
  <path d="M 208,304 C 280,296 380,330 470,398 L 452,428 C 366,368 274,338 202,344 Z"
        fill="#3d5f7f" stroke="#79a8d0" stroke-width="2"/>
  <!-- 위구멍 / 아래구멍 영역 표시 -->
  <path d="M 214,282 C 286,272 372,300 452,354" fill="none" stroke="#4e9070" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 206,364 C 270,362 350,392 430,444" fill="none" stroke="#e3a765" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- ================= 위구멍 통과: 위볼기 A/N ================= -->
  <path d="M 224,300 C 300,292 366,308 424,336" fill="none" stroke="#e0645f" stroke-width="3.4"/>
  <path d="M 224,312 C 300,304 364,320 420,346" fill="none" stroke="#9cc3ff" stroke-width="3"/>
  <!-- ================= 아래구멍 통과 ================= -->
  <!-- 아래볼기 A/N -->
  <path d="M 218,352 C 276,356 332,378 384,412" fill="none" stroke="#e0645f" stroke-width="3.2"/>
  <path d="M 218,364 C 276,368 330,390 380,424" fill="none" stroke="#9cc3ff" stroke-width="2.8"/>
  <!-- 궁둥신경 (가장 굵고 가장 가쪽) -->
  <path d="M 226,382 C 292,394 340,430 366,492 C 384,534 390,566 392,596"
        fill="none" stroke="#6fa8e8" stroke-width="7" stroke-linecap="round"/>
  <!-- 뒤넙다리피부신경 -->
  <path d="M 222,394 C 280,412 320,452 336,506 C 346,542 348,572 348,596"
        fill="none" stroke="#9cc3ff" stroke-width="2.4" stroke-dasharray="6 4"/>
  <!-- 음부신경 + 속음부동맥 : 아래구멍 → 궁둥뼈가시 뒤를 감아 작은궁둥구멍으로 재진입 -->
  <path d="M 214,372 C 226,392 226,414 210,428 C 196,440 182,442 170,438"
        fill="none" stroke="#e0645f" stroke-width="2.6"/>
  <path d="M 210,382 C 220,398 220,416 206,428 C 194,438 182,440 172,436"
        fill="none" stroke="#c9a5f0" stroke-width="2.4"/>

  <!-- 표면 표지: 궁둥신경 위치 -->
  <line x1="268" y1="500" x2="500" y2="440" stroke="#eab308" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="384" cy="470" r="6" fill="none" stroke="#eab308" stroke-width="1.6"/>
  <!-- ================= 오른쪽: 속엉덩동맥 분지 트리 ================= -->
  
  <!-- ================= 오른쪽 아래: 임상 ================= -->
  
  <!-- ================= 하단 요약 ================= -->
  
  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">큰궁둥구멍 통과 구조물 — 태깅 연습판<tspan fill="#93a4b7" font-size="12" font-weight="400"> greater sciatic foramen — quiz</tspan></text><text x="20" y="50" fill="#93a4b7" font-size="11">오른쪽 볼기를 뒤에서 본 모습. 번호핀 ①~⑦의 이름(한·영)을 말하고, 각각 <tspan fill="#e6edf3">위구멍/아래구멍</tspan> 중 어디로 나오는지 답하시오.</text><text x="20" y="68" fill="#6f8299" font-size="11">정답은 대응 문항 카드(anatomy-2026-0028) frontmatter에 있다.</text><circle cx="340" cy="352" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="340" y="357" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">1</text><circle cx="300" cy="293" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="300" y="298" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">2</text><circle cx="392" cy="340" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="392" y="345" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">3</text><circle cx="296" cy="357" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="296" y="362" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">4</text><circle cx="350" cy="468" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="350" y="473" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">5</text><circle cx="338" cy="520" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="338" y="525" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">6</text><circle cx="196" cy="430" r="14" fill="#eab308" stroke="#0e1826" stroke-width="2"/><text x="196" y="435" fill="#241a05" font-size="15" font-weight="700" text-anchor="middle" stroke="none">7</text><rect x="596" y="96" width="266" height="300" rx="10" fill="#121e2e" stroke="#2b3a4d"/><text x="612" y="120" fill="#93a4b7" font-size="12" font-weight="700">답안 칸 — 이름 + 위/아래구멍</text><text x="612" y="152" fill="#eab308" font-size="12" font-weight="700">1.</text><line x1="632" y1="154" x2="846" y2="154" stroke="#3d5166" stroke-width="1.2"/><text x="612" y="184" fill="#eab308" font-size="12" font-weight="700">2.</text><line x1="632" y1="186" x2="846" y2="186" stroke="#3d5166" stroke-width="1.2"/><text x="612" y="216" fill="#eab308" font-size="12" font-weight="700">3.</text><line x1="632" y1="218" x2="846" y2="218" stroke="#3d5166" stroke-width="1.2"/><text x="612" y="248" fill="#eab308" font-size="12" font-weight="700">4.</text><line x1="632" y1="250" x2="846" y2="250" stroke="#3d5166" stroke-width="1.2"/><text x="612" y="280" fill="#eab308" font-size="12" font-weight="700">5.</text><line x1="632" y1="282" x2="846" y2="282" stroke="#3d5166" stroke-width="1.2"/><text x="612" y="312" fill="#eab308" font-size="12" font-weight="700">6.</text><line x1="632" y1="314" x2="846" y2="314" stroke="#3d5166" stroke-width="1.2"/><text x="612" y="344" fill="#eab308" font-size="12" font-weight="700">7.</text><line x1="632" y1="346" x2="846" y2="346" stroke="#3d5166" stroke-width="1.2"/>
</svg>
