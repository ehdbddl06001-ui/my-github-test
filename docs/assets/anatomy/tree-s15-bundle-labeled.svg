<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 1458" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="통로와 칸 — 머리의 길과 다리 관절 — 분지 계보 구조도">
  <!-- 자동 생성: pipelines/branch_tree.py (스펙: branch_specs.py). 손으로 고치지 말 것.
       근거: 15회차 인제스트 섹션 a2-s15 §코안 가쪽벽 · §인두의 구분 · §후두절단면 · §관절주머니와 인대 · §십자인대 · §관절반달 + SESSION_DETAILS 응용과제(후두경 영상 비교 · 십자인대 손상 확인법) -->
  <style>text{paint-order:stroke;stroke:#0e1826;stroke-width:3px;stroke-linejoin:round}.kr{font-weight:700}.pin{stroke:none}</style>
  <rect width="654" height="1458" fill="#0e1826"/>
  <text x="26" y="30" fill="#e6edf3" font-size="17" font-weight="700">통로와 칸 — 머리의 길과 다리 관절<tspan fill="#93a4b7" font-size="11.5" font-weight="400"> passages &amp; ligaments</tspan></text>
  <text x="26" y="50" fill="#93a4b7" font-size="10.5">15회차 · 머리는 공기·음식이 지나는 길을 칸으로 나누고, 다리 관절은 인대가 칸 없이 붙잡는다</text>
  <text x="26" y="68" fill="#6f8299" font-size="10"><tspan fill="#e0645f">■ 동맥</tspan>  <tspan fill="#b49ae0">■ 정맥</tspan>  <tspan fill="#9cc3ff">■ 신경</tspan>  · ★ = tagging 최다 빈출 · 굵은 테두리 = 종말가지</text>
  <path d="M 406,198 H 419 V 125 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,198 H 419 V 206 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,198 H 419 V 280 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,423 H 419 V 350 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
