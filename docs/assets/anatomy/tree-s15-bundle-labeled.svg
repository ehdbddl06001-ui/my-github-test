  <path d="M 406,664 H 419 V 767 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,926 H 419 V 842 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,926 H 419 V 924 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 406,926 H 419 V 1020 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
