  <path d="M 406,1216 H 419 V 1333 H 432" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,706 H 219 V 198 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,706 H 219 V 423 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
  <path d="M 206,706 H 219 V 664 H 232" fill="none" stroke="#3f7a5e" stroke-width="1.6"/>
