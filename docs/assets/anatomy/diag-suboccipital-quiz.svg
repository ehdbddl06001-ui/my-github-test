<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="뒤통수밑삼각 — 경계 근육 셋, 지붕과 바닥, 내용물(척추동맥·뒤통수밑신경), 큰뒤통수신경의 주행">
  <!-- 자체 제작 도해(claude-drawn). 목덜미를 **뒤에서** 본 구도(오른쪽 삼각).
       근거: 2회차 김홍태pf §뒤통수밑삼각 A036~A043 + 표준 교재. -->
  <defs>
    
  </defs>
  <rect class="bg" width="900" height="700" style="fill:#0f1724"/>
  <text class="ttl" x="26" y="34" style="fill:#e8eefc;font-size:21px;font-weight:700">뒤통수밑삼각 <tspan class="sub" style="fill:#8fa6cf;font-size:12.5px">suboccipital triangle — 목덜미를 뒤에서 본 그림(오른쪽)</tspan></text>
  <text class="sub" x="26" y="54" style="fill:#8fa6cf;font-size:12.5px">2회차 김홍태pf §뒤통수밑삼각 · 근육 셋이 삼각을 만들고, 그 안에 척추동맥과 C1 뒤가지가 있다</text>

  <!-- 왼쪽: 삼각 -->
  <rect class="panel" x="24" y="70" width="500" height="470" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="h" x="42" y="96" style="fill:#cfe0ff;font-size:14px;font-weight:700">① 경계 — 근육 셋</text>

  <rect class="bone" x="60" y="112" width="430" height="20" rx="6" style="fill:#2a2e3c;stroke:#8b93a8;stroke-width:1.4"/>
  <text class="en" x="72" y="127" style="fill:#93a9d4;font-size:10.5px">뒤통수뼈 아래목덜미선  inferior nuchal line</text>

  
  <!-- 위안쪽: 큰뒤머리곧은근 -->
  <g class="ans" data-n="1">
    <path class="muscle" d="M176,160 L236,152 L286,352 L246,364 Z" style="fill:#4a2f3d;stroke:#c98aa6;stroke-width:1.6"/>
    <circle class="pin" cx="222" cy="252" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="222" y="257" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">1</text>
  </g>
  <!-- 위가쪽: 위머리빗근 -->
  <g class="ans" data-n="2">
    <path class="muscle" d="M398,168 L446,186 L336,352 L300,336 Z" style="fill:#4a2f3d;stroke:#c98aa6;stroke-width:1.6"/>
    <circle class="pin" cx="382" cy="256" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="382" y="261" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">2</text>
  </g>
  <!-- 아래: 아래머리빗근 -->
  <g class="ans" data-n="3">
    <path class="muscle" d="M212,380 L438,208 L462,238 L236,410 Z" style="fill:#4a2f3d;stroke:#c98aa6;stroke-width:1.6"/>
    <circle class="pin" cx="336" cy="312" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="336" y="317" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">3</text>
  </g>

  <!-- 내용물 -->
  <g class="ans" data-n="4">
    <path class="art" d="M330,300 C300,266 268,244 222,238" style="fill:none;stroke:#ff7d8f;stroke-width:3.4"/>
    <circle class="pin" cx="296" cy="252" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="296" y="257" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">4</text>
  </g>
  <g class="ans" data-n="5">
    <path class="nrv" d="M262,318 C288,300 306,288 330,282" style="fill:none;stroke:#e0d264;stroke-width:2.6"/>
    <circle class="pin" cx="266" cy="300" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="266" y="305" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">5</text>
  </g>

  <path d="M200,168 L420,196 L300,368 Z" style="fill:none;stroke:#ffd479;stroke-width:3;stroke-dasharray:7 5"/>
  <text x="286" y="252" style="fill:#ffd479;font-size:12px;text-anchor:middle">삼각</text>
  <!-- 지붕·바닥 -->
  <g class="ans" data-n="6">
    <rect class="roof" x="60" y="452" width="200" height="26" rx="7" style="fill:#2b3a2b;stroke:#8fc98a;stroke-width:1.6"/>
    <circle class="pin" cx="48" cy="465" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="48" y="470" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">6</text>
  </g>
  <g class="ans" data-n="7">
    <rect class="bone" x="286" y="452" width="230" height="26" rx="7" style="fill:#2a2e3c;stroke:#8b93a8;stroke-width:1.4"/>
    <circle class="pin" cx="274" cy="465" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="274" y="470" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">7</text>
  </g>
  <text class="note" x="42" y="504" style="fill:#9fb4dc;font-size:11.5px">지붕 위로 머리널판근·등세모근이 더 덮는다 — 실습에서는 <tspan style="fill:#f0c674">널판근 → 머리반가시근</tspan> 순으로 젖힌다.</text>
  <text class="note" x="42" y="524" style="fill:#9fb4dc;font-size:11.5px">삼각 근육 넷(위 셋 + 작은뒤머리곧은근)은 모두 <tspan style="fill:#f0c674">뒤통수밑신경(C1 뒤가지)</tspan> 지배.</text>

  <!-- 오른쪽: 큰뒤통수신경 -->
  <rect class="panel" x="542" y="70" width="334" height="286" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="h" x="560" y="96" style="fill:#cfe0ff;font-size:14px;font-weight:700">② 큰뒤통수신경의 길</text>
  <g class="ans" data-n="8">
    <rect class="nerve" x="576" y="112" width="278" height="40" rx="8" style="fill:#3a3a18;stroke:#e0d264;stroke-width:1.6"/>
    <circle class="pin" cx="564" cy="132" r="13" style="fill:#eab308;stroke:#7c5a00;stroke-width:1.2"/><text class="pinn" x="564" y="137" style="fill:#2a1f05;font-size:12px;font-weight:700;text-anchor:middle">8</text>
  </g>
  <path class="nrv" d="M700,152 L700,180" style="fill:none;stroke:#e0d264;stroke-width:2.6"/>
  <rect class="panel" x="576" y="180" width="278" height="34" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="lab" x="592" y="202" style="fill:#e6eeff;font-size:12.5px">아래머리빗근 <tspan class="en" style="fill:#93a9d4;font-size:10.5px">아래를 돌아 위로</tspan></text>
  <path class="nrv" d="M700,214 L700,238" style="fill:none;stroke:#e0d264;stroke-width:2.6"/>
  <rect class="panel" x="576" y="238" width="278" height="34" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="lab" x="592" y="260" style="fill:#e6eeff;font-size:12.5px">머리반가시근을 <tspan style="fill:#f0c674">뚫고</tspan> 나온다</text>
  <path class="nrv" d="M700,272 L700,296" style="fill:none;stroke:#e0d264;stroke-width:2.6"/>
  <rect class="panel" x="576" y="296" width="278" height="34" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="lab" x="592" y="318" style="fill:#e6eeff;font-size:12.5px">뒤통수 피부 <tspan class="en" style="fill:#93a9d4;font-size:10.5px">— 뒤통수동맥과 나란히</tspan></text>

  <!-- 오른쪽 아래: 대비 -->
  <rect class="panel" x="542" y="372" width="334" height="168" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="h" x="560" y="398" style="fill:#cfe0ff;font-size:14px;font-weight:700">③ 신경 둘을 갈라 외운다</text>
  <text class="note" x="560" y="422" style="fill:#9fb4dc;font-size:11.5px">· <tspan style="fill:#f0c674">C1 뒤가지</tspan> = 뒤통수밑신경 → <tspan style="fill:#f0c674">운동만</tspan>(뒤통수밑근육 넷)</text>
  <text class="note" x="560" y="444" style="fill:#9fb4dc;font-size:11.5px">· <tspan style="fill:#f0c674">C2 뒤가지</tspan> = 큰뒤통수신경 → <tspan style="fill:#f0c674">감각만</tspan>(뒤통수 피부)</text>
  <text class="note" x="560" y="466" style="fill:#9fb4dc;font-size:11.5px">· 셋째뒤통수신경 = C3 뒤가지 (뒤통수 아래 피부)</text>
  <text class="note" x="560" y="494" style="fill:#9fb4dc;font-size:11.5px">동맥은 반대로 앞에서 온다 — <tspan style="fill:#f0c674">뒤통수동맥은 바깥목동맥</tspan> 가지.</text>
  <text class="note" x="560" y="516" style="fill:#9fb4dc;font-size:11.5px">출발이 정반대인데 뒤통수 피부에서 만난다.</text>

  <!-- 하단 요약 -->
  <rect class="panel" x="24" y="558" width="852" height="120" rx="10" style="fill:#16213a;stroke:#2b3f68;stroke-width:1.4"/>
  <text class="h" x="42" y="584" style="fill:#cfe0ff;font-size:14px;font-weight:700">외우는 요령</text>
  <text class="note" x="42" y="608" style="fill:#9fb4dc;font-size:11.5px">· 경계는 <tspan style="fill:#f0c674">&quot;위안쪽 곧은근 · 위가쪽 위빗근 · 아래 아래빗근&quot;</tspan> — 이름에 방향이 이미 들어 있다.</text>
  <text class="note" x="42" y="630" style="fill:#9fb4dc;font-size:11.5px">· 내용물은 <tspan style="fill:#f0c674">척추동맥 + C1 뒤가지</tspan> 둘뿐. 정맥얼기도 있지만 시험 답은 이 둘.</text>
  <text class="note" x="42" y="652" style="fill:#9fb4dc;font-size:11.5px">· 척추동맥은 C1 가로구멍 → C1 뒤활 위 고랑 → 큰구멍. <tspan style="fill:#f0c674">목을 심하게 돌리면 눌려</tspan> 어지럼(bow hunter&apos;s)이 생긴다.</text>
</svg>
