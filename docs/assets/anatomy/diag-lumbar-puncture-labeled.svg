<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="허리천자와 꼬리마취 — 허리뼈·엉치뼈 정중시상면에서 바늘이 지나는 층과 지표를 그린 자체 제작 도해">
  <!-- 자체 제작 도해(claude-drawn). 허리뼈~엉치뼈 정중시상면(왼쪽이 앞, 오른쪽이 뒤).
       근거: 1회차(0818) 문용석pf 과제 §허리천자 방법·원칙, §꼬리마취 목적·방법.
       핵심 ① 성인 척수는 L1–L2 에서 끝난다 → L3 아래에서 찌른다
             ② 경막주머니는 S2 에서 끝난다 → 꼬리마취는 그 아래(엉치뼈틈새)
             ③ 정중접근에서 바늘이 지나는 층 순서 -->
  <style>
    text{paint-order:stroke;stroke:#0e1826;stroke-width:3.2px;stroke-linejoin:round}
    .kr{font-weight:700}
  </style>
  <rect width="880" height="700" fill="#0e1826"/>

  <text x="20" y="30" fill="#e6edf3" font-size="18" font-weight="700">허리천자와 꼬리마취 — 어디를, 왜 거기를
    <tspan fill="#93a4b7" font-size="12" font-weight="400">lumbar puncture &amp; caudal block</tspan></text>
  <text x="20" y="50" fill="#93a4b7" font-size="11">자체 제작(교과식 구도) · 근거: 1회차 과제 §허리천자·꼬리마취 · 정중시상면(왼쪽 앞 / 오른쪽 뒤)</text>
  <text x="20" y="68" fill="#6f8299" font-size="11"><tspan fill="#eab308">노랑</tspan> 바늘 · <tspan fill="#9578c4">보라</tspan> 경막주머니·거미막밑공간 · ★ = 시험 포인트</text>

  <!-- ================= 척추뼈 몸통 ================= -->
  <g fill="#22344a" stroke="#5b7690" stroke-width="1.6">
    <rect x="96" y="112" width="86" height="42" rx="5"/>
    <rect x="96" y="166" width="86" height="42" rx="5"/>
    <rect x="96" y="220" width="86" height="42" rx="5"/>
    <rect x="96" y="274" width="86" height="42" rx="5"/>
    <rect x="96" y="328" width="86" height="42" rx="5"/>
  </g>
  <!-- 엉치뼈 -->
  <path d="M 96,382 L 182,382 C 196,428 194,478 178,516 L 116,506 C 104,468 98,424 96,382 Z"
        fill="#22344a" stroke="#5b7690" stroke-width="1.8"/>
  <!-- 꼬리뼈 -->
  <path d="M 150,520 C 158,540 158,552 152,562 L 132,556 C 130,542 132,530 136,516 Z"
        fill="#1b2a3c" stroke="#5b7690" stroke-width="1.4"/>

  <!-- 가시돌기(뒤쪽) -->
  <g fill="#22344a" stroke="#5b7690" stroke-width="1.5">
    <path d="M 214,116 L 268,124 L 268,144 L 214,150 Z"/>
    <path d="M 214,170 L 268,178 L 268,198 L 214,204 Z"/>
    <path d="M 214,224 L 268,232 L 268,252 L 214,258 Z"/>
    <path d="M 214,278 L 268,286 L 268,306 L 214,312 Z"/>
    <path d="M 214,332 L 268,340 L 268,360 L 214,366 Z"/>
  </g>
  <!-- 척주관 벽(고리) -->
  <path d="M 182,112 L 214,116 L 214,150 L 182,154 Z M 182,166 L 214,170 L 214,204 L 182,208 Z
           M 182,220 L 214,224 L 214,258 L 182,262 Z M 182,274 L 214,278 L 214,312 L 182,316 Z
           M 182,328 L 214,332 L 214,366 L 182,370 Z"
        fill="#1b2a3c" stroke="#4a5b6e" stroke-width="1.2"/>
  <!-- 엉치뼈 뒤벽 + 엉치뼈틈새 -->
  <path d="M 182,382 L 214,386 L 210,470 L 186,466 Z" fill="#1b2a3c" stroke="#4a5b6e" stroke-width="1.2"/>
  <path d="M 186,472 L 210,476 L 206,500 L 190,496 Z" fill="#0e1826" stroke="#eab308"
        stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- ================= 경막주머니·척수 ================= -->
  <path d="M 186,108 L 208,110 C 210,220 210,340 206,436 L 190,434 C 186,330 184,214 186,108 Z"
        fill="#2c2542" stroke="#9578c4" stroke-width="1.8"/>
  <!-- 척수(원뿔) — L1~L2 에서 끝 -->
  <path d="M 190,108 L 204,108 L 202,186 L 197,206 L 192,186 Z"
        fill="#5b4f7d" stroke="#b49ae0" stroke-width="1.4"/>
  <!-- 말총 -->
  <g stroke="#b49ae0" stroke-width="1.3" fill="none" opacity="0.9">
    <path d="M 195,206 C 194,262 194,340 195,424"/>
    <path d="M 198,206 C 199,262 200,340 200,424"/>
    <path d="M 201,206 C 203,262 205,340 204,424"/>
  </g>

  <!-- ================= 바늘 ================= -->
  <!-- 허리천자: L3–L4 사이 -->
  <path d="M 366,238 L 200,272" stroke="#eab308" stroke-width="3.6"/>
  <path d="M 366,238 L 380,234" stroke="#eab308" stroke-width="9" stroke-linecap="round"/>
  <!-- 꼬리마취: 엉치뼈틈새 -->
  <path d="M 320,540 L 200,486" stroke="#eab308" stroke-width="3.2" stroke-dasharray="9 5"/>
  <path d="M 320,540 L 336,546" stroke="#eab308" stroke-width="9" stroke-linecap="round"/>

  <!-- Tuffier 선 -->
  <path d="M 60,300 L 400,300" stroke="#e0645f" stroke-width="1.8" stroke-dasharray="8 6"/>

  <!-- ================= 라벨 ================= -->
  <text x="20" y="132" fill="#8fa3b8" font-size="10.5" class="kr">L1</text>
  <text x="20" y="186" fill="#8fa3b8" font-size="10.5" class="kr">L2</text>
  <text x="20" y="240" fill="#8fa3b8" font-size="10.5" class="kr">L3</text>
  <text x="20" y="294" fill="#8fa3b8" font-size="10.5" class="kr">L4</text>
  <text x="20" y="348" fill="#8fa3b8" font-size="10.5" class="kr">L5</text>
  <text x="20" y="420" fill="#8fa3b8" font-size="10.5" class="kr">엉치뼈</text>
  <text x="20" y="560" fill="#8fa3b8" font-size="10" class="kr">꼬리뼈</text>

  <text x="286" y="176" fill="#b49ae0" font-size="11.5" class="kr">척수원뿔 ★</text>
  <text x="286" y="188" fill="#8f79b8" font-size="9">conus medullaris — 성인 L1–L2</text>
  <text x="286" y="200" fill="#eab308" font-size="9.5" class="kr">그 아래를 찔러야 안전하다</text>
  <path d="M 282,182 L 208,178" stroke="#584a76" stroke-width="1"/>

  <text x="286" y="366" fill="#b49ae0" font-size="11" class="kr">말총</text>
  <text x="286" y="378" fill="#8f79b8" font-size="9">cauda equina — 바늘에 밀려 비켜난다</text>
  <path d="M 282,372 L 210,376" stroke="#584a76" stroke-width="1"/>

  <text x="286" y="440" fill="#9578c4" font-size="11" class="kr">경막주머니 끝 ★</text>
  <text x="286" y="452" fill="#8f79b8" font-size="9">dural sac — 성인 S2</text>
  <path d="M 282,446 L 210,438" stroke="#584a76" stroke-width="1"/>

  <text x="240" y="512" fill="#eab308" font-size="11.5" class="kr">엉치뼈틈새 ★</text>
  <text x="240" y="524" fill="#b7962e" font-size="9">sacral hiatus — 엉치뿔이 지표</text>
  <path d="M 236,508 L 212,492" stroke="#8b7a2e" stroke-width="1"/>

  <text x="386" y="222" fill="#eab308" font-size="11" class="kr">허리천자</text>
  <text x="300" y="288" fill="#6f8299" font-size="9.5">L3–L4 또는 L4–L5 사이</text>

  <text x="330" y="572" fill="#eab308" font-size="11" class="kr">꼬리마취</text>
  <text x="236" y="556" fill="#6f8299" font-size="9.5">엉치관 경막바깥공간으로</text>

  <text x="286" y="316" fill="#e0645f" font-size="10.5" class="kr">Tuffier 선 → L4 높이</text>
  <text x="286" y="328" fill="#a35f5b" font-size="9">양쪽 엉덩뼈능선을 잇는 선 — 만져서 찾는다</text>

  <!-- ================= 오른쪽 위: 허리천자 ================= -->
  <rect x="446" y="96" width="416" height="256" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="462" y="120" fill="#eab308" font-size="13" class="kr">허리천자 — 방법과 원칙</text>
  <line x1="462" y1="132" x2="846" y2="132" stroke="#2b3a4d" stroke-width="1"/>
  <text x="462" y="154" fill="#93a4b7" font-size="11" class="kr">자세</text>
  <text x="540" y="154" fill="#93a4b7" font-size="10.5">모로 누워 <tspan fill="#e6edf3">허리를 최대한 구부린다</tspan> — 가시돌기</text>
  <text x="540" y="168" fill="#6f8299" font-size="9.5">사이가 벌어져 들어갈 틈이 커진다</text>
  <text x="462" y="192" fill="#93a4b7" font-size="11" class="kr">높이</text>
  <text x="540" y="192" fill="#93a4b7" font-size="10.5"><tspan fill="#e6edf3">L3–L4</tspan> 또는 <tspan fill="#e6edf3">L4–L5</tspan> · Tuffier 선(엉덩뼈능선)이 L4</text>
  <text x="540" y="206" fill="#6f8299" font-size="9.5">소아는 척수가 L3까지 내려와 있어 더 아래로</text>
  <text x="462" y="230" fill="#93a4b7" font-size="11" class="kr">통과 층</text>
  <text x="540" y="230" fill="#93a4b7" font-size="10.5">피부 → 얕은근막 → <tspan fill="#e6edf3">가시위인대</tspan> → 가시사이인대</text>
  <text x="540" y="244" fill="#93a4b7" font-size="10.5">→ <tspan fill="#e6edf3">황색인대</tspan> → 경막바깥공간 → 경막 → 거미막</text>
  <text x="540" y="258" fill="#93a4b7" font-size="10.5">→ <tspan fill="#e6edf3">거미막밑공간</tspan>(여기서 뇌척수액)</text>
  <text x="462" y="284" fill="#93a4b7" font-size="11" class="kr">원칙</text>
  <text x="540" y="284" fill="#93a4b7" font-size="10.5">척수를 피한다 · 무균 · 바늘 경사면을 세로로</text>
  <text x="540" y="298" fill="#6f8299" font-size="9.5">(경막섬유를 가르지 않고 벌려 지나가 두통을 줄인다)</text>
  <text x="462" y="322" fill="#e0645f" font-size="11" class="kr">금기</text>
  <text x="540" y="322" fill="#93a4b7" font-size="10.5">머리속압 상승 · 천자 부위 감염 · 출혈경향</text>
  <text x="540" y="336" fill="#6f8299" font-size="9.5">머리속압이 높으면 뇌탈출 위험 — 먼저 영상</text>

  <!-- ================= 오른쪽 아래: 꼬리마취 ================= -->
  <rect x="446" y="364" width="416" height="200" rx="10" fill="#111d2c" stroke="#2b3a4d"/>
  <text x="462" y="388" fill="#eab308" font-size="13" class="kr">꼬리마취 — 목적과 방법</text>
  <line x1="462" y1="400" x2="846" y2="400" stroke="#2b3a4d" stroke-width="1"/>
  <text x="462" y="422" fill="#93a4b7" font-size="11" class="kr">무엇</text>
  <text x="540" y="422" fill="#93a4b7" font-size="10.5"><tspan fill="#e6edf3">엉치관 경막바깥마취</tspan> — 경막바깥공간의 꼬리쪽 입구</text>
  <text x="462" y="448" fill="#93a4b7" font-size="11" class="kr">목적</text>
  <text x="540" y="448" fill="#93a4b7" font-size="10.5">항문·회음·아랫배·다리 수술 진통 — <tspan fill="#e6edf3">소아에서 특히</tspan></text>
  <text x="540" y="462" fill="#6f8299" font-size="9.5">치핵·항문루 수술, 만성 허리통증의 경막바깥 주사</text>
  <text x="462" y="488" fill="#93a4b7" font-size="11" class="kr">지표</text>
  <text x="540" y="488" fill="#93a4b7" font-size="10.5"><tspan fill="#e6edf3">엉치뿔</tspan> 두 개 사이의 <tspan fill="#e6edf3">엉치뼈틈새</tspan>(S4–S5 뒤벽 결손)</text>
  <text x="540" y="502" fill="#6f8299" font-size="9.5">엎드리거나 옆으로 누워, 엉치뿔을 만져 확인</text>
  <text x="462" y="528" fill="#e0645f" font-size="11" class="kr">주의 ★</text>
  <text x="540" y="528" fill="#93a4b7" font-size="10.5">경막주머니는 <tspan fill="#e6edf3">S2</tspan>까지 — 너무 깊이 넣으면 거미막밑</text>
  <text x="540" y="542" fill="#93a4b7" font-size="10.5">주사가 되어 <tspan fill="#e6edf3">전척추마취</tspan>가 된다</text>

  <!-- ================= 하단 요약 ================= -->
  <rect x="18" y="580" width="844" height="100" rx="10" fill="#121e2e" stroke="#2b3a4d"/>
  <text x="34" y="604" fill="#e6edf3" font-size="12.5" font-weight="700">한 줄 정리 — 두 술기 모두 "끝나는 높이"를 알아야 안전하다</text>
  <text x="34" y="628" fill="#b49ae0" font-size="11" class="kr">척수 L1–L2</text>
  <text x="150" y="628" fill="#93a4b7" font-size="11">그래서 허리천자는 <tspan fill="#e6edf3">L3 아래</tspan> · 소아는 척수가 더 내려와 있어 한 마디 더 아래로</text>
  <text x="34" y="650" fill="#9578c4" font-size="11" class="kr">경막주머니 S2</text>
  <text x="150" y="650" fill="#93a4b7" font-size="11">그래서 꼬리마취는 <tspan fill="#e6edf3">엉치뼈틈새</tspan>에서 · 깊이 밀어 넣으면 거미막밑으로 들어간다</text>
  <text x="34" y="672" fill="#eab308" font-size="11" class="kr">지표</text>
  <text x="150" y="672" fill="#93a4b7" font-size="11">Tuffier 선(엉덩뼈능선) = <tspan fill="#e6edf3">L4</tspan> · 엉치뿔 사이 = <tspan fill="#e6edf3">엉치뼈틈새</tspan> — 만져서 찾는 두 지표</text>
</svg>
