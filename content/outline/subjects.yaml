# 과별 학습서의 「기본틀」 — 단원이 쌓이는 순서. 2026-09-21 사용자 지시로 만든다.
#
# 왜: 오답이 생기는 대로 정리본을 쓰면 심전도 → 심근경색 → 심근병증 → 다시 심전도 처럼 흩어진다.
# 이 파일이 각 과의 **읽는 순서**를 미리 정해 두면, 나중에 어떤 단원이 추가돼도 책 안에서 제자리에 꽂힌다.
#
# 순서의 기준: 해리슨 21판의 서술 순서(부 → 절 → 장). 장 번호·제목·쪽은 `harrison_toc.json` 에 이미 뽑혀 있어
# **순서를 정할 때 해리슨 PDF 를 다시 열지 않는다.** 정리본을 쓸 때도 그 슬롯의 `chapters` 가 가리키는
# 장만 읽으면 된다(`python pipelines/harrison_read.py --chapter N`).
#
# 항목 형식(순서대로 적은 것이 그대로 책의 순서다):
#   - chapters: "236-283"        → 그 범위의 **장마다 슬롯 하나**. id 는 h236…, 제목은 해리슨 장 제목.
#   - id: ob.normal-pregnancy    → 손으로 적는 슬롯 하나. 해리슨에 없는 과(산부인과·소아과·외과…)에 쓴다.
#     title: "정상 임신과 산전 관리"
#     chapters: "398"            → (선택) 해리슨에 관련 장이 있으면 적어 둔다. 읽을 곳을 바로 알 수 있다.
#
# 규칙
#   - 해리슨의 한 장은 **한 과에만** 넣는다(같은 장이 두 책에 슬롯으로 생기지 않게). outline.py 가 검사한다.
#   - 492개 장이 모두 어딘가에 배정돼야 한다. 빠지면 outline.py 가 오류를 낸다.
#   - 책 이름은 `pipelines/books_config.yaml` 의 books 값과 같아야 한다.
#   - 정리본은 frontmatter 의 `outline:` 에 슬롯 id 를 적는다. 없으면 책 맨 뒤 「배치 대기」로 간다(린터 WARN).

version: 1
harrison: content/outline/harrison_toc.json

