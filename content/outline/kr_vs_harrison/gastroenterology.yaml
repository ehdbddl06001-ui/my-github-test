- id: diff.gi.hcv.treatment-indication
  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2692]]'
  kr_guideline_id: kr-kasl-hcv-2025
  kr_cite: C형간염 진료가이드라인 2025(대한간학회) p.12
  diff_type: same
  topic: 치료 대상 — HCV RNA 양성이면 ALT·섬유화와 무관하게 모두
  harrison_says: '''Patients with chronic hepatitis C who have detectable HCV RNA in serum, whether or not aminotransferase levels are increased, and chronic hepatitis of any grade and stage are candidates for antiviral therapy with DAA agents. The only exception would be patients with short life expectancies''. 급성: ''Delaying the initiation of therapy in acute hepatitis C to allow for spontaneous recovery is no longer recommended.'''
  kr_says: 본문 'antiviral therapy is recommended for all individuals with detectable serum HCV RNA, regardless of ALT level.' [Recommendation] '1. Antiviral therapy should be offered to all patients with acute or chronic hepatitis C who do not have contraindications to treatment. (A1)' '3. Antiviral therapy is not recommended for patients with limited life expectancy due to non–liver-related comorbidities or those who are not candidates for liver transplantation and are unlikely to benefit from viral eradication. (B1)'
  kmle_rule: KMLE 문항·정리본은 HCV RNA 양성인 급성·만성 C형간염 모두를 ALT 와 무관하게 치료 대상으로 하고(A1), 간 외 질환으로 기대여명이 짧은 경우만 제외한다(B1).
