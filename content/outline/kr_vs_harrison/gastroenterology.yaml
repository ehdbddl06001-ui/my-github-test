  h22_cite: '[[harrison-22: 334장 p.2505]]'
  kr_guideline_id: kr-ksnm-gerd-seoul
  kr_cite: 2020 Seoul Consensus on the Diagnosis and Management of GERD(대한소화기기능성질환·운동학회) p.464
  diff_type: threshold
  topic: 보행성 pH 검사 — 산 노출 시간 비정상 기준 ≥4%(아시아) vs >6%
  harrison_says: '''the outcome is expressed as the percentage of the day that the pH was <4 (indicative of recent acid reflux), with values exceeding 6% indicative of GERD. Reflux testing is useful in the evaluation of patients presenting with atypical symptoms or an inexplicably poor response to therapy.'''
  kr_says: 'Statement 13: ''A value of total esophageal acid exposure time of ≥ 4% is defined as an abnormal finding in Asian adults.'' Level of evidence: moderate; Strength of recommendation: weak. (요약 p.453 초록: Lyon 합의의 ''proven GERD'' 는 AET > 6% 이나 ''some Asian researchers have different opinions on whether the same standards should be applied to the Asian population.'')'
  kmle_rule: KMLE 문항·정리본은 아시아(한국) 성인에서 식도 산 노출 시간 ≥4% 를 비정상으로 판정한다.
  usmle_rule: USMLE 문항은 pH <4 시간 비율 >6% 를 GERD 로 판정한다.
