  diff_type: first_line
  topic: 신기능 저하·골대사 질환 — TDF 회피, 대체 약 범위
  harrison_says: '''Between TDF and TAF, TAF is preferred in patients with creatinine clearance <50 mL/min, reduced bone density, and risk factors for renal injury (e.g., decompensated cirrhosis, creatinine clearance <60 mL/min, poorly controlled hypertension or diabetes, proteinuria, active glomerulonephritis, concomitant nephrotoxic medications, or solid-organ transplantation). ... the EASL recommendation for TAF extends to persons >60 years''.'
  kr_says: 'p.1055 ''TDF is not recommended for patients with underlying renal dysfunction or risk factors for bone metabolism diseases; instead, TAF, ETV, or BSV are recommended.'' 신기능 위험: ''glomerular filtration rate (GFR) <60 mL/min/1.73m², proteinuria or albuminuria (urine albumin-to-creatinine ratio >30 mg/g), hypophosphatemia (<2.5 mg/dL), uncontrolled diabetes or hypertension''. p.1057 [Recommendation] ''TAF, ETV, or BSV are preferentially recommended for patients who have pre-existing renal impairment or bone metabolic disease (A1), as well as for those at an increased risk of developing such conditions (B1).'''
  kmle_rule: KMLE 문항·정리본은 신기능 저하(GFR <60)·골대사 질환 또는 그 위험이 있으면 TDF 대신 TAF·ETV·besifovir 를 우선 쓴다(A1/B1).
  usmle_rule: USMLE 문항은 신손상 위험·골밀도 저하 환자에서 TDF 보다 TAF 를 고른다(CrCl <50 등).
  verified: text
- id: diff.gi.hbv.pregnancy-mtct
  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2683]]'
  kr_guideline_id: kr-kasl-hbv-2026
  kr_cite: 만성 B형간염 진료가이드라인 2026(대한간학회) p.1085
  diff_type: threshold
  topic: 임신부 수직감염 예방 — HBV DNA ≥200,000 IU/mL · 24~32주 tenofovir
  harrison_says: 'p.2683 ''Tenofovir is the current drug of choice in pregnancy.'' (entecavir 는 ''Data on the safety of entecavir during pregnancy have not been published''). 수직감염 예방 기준치는 제시하지 않음 — p.2677 lamivudine 단락: ''administration of lamivudine during the last months of pregnancy to mothers with high-level hepatitis B viremia reduced the likelihood of perinatal transmission of hepatitis B.'''
  kr_says: '[Recommendation] ''1. ... TDF or TAF is recommended as the first-line agent. (A1)'' ''3. In pregnant women with CHB who are not receiving antiviral therapy, breastfeeding should not be restricted after delivery. (B1)'' ''4. In pregnant women with serum HBV DNA levels ≥200,000 IU/mL, antiviral therapy during pregnancy should be initiated to prevent vertical transmission. (A1) For the purpose of preventing vertical transmission, antiviral therapy is ideally started before 28 weeks of gestation and is recommended to begin between 24 and 32 weeks, with continuation until 2–12 weeks postpartum. (B1)'''
  kmle_rule: KMLE 문항·정리본은 임신부 HBV DNA ≥200,000 IU/mL 이면 수직감염 예방을 위해 TDF 또는 TAF 를 임신 24~32주(이상적으로 28주 전)에 시작해 분만 후 2~12주까지 유지한다(A1/B1).
  usmle_rule: USMLE 문항은 임신 중 B형간염 항바이러스제로 tenofovir 를 고르고, 고바이러스혈증 산모에서 임신 후기 투여가 수직감염을 줄인다는 해리슨 서술을 따른다(수치 기준은 해리슨 352장에 없음).
