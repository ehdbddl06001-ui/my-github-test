  diff_type: same
  topic: 예방적 항생제 — 중증·괴사성에서도 일상 사용 안 함
  harrison_says: 'p.2746: ''Prophylactic antibiotics are no longer recommended for severe acute pancreatitis.'' p.2749: ''there is currently no role for prophylactic antibiotics in necrotizing pancreatitis, empiric antibiotics should be considered in those with clinical decompensation. Prophylactic antibiotics do not lead to improved survival and may promote the development of opportunistic fungal infections.'''
