  harrison_says: '''Nonetheless, the dominant clinical strategy is empirical treatment with acid inhibitors, reserving further evaluation for those who fail to respond. Important exceptions to this are patients with chest pain or persistent dysphagia'' — PPI 시험 기간·용량은 명시하지 않음.'
  kr_says: 'Statement 9: ''A 2-week trial of a standard dose of proton pump inhibitor should be recommended as a sensitive and practical test for gastroesophageal reflux disease diagnosis in patients with typical gastroesophageal reflux disease symptoms.'' Level of evidence: moderate; Strength of recommendation: strong. 메타분석 PPI test 민감도 0.78, 특이도 0.40.'
