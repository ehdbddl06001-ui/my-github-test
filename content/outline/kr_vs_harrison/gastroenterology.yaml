- id: diff.gi.cirrhosis.lvp-albumin
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2715]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 복수 및 관련 합병증 2026(대한간학회) p.973-974'
  diff_type: same
  topic: 대량 복수천자(>5 L) 때 알부민 6–8 g/L
  harrison_says: '''After LVP of ≥5 L, IV 25% albumin at a dose of 6–8 g/L of removed ascites should be given to prevent circulatory dysfunction.'' 불응성 복수에는 ''repeated large-volume paracentesis (LVP) or a TIPS procedure should be considered''.'
  kr_says: 'p.974 [Recommendations] 5. ''For patients with tense ascites, large-volume paracentesis (LVP) is the first-line treatment. (A1) During LVP, intravenous albumin infusion at a dose of 6–8 g per liter of ascitic fluid removed is recommended. (A1)'' p.973: ''LVP is defined as the removal of more than 5 L of ascitic fluid in a single procedure''.'
  kmle_rule: KMLE 문항·정리본은 긴장성 복수의 1차 치료를 대량 복수천자(1회 5 L 초과)로 하고, 제거한 복수 1 L 당 알부민 6–8 g 을 정맥 투여한다.
  usmle_rule: USMLE 문항은 ≥5 L LVP 뒤 albumin 6–8 g/L 투여를 적용한다.
