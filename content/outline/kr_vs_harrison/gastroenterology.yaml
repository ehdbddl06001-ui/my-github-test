  harrison_says: '표 337-6 ''Diseases That Mimic IBD'' 의 Infectious Etiologies — Mycobacterial: ''Tuberculosis'', ''Mycobacterium avium'' 을 나열할 뿐, 장결핵과 크론병을 가르는 내시경 소견이나 시험적 항결핵 치료 절차는 서술하지 않음.'
  kr_says: '권고문 1.2: ''특히 크론병의 감별 진단 시 장결핵을 고려해야 하며'' (동의율 100% — 이 지침은 권고 강도·근거 수준 없이 델파이 동의율만 표기). 본문: ''4개 미만의 대장 분절 침범, 개방된 회맹판, 횡행 궤양, 그리고 가성 용종은 CD보다 ITB를 시사하는 내시경 소견''; 확진은 ''항산균 도말 검사, M. tuberculosis 배양 검사 또는 건락성 육아종'', ''M. tuberculosis PCR 검사와 ... IGRA는 유용한 보조 진단 검사'' 이나 단독으로 배제·확진에 한계; ''ITB와 CD의 감별이 어려운 경우에는 시험적 항결핵 치료 2–3개월 후 임상 증상과 함께 추적 대장내시경검사를 시행하여 치료 반응을 재평가하는 방법을 고려할 수 있다.'''
  kmle_rule: KMLE 문항·정리본은 회맹부 궤양에서 장결핵을 먼저 감별하고(횡행 궤양·개방된 회맹판·4개 미만 분절·건락성 육아종 → 장결핵), 감별이 안 되면 시험적 항결핵 치료 2–3개월 후 추적 대장내시경으로 반응을 본다고 적용한다.
