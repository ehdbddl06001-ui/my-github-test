  kr_says: p.7 'Routine prenatal HCV screening is not universally recommended unless the pregnant woman has identifiable risk factors.' p.35 'In Korea, given the increasing adoption of universal HCV screening, screening may be considered during prenatal care for pregnant women with identifiable risk factors.' — 선별 문장엔 권고 등급 표기 없음. 임신 중 치료는 p.36 [Recommendation] 'may be considered on an individual basis ... (B2)'.
