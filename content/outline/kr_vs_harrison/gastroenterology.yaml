  diff_type: same
  topic: 간경변 B형간염 — HBV DNA 검출되면 ALT 와 무관하게 치료
  harrison_says: p.2682 'For patients with compensated cirrhosis ... treatment is recommended regardless of HBeAg status and ALT as long as HBV DNA is detectable. ... For patients with decompensated cirrhosis, treatment is recommended regardless of serologic and biochemical status, as long as HBV DNA is detectable. In addition, patients with decompensated cirrhosis should be evaluated as candidates for liver transplantation.' p.2683 간경변에는 'PEG IFN should not be used'.
  kr_says: '[Recommendation] ''In patients with compensated cirrhosis, antiviral therapy is recommended if serum HBV DNA is detectable, regardless of the level of viremia (HBV DNA ≥2,000 IU/mL [A1]; <2,000 IU/mL [B1]).'' / ''In patients with decompensated cirrhosis, antiviral therapy should be initiated when serum HBV DNA is detectable, and liver transplantation should be considered in the event of progression to liver failure. (A1)'''
