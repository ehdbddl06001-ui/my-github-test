- id: diff.gi.gerd.long-term-maintenance
  slot: h323
  h22_chapter: 334
  h22_cite: '[[harrison-22: 334장 p.2511]]'
  kr_guideline_id: kr-ksnm-gerd-seoul
  kr_cite: 2025 Focused Update of the Seoul Consensus on GERD(대한소화기기능성질환·운동학회) p.12-15
  diff_type: algorithm
  topic: 장기 유지 — 표현형별 on-demand/지속 요법과 최저 유효 용량
  harrison_says: '''Reflux symptoms tend to be chronic, irrespective of esophagitis. Thus, a common management strategy is indefinite treatment with PPIs or H2RAs as necessary for symptom control.'' ''... as with any medication, PPI dosage should be minimized to that necessary for the clinical indication.'' 표현형별 on-demand/지속 구분 없음.'
  kr_says: 'Statement 4(p.12): ''On-demand therapy with proton pump inhibitor or potassium-competitive acid blocker is recommended for the long-term management of patients with non-erosive reflux disease or mild erosive esophagitis.'' moderate; weak. Statement 5(p.13): ''Continuous daily therapy with potassium-competitive acid blocker or proton pump inhibitor is proposed for the long-term management of patients with severe erosive esophagitis.'' low; weak. Statement 6(p.15): ''The lowest effective dose that controls symptoms and maintains mucosal healing is recommended ...'' low; weak.'
  kmle_rule: KMLE 문항·정리본은 NERD·경증 EE 는 필요시(on-demand) 요법, 중증 EE 는 매일 지속 요법으로 유지하고, 모두 최저 유효 용량을 쓴다.
  usmle_rule: USMLE 문항은 증상 조절에 필요한 만큼 PPI/H2RA 를 장기 사용하되 용량을 최소화한다는 해리슨 서술을 따른다.
  verified: text
