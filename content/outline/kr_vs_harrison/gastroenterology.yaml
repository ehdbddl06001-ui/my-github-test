- id: diff.gi.hcv.decompensated-cirrhosis
  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2692]]'
  kr_guideline_id: kr-kasl-hcv-2025
  kr_cite: C형간염 진료가이드라인 2025(대한간학회) p.28
  diff_type: same
  topic: 비대상성 간경변 C형간염 — SOF/VEL + ribavirin 12주, PI 금기
  harrison_says: '''protease-inhibitor-containing combinations have been associated with potential hepatotoxicity and hepatic decompensation and are contraindicated in this patient subset. ... in ribavirin-eligible patients, ribavirin is added to a 12-week course of sofosbuvir-NS5A therapy; however, in cases of ribavirin ineligibility, the duration of therapy should be extended to 24 weeks. ... patients with decompensated cirrhosis should be referred to a liver transplantation center.'''
  kr_says: '[Recommendation] ''1. All patients with decompensated cirrhosis (Child–Pugh class B or C) who are HCV RNA positive should be referred to a hepatology specialist or a liver transplantation center. (C1)'' ''4. Protease inhibitors should be avoided in patients with decompensated cirrhosis due to the increased risk of adverse events. (A1)'' ''5. Patients with decompensated cirrhosis should be treated with a combination regimen of sofosbuvir/velpatasvir and ribavirin. Ribavirin should be initiated at 600 mg and titrated up to 1,200 mg in patients weighing ≥75 kg or to 1,000 mg in those weighing <75 kg. The total treatment duration should be 12 weeks. (A1) If ribavirin is contraindicated or not tolerated, a 24-week course of sofosbuvir/velpatasvir monotherapy is recommended. (A1)'' (6번: 유전자형 1·2형은 SOF/VEL 단독 12주도 대안, B2).'
  kmle_rule: KMLE 문항·정리본은 비대상성 간경변(Child–Pugh B·C)에서 단백분해효소 억제제를 피하고 sofosbuvir/velpatasvir + ribavirin 12주(ribavirin 불가 시 SOF/VEL 24주)를 쓰며 간이식 센터로 의뢰한다.
  usmle_rule: USMLE 문항은 비대상성 간경변에 protease inhibitor(glecaprevir 등) 금기, sofosbuvir-NS5A + ribavirin 12주(불가 시 24주)를 적용한다.
