  harrison_says: 'p.648~649: ''for most medically fit patients with stage cTNM II and III resectable gastric cancers, preoperative systemic chemotherapy followed by resection and, if tolerable, postoperative chemotherapy is a standard approach.'' ''... a platinum compound plus a fluorinated pyrimidine, such as fluorouracil or capecitabine, given for three to four cycles before surgery is a standard-of-care option. Drug combinations are favored; for very fit patients, a combination of FLOT may be chosen.'' 수술을 먼저 한 경우: ''who are found to have stage II or III cancers, or who have <15 lymph nodes ... postoperative chemotherapy or chemoradiation is a treatment option.'''
  kr_says: 'Statement 23(p.57): ''Adjuvant chemotherapy (S-1 or capecitabine and oxaliplatin [CAPOX]) is recommended in patients with pathological stage II or III gastric cancer (evidence: high, recommendation: strong for).'' Statement 24(p.59): ''NCT as part of perioperative chemotherapy can be considered for patients with resectable locally AGC (evidence: high, recommendation: conditional for).'' 근거 임상시험은 PRODIGY(DOS)·RESOLVE(SOX). p.60: ''FLOT ... have not been investigated in Asian populations. Therefore, FLOT should not be adopted in Asia without further evidence.'''
  kmle_rule: KMLE 문항·정리본은 근치적 D2 위절제 후 병리 2·3기에 보조항암 S-1(1년) 또는 CAPOX 를 표준(강한 권고)으로 적용하고, 수술 전 항암(DOS·SOX)은 조건부 선택지로, FLOT 는 국내 근거 없음으로 적는다.
  usmle_rule: USMLE 문항은 cTNM II·III 절제 가능 위암에서 수술 전 백금+플루오로피리미딘(건강하면 FLOT) 항암 → 절제 → 가능하면 수술 후 항암을 표준으로 본다.
