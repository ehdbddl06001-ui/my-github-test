  harrison_says: 개정 Atlanta 분류 'mild, moderately severe, and severe'. 'Moderately severe acute pancreatitis is characterized by transient organ failure ... in the absence of persistent organ failure.' 'Severe acute pancreatitis is characterized by persistent organ failure (>48 h), involving one or more organs.'
