- id: diff.gi.cirrhosis.hepatic-encephalopathy
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2717]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 정맥류·간성뇌증 2019(대한간학회) p.106-107'
  diff_type: algorithm
  topic: 간성뇌증 — 락툴로오스 1차, 재발 예방에 리팍시민 단독도 허용 vs 리팍시민은 보조
  harrison_says: '''The mainstay of treatment for encephalopathy is to use lactulose ... The goal of lactulose therapy is to promote two to three soft stools per day.'' ''Poorly absorbed antibiotics are often used as adjunctive therapies for patients who have a difficult time with lactulose or in those with recurrent episodes. Rifaximin ... The dose is 550 mg twice daily and is very effective in preventing recurrent encephalopathy.'' 단백 제한은 ''the negative impact of that maneuver on overall nutrition is thought to outweigh the benefit, and it is thus strongly discouraged'' (p.2716–2717).'
  kr_says: 'p.106 [Recommendations] 1. 유발 인자 교정(A1). 2. ''To manage acute episodic overt HE, non-absorbable disaccharides (e.g., lactulose, lactitol) are recommended. Enema is recommended in severe HE (West Haven criteria grade ≥3) or a clinical situation in which oral intake is inappropriate. (A1)'' 3. ''Rifaximin might be combined with non-absorbable disaccharides to treat patients with HE. (B1)'' p.107: ''A nonabsorbable disaccharide (lactulose, lactitol) or rifaximin, as single or combined therapy, is recommended for the prevention of overt HE recurrence. (A1)'' ''Long-term protein restriction should be avoided (B1)''.'
  kmle_rule: KMLE 문항·정리본은 현성 간성뇌증을 유발 인자 교정 + 락툴로오스(락티톨)로 치료하고(West Haven ≥3 이면 관장), 재발 예방은 락툴로오스·리팍시민 단독 또는 병합으로 적용하며 장기 단백 제한은 하지 않는다(2019 정맥류·간성뇌증 지침).
  usmle_rule: USMLE 문항은 lactulose(하루 2–3회 무른 변)를 1차로, rifaximin 550 mg bid 를 반복·락툴로오스 불내 시 추가 약으로 적용한다.
  verified: text
- id: diff.gi.masld.cardiometabolic-criteria
  slot: h343
  h22_chapter: 354
  h22_cite: '[[harrison-22: 354장 p.2702]]'
  kr_guideline_id: kr-kasl-masld-2025
  kr_cite: MASLD 진료지침 2025(대한간학회) p.S7
  diff_type: threshold
  topic: MASLD 심장대사 위험인자 — 한국인 BMI·허리둘레 기준
  harrison_says: 'p.2700: MASLD 는 ''hepatic steatosis, drink little alcohol ... and have one or more cardiometabolic risk factors (e.g., overweight/obesity, hypertension, dyslipidemia, insulin resistance/type 2 diabetes)'' — 위험인자별 수치(BMI·허리둘레 절단값)는 본문에 제시하지 않음. p.2702: 마른 MASLD 를 ''lean (body mass index [BMI] <25 kg/m2 or <23 kg/m2)'' 로 적고 ''particularly common in individuals of Asian ethnicity''.'
  kr_says: '본문: 심장대사 위험인자 5개 중 1개 이상 — ''(1) BMI ≥23 kg/m² in Koreans and Asians or ≥25 kg/m² in Western populations; or a waist circumference ≥90 cm for men and ≥85 cm for women in Korea, or ≥94 cm for men and ≥80 cm for women according to the World Health Organization (WHO), (2) fasting blood glucose ≥100 mg/dL, postprandial 2-h blood glucose ≥140 mg/dL, HbA1c ≥5.7% ... (3) blood pressure ≥130/85 mmHg ... (4) triglycerides ≥150 mg/dL ... or HDL-C <40 mg/dL for men and <50 mg/dL for women''. ''considering the average waist circumference of Korean adults, the criteria in Korea are set at ≥90 cm for men and ≥85 cm for women.'' 진단 요약(p.S9): 영상 또는 생검으로 지방증 + 심장대사 위험인자 1개 이상 + 유의한 음주 없음 — 권고 등급 없는 Summary.'
  kmle_rule: KMLE 문항·정리본은 MASLD 심장대사 위험인자의 비만 기준을 BMI ≥23 kg/m² 또는 허리둘레 남 ≥90 cm·여 ≥85 cm(한국 기준)로 적용한다.
  usmle_rule: USMLE 문항은 지방간 + 심장대사 위험인자 1개 이상(비만·고혈압·이상지질혈증·인슐린저항성/T2DM) + 적은 음주를 MASLD 로 보고, 서양 BMI 기준(≥25)을 기본으로 한다.
  verified: text
- id: diff.gi.masld.alcohol-thresholds-metald
  slot: h343
  h22_chapter: 354
  h22_cite: '[[harrison-22: 354장 p.2702]]'
  kr_guideline_id: kr-kasl-masld-2025
  kr_cite: MASLD 진료지침 2025(대한간학회) p.S8
  diff_type: same
  topic: MASLD·MetALD·ALD 음주량 경계
  harrison_says: 'p.2702: ''A diagnosis of MASLD requires ... an individual who drinks little to no alcohol (i.e., ≤20 g/d for women; ≤30 g/d for men).'' ''a new diagnostic category, MetALD, was recently created ...'' ''Hazardous alcohol consumption (≥50 g/d for women; ≥60 g/d for men) is defined as ALD irrespective of the presence of hepatic steatosis and/or metabolic syndrome.'' p.2700: MetALD = ''consume social amounts of alcohol (20–50 g/d for woman; 30–60 g/d for men)''.'
  kr_says: 'p.S8: ''MASLD with increased alcohol consumption (MetALD), which refers to moderate alcohol intake, defined as 30–60 g/day for men and 20–50 g/day for women; alcohol-related liver disease (ALD), associated with either significant alcohol consumption in the absence of cardiometabolic risk factors or excessive alcohol consumption in the presence of cardiometabolic risk factor(s)''. 그림 2(p.S7) 알고리즘: ''Alcohol consumption >30 g/day (M), >20 g/day (F)'' → MetALD, ''>60 g/day (M), >50 g/day (F)'' → ALD. 표 2(p.S8): MASLD 음주량 ''<30 g/day (M), 20 g/day (F)'' — 권고 등급 없음.'
  kmle_rule: KMLE 문항·정리본은 MASLD 음주 상한을 남 30 g/일·여 20 g/일 미만으로, MetALD 를 남 30–60 g/일·여 20–50 g/일로, 그 이상을 ALD 로 적용한다.
  usmle_rule: USMLE 문항은 같은 경계(MASLD <30/20 g/d, MetALD 30–60/20–50 g/d, ALD ≥60/50 g/d)를 적용한다.
