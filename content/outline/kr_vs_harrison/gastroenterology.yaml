- id: diff.gi.hbv.moderate-viremia-indication
  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2681]]'
  kr_guideline_id: kr-kasl-hbv-2026
  kr_cite: 만성 B형간염 진료가이드라인 2026(대한간학회) p.1052
  diff_type: threshold
  topic: 비간경변 만성 B형간염 치료 시작 — HBV DNA 단독(≥2,000 IU/mL) vs HBeAg·DNA·ALT 조합
  harrison_says: 'p.2681 ''In patients with detectable HBeAg and HBV DNA levels >2 × 10^4 IU/mL, treatment is recommended by the AASLD for those with ALT levels >2× the upper limit of normal. (The EASL recommends treatment in HBeAg-positive patients for HBV DNA levels >2 × 10^3 IU/mL and ALT above the upper limit of normal.)'' p.2682 HBeAg 음성: ''antiviral therapy is recommended if ALT is >2× the upper limit of normal (above the upper limit of normal according to EASL) and HBV DNA is >2 × 10^3 IU/mL.'' ALT ≤2× ULN 의 ''gray zone'' 은 HBV DNA·ALT 를 3~6개월마다 감시.'
  kr_says: 'p.1051 종래 기준(HBeAg 양성 ≥20,000, 음성 ≥2,000 IU/mL + ALT >2× ULN)을 ''an ALT-centered framework for disease classification and treatment strategy may be insufficient for effective HCC prevention'' 으로 보고 HBV DNA 로 단계를 새로 나눔. p.1052 [Recommendation] ''In patients with moderate viremia (serum HBV DNA ≥2,000 IU/mL and ≤8 log10 IU/mL), antiviral therapy is recommended, as they are at high risk for liver disease progression and HCC. (B1)'' 본문: ''regardless of ALT levels or other risk factors''. p.1053 저바이러스혈증(<2,000 IU/mL)은 간경변이 없으면 치료 없이 감시 (B1).'
  kmle_rule: KMLE 문항·정리본은 간경변 없는 만성 B형간염에서 HBV DNA 2,000 IU/mL 이상~8 log10 IU/mL 이하(중등도 바이러스혈증)이면 ALT·HBeAg 와 무관하게 항바이러스 치료를 권고한다(대한간학회 2026, B1).
  usmle_rule: USMLE 문항은 AASLD 기준 — HBeAg 양성 HBV DNA >20,000 IU/mL, 음성 >2,000 IU/mL 이면서 ALT >2× ULN 일 때 치료, 그 사이(gray zone)는 나이 >40·가족력·섬유화로 결정 — 을 적용한다.
  verified: text
- id: diff.gi.hbv.high-viremia-age
  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2682]]'
  kr_guideline_id: kr-kasl-hbv-2026
  kr_cite: 만성 B형간염 진료가이드라인 2026(대한간학회) p.1050
  diff_type: threshold
  topic: 면역관용기(고바이러스혈증·정상 ALT) 치료 고려 나이 — 30세 vs 40세
  harrison_says: p.2681 'Nor is treatment recommended currently for HBeAg-positive chronic hepatitis B with normal ALT (labeled by some as reflecting a relatively "immune-tolerant" phase ...)'. p.2682 gray zone 에서도 'therapy would be considered for patients >40 years of age, with extrahepatic manifestations of HBV infection, or with a family history of cirrhosis or HCC; patients whose liver biopsy or noninvasive testing shows moderate to severe necroinflammatory activity or fibrosis'.
  kr_says: '[Recommendation] ''In patients with high viremia (serum HBV DNA >8 log10 IU/mL), antiviral therapy should be considered in those older than 30 years, those with elevated liver enzymes, or those with significant liver fibrosis. In the absence of these risk factors for disease progression or HCC, close monitoring is recommended. (B1)'' (p.1048 그림 2 각주: ''ALT >ULN, age >30 years, or significant fibrosis (≥F2)'').'
  kmle_rule: KMLE 문항·정리본은 HBV DNA >8 log10 IU/mL(고바이러스혈증)에서 나이 30세 초과·ALT 상승·유의한 섬유화(≥F2) 중 하나가 있으면 치료를 고려하고, 없으면 면밀히 감시한다(대한간학회 2026, B1).
  usmle_rule: USMLE 문항은 HBeAg 양성·정상 ALT(immune-tolerant)는 치료하지 않고 감시하며, 나이 >40·가족력·섬유화가 있을 때 치료를 고려한다(AASLD).
