  harrison_says: 'p.2566: ''All of the anti-TNF drugs are associated with an increased risk of infections, particularly reactivation of latent tuberculosis ... Patients should have a purified protein derivative (PPD) or a QuantiFERON-TB Gold test before initiation of anti-TNF therapy.'' 표 337-9(p.2568) infliximab 등: ''Prior to infusion: TB testing''.'
