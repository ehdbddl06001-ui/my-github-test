  usmle_rule: USMLE 문항은 vitamin E 가 조직학적 지방간염을 개선하나 섬유화 효과가 없고 장기 안전성 우려(출혈성 뇌졸중·전립선암)가 있다는 해리슨 서술을 따른다.
