  slot: h323
  h22_chapter: 334
  h22_cite: '[[harrison-22: 334장 p.2511]]'
  kr_guideline_id: kr-ksnm-gerd-seoul
  kr_cite: 2020 Seoul Consensus on the Diagnosis and Management of GERD(대한소화기기능성질환·운동학회) p.465
