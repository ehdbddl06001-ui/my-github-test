- id: diff.gi.gastric-cancer.esd-absolute-indication
  slot: h80
  h22_chapter: 85
  h22_cite: '[[harrison-22: 85장 p.647]]'
  kr_guideline_id: kr-kgca-gastric-cancer
  kr_cite: Korean Practice Guideline for Gastric Cancer 2024(대한위암학회) p.25
  diff_type: threshold
  topic: 조기위암 내시경 절제 절대 적응증 — 점막암·궤양 없음 vs 깊은 점막하층 침범 없음
  harrison_says: '''For selected very-early-stage gastric cancers (primary tumors that are ≤2 cm in diameter, are well to moderately differentiated, do not invade the deep submucosa [T1], and do not show lymphovascular invasion or lymph node metastasis), which are not commonly found in the United States, EMR or ESD may be performed by experienced gastroenterologists in place of surgical resection''. 궤양 유무는 기준에 넣지 않았다.'
  kr_says: 'Statement 4: ''Endoscopic resection is recommended for well or moderately differentiated tubular or papillary EGCs meeting the following endoscopic findings: endoscopically estimated tumor size ≤2 cm, endoscopically mucosal cancer, and no ulcer in the tumor (evidence: moderate, recommendation: strong for).'' 본문은 이를 ''classical absolute indication'' 이라 부른다.'
  kmle_rule: KMLE 문항·정리본은 분화형(고·중분화 관상/유두상)·내시경상 점막암·2 cm 이하·궤양 없음을 내시경 절제 절대 적응증으로 적용한다(근거 보통·강한 권고).
  usmle_rule: USMLE 문항은 ≤2 cm·well/moderately differentiated·깊은 점막하층 침범 없음·림프혈관 침범/림프절 전이 없음인 매우 이른 위암에서 EMR/ESD 를 수술 대신 쓸 수 있다는 해리슨 서술을 따른다.
  verified: text
- id: diff.gi.gastric-cancer.esd-expanded-indication
  slot: h80
  h22_chapter: 85
  h22_cite: '[[harrison-22: 85장 p.647]]'
  kr_guideline_id: kr-kgca-gastric-cancer
  kr_cite: Korean Practice Guideline for Gastric Cancer 2024(대한위암학회) p.26
  diff_type: algorithm
  topic: 조기위암 ESD 확대 적응증 — 국내 지침만 제시
  harrison_says: ESD/EMR 적응은 '≤2 cm ... well to moderately differentiated' 한 가지 묶음만 제시하고, 그런 병변은 'not commonly found in the United States' 이며 'favorable results in studies in high-incidence areas such as Japan' 이라고만 적는다. 2 cm 초과·궤양 동반·미분화형에 대한 확대 적응증은 서술하지 않는다.
  kr_says: 'Statement 5: ''ESD as well as gastrectomy with LN dissection can be indicated for well or moderately differentiated tubular or papillary EGCs meeting the following endoscopic findings: endoscopically estimated tumor size >2 cm, endoscopically mucosal cancer, and no ulcer in the tumor, or endoscopically estimated tumor size ≤3 cm, endoscopically mucosal cancer, and ulcer in the tumor (evidence: moderate, recommendation: strong for).'' Statement 6(p.27): 미분화형(poorly differentiated tubular·poorly cohesive 포함 signet-ring) ''≤2 cm, endoscopically mucosal cancer, and no ulcer'' 은 ''could be cautiously considered ... after sufficient discussion'' (근거 낮음·조건부 권고).'
  kmle_rule: KMLE 문항·정리본은 분화형 점막암으로 궤양 없으면 크기 무관(>2 cm), 궤양 있으면 3 cm 이하를 ESD 확대 적응증으로 적용하고, 미분화형은 2 cm 이하·점막암·궤양 없음일 때만 신중히 고려한다고 적는다.
  usmle_rule: USMLE 문항은 해리슨의 단일 기준(≤2 cm·분화형·깊은 점막하층 침범 없음)을 넘는 병변은 수술적 절제를 기본으로 본다.
  verified: text
- id: diff.gi.gastric-cancer.lymphadenectomy-extent
  slot: h80
  h22_chapter: 85
  h22_cite: '[[harrison-22: 85장 p.648]]'
  kr_guideline_id: kr-kgca-gastric-cancer
  kr_cite: Korean Practice Guideline for Gastric Cancer 2024(대한위암학회) p.48
  diff_type: algorithm
  topic: 위암 림프절 절제 범위 — D2 표준(조기위암 D1+) vs 미국 modified D2(D1+)
  harrison_says: '''The goal is to examine at least 15 lymph nodes from the resected specimen ... In the United States, a modified D2 (D1+) resection preserving the spleen and avoiding pancreatectomy is recommended but should be performed by experienced surgeons at high-volume centers. Japanese investigators and others have used very extensive lymph node dissections, but studies have not demonstrated an advantage for a D3 resection.'' ''Sentinel lymph node biopsy is not performed in gastric cancer outside of a research study setting.'''
  kr_says: 'Statement 17: ''D1+ dissection can be performed during surgery for EGC (cT1N0) patients in terms of survival outcomes (evidence: low, recommendation: strong for).'' 본문: ''D2 dissection has been considered the standard LN dissection based on long-term survival data of the Dutch trial.'' p.57: ''Surgical resection with D2 LN dissection is the standard treatment for gastric cancer.'' (참고: Statement 18 은 cT1N0·≤3 cm 에서 감시림프절 항법수술을 조건부로 고려 가능하다고 한다.)'
  kmle_rule: KMLE 문항·정리본은 진행위암의 표준 림프절 절제를 D2 로, 조기위암(cT1N0)은 D1+ 절제도 가능(근거 낮음·강한 권고)으로 적용한다.
  usmle_rule: USMLE 문항은 미국 기준인 비장 보존·췌장 절제 없는 modified D2(D1+)와 림프절 15개 이상 검사를 적용한다.
