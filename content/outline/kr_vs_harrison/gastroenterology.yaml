  harrison_says: '''In general, minimal evidence supports the efficacy of these measures ... The most broadly applicable recommendation is for weight reduction. Even though the benefit with respect to reflux cannot be assured, the strong epidemiologic relationship between body mass index and GERD and the secondary health gains of weight reduction is beyond dispute.'' 야간 증상은 침대 머리 올리기·취침 전 식사 피하기.'
