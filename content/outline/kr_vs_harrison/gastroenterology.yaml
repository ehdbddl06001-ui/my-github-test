- id: diff.gi.masld.vitamin-e
  slot: h343
  h22_chapter: 354
  h22_cite: '[[harrison-22: 354장 p.2706]]'
  kr_guideline_id: kr-kasl-masld-2025
  kr_cite: MASLD 진료지침 2025(대한간학회) p.S19
  diff_type: first_line
  topic: MASH 의 vitamin E — 비당뇨 한정 권고 vs 안전성 우려
  harrison_says: 'p.2706: PIVENS 에서 ''RRR-α-tocopherol ... 800 IU daily for 96 weeks improved histologic features of steatohepatitis without worsening of fibrosis (43% ... vs 19%)''; ''no study has demonstrated an antifibrotic effect with vitamin E''; ''Enthusiasm for use of vitamin E for treatment of NASH has been dampened by concerns of the risk-to-benefit ratio for safety (i.e., risk of perioperative bleeding, hemorrhagic stroke, increased cardiac mortality, and prostate cancer)'' (p.2707 이어짐). 당뇨 유무로 대상을 나누는 권고 문장은 없음.'
  kr_says: '[Recommendation] ''Vitamin E can be expected to improve steatohepatitis in patients with MASH without T2DM, and pioglitazone can be expected to improve steatohepatitis in patients with MASH regardless of T2DM. However, their effects on improving liver fibrosis are not clear. (B2)'' 본문(p.S16): 장기 투여 시 전립선암·출혈성 뇌졸중, 고용량(>400 IU/day) 사망률 증가 가능성에 주의.'
