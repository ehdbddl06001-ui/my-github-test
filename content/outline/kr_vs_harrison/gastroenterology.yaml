  harrison_says: '''Surveillance is recommended for cirrhotic patients owing to any cause, those with HCV-related advanced fibrosis, and patients with chronic HBV infection if Asian aged >40 years, African aged >20 years, family history of HCC, or patients with sufficient risk by risk scores such as PAGE-B.'' 또 ''the presence of advanced cirrhosis (Child-Pugh class C) prevents potentially curative therapies from being employed, and thus surveillance is not recommended'' (이식 대기자는 예외).'
