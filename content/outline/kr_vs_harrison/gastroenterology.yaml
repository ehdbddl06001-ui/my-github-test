  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2693]]'
  kr_guideline_id: kr-kasl-hcv-2025
  kr_cite: C형간염 진료가이드라인 2025(대한간학회) p.29
  diff_type: first_line
  topic: 중증 신기능 저하·투석 — 권고 DAA 와 G/P 기간
  harrison_says: '''For patients with severe renal impairment (creatinine clearances <30 mL/min), including those undergoing hemodialysis, recommended combinations are 12 weeks of elbasvir-grazoprevir for genotypes 1 and 4 or 12 weeks of glecaprevir-pibrentasvir for all genotypes. ... sofosbuvir-containing regimens were approved by the FDA in November 2019 for patients with severe renal impairment.'''
  kr_says: '[Recommendation] ''1. In patients with CKD and concurrent HCV infection, treatment with sofosbuvir/velpatasvir or glecaprevir/pibrentasvir is recommended. The treatment duration should follow that used for patients with normal renal function. (A1)'' ''2. In patients with a history of decompensated complications or decompensated cirrhosis (Child–Pugh class B or C) and severe renal impairment (eGFR <30 mL/min/1.73 m²), a 12-week course of sofosbuvir/velpatasvir with low-dose ribavirin (200 mg/day) is recommended. ... (B1)'' (p.16: ''no dose adjustment is currently needed in patients with CKD, regardless of severity'').'
  kmle_rule: KMLE 문항·정리본은 투석을 포함한 CKD 동반 C형간염에 sofosbuvir/velpatasvir 또는 glecaprevir/pibrentasvir 를 정상 신기능과 같은 기간(SOF/VEL 12주 · G/P 8주)으로 쓴다(A1).
  usmle_rule: USMLE 문항은 CrCl <30·투석 환자에 glecaprevir-pibrentasvir(전 유전자형) 또는 elbasvir-grazoprevir(1·4형) 12주를 고르되, sofosbuvir 포함 요법도 2019년 승인되었음을 안다.
