- id: diff.gi.masld.resmetirom-f2-f3
  slot: h343
  h22_chapter: 354
  h22_cite: '[[harrison-22: 354장 p.2706]]'
  kr_guideline_id: kr-kasl-masld-2025
  kr_cite: MASLD 진료지침 2025(대한간학회) p.S19
  diff_type: same
  topic: MASH 약물 — resmetirom 은 F2–F3(간경변 없음)
  harrison_says: '''Resmetirom, a selective thyroid hormone receptor beta (THR-B) agonist, was recently granted accelerated approval by the FDA to treat patients with ‘at-risk’ MASH (i.e. F2-F3 fibrosis) without cirrhosis.'' ''Pharmacotherapy for liver disease per se is not recommended for patients with hepatic steatosis without steatohepatitis or fibrosis''.'
  kr_says: '[Recommendation] ''Resmetirom can be used as a therapeutic agent in patients with MASH with F2/F3 liver fibrosis as histological improvement of steatohepatitis and liver fibrosis has been proven. (A1)'' 본문: 장기 자료 부족·고비용·아시아인 자료 부족을 들어 ''attention should be paid to the long-term follow-up results''.'
  kmle_rule: KMLE 문항·정리본은 resmetirom 을 F2–F3 섬유화가 있는 MASH(간경변 없음)의 약물로 적용한다(A1). 단순 지방증에는 간 표적 약물을 쓰지 않는다.
  usmle_rule: USMLE 문항은 resmetirom(THR-β 작용제)을 F2–F3, 비간경변 'at-risk' MASH 에 적용한다.
