  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2566]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 궤양성 대장염 치료 가이드라인(대한장연구학회) p.386
  diff_type: first_line
  topic: 급성 중증 UC infliximab 구제 — 강화 용량을 일상적으로 쓰는가
  harrison_says: 'p.2566: 스테로이드 불응 입원 UC 는 단백 소실로 infliximab 농도가 낮아 ''Given a clear exposure–response relationship ... intensive infliximab dosing regimens have been used in these patients.'' 표 337-9(p.2568): infliximab ''5 mg/kg at 0, 2, and 6 weeks ... Intensive dosing for hospitalized corticosteroid-refractory patients''.'
  kr_says: '권고문 5.5: ''Infliximab 구제 치료를 받는 모든 급성 중증 궤양성 대장염 환자에서 표준 관해 유도 요법보다 강화된 infliximab 관해 유도 요법을 일상적으로 사용하는 것은 권장하지 않는다.'' (근거 확실성 중등도, 권고 강도 조건부). 본문: ''표준 infliximab 관해 유도 요법은 일반적으로 5 mg/kg으로 시작한다.'''
  kmle_rule: KMLE 문항·정리본은 급성 중증 UC infliximab 구제 치료를 표준 5 mg/kg 유도 요법으로 적용하고, 강화 용량을 일상적으로 쓰지 않는다.
  usmle_rule: USMLE 문항은 infliximab 5 mg/kg 0·2·6주 유도를 기본으로 하되, 입원 스테로이드 불응 환자에서 intensive dosing 이 쓰인다는 서술을 따른다.
  verified: text
- id: diff.gi.ibd.cd-early-advanced-therapy
  slot: h326
  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2565]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 크론병 내과적 치료 가이드라인(대한장연구학회) p.343
  diff_type: algorithm
  topic: 중등도~중증 크론병 — 처음부터 advanced therapy(top-down) vs step-up
  harrison_says: '''Biologic therapy is now commonly given as an initial therapy for patients with moderate to severe CD and UC to prevent future complications of IBD.'' 고위험 CD: ''<30 years old, with extensive disease, perianal or severe rectal disease and/or deep ulcerations in the colon, and stricturing or penetrating disease behavior.'' ''The current goal ... is to treat early in the disease course, treat aggressively''.'
  kr_says: '임상적 고려사항 2: ''중등도에서 중증 활동성 크론병 환자, 특히 질병 진행 위험이 높은 환자에서는 step-up 접근법의 대안으로 advanced therapy의 조기 시작을 고려할 수 있다. 다만 근거는 아직 제한적이므로 치료 결정은 개별화해야 한다. [동의율: 100%]'' — 권고문이 아니라 임상적 고려사항(GRADE 등급 없음). 본문: ''조기 사용을 뒷받침하는 전체 근거 확실성은 낮다.'''
  kmle_rule: KMLE 문항·정리본은 진행 위험이 높은 중등도~중증 크론병에서 조기 advanced therapy 를 step-up 의 '대안으로 고려'하는 선택지로 적용한다(모든 환자의 기본 1차로 단정하지 않는다).
  usmle_rule: USMLE 문항은 고위험 moderate–severe CD(<30세·광범위·항문주위·협착/관통형)에 생물학제제를 initial therapy 로 조기 투여하는 것을 적용한다.
  verified: text
- id: diff.gi.ibd.cd-biologic-immunomodulator-combination
  slot: h326
  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2566]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 크론병 내과적 치료 가이드라인(대한장연구학회) p.325, p.328
  diff_type: first_line
  topic: 크론병 생물학제제 + 면역조절제 병합 — infliximab 은 병합, 그 밖은 단독
  harrison_says: 'p.2566: ''Randomized trials support combination therapy with infliximab and azathioprine for moderate to severe CD and UC. For moderate to severe CD, combination therapy has been shown to be more effective than either infliximab or azathioprine alone.'' p.2565: ''administer dual therapy with immunomodulators and biologics in appropriate patients''. 그림 337-12(p.2569): ''Biologic +/– MP/AZA/MTX''.'
  kr_says: '권고문 5.3(p.325): ''infliximab 단독치료보다 infliximab과 immunomodulator의 병합치료를 권고한다.'' (중등도, 강함); 5.4: 유지에도 ''최소 6개월간'' 병합 권고(중등도, 강함). 권고문 6.3(p.328): ''Biologic 미사용 ... 통상적인 immunomodulator 병합치료보다 adalimumab 단독치료를 제안한다.'' (중등도, 조건부). ustekinumab(8.3)·vedolizumab(9.3)도 단독 제안(매우 낮음, 조건부).'
  kmle_rule: KMLE 문항·정리본은 크론병 infliximab 은 면역조절제(thiopurine) 병합을 권고하고, adalimumab·ustekinumab·vedolizumab 은 단독 사용을 기본으로 적용한다.
  usmle_rule: USMLE 문항은 infliximab + azathioprine 병합이 각각 단독보다 우월하다는 근거(SONIC 계열)를 적용한다.
  verified: text
- id: diff.gi.ibd.crc-surveillance-start
  slot: h326
  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2570]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 염증성 장질환 진단 및 모니터링 가이드라인(대한장연구학회) p.298
  diff_type: threshold
  topic: IBD 대장암 감시 대장내시경 시작 시점
  harrison_says: '''Annual or biennial colonoscopy with multiple biopsies is recommended for patients with >8–10 years of extensive colitis (greater than one-third of the colon involved) or 12–15 years of proctosigmoiditis (less than one-third but more than just the rectum)''. 크론 대장염도 ''the same endoscopic surveillance strategy used for UC is recommended''.'
  kr_says: '권고문 5.1: ''염증성 장질환 환자에서는 증상 발생 후 8년째부터 이형성 감시를 위한 대장내시경을 시행하는 것을 권고한다. 다만, 염증이 직장에 국한되어 있으면서 과거 및 현재 근위부 대장에 내시경적 또는 조직학적 염증의 근거가 없는 궤양성 대장염 환자 또는 염증이 소장에만 국한된 크론병 환자는 일반 인구를 대상으로 한 대장암 검진 권고를 따른다.'' (동의율 100%, 권고 강도 표기 없음)'
  kmle_rule: KMLE 문항·정리본은 대장을 침범한 IBD(범위 무관)에서 증상 발생 8년째부터 감시 대장내시경을 시작하고, 직장염 국한 UC·소장 국한 CD 는 일반 인구 검진을 따른다고 적용한다.
  usmle_rule: USMLE 문항은 광범위 대장염 8–10년 후, 직장구불결장염은 12–15년 후 감시 대장내시경 시작을 적용한다.
  verified: text
- id: diff.gi.ibd.crc-surveillance-interval
  slot: h326
  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2570]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 염증성 장질환 진단 및 모니터링 가이드라인(대한장연구학회) p.299
  diff_type: algorithm
  topic: IBD 감시 대장내시경 간격 — 위험도별 1·2–3·5년 vs 일괄 1–2년
  harrison_says: '''Annual or biennial colonoscopy with multiple biopsies is recommended'' (위험도별 간격 차등 없음). 위험인자: ''long-duration disease, extensive disease, family history of colon cancer, PSC, a colon stricture, and the presence of postinflammatory pseudopolyps''.'
  kr_says: '권고문 5.3: ''50세 이하에 대장암을 진단받은 직계 가족, 최근 5년 이내의 대장 협착 또는 이형성, PSC, 또는 중증의 활동성 염증을 동반한 광범위 대장염 등의 고위험 요인이 있는 환자에서는 매년, 50세를 초과하여 대장암을 진단받은 직계 가족 또는 경도에서 중등도의 활동성 염증을 동반한 광범위 대장염 등의 중등도 위험 요인이 있는 환자에서는 2–3년마다, 고위험 또는 중등도 위험 요인이 없는 환자에서는 5년마다 감시 대장내시경을 시행할 것을 권고한다.'' (동의율 94%)'
  kmle_rule: KMLE 문항·정리본은 IBD 감시 간격을 고위험 매년·중등도 위험 2–3년·그 외 5년으로 적용한다.
  usmle_rule: USMLE 문항은 감시 대장내시경을 1–2년마다(annual or biennial)로 적용한다.
  verified: text
- id: diff.gi.ibd.psc-annual-surveillance
  slot: h326
  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2563]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 염증성 장질환 진단 및 모니터링 가이드라인(대한장연구학회) p.299
  diff_type: same
  topic: PSC 동반 IBD — 매년 감시 대장내시경
  harrison_says: '''Patients with IBD and PSC are at increased risk of colon cancer and should be surveyed yearly by colonoscopy and biopsy.'''
  kr_says: '권고문 5.2: ''PSC를 동반한 염증성 장질환 환자에서는 질병 범위나 유병 기간과 관계없이 PSC 진단 시점부터 매년 감시 대장내시경검사를 시행할 것을 권고한다.'' (동의율 100%)'
  kmle_rule: KMLE 문항·정리본은 PSC 동반 IBD 에서 PSC 진단 시점부터(범위·유병 기간 무관) 매년 감시 대장내시경을 적용한다.
  usmle_rule: USMLE 문항은 IBD + PSC 환자에서 매년 대장내시경·생검 감시를 적용한다.
