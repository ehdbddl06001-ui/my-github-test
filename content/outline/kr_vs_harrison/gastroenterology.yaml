  kr_guideline_id: kr-klca-hcc-2022
  kr_cite: 2022 간세포암종 진료 가이드라인(대한간암학회·국립암센터) p.607
  diff_type: algorithm
  topic: 영상 비침습 진단을 쓸 수 있는 환자 — 간경변만 vs 만성 B·C형간염 포함 고위험군
  harrison_says: 'p.661: ''Noninvasive criteria can only be applied to cirrhotic patients and are based on imaging techniques obtained by four-phase multidetector CT scan ... or dynamic contrast-enhanced MRI.'' p.662: ''Pathological diagnosis is required: (1) in patients without cirrhosis, (2) if radiology is not typical in at least one of two imaging techniques (CT and MRI), and (3) for a LI-RADS-4 lesion.'''
  kr_says: '[Recommendations] 1. ''The diagnosis of HCC can be made pathologically or using the typical hallmarks of HCC obtained by non-invasive imaging in high-risk groups (chronic hepatitis B [A1], chronic hepatitis C [B1], or cirrhosis [A1]).'' — 간경변이 없는 만성 B형간염 환자도 영상만으로 진단 가능.'
