  diff_type: same
  topic: ≥1 cm 결절의 영상 진단 — 다중시기 CT·MRI 의 동맥기 조영증강 + 문맥기·지연기 씻김
  harrison_says: '''In nodules >1 cm or with AFP ≥20 ng/mL or rising AFP, multiphasic contrast-enhanced CT or MRI is recommended. Using these techniques, the typical hallmark of HCC consists of vascular uptake of the nodule in the arterial phase with washout in the portal venous or delayed phases. ... diagnostic specificity of ~95–100%, making a biopsy unnecessary.'''
  kr_says: '[Recommendations] 2. ''For a new liver nodule ≥1 cm detected by surveillance tests in high-risk patients, multiphasic CT, or multiphasic MRI ... should be performed as a first-line imaging study for the diagnosis of HCC (A1).'' 3. ''(1) the radiological hallmarks in multiphasic CT or MRI with extracellular contrast agents are APHE with washout appearance in the portal venous or delayed phases (A1). (2) ... MRI with hepatocyte-specific contrast agents are APHE with washout appearance in the portal venous, delayed, or hepatobiliary phases'' (B1, 뚜렷한 T2 고신호·표적 모양이 없는 병변에 한해).'
  kmle_rule: KMLE 문항·정리본은 고위험군의 1 cm 이상 새 결절에 다중시기 CT·MRI 를 시행하고, 동맥기 조영증강 + 문맥기·지연기 씻김(간세포특이 조영제 MRI 는 간담도기 포함)이면 생검 없이 '확정' 간세포암으로 진단한다.
  usmle_rule: USMLE 문항은 >1 cm 결절의 multiphasic CT/MRI 에서 arterial enhancement + portal venous/delayed washout 을 HCC 의 진단적 소견(생검 불필요)으로 적용한다.
  verified: text
- id: diff.gi.hcc.indeterminate-nodule-followup
  slot: h82
  h22_chapter: 87
  h22_cite: '[[harrison-22: 87장 p.661]]'
  kr_guideline_id: kr-klca-hcc-2022
  kr_cite: 2022 간세포암종 진료 가이드라인(대한간암학회·국립암센터) p.608
  diff_type: terminology
  topic: 비전형 결절·1 cm 미만 결절 — '확정/가능(probable)/불확정' vs LI-RADS, 추적 간격
  harrison_says: 'LI-RADS 로 분류: ''LI-RADS-4 category are likely to be an HCC in 60–70% of cases and repeated imaging within 3–6 months or biopsy is recommended. Finally, LI-RADS-5 lesions have a ~95% probability of being HCCs.'' ''Nodules <1 cm in size are unlikely to be HCC ... and thus ultrasound follow-up at 3–4 months is recommended.'' (p.662: LI-RADS-4 는 ''Pathological diagnosis is required'').'
  kr_says: '[Recommendations] 5. ''For "probable" HCC, follow-up imaging study within 3 months or biopsy should be considered (C1). For "indeterminate" nodules that cannot be diagnosed as "definite" or "probable" HCC by imaging, follow-up imaging study within 6 months or biopsy should be considered (B1).'' 6. ''For subcentimeter nodules newly detected on HCC surveillance in high-risk patients, follow-up surveillance test within 6 months is recommended (C1).'' (4번: 보조 영상 소견으로 ''probable'' HCC 를 정한다 — LI-RADS 범주는 쓰지 않음).'
  kmle_rule: KMLE 문항·정리본은 '확정·가능(probable)·불확정' 간세포암 용어를 쓰고, 가능 HCC 는 3개월 내 추적 영상 또는 생검, 불확정 결절은 6개월 내 추적 영상 또는 생검, 1 cm 미만 새 결절은 6개월 내 감시 검사를 적용한다.
  usmle_rule: 'USMLE 문항은 LI-RADS 범주(LR-4: 3–6개월 내 재영상 또는 생검, LR-5: HCC)를 쓰고, 1 cm 미만 결절은 3–4개월 뒤 초음파 추적을 적용한다.'
  verified: text
- id: diff.gi.hcc.staging-system
  slot: h82
  h22_chapter: 87
  h22_cite: '[[harrison-22: 87장 p.662]]'
  kr_guideline_id: kr-klca-hcc-2022
  kr_cite: 2022 간세포암종 진료 가이드라인(대한간암학회·국립암센터) p.609-610
  diff_type: algorithm
  topic: 병기 체계 — mUICC 1차(BCLC·AJCC 보완) vs BCLC
  harrison_says: 'p.662: ''The most accepted staging system is the Barcelona Clinic Liver Cancer (BCLC) Classification, which is endorsed by U.S. and European clinical practice guidelines (Fig. 87-3).'' p.663: ''Very early HCC (BCLC 0) is defined by single tumors ≤2 cm ... Early HCC (BCLC A) includes either single tumors or a maximum of three nodules of ≤3 cm ... Intermediate stage (BCLC B) is defined by all other liver-only tumors'' — 혈관 침범·림프절·간외 전이·ECOG 1–2 는 BCLC C.'
  kr_says: 'p.610 [Recommendations] 1. ''This guideline adopts the mUICC stages as the primary staging system, with the BCLC staging system and the AJCC/UICC TNM staging system serving as complementary systems (B1).'' p.609 Table 5(Modified UICC stage): T 기준 세 가지 ''(1) Number of tumors: solitary (2) Diameter of the largest tumor ≤2 cm (3) No vascular or bile duct invasion'' — 셋 다 = T1, 둘 = T2, 하나 = T3, 없음 = T4; I=T1N0M0, II=T2N0M0, III=T3N0M0, IVA=T4N0M0 또는 N1M0, IVB=M1.'
  kmle_rule: KMLE 문항·정리본은 간세포암 병기를 mUICC(단발·≤2 cm·혈관/담관 침범 없음 세 기준 충족 수로 T1~T4)로 매기고, BCLC 는 치료 선택을 돕는 보완 체계로 적는다.
  usmle_rule: USMLE 문항은 BCLC(0/A/B/C/D — 종양 크기·수, 혈관 침범·간외 전이, ECOG, 간기능)로 병기와 치료를 배정한다.
  verified: text
- id: diff.gi.hcc.first-line-systemic
  slot: h82
  h22_chapter: 87
  h22_cite: '[[harrison-22: 87장 p.664]]'
  kr_guideline_id: kr-klca-hcc-2022
  kr_cite: 2022 간세포암종 진료 가이드라인(대한간암학회·국립암센터) p.637
  diff_type: same
  topic: 진행성 간세포암 1차 전신치료 — 아테졸리주맙+베바시주맙 또는 더발루맙+트레멜리무맙
  harrison_says: 'p.664: ''First-line therapy for advanced HCC includes atezolizumab plus bevacizumab or durvalumab plus tremelimumab. Both combinations were superior to sorafenib in phase 3 trials. In patients with contraindications for immunotherapies, both sorafenib or lenvatinib are recommended''. p.666: 상부위장관 내시경 정맥류 선별이 ''has become standard before first-line therapy in advanced HCC to mitigate the risk of bleeding associated with bevacizumab''.'
  kr_says: '[Recommendations] 1. ''Atezolizumab plus bevacizumab or durvalumab plus tremelimumab is recommended for systemic treatment-naïve patients with locally advanced unresectable or metastatic HCC not amenable to curative or loco-regional therapy who have Child-Pugh class A and ECOG performance status 0–1 (A1). If these two combination therapies cannot be applied, sorafenib or lenvatinib is recommended (A1).'' 2. ''Sorafenib is considered for patients with HCC who have Child-Pugh class B7 (B1) or B8–9 (B2)''.'
  kmle_rule: KMLE 문항·정리본은 Child-Pugh A·ECOG 0–1 진행성 간세포암의 1차 전신치료를 아테졸리주맙+베바시주맙 또는 더발루맙+트레멜리무맙으로, 쓸 수 없으면 소라페닙·렌바티닙으로 적용한다.
  usmle_rule: USMLE 문항은 advanced HCC 1차를 atezolizumab + bevacizumab 또는 durvalumab + tremelimumab, 면역치료 금기 시 sorafenib·lenvatinib 로 적용한다.
