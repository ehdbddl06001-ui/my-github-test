  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2693]]'
  kr_guideline_id: kr-kasl-hcv-2025
  kr_cite: C형간염 진료가이드라인 2025(대한간학회) p.8
  diff_type: screening
  topic: 일반인 HCV 선별 — 국가건강검진 56세 anti-HCV
  harrison_says: 352장은 일반 성인 선별의 나이·대상을 제시하지 않음. p.2693 'The World Health Organization has set an elimination goal of a 90% reduction in the global prevalence of HCV infection by 2030 ... efforts have been devoted to improving the frequency of screening and diagnosis' 및 'one-stop screening and treatment initiation' 프로그램 언급뿐.
  kr_says: '''As a result, beginning in 2025, anti-HCV testing has been incorporated into the national health checkup for all citizens at the age of 56.'' [Recommendation] ''1. Nationwide large-scale screening is recommended for elimination of hepatitis C. (A1)'' (같은 쪽이 인용한 미국 기준: USPSTF 2020 ''one-time screening for all adults aged 18 to 79 years'').'
