  kr_guideline_id: kr-ksnm-gerd-seoul
  kr_cite: 2020 Seoul Consensus on the Diagnosis and Management of GERD(대한소화기기능성질환·운동학회) p.462
  diff_type: screening
  topic: 바렛식도 내시경 감시 — 장분절 바렛 권고 vs 효용 미정
  harrison_says: '''The rate of cancer development is estimated at 0.1–0.3% per year ... However, despite common practice, the utility of endoscopic screening and surveillance programs intended to control the adenocarcinoma risk remains an open question.'' 고도 이형성은 ''mandates further intervention'' — 내시경 점막 절제·소작 권장(p.2511).'
  kr_says: 'Statement 11: ''Endoscopic surveillance is recommended in patients with long-segment Barrett''s esophagus.'' Level of evidence: very low; Strength of recommendation: strong. 근거: 메타분석에서 감시 내시경이 식도선암 관련 사망 RR 0.60(0.50–0.71), 전체 사망 HR 0.75(0.59–0.94).'
