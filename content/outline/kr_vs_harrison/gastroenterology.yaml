- id: diff.gi.hcv.simplified-regimen-cirrhosis
  slot: h341
  h22_chapter: 352
  h22_cite: '[[harrison-22: 352장 p.2692]]'
  kr_guideline_id: kr-kasl-hcv-2025
  kr_cite: C형간염 진료가이드라인 2025(대한간학회) p.13, p.19
  diff_type: algorithm
  topic: 단순화 치료(SOF/VEL 12주 · G/P 8주) 대상 — 대상성 간경변 포함 여부
  harrison_says: '''Patients who are eligible for this simplified algorithm must not have any of the following clinical characteristics: prior treatment failure, cirrhosis, presence of HBsAg, pregnancy, HCC, or history of liver transplantation. In the absence of any of these features, the patient may be treated with either sofosbuvir/velpatasvir for 12 weeks or glecaprevir/pibrentasvir for 8 weeks.'''
  kr_says: p.13 [Recommendation] '1. A simplified treatment strategy using pan-genotypic oral antiviral agents with SVR assessment only after treatment completion is recommended for treatment-naïve patients without cirrhosis or with compensated cirrhosis. (A1)' '2. The simplified treatment strategy is not recommended for patients with prior HCV treatment experience, HBV co-infection, compensated cirrhosis with ESRD (eGFR <30 mL/min/1.73 m²), decompensated cirrhosis (Child–Pugh score ≥7), pregnancy, suspected or confirmed hepatocellular carcinoma, or a history of liver transplantation. (A1)' p.19 [Recommendation] '... a simplified treatment strategy using either sofosbuvir/velpatasvir for 12 weeks or glecaprevir/pibrentasvir for 8 weeks is recommended, regardless of genotype. (A1)'
  kmle_rule: KMLE 문항·정리본은 치료 경험 없는 비간경변 또는 대상성 간경변(Child–Pugh A) 환자에게 유전자형 검사 없이 sofosbuvir/velpatasvir 12주 또는 glecaprevir/pibrentasvir 8주를 쓰는 단순화 치료를 적용한다(A1).
  usmle_rule: USMLE 문항은 단순화 알고리즘에서 간경변을 제외 대상으로 보고, 해당 없으면 sofosbuvir/velpatasvir 12주 또는 glecaprevir/pibrentasvir 8주를 고른다.
  verified: text
- id: diff.gi.hcv.national-screening
