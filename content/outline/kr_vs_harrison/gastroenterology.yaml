- id: diff.gi.masld.pioglitazone-vs-incretin
  slot: h343
  h22_chapter: 354
  h22_cite: '[[harrison-22: 354장 p.2706]]'
  kr_guideline_id: kr-kasl-masld-2025
  kr_cite: MASLD 진료지침 2025(대한간학회) p.S19
  diff_type: first_line
  topic: 인슐린 감수성 개선제·GLP-1 RA — MASH 자체 치료인가 동반질환 치료인가
  harrison_says: '''The use of pioglitazone has been largely usurped in clinical practice by the increasing use of incretin mimetics (e.g., glucagon-like peptide 1 receptor agonists [GLP-1RAs]) and sodium-glucose cotransporter 2 inhibitors (SGLT-2i)''. GLP-1RA 는 ''attractive agents for treatment of MASH''; semaglutide 0.4 mg 72주 ''NASH resolution ... 59% ... vs 17%'', ''no statistically significant improvement in fibrosis'', ''A global phase 3 study ... is currently underway.'' Metformin 은 ''not currently recommended as a treatment for NASH''.'
  kr_says: '[Recommendation] pioglitazone 은 ''can be expected to improve steatohepatitis in patients with MASH regardless of T2DM'' (B2). ''GLP-1 receptor agonists can be used to treat obesity and T2DM in patients with MASH. SGLT2 inhibitors can be used to improve concomitant diseases in patients with MASH accompanied by T2DM, heart failure, and chronic renal failure. (B1)'' 본문: semaglutide 3상 결과 미발표로 ''it is difficult to use it currently to improve steatohepatitis and liver fibrosis''.'
  kmle_rule: KMLE 문항·정리본은 pioglitazone 을 당뇨 유무와 무관하게 MASH 지방간염 개선 약으로(B2), GLP-1 RA·SGLT2 억제제는 MASH 동반 비만·T2DM·심부전·만성콩팥병 치료 약으로(B1) 적용한다.
  usmle_rule: USMLE 문항은 GLP-1RA(semaglutide)를 MASH 에 유망한 약으로, pioglitazone 은 효과는 있으나 실제로는 GLP-1RA·SGLT2i 에 밀린 약으로, metformin 은 NASH 치료로 권하지 않는 약으로 적용한다.
  verified: text
