- id: diff.gi.cirrhosis.varices-primary-prophylaxis
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2714]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 정맥류·간성뇌증 2019(대한간학회) p.88, 90'
  diff_type: first_line
  topic: 식도정맥류 1차 예방 — 큰 정맥류는 NSBB·카르베딜롤·EVL 동등 vs 카르베딜롤 우선
  harrison_says: '''primary prophylaxis can be achieved either through traditional nonselective beta blockade (NSBB) (propranolol or nadolol) titrated with a goal heart rate of 55–60 beats/min with systolic blood pressure >90 mmHg or by variceal band ligation. Carvedilol is becoming the NSBB of choice.'' ''EVL appears to have equivalent efficacy at preventing bleeding. NSBBs, especially carvedilol, are generally recommended as first-line treatment for primary prophylaxis of bleeding if tolerated, given their additional benefits.'''
  kr_says: 'p.90 [Recommendations] 1. ''In cirrhotic patients with small EVs that have a high risk of bleeding (decompensated cirrhosis or red color signs on endoscopy), the use of a NSBBs (propranolol or nadolol) should be considered to prevent first variceal bleeding. (B1) NSBBs are adjusted every 2–3 days until the resting heart rate reaches 55–60 beats per minute.'' 2. ''In cirrhotic patients with large EVs, the use of a NSBBs (propranolol or nadolol), carvedilol, or EVL is recommended to prevent first variceal bleeding. (A1) A combination of NSBBs and EVL can also be considered. (B2)'' p.88: ''NSBBs (propranolol and nadolol) are not recommended to prevent the formation of EVs in cirrhotic patients without EVs. (A1)''.'
  kmle_rule: KMLE 문항·정리본은 큰 식도정맥류의 1차 예방에 NSBB(프로프라놀롤·나돌롤)·카르베딜롤·EVL 중 하나를 동등하게 적용하고(출혈 고위험 작은 정맥류는 NSBB), 정맥류가 없으면 NSBB 를 쓰지 않는다(2019 정맥류·간성뇌증 지침).
  usmle_rule: USMLE 문항은 고위험 정맥류 1차 예방에 NSBB(특히 carvedilol)를 내약 시 1차로, EVL 을 대안으로 적용한다.
  verified: text
- id: diff.gi.cirrhosis.varices-secondary-prophylaxis
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2714]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 정맥류·간성뇌증 2019(대한간학회) p.94'
  diff_type: same
  topic: 정맥류 재출혈 예방 — EVL + NSBB 병합, 실패 시 TIPS
  harrison_says: '''Prevention of further bleeding is usually accomplished with repeated variceal band ligation until varices are obliterated in combination with NSBB. If recurrent variceal bleeding occurs, then TIPS should be performed for long-term prevention of bleeding.'''
  kr_says: '[Recommendations] 2. ''The combination of endoscopic variceal ligation (EVL) plus NSBBs is recommended as the primary treatment for esophageal variceal bleeding. (A1) If the combination treatment is difficult to perform, use of a NSBBs or EVL alone is recommended. (A1)'' 3. ''If primary treatment for esophageal variceal rebleeding fails, TIPS placement should be considered as a rescue therapy. (B1)'''
  kmle_rule: KMLE 문항·정리본은 식도정맥류 출혈 후 재출혈 예방을 EVL + NSBB 병합으로, 실패하면 TIPS 로 적용한다(2019 정맥류·간성뇌증 지침).
  usmle_rule: USMLE 문항은 secondary prophylaxis 를 repeated band ligation + NSBB, 재출혈 시 TIPS 로 적용한다.
