- id: diff.gi.cirrhosis.sbp-diagnosis-treatment
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2716]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 복수 및 관련 합병증 2026(대한간학회) p.981, 983, 986'
  diff_type: same
  topic: SBP — 복수 호중구 ≥250, 3세대 세팔로스포린 + 알부민
  harrison_says: '''The diagnosis of SBP is made when the fluid sample has an absolute neutrophil count >250/μL. Bedside cultures should be obtained by direct injection of ascitic fluid into blood culture bottles.'' ''Treatment is commonly with intravenous third-generation cephalosporin for 5 days. In addition, intravenous albumin (1.5 g/kg body weight on day 1 and 1.0 g/kg on day 3) has been shown to reduce the risk of renal failure and to improve survival.'''
  kr_says: 'p.981 [Recommendations] 1. ''When SBP is suspected, diagnostic paracentesis should be performed, and SBP is diagnosed when the ascitic PMN count is ≥250/mm³. (A1)'' p.983: ''Community-acquired spontaneous bacterial peritonitis should be treated empirically with intravenous third-generation cephalosporins (ceftriaxone or cefotaxime) for 5–7 days. (A1)'' p.986: ''intravenous albumin should be administered in combination with antibiotics to reduce the risk of acute kidney injury and mortality. (A1)'' (근거 RCT 용량 p.985: ''1.5 g/kg at diagnosis and 1.0 g/kg on day 3'').'
  kmle_rule: KMLE 문항·정리본은 복수 다형핵백혈구 ≥250/mm³ 를 SBP 로 진단하고, 지역사회 획득 SBP 는 정맥 3세대 세팔로스포린 5–7일 + 정맥 알부민(진단일 1.5 g/kg, 3일째 1.0 g/kg)으로 치료한다.
  usmle_rule: USMLE 문항은 ascitic PMN >250/μL 를 SBP 로 진단하고 IV third-generation cephalosporin + IV albumin(1.5 g/kg day 1, 1.0 g/kg day 3)을 적용한다.
  verified: text
- id: diff.gi.cirrhosis.sbp-prophylaxis
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2716]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 복수 및 관련 합병증 2026(대한간학회) p.987'
  diff_type: first_line
  topic: SBP 예방 — 위장관 출혈 시 세프트리악손 · 2차/고위험 1차 예방에 리팍시민 또는 노르플록사신
  harrison_says: '''In patients with variceal hemorrhage, the frequency of SBP is significantly increased, and prophylaxis against SBP is recommended at presentation with upper GI bleeding. Furthermore, in patients who have had an episode of SBP and recovered, quinolone antibiotic prophylaxis should be given to prevent recurrent SBP.'' (출혈 시 항생제는 p.2714 ''Prophylactic antibiotics, usually with ceftriaxone''). 복수 단백 <1.5 g/dL 은 p.2715 에서 SBP 위험 증가로만 서술 — 1차 예방 권고 문장은 없음.'
  kr_says: '[Recommendations] 1. ''In cirrhotic patients with gastrointestinal bleeding, intravenous ceftriaxone 1 g/day is recommended to prevent infections, including spontaneous bacterial peritonitis. (A1)'' 2. ''In patients with ascitic protein concentration ≤1.5 g/dL accompanied by severe liver failure, renal dysfunction, or hyponatremia, or in patients who have recovered from spontaneous bacterial peritonitis, prophylactic administration of rifaximin or norfloxacin should be considered to prevent spontaneous bacterial peritonitis. (A2)'''
  kmle_rule: KMLE 문항·정리본은 위장관 출혈 간경변 환자에 정맥 세프트리악손 1 g/일을, SBP 회복 후 또는 복수 단백 ≤1.5 g/dL + 중증 간부전·신기능장애·저나트륨혈증 환자에 리팍시민 또는 노르플록사신 예방을 적용한다.
  usmle_rule: USMLE 문항은 상부위장관(정맥류) 출혈 시 ceftriaxone 예방, SBP 회복 후 quinolone 2차 예방을 적용한다.
  verified: text
- id: diff.gi.cirrhosis.sodium-restriction
  slot: h344
  h22_chapter: 355
  h22_cite: '[[harrison-22: 355장 p.2715]]'
  kr_guideline_id: kr-kasl-cirrhosis
  kr_cite: '간경변증 진료 가이드라인: 복수 및 관련 합병증 2026(대한간학회) p.974'
  diff_type: terminology
  topic: 복수 식이 나트륨 제한 — 소금 <5 g/일(나트륨 <2,000 mg) vs 나트륨 2 g/일
  harrison_says: '''it is often extremely difficult to get patients to change their dietary habits to ingest 2 g of sodium per day, equivalent to slightly more than three-quarters of a teaspoon of salt, which is the recommended amount.'' 이뇨제: ''spironolactone at 100 mg/d ... furosemide may be added at 40 mg/d'', 최대 400 mg/d·160 mg/d. 수분 제한 언급 없음.'
  kr_says: '[Recommendations] 3. ''A sodium-restricted diet (salt <5 g/day, equivalent to sodium <2,000 mg or 88 mmol/day) is recommended for patients with cirrhotic ascites. (B1) Fluid restriction is not required unless the patient presents with severe hyponatremia (serum sodium <125 mmol/L). (B1)'' 4. ''Spironolactone ... is recommended as the first-line diuretic ... with furosemide added as needed (A1)''.'
  kmle_rule: KMLE 문항·정리본은 간경변 복수의 식이를 소금 5 g/일 미만(나트륨 2,000 mg·88 mmol 미만)으로 적고, 혈청 나트륨 <125 mmol/L 가 아니면 수분 제한을 하지 않는다.
  usmle_rule: USMLE 문항은 cirrhotic ascites 식이를 sodium 2 g/day 로 적용한다(같은 양 — 단위가 소금이 아니라 나트륨).
