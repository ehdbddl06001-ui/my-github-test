  usmle_rule: USMLE 문항은 간경변 환자에서 HBV DNA 가 검출되면 HBeAg·ALT 와 무관하게 경구제(entecavir·tenofovir)로 치료하고, 비대상성이면 간이식을 의뢰하며 PEG IFN 은 쓰지 않는다.
