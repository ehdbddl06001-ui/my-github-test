- id: diff.gi.panc.acute.diagnosis-2-of-3
  slot: h348
  h22_chapter: 359
  h22_cite: '[[harrison-22: 359장 p.2745]]'
  kr_guideline_id: kr-kpba-pancreatitis
  kr_cite: 급성췌장염 진료지침 개정판(대한췌담도학회) p.36
  diff_type: same
  topic: 급성췌장염 진단 — 3개 중 2개
  harrison_says: '''The diagnosis is established by two of the following three criteria: (1) typical abdominal pain in the epigastrium that may radiate to the back, (2) threefold or greater elevation in serum lipase and/or amylase, and (3) confirmatory findings of acute pancreatitis on cross-sectional abdominal imaging.'''
  kr_says: 'Recommendation 1: ''(1) Acute abdominal pain in the upper abdomen or the epigastrium. (2) Elevated levels of pancreatic enzymes (serum amylase and/or lipase) ≥3 times the upper limit of normal. (3) Abnormal findings of acute pancreatitis detected by abdominal images such as ultrasonography (USG), computed tomography (CT) or magnetic resonance imaging (MRI). Patients who present with at least two of the above three manifestations, and with other pancreatic diseases and acute abdomen ruled out are diagnosed with acute pancreatitis.'' — Recommendation grade: strong, Evidence level: B.'
  kmle_rule: KMLE 문항·정리본은 상복부 통증·아밀라아제/리파아제 정상 상한 3배 이상·영상 소견 중 2개 이상으로 급성췌장염을 진단한다(강한 권고, B).
  usmle_rule: USMLE 문항은 2-of-3 기준(통증·lipase/amylase ≥3×ULN·영상)을 적용한다.
