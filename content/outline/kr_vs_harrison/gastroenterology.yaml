- id: diff.gi.gerd.endoscopy-alarm-features
  slot: h323
  h22_chapter: 334
  h22_cite: '[[harrison-22: 334장 p.2510]]'
  kr_guideline_id: kr-ksnm-gerd-seoul
  kr_cite: 2020 Seoul Consensus on the Diagnosis and Management of GERD(대한소화기기능성질환·운동학회) p.462
  diff_type: same
  topic: 내시경 적응 — 경고 증상(삼킴곤란 등)·PPI 무반응
  harrison_says: '경험적 치료의 예외: ''patients with chest pain or persistent dysphagia, each of which may be indicative of GERD or alternative diagnoses. With chest pain, cardiac disease must be considered. With dysphagia, eosinophilic esophagitis (EoE) should be considered as an alternative diagnosis along with peptic stricture, motility disorders, or esophageal cancer.'' ''mucosal biopsies are necessary to evaluate for infectious or eosinophilic inflammation.'''
  kr_says: 'Statement 10: ''Endoscopy with or without biopsy can be recommended to diagnose gastroesophageal reflux disease and exclude other organic diseases.'' Level of evidence: very low; Strength: strong. 본문: ''endoscopy is not required in the presence of typical GERD symptoms ... In patients with GERD symptoms who do not respond to a PPIs trial, the upper endoscopy is recommended'' · ''endoscopy is recommended in the presence of alarm symptoms such as dysphagia, unintentional weight loss, and hematemesis and patients at high risk for esophageal malignancy.'''
  kmle_rule: KMLE 문항·정리본은 삼킴곤란·의도치 않은 체중감소·토혈 등 경고 증상, 식도암 고위험, PPI 시험 무반응이면 내시경(필요 시 생검)을 먼저 한다.
  usmle_rule: USMLE 문항은 흉통(심장 질환 먼저 배제)·지속 삼킴곤란이 있으면 경험적 치료 대신 평가(내시경·생검)를 하는 해리슨 서술을 따른다.
