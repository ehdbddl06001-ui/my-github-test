- id: diff.gi.hpylori.eradication-gastric-cancer-prevention
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1301]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.163
  diff_type: screening
  topic: 위암 예방 목적 제균 — H. pylori 위염 전체 vs 가족력 등 선택적
  harrison_says: '''For individuals with a strong family history of gastric cancer, treatment to eradicate H. pylori in the hope of reducing cancer risk is reasonable but of unproven value: it slightly reduces future cancer incidence, but there is no evidence it reduces all-cause mortality.'' ''Currently, widespread community screening for and treatment of H. pylori as primary prophylaxis for gastric cancer and peptic ulcers are not recommended in most countries, mainly because the extent of the consequent reduction in cancer risk is not known.'''
  kr_says: '지침 1. ''헬리코박터 파일로리 위염 환자에게 위암의 예방을 위해 제균 치료를 시행할 것을 제안한다.'' 권고강도: 약함; 근거수준: 중등도(동의율 95.3%). 근거: 9편 RCT 메타분석 위암 발생 RR 0.65(95% CI 0.48–0.88), 위암 관련 사망 RR 0.81, 전체 사망 RR 0.98(차이 없음). ''스크리닝 목적의 내시경 검사가 위암 예방을 위한 제균 치료를 대신할 수 없다.'''
  kmle_rule: KMLE 문항·정리본은 H. pylori 위염이 확인되면 위암 예방을 위해 제균 치료를 시행한다(약한 권고)로 적용한다 — 가족력이 없어도 적응증이다.
  usmle_rule: USMLE 문항은 위암 가족력 등 선택적 경우에만 '합리적이나 근거 미확립'으로 보고, 무증상 인구 선별·제균은 권고하지 않는다는 해리슨 서술을 따른다.
  verified: text
- id: diff.gi.hpylori.tailored-therapy-first-line
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1303]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.168
  diff_type: algorithm
  topic: 1차 제균 — 클래리스로마이신 내성검사(DPO-PCR) 기반 맞춤 치료
  harrison_says: '''Assessment of antibiotic susceptibilities before treatment would be optimal but is not usually undertaken because endoscopy and mucosal biopsy are necessary to obtain H. pylori for culture and because most microbiology laboratories are inexperienced in H. pylori culture.'' 1차 실패 시 ''empirical re-treatment with another drug regimen'', ''The third-line approach ideally should be endoscopy, biopsy, and culture plus treatment based on documented antibiotic sensitivities.'''
  kr_says: '지침 4-1. ''항생제 감수성 검사를 기반으로 한 맞춤 치료를 헬리코박터 파일로리 감염의 1차 제균 치료로 권고한다.'' 권고강도: 강함; 근거수준: 중등도. 지침 4-2. ''내성이 있을 때는 비스무트 4제요법 10일(양성자펌프억제제 표준 용량 하루 2회, 메트로니다졸 500 mg 하루 3회, 비스무트 120 mg 하루 4회, 테트라사이클린 500 mg 하루 4회), 내성이 없을 때는 클래리스로마이신 포함 3제요법 7일 치료(양성자펌프억제제 표준 용량, 아목시실린 1 g, 클래리스로마이신 500 mg 하루 2회)를 권고한다.'' 권고강도: 강함; 근거수준: 중등도. DPO-PCR 은 23S rRNA A2142G·A2143G 돌연변이를 탐지.'
  kmle_rule: KMLE 문항·정리본은 1차 제균에서 클래리스로마이신 내성검사(DPO-PCR) 맞춤 치료를 우선한다 — 내성이면 비스무트 4제 10일, 감수성이면 클래리스로마이신 3제 7일.
  usmle_rule: USMLE 문항은 1차는 경험적 요법(Table 168-2)으로 시작하고, 감수성 검사·배양은 3차 치료 단계에서 하는 해리슨 알고리즘을 따른다.
  verified: text
- id: diff.gi.hpylori.clarithromycin-triple-threshold
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1302]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.174
  diff_type: threshold
  topic: 경험적 클래리스로마이신 3제요법 — 지역 내성률 <15% vs <20%
  harrison_says: 'Table 168-2 Regimen 2 OCA(14 days) — omeprazole 20 mg bid + clarithromycin 500 mg bid + amoxicillin 1 g bid. 각주 b: ''This regimen should be used only for populations in which the prevalence of clarithromycin-resistant strains is known to be <20%. In practice, this restriction limits the regimens'' appropriate range mainly to northern Europe.'''
  kr_says: '지침 7. ''클래리스로마이신 포함 3제요법은 항생제 감수성 검사를 시행할 수 없고 지역의 클래리스로마이신 내성이 15% 미만일 것으로 예상되는 경우에는 제한적으로 사용할 수 있다'' 권고강도: 약함; 근거수준: 중등도(수정 후 2차 투표 동의율 73.9%). 국내 14일 3제 ITT 73.5%, 2020년 이후 66.9% — ''80% 이상의 기준에 미치지 못''함. 장애요인: ''국내 클래리스로마이신 내성률이 33%로 높아 대부분의 지역에서 15% 미만 조건을 충족하기 어렵다''.'
  kmle_rule: KMLE 문항·정리본은 감수성 검사를 못 하고 지역 클래리스로마이신 내성이 15% 미만일 때만 경험적 3제요법을 제한적으로 쓴다 — 국내(내성 약 33%)에서는 경험적 1차로 고르지 않는다.
  usmle_rule: USMLE 문항은 clarithromycin 내성 <20% 지역에서만 OCA·OCM 3제요법(14일)을 쓰는 해리슨 기준을 따른다.
  verified: text
- id: diff.gi.hpylori.empirical-concomitant
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1302]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.170
  diff_type: first_line
  topic: 경험적 1차 — 10일 동시치료(국내 강한 권고) vs 14일 concomitant(대안)
  harrison_says: 'Table 168-2 Regimen 4: concomitant (14 days) — omeprazole 20 mg bid, amoxicillin 1 g bid, clarithromycin 500 mg bid, tinidazole 500 mg bid(각주 f: metronidazole 500 mg bid 대체 가능). 각주 e: ''This regimen may be used as an alternative to regimen 3.'''
  kr_says: '지침 5. ''10일 동시치료(양성자펌프억제제 표준 용량, 클래리스로마이신 500 mg, 아목시실린 1 g, 메트로니다졸 500 mg, 하루 2회)를 헬리코박터 파일로리 감염의 1차 경험적 제균 치료로 권고한다.'' 권고강도: 강함; 근거수준: 높음(동의율 68.8%). 10일 동시치료 종합 제균율 ITT 85.1%·PP 90.6%, 14일 ITT 85.5%·PP 93.8% — 국내 연구에서 10일과 14일 차이 없음.'
  kmle_rule: KMLE 문항·정리본은 감수성 검사가 없을 때 경험적 1차 제균으로 10일 동시치료(PPI+클래리스로마이신+아목시실린+메트로니다졸, 하루 2회)를 고른다.
  usmle_rule: USMLE 문항은 concomitant 요법을 14일, 비스무트 4제(regimen 3)의 대안으로 다룬다.
  verified: text
- id: diff.gi.hpylori.bismuth-quadruple-position
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1302]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.172
  diff_type: first_line
  topic: 비스무트 4제요법 — 1차 표준 vs 구제요법으로 아껴 두기
  harrison_says: 'Table 168-2 Regimen 3: OBTM (14 days) — omeprazole 20 mg bid, bismuth subsalicylate 2 tabs qid, tetracycline 500 mg qid, metronidazole 500 mg tid. 각주 d: ''This is a recommended first-line regimen in most countries and is the recommended second-line regimen in northern Europe.'''
  kr_says: '지침 6-1. ''10–14일간의 비스무트 4제요법을 헬리코박터 파일로리 감염의 1차 경험적 제균 치료로 사용할 수 있다.'' 권고강도: 약함; 근거수준: 중등도. 지침 6-2. ''비스무트 4제요법은 약물 부작용이 높고 구제요법으로 사용할 가능성이 있어 다른 제균 치료를 사용할 수 없는 경우에 1차 치료로 사용할 것을 제안한다.'' 권고강도: 약함; 근거수준: 전문가 합의.'
  kmle_rule: KMLE 문항·정리본은 비스무트 4제를 경험적 1차의 조건부 선택지로만 두고(다른 요법을 쓸 수 없을 때), 기본은 2차 구제요법으로 쓴다.
  usmle_rule: USMLE 문항은 bismuth quadruple(OBTM 14일)을 대부분 지역의 권장 1차 요법으로 본다.
  verified: text
- id: diff.gi.hpylori.second-line-and-referral
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1302]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.178, p.180
  diff_type: algorithm
  topic: 1차 실패 후 — 2차 비스무트 4제, 2회 실패 시 전문기관 의뢰
  harrison_says: 'Fig. 168-2: 1차 후 양성 → ''Second-line treatment (Table 168-2)'' → 2차 후 양성 → ''Third-line treatment; endoscopy with H. pylori culture and sensitivity testing; treat according to known antibiotic sensitivities'' → 3차 후 양성 → ''Refer to specialist''. Table 168-2 각주 g: OAL(levofloxacin) ''used as second-line treatment in many countries (particularly where quadruple or concomitant therapy is used as the first-line regimen)''. p.1303: ''When a patient is known to have been exposed—even remotely in time—to clarithromycin or a fluoroquinolone, these antibiotics usually should be avoided.'''
  kr_says: '지침 9-1(p.178). ''클래리스로마이신 포함 3제요법 또는 동시치료에 실패한 경우, 헬리코박터 파일로리 감염의 2차 제균 치료로 비스무트 4제요법 10–14일 치료를 권고한다.'' 권고강도: 강함; 근거수준: 중등도. 지침 9-3(p.180). ''두 번 이상의 제균 치료에 실패한 경우, 항생제 감수성 검사에 기반한 맞춤 치료가 가능한 헬리코박터 파일로리 전문기관에 의뢰하는 것을 제안한다.'' 권고강도: 약함; 근거수준: 전문가 합의.'
  kmle_rule: KMLE 문항·정리본은 3제·동시치료 실패 후 2차로 비스무트 4제 10–14일을 쓰고, 2회 이상 실패하면 감수성 검사 맞춤 치료가 가능한 전문기관에 의뢰한다.
  usmle_rule: 'USMLE 문항은 2차를 1차와 다른 경험적 요법(예: levofloxacin 요법)으로, 3차에서 배양·감수성 검사, 그 뒤 전문의 의뢰로 하는 해리슨 알고리즘을 따른다.'
  verified: text
- id: diff.gi.hpylori.pcab-substitution
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1303]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.175
  diff_type: same
  topic: 제균 요법의 위산억제 — P-CAB 이 PPI 를 대체
  harrison_says: '''use of vonoprazan, a highly effective potassium-competitive acid blocker, originally licensed in Japan and now in several countries, including the United States, was associated with higher eradication rates in conjunction with amoxicillin and clarithromycin, than when a PPI was used for acid suppression.'' 또한 ''using high rather than moderate doses of acid-suppressive PPIs with the antibiotics increases the effectiveness of the regimen.'''
  kr_says: '지침 8. ''칼륨경쟁적위산분비억제제 기반의 항생제 병합 치료는 헬리코박터 파일로리 제균을 위한 1차 치료로 양성자펌프억제제 기반의 항생제 병합치료를 대체할 수 있다.'' 권고강도: 강함; 근거수준: 중등도(동의율 98.4%). 19개 RCT: P-CAB 86.3% vs PPI 78.8%(RR 1.08, 95% CI 1.04–1.12); 보노프라잔 88.4% vs 79.0%.'
  kmle_rule: KMLE 문항·정리본은 1차 제균 요법에서 PPI 대신 P-CAB(보노프라잔·테고프라잔 등)을 쓸 수 있다고 적용한다.
  usmle_rule: USMLE 문항은 vonoprazan(P-CAB)+amoxicillin+clarithromycin 이 PPI 기반보다 제균율이 높다는 해리슨 서술을 따른다.
  verified: text
- id: diff.gi.hpylori.test-of-cure-timing
  slot: h163
  h22_chapter: 168
  h22_cite: '[[harrison-22: 168장 p.1301]]'
  kr_guideline_id: kr-kchug-hpylori-2025
  kr_cite: 한국인에서 근거 기반의 헬리코박터 파일로리 진단 및 치료 임상진료지침 개정안 2025(대한상부위장관·헬리코박터학회) p.159
  diff_type: same
  topic: 제균 확인 — 치료 종료 ≥4주 뒤 요소호기검사·대변항원검사
  harrison_says: '''because these tests are dependent on H. pylori load, their use <4 weeks after treatment may yield false-negative results ... these tests are unreliable if performed within 4 weeks of intercurrent treatment with antibiotics or bismuth compounds or within 2 weeks of the discontinuation of proton pump inhibitor (PPI) treatment. In the assessment of treatment success, noninvasive tests are normally preferred.'' ''Serologic tests are not used to monitor treatment success.'''
  kr_says: '별도 핵심질문 아님(이전 지침 원칙 유지): ''제균 치료 완료 후 최소 4주 이상 경과 후 요소호기검사 또는 대변항원검사를 통한 제균 확인의 필수성 ... 이전 진료지침의 권고에서 변경된 바 없이 임상 진료에서 그대로 준수되어야 하는 원칙'' — 권고 등급 표기 없음.'
  kmle_rule: KMLE 문항·정리본은 제균 치료 종료 후 최소 4주 뒤 요소호기검사 또는 대변항원검사로 제균을 반드시 확인한다(혈청항체검사는 쓰지 않는다).
  usmle_rule: USMLE 문항은 치료 종료 ≥4주, PPI 중단 ≥2주 뒤 urea breath test 또는 stool antigen 으로 test of cure 하고 serology 는 쓰지 않는다.
  verified: text
