- id: diff.gi.hcc.surveillance-us-afp-6mo
  slot: h82
  h22_chapter: 87
  h22_cite: '[[harrison-22: 87장 p.661]]'
  kr_guideline_id: kr-klca-hcc-2022
  kr_cite: 2022 간세포암종 진료 가이드라인(대한간암학회·국립암센터) p.599
  diff_type: same
  topic: 감시 검사 — 6개월마다 간초음파 + 혈청 AFP
  harrison_says: '''Ultrasonography every 6 months with serum α-fetoprotein (AFP) levels is the recommended method of surveillance. It has a sensitivity of ~65% and a specificity of >90% for early detection.'' CT·MRI 는 ''not recommended as screening tools''; ''Contrast-enhanced MRI can be considered in patients with obesity and fatty liver, where visualization with ultrasound is suboptimal.'''
  kr_says: '[Recommendations] 2. ''Surveillance test for HCC should be performed with liver US plus serum AFP measurement every 6 months (A1).'' 3. ''When liver US cannot be performed adequately, dynamic contrast-enhanced CT or dynamic contrast-enhanced MRI can be performed as an alternative (C1)''. 본문(p.597): 미국·유럽은 ''only the US examination is often recommended'', 한국·일본은 US+AFP.'
