- id: diff.gi.panc.acute.fluid-resuscitation
  slot: h348
  h22_chapter: 359
  h22_cite: '[[harrison-22: 359장 p.2747]]'
  kr_guideline_id: kr-kpba-pancreatitis
  kr_cite: 급성췌장염 진료지침 개정판(대한췌담도학회) p.39
  diff_type: algorithm
  topic: 초기 수액 — 목표지향 수액(종류·속도 수치는 해리슨만)
  harrison_says: '''Lactated Ringer’s solution ... may be a better crystalloid than normal saline.'' 예전 적극 수액 ''15–20 mL/kg (1050–1400 mL), followed by 2–3 mL/kg per h (200–250 mL/h), to maintain urine output >0.5 mL/kg per hour'' 은 RCT 에서 덜 적극적 전략 ''(10 mL/kg bolus, followed by 1.5 mL/kg per h)'' 대비 ''increased risk of fluid overload ... without an improvement in clinical outcomes''. ''serial bedside evaluations are required every 6–8 h''; ''A targeted resuscitation strategy with measurement of hematocrit and BUN every 8–12 h is recommended''.'
  kr_says: 'Recommendation 10: ''Goal-directed therapy is recommended for initial fluid resuscitation in acute pancreatitis.'' — Recommendation grade: weak, Evidence level: C. 본문: 24시간 ''4.1 L'' 초과 수액이 지속 장기부전을 늘렸고, 48시간 안에 Hct 35% 미만으로 떨어뜨리는 빠른 과다 수액이 패혈증·사망을 늘렸다. 목표 = ''mean arterial pressure, central venous pressure, heart rate, urine output, blood urea nitrogen concentration, and hematocrit''. 수액 종류(링거 젖산액 vs 생리식염수)·mL/kg 속도는 제시하지 않음.'
  kmle_rule: KMLE 문항·정리본은 초기 수액을 목표지향 수액(평균동맥압·맥박·소변량·BUN·Hct 를 보며 조절, 약한 권고·C)으로 적용하고 과다 수액(24시간 >4 L)의 위험을 적는다. 수액 종류·속도 수치는 국내 지침 근거로 묻지 않는다.
  usmle_rule: USMLE 문항은 lactated Ringer 를 선호 수액으로, 예전 적극 수액보다 중등도 수액(10 mL/kg 볼루스 후 1.5 mL/kg/h)과 Hct·BUN 추적에 따른 목표 수액을 적용한다.
  verified: text
