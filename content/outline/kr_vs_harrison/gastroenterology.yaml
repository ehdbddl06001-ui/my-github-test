  harrison_says: '''Patients with evidence of ascending cholangitis (including sepsis with evidence of biliary obstruction on laboratory or imaging studies) should undergo ERCP within 24–48 h of admission.'''
  kr_says: 'Recommendation 13: ''Early ERCP should be performed in acute gallstone pancreatitis with cholangitis or persistent biliary obstruction.'' — Recommendation grade: strong, Evidence level: A. 본문: ''48시간'' 넘는 담도 폐쇄가 합병증을 늘렸고, 담관염 없는 중증 담석 췌장염에서는 조기 ERCP+괄약근절개가 보존 치료와 주요 합병증·사망에 차이가 없었다. 권고 문장에 시각(시간) 수치는 없음.'
  kmle_rule: KMLE 문항·정리본은 담관염 또는 지속 담도 폐쇄가 있는 담석 췌장염에만 조기 ERCP 를 적용한다(강한 권고, A) — 담관염·폐쇄 없는 담석 췌장염에 일상 ERCP 를 하지 않는다.
  usmle_rule: USMLE 문항은 상행 담관염 동반 담석 췌장염에서 입원 24–48시간 안 ERCP 를 적용한다.
