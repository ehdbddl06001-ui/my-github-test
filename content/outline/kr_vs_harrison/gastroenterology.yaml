- id: diff.gi.ibd.dysplasia-detection-technique
  slot: h326
  h22_chapter: 337
  h22_cite: '[[harrison-22: 337장 p.2570]]'
  kr_guideline_id: kr-kasid-ibd-2026
  kr_cite: 2026 대한장연구학회 염증성 장질환 진단 및 모니터링 가이드라인(대한장연구학회) p.300
  diff_type: algorithm
  topic: 감시 내시경 방법 — 표적 생검 vs 다발 무작위 생검
  harrison_says: '''Annual or biennial colonoscopy with multiple biopsies''; ''International guideline societies have recommended chromoendoscopy for dysplasia surveillance in IBD.'' 실제로는 ''standard-definition white light endoscopy with surveillance biopsies in patients with chronic colitis at average risk and chromoendoscopy in higher-risk patients including those with a history of dysplasia, PSC, or family history of colorectal cancer.'''
  kr_says: '권고문 5.4.1: ''감시 대장내시경검사는 대장의 염증이 충분히 조절된 상태에서 시행하는 것이 바람직하다.'' (94%). 5.4.2: ''고해상도 염색 색소내시경, 고해상도 가상 색소내시경 또는 점막을 주의 깊게 관찰하는 고해상도 백색광 내시경을 시행하는 것을 권장한다.'' (100%). 5.4.3: ''육안적으로 확인되는 모든 병변에 대해서는 표적 생검을 시행하는 것이 권장되며, 무작위 생검은 PSC를 동반하거나, 이형성 병력이 있는 일부 고위험 환자에서 선택적으로 고려될 수 있다.'' (100%)'
  kmle_rule: KMLE 문항·정리본은 염증이 조절된 상태에서 고해상도 색소내시경 또는 고해상도 백색광 내시경으로 보이는 병변을 표적 생검하고, 무작위 생검은 PSC·이형성 병력 고위험군에만 적용한다.
  usmle_rule: USMLE 문항은 감시 대장내시경에서 다발 생검과 chromoendoscopy(특히 고위험군)를 적용한다.
