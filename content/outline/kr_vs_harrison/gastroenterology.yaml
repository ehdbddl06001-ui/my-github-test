  harrison_says: 'p.655: ''the U.S. Preventative Services Task Force updated their screening recommendations in 2021 and lowered the age for recommended screening to 45.'' ''every 5 years instead of every 10 years for colonoscopy) and the use of annual fecal immunohistochemical test (FIT)''. p.656: ''Most professional societies agree that screening for colon cancer should begin at age 45 for patients at average risk.'''
  kr_says: '서론: ''국내의 경우 국가 대장암 선별 검사로서 분변잠혈검사가 시행되고 있으나, 의료 접근성 및 효용성이 높은 국내 의료 환경의 특성상 대장암 선별 검사로 대장내시경검사가 이미 보편화되었으며''. 선별 시작 나이·간격은 이 지침의 범위 밖이라 제시하지 않는다.'
  kmle_rule: KMLE 문항·정리본은 국내 국가 대장암 선별 검사가 분변잠혈검사라고만 이 지침으로 적고, 시작 나이·간격은 국가암검진 기준을 따로 확인해 인용한다(이 지침으로 쓰지 않는다).
  usmle_rule: USMLE 문항은 평균 위험 45세 시작, 대장내시경 10년·FIT 매년·구불결장내시경 5년을 적용한다.
