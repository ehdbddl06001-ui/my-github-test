- id: diff.gi.gerd.pcab-initial-treatment
  slot: h323
  h22_chapter: 334
  h22_cite: '[[harrison-22: 334장 p.2511]]'
  kr_guideline_id: kr-ksnm-gerd-seoul
  kr_cite: 2025 Focused Update of the Seoul Consensus on GERD(대한소화기기능성질환·운동학회) p.10-12
  diff_type: same
  topic: 초기 치료 — PPI 또는 P-CAB 표준용량 4–8주, 중증 미란성 식도염은 P-CAB 우위
  harrison_says: '''The hierarchy of effectiveness among pharmaceuticals for healing esophagitis parallels their antisecretory potency. Potassium competitive acid blockers (PCABs) are more efficacious than proton pump inhibitors (PPIs), which are more efficacious than histamine-2 receptor antagonists (H2RAs). The differences are most evident with severe esophagitis, much less so with mild disease.'' 증상 소실에 대해서는 ''minimal data are available for PCABs''. 치료 기간은 명시하지 않음.'
  kr_says: 'Statement 2(p.10): ''The administration of a standard dose of PPIs or P-CABs once daily for 4 to 8 weeks is recommended as the initial treatment for NERD or mild EE'' — Level of evidence: high; Strength: strong. Statement 3(p.11): ''standard dose of P-CABs or PPIs once daily for 8 weeks is recommended as the initial treatment for severe EE'' — high; weak. Consideration(p.12): ''P-CABs may offer superior mucosal healing efficacy compared to PPIs in patients with severe EE.'' 경증 EE 8주 치유 RR 1.00, 중증 EE 8주 RR 1.10(1.00–1.20). (LA A·B = mild, C·D = severe)'
  kmle_rule: KMLE 문항·정리본은 NERD·경증 EE(LA A·B)는 표준용량 PPI 또는 P-CAB 하루 1회 4–8주, 중증 EE(LA C·D)는 8주로 치료하고 중증에서 P-CAB 의 치유 우위를 적는다.
  usmle_rule: USMLE 문항은 P-CAB > PPI > H2RA 의 식도염 치유 효능 위계(중증 식도염에서 차이가 가장 큼)를 따른다.
  verified: text
- id: diff.gi.gerd.ph-acid-exposure-threshold
  slot: h323
