- id: diff.id.endemic.scrub-typhus-first-line
  slot: h187
  h22_chapter: 192
  h22_cite: '[[harrison-22: 192장 p.1460]]'
  kr_guideline_id: kr-kdca-endemic
  kr_cite: 2026년도 진드기·설치류매개감염병 관리지침(질병관리청) p.26, p.39
