  topic: 중증 말라리아 — 주사 아르테수네이트 후 경구 전환
  harrison_says: '중증 열대열: artesunate 2.4 mg/kg 정맥 즉시, 12·24시간에 2.4 mg/kg, 이후 필요하면 매일(20 kg 미만 소아 3 mg/kg). 없으면 artemether 근주, 그다음 quinine. 경구 섭취가 가능해지면 곧 경구 치료로 바꾼다. artesunate 가 있으면 1차 약이다.'
  kr_says: '합병증이 동반되는 중증 말라리아: 아르테수네이트 주사제 3회 + 경구용 항말라리아제 중 택 1 — 3일(아르테수네이트-피로나리딘, 아토바쿠온-프로구아닐) 또는 2~3회(메플로퀸).'
  kmle_rule: KMLE 문항·정리본은 중증 말라리아를 주사 아르테수네이트(3회) 후 경구 항말라리아제로 마무리하는 기준을 적용한다.
  usmle_rule: USMLE 문항은 IV artesunate(0·12·24시간 2.4 mg/kg) 후 경구 전환이라는 해리슨 기준을 적용한다.
