  topic: 쯔쯔가무시증 항생제 — 약제·용량·중증 병용
  harrison_says: 경구 doxycycline 100 mg 1일 2회 7–15일, azithromycin 500 mg 3일, 또는 chloramphenicol 500 mg 1일 4회 7–15일로 치료한다. 중증 쯔쯔가무시증에서는 doxycycline + azithromycin 병용이 단독요법보다 낫다. 태국 일부 증례는 doxycycline·chloramphenicol 반응이 나쁘나 azithromycin·rifampin 에 반응한다.
