- id: diff.id.endemic.murine-typhus-duration
  slot: h187
  h22_chapter: 192
  h22_cite: '[[harrison-22: 192장 p.1460]]'
  kr_guideline_id: kr-kdca-endemic
  kr_cite: 2026년도 진드기·설치류매개감염병 관리지침(질병관리청) p.122
  diff_type: threshold
  topic: 발진열(murine typhus) 치료 기간
  harrison_says: 발진열이 의심되면 경험적으로 doxycycline 100 mg 1일 2회 경구 7일 치료한다. 구할 수 있으면 chloramphenicol 이 대안이다. ciprofloxacin·azithromycin 은 시험관 내 활성은 있으나 임상적으로 doxycycline 보다 덜 효과적이다.
  kr_says: 항생제(독시사이클린, 클로람페니콜 등) 치료. 발열이 소실된 후 2~3일까지 치료. 치료 지연 시 중증 감염으로 진행될 수 있으므로 실험실 검사 결과를 확인할 때까지 치료가 지연되지 않아야 함.
  kmle_rule: KMLE 문항·정리본은 발진열을 검사 결과를 기다리지 않고 독시사이클린으로 치료하되 기간은 「해열 후 2~3일까지」로 적용한다.
  usmle_rule: USMLE 문항은 해리슨 기준(경험적 doxycycline 100 mg bid 7일)을 적용한다.
  verified: text
- id: diff.id.endemic.vivax-radical-cure
