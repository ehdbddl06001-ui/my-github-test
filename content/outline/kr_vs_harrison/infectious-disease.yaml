  kr_cite: 2026년도 진드기·설치류매개감염병 관리지침(질병관리청) p.35, p.38
  diff_type: algorithm
  topic: 쯔쯔가무시증 가피 빈도와 추정환자 판정
  harrison_says: 가피·국소 림프절병증·반구진 발진의 고전적 소견은 토착민 환자에게서는 드물게 보인다. 귀국 여행자의 50% 미만에서 가피가, 40% 미만에서 발진(병일 4–6일)이 생긴다.
  kr_says: '털진드기에 물린 자국(가피) 발견율은 약 94.3%(p.35). 추정환자 신고 기준(2024.9.5. 개정): ① 가피 형성이 반드시 확인되어야 하며 발열·림프절 종대 등 부합 증상 동반 ② 잠복기 내 야외활동으로 진드기 노출력 확인 ③ 추정진단 검사(ICA, IFA 1차)로 특이항체 검출. 특이항체가 검출되었지만 가피 확인이 안 되면 보건환경연구원 확인진단(PCR) 권고(p.38).'
  kmle_rule: KMLE 문항·정리본은 국내 환자에서 가피를 핵심 진단 단서로 보고, 추정환자 신고에는 가피 확인 + 노출력 + 특이항체 검출이 모두 필요하다는 국내 기준을 적용한다.
  usmle_rule: USMLE 문항은 가피가 없다고 쯔쯔가무시증을 배제하지 않는다는 해리슨 기준(여행자 가피 <50%)을 적용한다.
  verified: text
- id: diff.id.endemic.scrub-typhus-lab-diagnosis
  slot: h187
  h22_chapter: 192
  h22_cite: '[[harrison-22: 192장 p.1460]]'
  kr_guideline_id: kr-kdca-endemic
  kr_cite: 2026년도 진드기·설치류매개감염병 관리지침(질병관리청) p.39
  diff_type: algorithm
  topic: 쯔쯔가무시증 실험실 진단 — 확인·추정 구분
  harrison_says: 혈청검사(간접면역형광항체법, 간접면역과산화효소법, 효소면역법, 측방유동 신속진단검사)가 실험실 진단의 중심이다. 가피에서 Orientia 유전자 PCR 증폭은 효과적이나 혈액에서는 덜하다.
  kr_says: '확인진단: 검체(혈액, 조직, 가피)에서 O. tsutsugamushi 분리 동정, 회복기 혈청의 항체가가 급성기에 비하여 4배 이상 증가(IFA 등), 검체(혈액, 조직, 가피)에서 특이 유전자 검출(Real-time PCR 등). 추정진단: 검체(혈액)에서 특이 항체 검출(IFA, ICA 등). 단일 혈청 IFA 역가 기준치는 이 지침에 없고 법정감염병 진단검사 통합지침을 참조하게 한다.'
  kmle_rule: KMLE 문항·정리본은 확인진단 = 분리·쌍혈청 4배 상승·PCR, 추정진단 = 단일 혈청 특이항체 검출로 구분하는 국내 기준을 적용한다(역가 숫자를 지어내지 않는다).
  usmle_rule: USMLE 문항은 혈청검사(IFA 등)를 진단의 중심으로, PCR 은 가피 검체에서 유용하고 혈액에서는 덜 민감하다는 해리슨 기준을 적용한다.
  verified: text
