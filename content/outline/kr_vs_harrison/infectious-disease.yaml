  kr_says: '국소 요로감염 대안 약제에 ciprofloxacin. 각주 4: 국내 급여기준에 따르면 국소 요로감염에서 ciprofloxacin 의 사용은 1차 약제 투여로 호전되지 않는 환자에 투여하는 것이 원칙(p.8). 점검표: ''Ciprofloxacin은 1차 약제로 사용 불가(심평원)''(p.12). 권고 등급 표기 없음.'
