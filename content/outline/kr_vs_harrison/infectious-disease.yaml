  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.16
  diff_type: threshold
  topic: 항생제 치료 기간
  harrison_says: '''A 5-day course of treatment is usually sufficient for uncomplicated CAP, but longer treatment may be required for patients who have not stabilized clinically and for those with bacteremia, metastatic infection, or infection with a more virulent pathogen such as P. aeruginosa or MRSA. There are some data to suggest that in select patients who are doing well and are clinically stable, treatment may be discontinued after 3 days.'''
  kr_says: 'KQ 10: ''항생제는 적어도 5일 이상 투여한다(권고강도: 강함, 근거수준: 낮음).'' ''통상적으로 항생제는 7-10일 투여하지만 …'' ''치료 종료를 위해서는 48-72시간 동안 발열이 없어야 하고, 치료 종료 전 Table 9의 임상적 안정 기준의 징후 중 1개 이상이 남아 있으면 안 된다.'' ''Legionella 폐렴은 적어도 14일 이상 치료한다.'''
  kmle_rule: KMLE 문항·정리본은 최소 5일 이상(통상 7-10일), 48-72시간 무열 + 임상적 안정 기준 충족 시 종료, Legionella 는 14일 이상을 적용한다.
  usmle_rule: USMLE 문항은 합병증 없는 CAP 에 5일 치료를 기본으로 하고, 균혈증·전이 감염·녹농균·MRSA 는 더 길게 둔다.
