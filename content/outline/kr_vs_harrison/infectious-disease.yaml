  kr_says: 'KQ 11: ''임상적으로 안정이 되고, 경구 치료가 가능하면, 정주 치료에서 경구 치료로 전환이 가능하다(권고강도: 강함, 근거수준: 높음).'' 전환 기준: ''1) 기침 및 호흡 곤란의 호전, 2) 해열: 8시간 동안 <37.8도 유지, 3) 혈액검사에서 백혈구 수의 정상화, 4) 충분한 경구섭취량 및 정상적인 위장관 흡수 기능''.'
