  kr_guideline_id: kr-kdca-endemic
  kr_cite: 2026년도 말라리아 관리지침(질병관리청) p.20, p.40
  diff_type: first_line
  topic: 해외유입 비중증 열대열 — 약제 목록
  harrison_says: 'P. falciparum 비중증: artesunate + SP, artesunate + amodiaquine, artemether-lumefantrine, artesunate + mefloquine, DHA-piperaquine, artesunate-pyronaridine 등 ACT. 2차·수입 말라리아(다른 ACT 가 없을 때): artesunate 또는 quinine 7일 + tetracycline/doxycycline/clindamycin, 또는 atovaquone-proguanil 3일(p.1770). WHO 는 ACT 를 열대열 1차 치료로 권고(p.1768).'
  kr_says: '해외유입 열대열·사일열·원숭이열: 경구용 항말라리아제 중 택 1 — 3일(아르테수네이트-피로나리딘, 아토바쿠온-프로구아닐) 또는 2~3회(메플로퀸)(p.20). 비축 치료·예방약: 클로로퀸, 프리마퀸, 아르테수네이트-피로나리딘, 아토바쿠온-프로구아닐, 메플로퀸(p.40). 아르테메터-루메판트린은 이 목록에 없다.'
  kmle_rule: KMLE 문항·정리본은 해외유입 비중증 열대열 약을 국내 지침 목록(아르테수네이트-피로나리딘 · 아토바쿠온-프로구아닐 · 메플로퀸 중 택 1)으로 적용한다.
  usmle_rule: 'USMLE 문항은 ACT(예: artemether-lumefantrine)를 1차로, atovaquone-proguanil 은 2차·수입 말라리아 대안으로 보는 해리슨 기준을 적용한다.'
