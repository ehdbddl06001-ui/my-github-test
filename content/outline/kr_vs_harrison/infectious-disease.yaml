  diff_type: algorithm
  topic: 입원 신우신염 정주 경험적 약 — 패혈증 여부로 나누기
  harrison_says: 'For hospitalized patients, empirical IV β-lactam chosen by prior resistant isolates and local antibiogram. Parenteral options for uncomplicated pyelonephritis: late-generation cephalosporins (ceftriaxone, cefepime), piperacillin-tazobactam, a carbapenem, or fluoroquinolones; alternatives: novel β-lactam/β-lactamase inhibitors and aminoglycosides.'
