  kmle_rule: KMLE 문항·정리본은 외래 신우신염 경구 약을 ciprofloxacin·levofloxacin·TMP-SMX 로 두고 nitrofurantoin·fosfomycin 은 쓰지 않는다.
  usmle_rule: USMLE 문항도 같은 기준(TMP-SMX·ciprofloxacin·levofloxacin, 가능하면 첫 IV/IM 1회)을 적용한다.
