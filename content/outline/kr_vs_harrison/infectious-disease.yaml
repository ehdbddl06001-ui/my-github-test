  kmle_rule: KMLE 문항·정리본은 쯔쯔가무시증 1차 약을 독시사이클린(대안 아지스로마이신·클로람페니콜)으로 두고, 지침에 없는 용량·기간을 지침 근거로 적지 않는다.
  usmle_rule: USMLE 문항은 해리슨 기준(doxycycline 100 mg bid 7–15일 · azithromycin 500 mg 3일 · 중증은 doxycycline + azithromycin 병용)을 적용한다.
  verified: text
