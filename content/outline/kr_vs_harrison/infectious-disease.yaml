- id: diff.id.sti.partner-management-ept
  slot: h136
  h22_chapter: 141
  h22_cite: '[[harrison-22: 141장 p.1099]] · [[harrison-22: 141장 p.1111]]'
  kr_guideline_id: kr-kdca-sti
