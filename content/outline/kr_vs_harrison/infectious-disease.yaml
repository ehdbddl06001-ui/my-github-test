  harrison_says: '외래 골반염(Table 141-6): ceftriaxone 500 mg IM 1회 + doxycycline 100 mg PO bid 14일 + metronidazole 500 mg PO bid 14일. 임신·골반 농양 의심·진단 불확실·중증·HIV·외래 요법 불가·외래 치료 실패 시 입원 고려.'
