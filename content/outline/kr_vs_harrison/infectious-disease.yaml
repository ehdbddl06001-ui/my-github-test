  harrison_says: Treatment of ASB in pregnant patients and patients undergoing high-risk urologic procedures is recommended and should be guided by urine culture. In all other populations, screening for and treating ASB are discouraged; no urine culture at catheter placement or removal if asymptomatic (p.1092). Screening is done only in pregnancy or before urologic procedures (p.1089).
