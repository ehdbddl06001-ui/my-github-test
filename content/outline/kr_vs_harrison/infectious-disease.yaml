  kmle_rule: KMLE 문항·정리본은 파트너 통지·평가(임균 60일, 클라미디아 8주/6개월)와 검진된 파트너 치료 기준을 적용하고 EPT를 국내 권고로 쓰지 않는다.
  usmle_rule: USMLE 문항은 60일 내 파트너 동일 요법 치료와 EPT 허용 기준을 적용한다.
