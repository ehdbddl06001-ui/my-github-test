  harrison_says: Preferred agents for acute uncomplicated cystitis include TMP-SMX, nitrofurantoin, fosfomycin, and pivmecillinam. TMP-SMX remains an excellent option where local antibiogram data do not clearly favor other preferred agents or with recent TMP-SMX-susceptible microbiology.
  kr_says: '국소 요로감염 경험적 항생제 추천 약제 = nitrofurantoin·fosfomycin, 대안 약제(추천 약제를 사용할 수 없는 경우) = TMP-SMX·ciprofloxacin(p.8 <표 5>). 근거: 국소 요로감염 E. coli 감수성 nitrofurantoin 98.9%, fosfomycin 96.8%, TMP-SMX 68.1%, ciprofloxacin 50.9%(p.5). Pivmecillinam 은 지침에 없다. p.19 국소 요로감염 표는 fosfomycin 을 ''대안''칸에 두어 p.8 <표 5>(추천)와 어긋난다. 권고 등급 표기 없음.'
  kmle_rule: KMLE 문항·정리본은 단순 방광염 1차 약을 nitrofurantoin·fosfomycin 으로 두고 TMP-SMX 는 대안으로 다룬다(국내 E. coli TMP-SMX 감수성 68.1%).
