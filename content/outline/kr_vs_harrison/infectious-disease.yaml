- id: diff.id.cap.outpatient-macrolide-monotherapy
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1028]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.15 (내성률 PDF p.7)
  diff_type: first_line
  topic: 외래 macrolide 단독요법 허용 여부
  harrison_says: '외래 동반질환·내성 위험 없는 환자 표준요법에 ''Monotherapy with a macrolide''가 있으나 각주 ''If local prevalence of pneumococcal resistance is <25%''. 본문: ''Monotherapy with a macrolide is recommended in the guidelines only if there are contraindications to amoxicillin or doxycycline and there is documented low risk of macrolide resistance (<25%).'' p.1026: 미국 macrolide 내성 S. pneumoniae ''approximately 40%'' — ''In these situations, a macrolide should not be used as empirical monotherapy.'''
  kr_says: '''2007년 IDSA/ATS, 2009년 BTS, 2011년 ERS/ESCMID 지침에서는 macrolide 또는 tetracycline 단독치료도 권고되고 있으나, 본 지침에서는 이를 제외하였다. 이는 이들 항생제가 국내 S. pneumoniae 분리주에서 높은 내성률을 보이기 때문이다.'' 국내 S. pneumoniae ''erythromycin, azithromycin 내성률은 여전히 73-81% 가량으로 높다''(PDF p.7). 주사→경구 전환 때도 미국식 경구 macrolide 단독 전환을 그대로 받아들일 근거가 없다고 적는다(PDF p.17).'
  kmle_rule: KMLE 문항·정리본은 외래 지역사회획득 폐렴에서 macrolide(또는 tetracycline) 단독요법을 쓰지 않는다(국내 폐렴구균 macrolide 내성 73-81%).
  usmle_rule: USMLE 문항은 macrolide 단독요법을 국소 폐렴구균 macrolide 내성 <25% 이고 amoxicillin·doxycycline 금기일 때만 허용하는 기준을 적용한다.
  verified: pending
- id: diff.id.cap.outpatient-first-line
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1027]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.14
  diff_type: first_line
  topic: 외래 경험적 항생제 1차 선택
  harrison_says: 'Table 131-4: 동반질환·내성 위험 없음 → ''Combination therapy with amoxicillin (1 g tid) + either a macrolide or doxycycline (100 mg bid) or Monotherapy with doxycycline (100 mg bid) or Monotherapy with a macrolide''. 동반질환(만성 심·폐·간·신장질환, 당뇨, 알코올중독, 악성종양, 무비증) ± 내성 위험 → ''amoxicillin/clavulanate or a cephalosporin + either a macrolide or doxycycline'' 또는 ''Monotherapy with a respiratory fluoroquinolone''. 본문: ''For those without comorbidity or resistance risk factors, amoxicillin alone or doxycycline is recommended in the guidelines.'''
  kr_says: 'KQ 8 권고: ''경험적 항생제로 β-lactam 사용을 권장한다(권고강도: 강함, 근거수준: 높음)'', ''경험적 항생제로 respiratory fluoroquinolone 사용을 권장한다(권고강도: 강함, 근거수준: 높음)''. 요점: ''β-lactam + macrolide는 비정형 폐렴이 의심되는 경우에 한해 권고한다.'' 추천 β-lactam: amoxicillin, amoxicillin-clavulanate, cefditoren, cefpodoxime. 동반질환에 따른 층화와 doxycycline 선택지는 없다.'
  kmle_rule: KMLE 문항·정리본은 외래 1차로 β-lactam(amoxicillin 등) 단독 또는 respiratory fluoroquinolone 단독을 쓰고, macrolide 병합은 비정형 폐렴 의심 때만 쓴다.
  usmle_rule: USMLE 문항은 동반질환 유무로 나눠 건강인은 amoxicillin 또는 doxycycline(±macrolide), 동반질환자는 amoxicillin/clavulanate·cephalosporin + macrolide/doxycycline 또는 respiratory fluoroquinolone 을 쓴다.
  verified: pending
- id: diff.id.cap.fluoroquinolone-tb-caution
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1027]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.14–15
  diff_type: first_line
  topic: 결핵 배제 전 fluoroquinolone 경험적 사용
  harrison_says: 'Table 131-4: 동반질환자 외래 표준요법에 ''Monotherapy with a respiratory fluoroquinolone''(levofloxacin 750 mg/d, moxifloxacin 400 mg/d, gemifloxacin 320 mg/d). 이 표·본문에는 결핵 관련 제한이 없다.'
  kr_says: 'KQ 8: ''결핵을 배제할 수 없는 경우에는 respiratory fluoroquinolone의 경험적 사용을 피한다(권고강도: 약함, 근거수준: 낮음).'' 근거: ''Respiratory fluoroquinolone이 결핵균에도 우수한 항균력을 보이기 때문에 … 결핵 진단이 지연되고 결핵균의 fluoroquinolone 내성을 야기할 우려가 있다.'''
  kmle_rule: KMLE 문항·정리본은 결핵을 배제할 수 없는 폐렴에서 respiratory fluoroquinolone 을 경험적으로 쓰지 않는다.
  usmle_rule: USMLE 문항은 동반질환이 있는 외래 환자에게 respiratory fluoroquinolone 단독요법을 표준 선택지로 둔다.
  verified: pending
- id: diff.id.cap.oral-cephalosporin-cefuroxime
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1027]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.14
  diff_type: first_line
  topic: 외래 경구 cephalosporin — cefuroxime 포함 여부
  harrison_says: 'Table 131-4 각주 f: 동반질환자 병합요법의 cephalosporin = ''Cefpodoxime (200 mg bid) or cefuroxime (500 mg bid)''.'
  kr_says: 추천 경구 cephalosporin 은 cefpodoxime 과 cefditoren. '반면, cefuroxime의 경우 국내 분리 S. pneumoniae의 내성률이 상당히 높아서 권고안에서 제외되었다.'
  kmle_rule: KMLE 문항·정리본은 외래 폐렴 경구 cephalosporin 으로 cefpodoxime·cefditoren 을 쓰고 cefuroxime 은 쓰지 않는다.
  usmle_rule: USMLE 문항은 cefpodoxime 또는 cefuroxime 을 macrolide·doxycycline 과 병합하는 선택지로 인정한다.
  verified: pending
- id: diff.id.cap.inpatient-nonsevere-regimen
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1028]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.15–16
  diff_type: first_line
  topic: 일반병동 입원(비중증) 경험적 항생제
  harrison_says: '''For patients with nonsevere infection and no risk factors, treatment should consist of either a combination of a β-lactam and a macrolide or monotherapy with a respiratory fluoroquinolone'' … ''Treatment with a β-lactam plus macrolide combination or a fluoroquinolone alone results in lower mortality than monotherapy with a β-lactam.'' macrolide·FQ 금기면 β-lactam + doxycycline.'
  kr_says: 'KQ 9: ''일반병실에 입원하는 경증 또는 중등도 폐렴 환자의 경험적 치료 시 β-lactam 항생제 또는 respiratory fluoroquinolone 항생제의 단독투여를 권장한다(권고강도: 약함, 근거수준: 중등도).'' ''β-lactam 항생제와 macrolide 항생제의 병용투여는 비정형세균 감염이 의심되거나, 중증 폐렴인 환자에서 제한적으로 사용한다(권고강도: 약함, 근거수준: 중등도).'' 정맥 β-lactam: amoxicillin/clavulanic acid, ampicillin/sulbactam, cefotaxime, ceftriaxone(PDF p.16).'
  kmle_rule: KMLE 문항·정리본은 일반병동 경증-중등도 폐렴에 β-lactam 단독 또는 respiratory fluoroquinolone 단독을 쓰고, macrolide 병용은 비정형균 의심·중증일 때만 쓴다.
  usmle_rule: USMLE 문항은 비중증 입원 폐렴에 β-lactam + macrolide 또는 respiratory fluoroquinolone 단독을 쓰고 β-lactam 단독은 표준으로 두지 않는다.
  verified: pending
- id: diff.id.cap.icu-combination-regimen
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1028]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.18
  diff_type: same
  topic: 중증(중환자실) 폐렴 경험적 병용요법
  harrison_says: 'Table 131-5 Severe, No risk factors: ''A β-lactam + a macrolide or A β-lactam + respiratory fluoroquinolone''. ''Observational studies suggest that combination therapy with a β-lactam plus macrolide may be preferable to a β-lactam plus fluoroquinolone.'''
  kr_says: 'KQ 14·15: ''중환자실 입원치료를 필요로 하는 환자는 β-lactam 단독요법보다는 β-lactam ＋ azithromycin/fluoroquinolone의 병용요법을 권장한다(권고강도: 강함, 근거수준: 중등도)'', ''respiratory fluoroquinolone 단독요법보다는 β-lactam ＋ azithromycin/fluoroquinolone의 병용요법을 권장한다(권고강도: 강함, 근거수준: 중등도).'' β-lactam: ampicillin/sulbactam, cefotaxime, ceftriaxone. 페니실린 과민반응이면 respiratory fluoroquinolone + aztreonam.'
  kmle_rule: KMLE 문항·정리본은 중환자실 폐렴에 β-lactam + azithromycin 또는 β-lactam + respiratory fluoroquinolone 병용을 쓴다(단독요법 ✗).
  usmle_rule: USMLE 문항은 중증 폐렴에 β-lactam + macrolide 또는 β-lactam + respiratory fluoroquinolone 병용을 쓴다.
  verified: pending
- id: diff.id.cap.mrsa-pseudomonas-coverage
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1028]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.18–19
  diff_type: algorithm
  topic: MRSA·녹농균 경험적 추가 기준
  harrison_says: '''If MRSA or P. aeruginosa has been isolated previously, appropriate empirical therapy should be started in both severe and nonsevere cases.'' 위험 요인이 최근 입원·3개월 내 항생제면 ''appropriate samples should be obtained for culture, and, in severe cases only, extended-spectrum treatment for MRSA or P. aeruginosa should be initiated.'' P. aeruginosa 위험에 기관지확장증·매우 중증 COPD. ''We prefer linezolid over vancomycin as first-line treatment for MRSA''; 배양·비강 PCR 음성이고 48시간에 호전되면 표준요법으로 de-escalation.'
  kr_says: '중환자실 환자에서 ''P. aeruginosa에 의한 폐렴이 의심되는 경우에는 … antipseudomonal 효과를 가지는 두 가지 항생제의 병용요법을 시행한다'' — (a) antipseudomonal β-lactam(cefepime, piperacillin/tazobactam, imipenem, meropenem) + ciprofloxacin 혹은 levofloxacin, (b) + aminoglycoside + azithromycin, (c) + aminoglycoside + anti-pneumococcal fluoroquinolone. 위험 요인: ''음주, 기관지확장증과 같은 폐의 구조적 질환, 반복되는 만성 폐쇄성 폐질환의 급성 악화로 인해 스테로이드를 자주 투여해 온 병력, 최근 3개월 이내의 항생제 사용력''. 지역사회획득 MRSA 의심 시 ''vancomycin이나 teicoplanin, linezolid을 사용할 수 있고, clindamycin이나 rifampin 추가를 고려해 볼 수 있다.'' 이전 분리력에 따른 위계·비중증 구분은 없다.'
  kmle_rule: KMLE 문항·정리본은 녹농균 위험 요인(음주·기관지확장증·잦은 스테로이드·3개월 내 항생제)이 있는 중증 폐렴에 antipseudomonal β-lactam 을 포함한 2제 이상 병용을, CA-MRSA 의심에 vancomycin·teicoplanin·linezolid 를 쓴다.
  usmle_rule: USMLE 문항은 호흡기 검체 이전 분리력이면 중증도와 무관하게 MRSA·녹농균 치료를 추가하고, 최근 입원·항생제만 있으면 배양 후 중증일 때만 추가한다.
  verified: pending
- id: diff.id.cap.site-of-care-score
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1026]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.11–12
  diff_type: algorithm
  topic: 입원 결정 중증도 점수(CRB-65·CURB-65·PSI)
  harrison_says: 'CURB-65: ''Patients with a score of 0 (a 30-day mortality rate of 1.5%) can be treated as outpatients. With a score of 1 or 2, the patient should be hospitalized unless the score is entirely or in part attributable to an age of ≥65 years'' … ''≥3, mortality rates are 22% overall; these patients may require ICU admission.'' ''The PSI score has greater efficacy and has been more robustly validated than the CURB-65 criteria but is more difficult to calculate.'' 경구 섭취 불가·순응 문제·실내공기 O2 포화도 <92% 면 입원.'
  kr_says: 'KQ 6: ''객관적 기준으로는 의원이나 병원급 의료기관의 외래 진료에서는 CRB-65 이용을 권장하며, 응급실 진료 등 혈액검사 결과가 있는 경우에는 CURB-65의 사용을 권장한다(강함, 낮음).'' 요점: ''PSI와 CURB-65/CRB-65 점수체계는 예측력이 동등하나 적용성 면에서 PSI에 비해 CURB-65/CRB-65가 월등''. ''CRB-65로 환자를 평가하여 점수가 0이 아닌 경우 입원이 가능한 병원으로의 전원이나 입원 진료를 고려'' — 단 나이 기준만 만족하고 다른 지표가 안정적이면 외래 고려(PDF p.12).'
  kmle_rule: KMLE 문항·정리본은 의원 외래에서 CRB-65(0점 외래, 1점 이상 전원·입원 고려 — 나이만 해당하면 예외), 혈액검사가 있으면 CURB-65 로 입원을 판단한다.
  usmle_rule: USMLE 문항은 PSI 또는 CURB-65(0 외래, 1–2 입원 단 나이 때문이면 예외, ≥3 ICU 고려)와 SpO2 <92% 등 입원 사유를 적용한다.
  verified: pending
- id: diff.id.cap.icu-admission-minor-criteria
  slot: h126
  h22_chapter: 131
  h22_cite: '[[harrison-22: 131장 p.1026]]'
  kr_guideline_id: kr-ksid-cap-2018
  kr_cite: 성인 지역사회획득 폐렴 항생제 사용지침(2018, 대한감염학회 등 · 한글판) PDF p.13
  diff_type: threshold
  topic: 중환자실 입실 — 보조기준 3개의 무게
  harrison_says: '''Neither PSI nor CURB-65 is accurate in determining the need for ICU admission. Patients with septic shock requiring vasopressors or with acute respiratory failure requiring intubation and mechanical ventilation should be admitted directly to an ICU (Table 131-3), and those with three of the nine minor criteria listed in the latter table should be admitted to an ICU or a high-level monitoring unit.'''
  kr_says: 'KQ 7: ''기계환기 보조가 필요하거나 패혈성 쇽이 동반된 경우에는 중환자실 입원치료가 필요하다(강함, 중등도).'' ''CURB-65가 ≥3이거나 IDSA/ATS 중증폐렴 정의의 보조 인자 기준을 충족하는 경우, 임상적으로 폐렴이 진행하는 경우, 기저질환의 악화가 있는 경우에는 중환자실 입실 필요성에 대해서 검토해야 한다(약함, 낮음).'' 보조기준은 ''특이도는 좋으나 예민도는 중간 정도''.'
  kmle_rule: KMLE 문항·정리본은 기계환기·승압제 필요 패혈성 쇼크면 중환자실, CURB-65 ≥3 또는 보조기준 충족은 중환자실 필요성 '검토'로 둔다.
  usmle_rule: USMLE 문항은 주기준 1개면 ICU 직행, 보조기준 9개 중 3개면 ICU 또는 고도 감시 병동 입원으로 둔다.
