  kmle_rule: KMLE 문항·정리본은 이 국내 STI 지침에 골반염 요법이 없으므로 해리슨 ceftriaxone + doxycycline + metronidazole 14일 요법을 쓰고 국내 출처 공백을 표시한다.
  usmle_rule: USMLE 문항은 ceftriaxone 500 mg IM + doxycycline 14일 + metronidazole 14일 외래 요법을 적용한다.
