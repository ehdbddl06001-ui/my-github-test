  harrison_says: 요도염 지표 환자와 지난 60일 내 접촉한 파트너는 임질·클라미디아 검사를 받고, 검사 여부와 관계없이 지표 환자와 같은 요법을 받아야 한다. 환자가 파트너에게 약을 전달하는 expedited partner therapy(EPT)는 지표 환자의 재감염을 유의하게 줄였고 미국 46개 주에서 허용.
