# 성인 지역사회획득 폐렴(kr-ksid-cap-2018) 항목은 verified: pending — 확보한 한글판 PDF 에 인쇄쪽이 없어 「PDF p.N」으로 적었다. 영문 게재본(Infect Chemother 2018;50:160-198, 봇 차단)을 확보하면 인쇄쪽으로 바꿔 text 로 올린다.
# 말라리아 항목의 국내 원문은 2026년도 말라리아 관리지침(질병관리청 — 드라이브 KDCA_malaria_management_2026.pdf), 쯔쯔가무시증은 2026년도 진드기·설치류매개감염병 관리지침. 둘 다 kr-kdca-endemic 트랙.
