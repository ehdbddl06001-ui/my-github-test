  kr_cite: 2026년도 말라리아 관리지침(질병관리청) p.75(권고 5-3·5-4)
  diff_type: screening
  topic: 프리마퀸 전 G6PD 검사
  harrison_says: primaquine 은 G6PD 결핍 검사 음성 확인 뒤 준다. 경한 G6PD 결핍 변이에서는 0.75 mg base/kg(최대 45 mg) 주 1회 8주. 중증 G6PD 결핍에는 주지 않는다. 임신부는 primaquine 대신 분만 후 1개월까지 chloroquine 주 1회 억제 예방 후 근치한다(p.1772–1773).
  kr_says: '권고 5-3: 「프리마퀸 투약 전 G6PD(glucose-6-phosphate-dehydrogenase)에 대한 검사를 가급적 시행하고 타페노퀸 투약 전에는 반드시 시행한다」(강함·높음). 권고 5-4: 「G6PD 결핍 시 프리마퀸 0.75mg base/kg를 8주간 주 1회 투약한다」(강함·낮음).'
  kmle_rule: KMLE 문항·정리본은 프리마퀸 전 G6PD 검사는 「가급적」(타페노퀸 전에는 반드시), 결핍이면 0.75 mg base/kg 주 1회 8주의 국내 기준을 적용한다.
  usmle_rule: USMLE 문항은 primaquine 전 G6PD 검사(중증 결핍 금기, 경증은 주 1회 8주)라는 해리슨 기준을 적용한다.
