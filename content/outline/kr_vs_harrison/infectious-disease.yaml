  harrison_says: USPSTF는 성적으로 활동적인 25세 이하 여성을 진료 때마다(최소 연 1회) C. trachomatis 선별하도록 권고한다. 더 나이 든 여성은 파트너가 둘 이상이거나 새 관계를 시작했거나 다른 STI가 진단되면 검사.
  kr_says: 성적으로 활동적인 25세 미만의 남/녀를 성매개감염 위험인자로 든다. 무증상 감염 의심자 표준 검사로 남성 첫 소변·여성 질 도말 multiplex PCR을 제시하나, 연령별 정기 선별 주기는 정하지 않는다.
  kmle_rule: KMLE 문항·정리본은 위험인자(25세 미만 성활동 남녀 등)가 있는 무증상자에 multiplex PCR 검사 기준을 적용하고 연 1회 주기를 국내 권고로 쓰지 않는다.
  usmle_rule: USMLE 문항은 성적으로 활동적인 25세 이하 여성 연 1회 클라미디아 선별 기준을 적용한다.
