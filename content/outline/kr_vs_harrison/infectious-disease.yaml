  harrison_says: For pyelonephritis not needing hospitalization, empirical TMP-SMX, ciprofloxacin, or levofloxacin based on local antibiogram, with urine culture and short-term follow-up; optimally an initial IV/IM β-lactam or aminoglycoside dose. Oral β-lactams are less effective and should be used with caution. Nitrofurantoin, pivmecillinam, and fosfomycin should not be used for pyelonephritis.
