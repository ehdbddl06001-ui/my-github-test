- id: diff.endo.thyroid-nodule.initial-tsh-scan
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3048]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:216
  diff_type: same
  topic: 결절 첫 검사 — TSH 먼저, 낮으면 갑상선스캔
  harrison_says: '모든 결절에서 TSH 를 잰다. TSH 가 억제돼 있으면 방사성핵종 스캔으로 ''열결절''인지 본다 — 섭취 증가 병소는 거의 악성이 아니어서 FNA 가 필요 없다. 그렇지 않으면 다음 단계는 갑상선 초음파(그림 397-6: 정상·높은 TSH → 림프절 평가를 포함한 진단 초음파 → 초음파 소견과 크기로 FNA).'
  kr_says: 2.1.A 갑상선결절의 초기 검사에 TSH 를 포함한 갑상선기능검사를 시행하고, TSH 가 정상보다 낮으면 갑상선스캔을 시행한다(권고수준 1). 혈청 TSH 가 낮지 않으면 갑상선 초음파를 시행한다. 자율기능성 결절은 냉결절보다 악성 가능성이 낮지만 초음파를 시행했다면 초음파 소견에 근거하여 필요에 따라 병리진단검사를 시행한다(p.216). 2.2.A 결절이 있거나 의심되는 모든 환자에서 경부 림프절 평가를 포함한 초음파(권고수준 1, p.218).
  kmle_rule: KMLE 문항·정리본은 TSH 먼저 → 낮으면 갑상선스캔, 정상·높으면 경부 림프절을 포함한 초음파 → K-TIRADS 와 크기로 병리진단검사 순서를 적용한다(자율기능성 결절도 초음파를 했다면 소견에 따라 생검 가능하다는 단서까지).
  usmle_rule: USMLE 문항은 TSH 먼저 → 낮으면 radionuclide scan(hot nodule 은 FNA 불필요), 정상·높으면 초음파 → FNA 결정 순서를 적용한다.
  verified: text
- id: diff.endo.thyroid-nodule.fna-cutoff-high-suspicion
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3042]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:218
  diff_type: same
  topic: 가장 의심스러운 결절(TR5 · K-TIRADS 5)의 FNA 크기 기준
  harrison_says: 'ACR TI-RADS(그림 397-1) TR5 Highly Suspicious — FNA if ≥ 1 cm, Follow if ≥ 0.5 cm. 본문(p.3048): 모든 위험층화 체계가 가장 의심스러운 TR5 결절에서 1 cm 에 FNA 를 권한다.'
  kr_says: '2021 K-TIRADS(Table 2.2.A): 5 높은의심(암 의심 초음파 소견이 있는 저에코 고형결절), 암 위험도 >60%, FNA/CNB 기준 >1 cm. 본문(p.219): 높은의심 결절은 크기가 1 cm 보다 큰 결절에서 병리진단검사를 시행한다.'
  kmle_rule: KMLE 문항·정리본은 K-TIRADS 5(높은의심) 결절은 1 cm 초과에서 병리진단검사(FNA, 보완으로 CNB) 기준을 적용한다.
  usmle_rule: USMLE 문항은 ACR TI-RADS TR5 는 ≥1 cm 에서 FNA(0.5 cm 이상은 추적) 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-nodule.fna-cutoff-intermediate-low
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3042]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:218
  diff_type: threshold
  topic: 중간·낮은의심 결절의 FNA 크기 기준(K-TIRADS 4·3·2 vs ACR TR4·TR3·TR2)
  harrison_says: 'ACR TI-RADS(그림 397-1): TR4 Moderately Suspicious — FNA if ≥ 1.5 cm, Follow if ≥ 1 cm; TR3 Mildly Suspicious — FNA if ≥ 2.5 cm, Follow if ≥ 1.5 cm; TR2 Not Suspicious·TR1 Benign — No FNA. 본문(p.3048): 매끈한 경계의 고형 저에코 결절(TR4)은 10–20% 가 악성이고 FNA 크기 기준은 체계에 따라 1–1.5 cm. 체계마다 크기 기준이 다르다.'
  kr_says: '2021 K-TIRADS(Table 2.2.A): 4 중간의심(암 위험도 10-40%) — >1-1.5 cm(초음파 소견·결절 위치·임상 위험인자·환자 특성을 고려해 1-1.5 cm 범위에서 결정); 3 낮은의심(암 의심 소견이 없는 부분 낭성 혹은 등/고에코 결절, 3-10%) — >2 cm; 2 양성(등/고에코 해면모양 결절, 혜성꼬리 인공음영 동반 부분 낭성 결절, 순수 낭종, <3%) — 해당하지 않음(단 지속적으로 커지거나 수술·고주파/에탄올절제 예정이면 생검).'
  kmle_rule: KMLE 문항·정리본은 K-TIRADS 기준(4 중간의심 >1-1.5 cm, 3 낮은의심 >2 cm, 2 양성은 진단 목적 생검 불필요)을 적용한다 — ACR TR3 의 2.5 cm 를 쓰지 않는다.
  usmle_rule: USMLE 문항은 ACR TI-RADS 기준(TR4 ≥1.5 cm, TR3 ≥2.5 cm, TR1·TR2 FNA 없음)을 적용한다.
  verified: text
- id: diff.endo.thyroid-nodule.subcentimeter-biopsy
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3048]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:219
  diff_type: threshold
  topic: 1 cm 이하 결절의 병리진단검사
  harrison_says: 작은(<1 cm) 갑상선암의 유병률과 대체로 느린 경과를 고려해, 어떤 위험층화 체계도 전이 경부 림프절이 없는 한 1 cm 미만 결절에 일상적 FNA 를 권하지 않는다. (ACR TR5 는 0.5 cm 이상이면 추적, 5–9 mm TR5 는 미세유두암 논의 참조 — 그림 397-1.)
  kr_says: 1 cm 이하 결절의 생검 기준은 이견이 많다. 단 경부 림프절전이 의심, 명백한 주변 구조물로의 갑상선외부침범, 확인된 원격전이, 갑상선수질암 의심 등 불량한 예후 인자가 있으면 크기와 무관하게 가장 의심스러운 결절에서 병리진단검사가 권고된다. 기도 혹은 되돌이후두신경 경로를 따라 후내측 피막에 붙은 높은의심 결절(>0.5 cm 및 ≤1 cm)은 병리진단검사가 권고되고, 그 밖의 작은(>0.5 cm 및 ≤1 cm) 높은의심 결절은 적극적 관찰 등 치료 결정을 위해 성인에서 병리진단검사가 고려될 수 있다(소아는 임상 소견을 고려해 시행될 수 있다).
  kmle_rule: KMLE 문항·정리본은 0.5-1 cm 높은의심 결절이라도 기도·되돌이후두신경 쪽 후내측 피막에 붙어 있거나 림프절전이·갑상선외부침범·원격전이·수질암 의심이 있으면 병리진단검사를 하는 KTA 기준을 적용한다.
  usmle_rule: USMLE 문항은 1 cm 미만 결절은 전이 경부 림프절이 없으면 일상적 FNA 를 하지 않는 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-nodule.core-needle-biopsy
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3048]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:216
  diff_type: algorithm
  topic: 중심바늘생검(CNB)의 자리
  harrison_says: FNA(가능하면 초음파 유도)가 최선의 진단 검사다. 비진단적 결과면 초음파 유도 FNA 를 반복한다(반복 FNA 로 약 50% 에서 진단, p.3049). 397장(p.3040–3050)에는 중심바늘생검에 대한 언급이 없다.
  kr_says: FNA 가 정확하고 비용 대비 효율이 가장 큰 방법으로 일차 권고되며, CNB 는 FNA 의 보완적 수단으로 숙련된 외과의에 의해 선택적으로 고려할 수 있다(p.216; Table 2.2.A 주 b, p.218). 3.1.C CNB 결과는 대한갑상선학회 병리진단 권고안의 6개 진단 범주로 보고한다(권고수준 2). 비진단적 FNA 뒤 FNA 재시행은 28.1-40.0% 에서 다시 비진단적이나 CNB 는 1.1-3.8% 만 비진단적이어서 CNB 는 비진단적 결과를 낮추는 데 도움이 된다(p.222). 3.4.A AUS 결절에서 반복 FNA, CNB, 또는 분자표지자검사를 시행해 볼 수 있다(권고수준 3).
  kmle_rule: KMLE 문항·정리본은 FNA 를 일차 검사로, CNB 를 FNA 의 보완(비진단적 반복·AUS 등에서 선택적)으로 적용한다 — '병리진단검사'는 FNA/CNB 를 함께 가리킨다.
  usmle_rule: USMLE 문항은 초음파 유도 FNA 를 진단 검사로 쓰고, 비진단적이면 초음파 유도 FNA 반복을 정답으로 적용한다(CNB 는 Harrison 근거가 없어 정답 보기로 쓰지 않는다).
  verified: text
- id: diff.endo.thyroid-nodule.bethesda-indeterminate
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3049]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:212(권고 요약표), 224(본문)
  diff_type: algorithm
  topic: 미결정 세포검사(Bethesda III AUS · IV 여포종양)의 처치
  harrison_says: 'AUS·FN 결절은 대부분 양성이고 악성 위험(ROM)은 13–34%. 전통적 접근은 조직 진단을 위한 진단적 엽절제술이며, 분자검사가 양성·악성 구분을 돕는다(음성예측도 >95%, p.3050). 그림 397-6: AUS → 초음파 유도 FNA 반복 또는 분자검사 고려; 여포종양 → 분자검사 고려, 필요하면 수술. Bethesda 3판 ROM: III 22(13–30)%, IV 30(23–34)%.'
  kr_says: '3.4.A AUS 결절은 임상 위험인자·초음파 소견·환자 선호도와 실행 가능성을 고려해 초음파 추적관찰 또는 반복 FNA, CNB, 분자표지자검사(권고수준 3). 3.4.B 결론에 이르지 못하면 초음파 추적관찰 또는 수술(권고수준 2). 3.5.A 여포종양(Bethesda 4)은 수술을 우선 고려하며, 크기가 2 cm 혹은 그 이상으로 커질수록 암 위험도가 증가함을 고려한다(권고수준 2). 3.5.B 초음파 추적관찰 또는 분자표지자검사 가능(권고수준 3). 성인 ROM: III 22(13-30)%, IV 30(23-34)%(Table 3.1.A, p.221).'
  kmle_rule: KMLE 문항·정리본은 AUS 는 추적·반복 FNA·CNB·분자검사 중 선택, 여포종양은 수술 우선(2 cm 이상이면 위험 증가) 기준을 적용한다.
  usmle_rule: USMLE 문항은 AUS 는 반복 FNA 또는 분자검사, 여포종양은 분자검사 또는 진단적 엽절제술 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-nodule.bethesda-sfm-malignant
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3049]]'
  kr_guideline_id: kr-kta-nodule-2024
  kr_cite: 2024 대한갑상선학회 갑상선결절 진료권고안 Int J Thyroidol 2024;17:212
  diff_type: same
  topic: 악성의심·악성 세포검사 → 수술(수술 전 경부 림프절 초음파)
  harrison_says: '악성을 가리키는 세포검사는 대체로 수술을 요하며, 수술 전 초음파로 경부 림프절을 평가한다(p.3048). 악성의심 세포검사는 경부 림프절 초음파 평가 뒤 수술을 권하고, 엽절제술 대 전절제술을 환자와 논의한다(p.3049). ROM: V 74(67–83)%, VI 97(97–100)%.'
  kr_says: '3.6.A 갑상선유두암의심(악성의심)은 악성과 유사하게 임상 위험요소·초음파 소견·환자 선호도를 고려해 수술적 절제(권고수준 2). 3.7.A 악성이면 일반적으로 수술을 권고한다(권고수준 1). 3.7.B 저위험군 미세갑상선유두암 성인은 적극적 관찰을 고려할 수 있다(권고수준 2). 성인 ROM: V 74(67-83)%, VI 97(97-100)%(Table 3.1.A, p.221).'
  kmle_rule: KMLE 문항·정리본은 Bethesda V·VI 는 수술(수술 전 경부 림프절 초음파)을 기본으로 하되 저위험 미세유두암 성인은 적극적 관찰을 고를 수 있다는 기준을 적용한다.
  usmle_rule: USMLE 문항은 Bethesda V·VI 는 경부 림프절 초음파 뒤 수술 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.active-surveillance
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3046]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:38-39(권고 I.2.3.A), 80(미세갑상선유두암 = 1 cm 이하)
  diff_type: threshold
  topic: 저위험 미세유두암의 적극적 관찰 — 크기 상한과 제외 기준
  harrison_says: 1–1.5 cm 초과(T1b 이상) 분화암은 모두 절제해야 한다. 적극적 관찰은 경부 림프절전이·갑상선외부침범·후피막 근처(되돌이후두신경 근처) 위치가 없는 작은(최대 1.5 cm) 갑상선 내 미세유두암에서 선택지다.
  kr_says: 'I.2.3.A 저위험군 미세갑상선유두암으로 진단된 성인 환자에서 적극적 관찰을 고려할 수 있다(권고수준 2). 다음이면 수술을 우선 고려: 가) 임상적으로 림프절전이 또는 원격전이 의심, 나) 육안적 갑상선외부침범 또는 기관·되돌이후두신경 침범 의심·우려, 다) 공격적 조직아형(긴세포, 원주세포, Hobnail 등). 진행 정의는 대부분 최대 길이 3 mm 이상 증가와 새 림프절·원격전이·갑상선외부침범(p.39). 1-2 cm 저위험 유두암의 적극적 관찰은 추가 연구가 필요하다(p.39).'
  kmle_rule: KMLE 문항·정리본은 적극적 관찰 대상을 저위험 '미세'(1 cm 이하) 유두암 성인으로 한정하고, 림프절·원격전이 의심, 육안적 갑상선외부침범·기관/되돌이후두신경 침범 우려, 공격적 아형이면 수술하는 KTA 기준을 적용한다.
  usmle_rule: USMLE 문항은 최대 1.5 cm 갑상선 내 미세유두암(림프절전이·갑상선외부침범·후피막 근처 위치 없음)에서 active surveillance 를 선택지로 하는 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.extent-of-surgery
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3046]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:36
  diff_type: same
  topic: 엽절제술 vs 전절제술 — 크기·림프절·원격전이
  harrison_says: 양측 수술이 생존을 개선한다는 확실한 근거가 없어, 전이가 없고 경부 림프절 초음파 평가 뒤 >1 cm, <4 cm 갑상선 내 암(T1b·T2)은 엽절제술 또는 근전절제술 모두 가능하다(p.3046–3047). 전이가 있거나 임상적 갑상선외부침범이 있거나 대부분의 >4 cm 종양은 근전절제술이 적절하다. 엽절제 뒤 고위험 병리(혈관침습, 덜 분화된 아형)면 완료절제술(p.3047).
  kr_says: I.2.2.A ≤1 cm·육안적 갑상선외부침범 없음(cT1a)·cN0 → 엽절제술(권고수준 1). B 1-2 cm(cT1b)·cN0 → 엽절제술 우선, 방사성요오드 계획·추적 효율·선호도에 따라 전절제술 가능(권고수준 1). C 2-4 cm(cT2)·cN0 → 엽절제술 또는 전절제술 선택(권고수준 2). D >4 cm(cT3a)·cN0 → 일반적으로 전절제술(권고수준 2). F 크기와 무관하게 주요 기관 육안 침범(cT4), cN1, M1 → 전절제와 원발암의 완전한 육안적 제거(권고수준 2).
  kmle_rule: KMLE 문항·정리본은 cT1a 엽절제, cT1b 엽절제 우선, cT2 둘 중 선택, cT3a 전절제, cT4·cN1·M1 전절제의 KTA 단계를 적용한다.
  usmle_rule: USMLE 문항은 1–4 cm 갑상선 내·전이 없음은 lobectomy 또는 near-total, 전이·임상적 갑상선외부침범·>4 cm 는 near-total thyroidectomy 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.strap-muscle-ete
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3047]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:36
  diff_type: algorithm
  topic: 띠근육에 국한된 육안적 갑상선외부침범(cT3b)의 수술 범위
  harrison_says: 전이가 있거나 임상적 갑상선외부침범(extrathyroidal invasion)의 증거가 있으면 근전절제술이 적절하다 — 침범 범위(띠근육 vs 주요 기관)를 나누지 않는다.
  kr_says: I.2.2.E 크기에 상관없이 띠근육에 국한된 육안적 갑상선외부침범(cT3b)은 재발 또는 사망 감소 효과와 합병증 증가 위험을 고려하여 갑상선전절제술을 '선택적으로' 시행할 수 있다(권고수준 2). 반면 주요 기관에 대한 육안적 침범(cT4)은 전절제를 시행하여야 한다(I.2.2.F, 권고수준 2).
  kmle_rule: KMLE 문항·정리본은 띠근육에 국한된 육안적 침범(cT3b)은 전절제가 '선택적', 주요 기관 침범(cT4)은 전절제 필수로 나누는 KTA 기준을 적용한다.
  usmle_rule: USMLE 문항은 임상적 갑상선외부침범이 있으면 near-total thyroidectomy 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.rai-indication
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3047]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:100
  diff_type: same
  topic: 수술 뒤 방사성요오드 치료 대상(저·중간·고위험)
  harrison_says: 모든 환자가 방사성요오드로 이득을 보지는 않는다. 갑상선에 국한된 T1(≤2 cm) 1기 환자는 재발·생존 모두 개선되지 않고, 더 큰(>2 cm, <4 cm) 저위험 종양도 이득이 입증되지 않았다. 고위험(큰 종양, 공격적 유두암 아형, 혈관침습, 갑상선외부침범, 대량 림프절전이)에서는 재발을 줄이고 고령에서 생존을 늘릴 수 있다.
  kr_says: I.6.2.A 저위험군에서 일률적인 방사성요오드 잔여갑상선제거술은 권고되지 않는다(권고수준 2; 개별 재발 위험인자와 추적 영향을 고려). I.6.2.B 중간위험군은 위험인자를 종합한 재발위험도에 따라 방사성요오드 치료(잔여갑상선제거술 또는 보조치료)를 고려한다(권고수준 2). I.6.2.C 고위험군은 방사성요오드 치료(보조치료 또는 알려진 병소의 치료)를 시행한다(권고수준 1).
  kmle_rule: KMLE 문항·정리본은 초기위험군(저 = 일률 시행 안 함, 중간 = 고려, 고 = 시행)에 따른 KTA 방사성요오드 기준을 적용한다.
  usmle_rule: USMLE 문항은 ≤2 cm 갑상선 내 저위험 종양은 RAI 이득 없음, 고위험 특징(큰 종양·공격적 아형·혈관침습·갑상선외부침범·대량 림프절전이)이면 RAI 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.rai-preparation-tsh
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3047]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:104
  diff_type: threshold
  topic: 방사성요오드 투여 전 TSH 자극 — 갑상선호르몬 중단 기간과 목표 TSH
  harrison_says: 저요오드 식이 1–2주 뒤 높은 TSH 상태에서 투여한다. 갑상선호르몬 중단 시 투여 때 혈청 TSH 가 이상적으로 >25 mIU/L. 흔한 방법은 수술 뒤 몇 주 liothyronine(25 μg 하루 1–2번) 후 2주 중단. 또는 rhTSH 0.9 mg 이틀 연속 주사 후 두 번째 주사 24시간 뒤 131I — 두 방법의 잔여갑상선 제거 성공률은 같다. 잔여갑상선 제거에는 1100 MBq(30 mCi) 저용량.
  kr_says: I.6.4.F LT4 중단으로 TSH 를 자극하려면 치료·진단스캔 전 LT4 를 3-4주간 중단하거나, 2-3주간 LT3 로 바꾼 뒤 최소한 2주간 중단한다(권고수준 1). I.6.4.G LT4 중단 시 TSH 가 30 mIU/L 이상이 되도록 한다(권고수준 3). I.6.4.D 잔여갑상선제거·보조치료 목적이면 LT4 중단보다 rhTSH 를 우선 권고(권고수준 1, p.9). I.6.3.A 잔여갑상선제거술은 일반적으로 30-50 mCi(1.11-1.75 GBq)(권고수준 1, p.102). I.6.4.H 1-2주 저요오드 식이(권고수준 2, p.9).
  kmle_rule: KMLE 문항·정리본은 LT4 3-4주 중단(또는 LT3 2-3주 뒤 2주 이상 중단)으로 TSH ≥30 mIU/L, 잔여갑상선제거·보조치료에는 rhTSH 우선, 잔여갑상선제거 30-50 mCi 의 KTA 기준을 적용한다.
  usmle_rule: USMLE 문항은 갑상선호르몬 중단 시 TSH >25 mIU/L, 또는 rhTSH(두 방법 효과 같음), 저요오드 식이 1–2주, 잔여갑상선 제거 30 mCi 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.tsh-target-initial-risk
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3047]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:123
  diff_type: threshold
  topic: 초기위험군별 TSH 목표 — 중간위험군 범위
  harrison_says: 'TSH 억제 정도는 재발 위험에 따라 개별화한다. 저위험: 정상 하한쪽(0.5–2.0 mIU/L). 중간위험: 0.1–0.5 mIU/L, 고위험: <0.1 mIU/L(경한 갑상선중독증에 강한 금기가 없을 때). 알려진 전이가 있으면 <0.1 mIU/L.'
  kr_says: 'II.2.2.A 저위험군 초기 TSH 억제(<0.1 mIU/L) 권고하지 않음(권고수준 1). II.2.2.B 저위험군 초기 목표 0.5-2 mIU/L 고려(권고수준 3). II.2.2.C 중간위험군 초기 TSH 억제(<0.1 mIU/L) 권고하지 않음(권고수준 2). II.2.2.D 중간위험군은 동반 위험인자에 따라 0.1-2.0 mIU/L 고려(권고수준 3). II.2.2.E 고위험군은 0.1 mIU/L 미만 유지(권고수준 1). 본문: 2016 KTA·2015 ATA·2019 ESMO 는 중간위험군 0.1-0.5 mIU/L 였다.'
  kmle_rule: KMLE 문항·정리본은 저위험 0.5-2, 중간위험 0.1-2.0(위험인자에 따라, <0.1 억제는 안 함), 고위험 <0.1 mIU/L 의 KTA 2024 기준을 적용한다.
  usmle_rule: USMLE 문항은 저위험 0.5–2.0, 중간위험 0.1–0.5, 고위험 <0.1 mIU/L 기준을 적용한다.
  verified: text
- id: diff.endo.thyroid-cancer.tsh-target-response
  slot: h385
  h22_chapter: 397
  h22_cite: '[[harrison-22: 397장 p.3047]]'
  kr_guideline_id: kr-kta-dtc-2024
  kr_cite: 2024 대한갑상선학회 갑상선분화암 진료권고안 Int J Thyroidol 2024;17:124
  diff_type: same
  topic: 추적 중 치료 반응별 TSH 목표(완전반응 vs 구조적 불완전반응)
  harrison_says: TSH 억제는 추적 혈액검사·영상에서 병이 없음이 확인되거나 잔존·재발이 의심되는지에 따라 조정한다. 임상적 잔존 병소가 없고 경부 초음파 음성·LT4 복용 중 기저 Tg <0.2 ng/mL 인 저위험 환자는 혈청 TSH 를 정상 범위의 아래쪽 절반에 유지한다. 알려진 전이가 있으면 TSH <0.1 mIU/L.
  kr_says: II.2.3.A 완전반응이면 TSH 억제는 필요하지 않으며 목표 0.5-2.0 mIU/L 고려(권고수준 2). II.2.3.B 생화학적 불완전·불명확 반응은 초기 재발위험도·Tg 추이·억제 위험을 고려(권고수준 2) — 초기 중간위험 0.1-0.5 mIU/L 뒤 완화(B3), 초기 고위험은 초기 5년 0.1-0.5 mIU/L 뒤 완화(B4)(p.125). II.2.3.C 구조적 불완전반응은 금기가 없으면 0.1 mIU/L 미만 유지(권고수준 1, p.125).
  kmle_rule: KMLE 문항·정리본은 완전반응 0.5-2.0, 구조적 불완전반응 <0.1 mIU/L, 생화학적 불완전·불명확반응은 초기위험군에 따라 조정하는 KTA 기준을 적용한다.
  usmle_rule: USMLE 문항은 병 없음이 확인된 저위험 환자는 정상 범위 아래쪽 절반, 알려진 전이는 TSH <0.1 mIU/L 기준을 적용한다.
  verified: text
- id: diff.endo.diabetes.screening-age-interval
  slot: h403
  h22_chapter: 415
  h22_cite: '[[harrison-22: 415장 p.3198]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:586
  diff_type: screening
  topic: 제2형 당뇨병 선별검사 대상 나이·간격
  harrison_says: 'ADA 는 35세 넘는 모든 사람을 3년마다 선별하고, 과체중이면서 당뇨병 위험인자가 하나 더 있으면 더 이른 나이에 선별한다(표 415-2: BMI ≥25 kg/m2, 아시아계 미국인 ≥23 kg/m2 + 위험인자 하나면 나이와 무관하게 검사 고려; 그 밖의 사람은 35세에 시작해 3년마다 반복; IFG·IGT·HbA1c 5.7–6.4% 는 매년).'
  kr_says: 위험인자가 하나 이상 있는 19세 이상 성인은 모두 선별검사(공복혈당·HbA1c·75 g OGTT 2시간 혈당)를 하고, 35세 이상 성인은 모두 선별검사를 한다. 선별검사 결과가 정상인 성인은 매년 검사한다.
  kmle_rule: KMLE 문항·정리본은 35세 이상 전원, 위험인자가 있으면 19세 이상 선별, 정상이면 매년 재검이라는 대한당뇨병학회 기준을 적용한다.
  usmle_rule: USMLE 문항은 35세 이상(또는 과체중 + 위험인자 1개면 나이 무관) 선별, 정상이면 3년마다 반복하는 ADA 기준을 적용한다.
  verified: text
- id: diff.endo.diabetes.diagnostic-criteria
  slot: h403
  h22_chapter: 415
  h22_cite: '[[harrison-22: 415장 p.3197]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:584
  diff_type: same
  topic: 당뇨병 진단 기준
  harrison_says: HbA1c ≥6.5%, 공복혈당 ≥126 mg/dL, 경구 당부하 2시간 혈당 ≥200 mg/dL 이면 당뇨병 진단 기준에 맞고, 전형적 증상(다뇨·다음·체중 감소)과 함께 무작위 혈당 ≥200 mg/dL 이어도 진단할 수 있다. 급성 대사 이상이나 뚜렷한 고혈당이 없으면 확진 전에 이상 검사를 반복한다.
  kr_says: ① HbA1c ≥6.5% ② 8시간 공복혈당 ≥126 mg/dL ③ 75 g OGTT 2시간 혈당 ≥200 mg/dL ④ 전형적 증상(다뇨·다음·설명되지 않는 체중 감소)과 무작위 혈당 ≥200 mg/dL. ①–③ 중 하나만 맞으면 다른 날 재검하되, 같은 때 시행한 검사에서 두 가지 이상 맞으면 곧바로 진단한다.
  kmle_rule: KMLE 문항·정리본은 HbA1c ≥6.5%, 공복 ≥126, OGTT 2시간 ≥200, 증상 + 무작위 ≥200 mg/dL 기준(한 번에 두 검사가 맞으면 즉시 진단)을 적용한다.
  usmle_rule: USMLE 문항은 같은 수치(HbA1c ≥6.5%, FPG ≥126, 2h OGTT ≥200, 증상 + random ≥200 mg/dL)를 적용한다 — 두 기준 사이 진단 수치는 같다.
  verified: text
- id: diff.endo.diabetes.prediabetes-ranges
  slot: h403
  h22_chapter: 415
  h22_cite: '[[harrison-22: 415장 p.3197]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:584
  diff_type: same
  topic: 당뇨병 전단계(공복혈당장애·내당능장애·HbA1c) 범위
  harrison_says: 당뇨병 전단계는 HbA1c 5.7–6.4%, 공복혈당장애(IFG) 공복혈당 100–125 mg/dL, 내당능장애(IGT) 당부하 뒤 140–199 mg/dL 이다(ADA 입장). WHO 는 IFG 를 공복혈당 >110 mg/dL 로 정의한다.
  kr_says: '공복혈당장애: 공복혈당 100–125 mg/dL, 내당능장애: 75 g OGTT 2시간 혈당 140–199 mg/dL, HbA1c 5.7%–6.4%. 정상 공복혈당은 <100 mg/dL, 정상 OGTT 2시간 혈당은 <140 mg/dL.'
  kmle_rule: KMLE 문항·정리본은 IFG 하한 100 mg/dL(100–125), IGT 140–199 mg/dL, HbA1c 5.7–6.4% 기준을 적용한다.
  usmle_rule: USMLE 문항은 같은 ADA 범위(IFG 100–125, IGT 140–199, HbA1c 5.7–6.4%)를 적용한다 — WHO 110 mg/dL 하한은 쓰지 않는다.
