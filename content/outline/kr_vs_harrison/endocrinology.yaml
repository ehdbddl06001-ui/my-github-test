  kmle_rule: KMLE 문항·정리본은 유병기간(10년)·위험인자·표적장기 손상으로 나눈 대한당뇨병학회 LDL-C 목표(<55/<70/<100 mg/dL)를 적용한다.
  usmle_rule: USMLE 문항은 나이(40–75세)·ASCVD·위험인자로 스타틴 강도를 정하는 ADA 기준(ASCVD <55, 위험인자 <70 mg/dL)을 적용한다.
