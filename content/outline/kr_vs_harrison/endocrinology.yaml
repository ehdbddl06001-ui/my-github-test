- id: diff.endo.dyslipidemia.moderate-htg
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3250]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.36, p.44
  diff_type: threshold
  topic: 중등도 고중성지방혈증 범위와 치료 목표
  harrison_says: 중등도 고중성지방혈증(TG 150–500 mg/dL)은 ASCVD 위험 증가와 연관되며 관리는 ASCVD 위험을 줄이고 LDL-C·non-HDL-C·apoB 를 낮추는 데 둔다. icosapent ethyl(EPA 단독)은 고중성지방혈증 환자의 심혈관 사건을 줄였다(p.3250).
  kr_says: TG ≥200 mg/dL 이면 먼저 체중 증가·음주·탄수화물 섭취 등 생활습관 요인 확인·교정(I, B). 생활습관 개선 후에도 TG 200–499 mg/dL 이면서 LDL-C 도 높으면 LDL-C 를 목표치까지 낮추려 스타틴(I)(p.36). 이때 non-HDL-C 목표는 LDL-C 목표치에 30 을 더한 값(p.44). ASCVD 나 당뇨병 환자에서 스타틴 후에도 TG ≥200 mg/dL 이 지속되면 IPE(하루 4 g) 추가 고려(IIb, B)(p.36).
  kmle_rule: KMLE 문항·정리본은 TG 200–499 mg/dL 에서 스타틴으로 LDL-C 목표를 먼저 맞추고 non-HDL-C 목표 = LDL-C 목표 + 30 을 쓰는 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 TG 150–500 mg/dL 을 중등도 고중성지방혈증으로 보고 LDL-C·non-HDL-C·apoB 를 낮춰 ASCVD 위험을 줄이는 Harrison 기준을 적용한다.
