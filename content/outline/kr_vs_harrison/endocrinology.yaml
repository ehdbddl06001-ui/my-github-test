- id: diff.endo.dyslipidemia.screening
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3239]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.31, p.161
  diff_type: screening
  topic: 지질 선별검사 연령·간격
  harrison_says: 모든 성인(과 많은 소아)은 혈장 지질을 적극적으로 선별검사해야 하며 가능하면 밤새 금식 뒤 지질 패널을 잰다(p.3239). 성인 시작 나이·간격은 적지 않는다. FH 진단이 흔히 정기 선별검사로 이루어지는 것이 9–11세 소아 선별검사 권고의 근거다(p.3243).
  kr_says: '20세 이상 모든 성인과, 조기 심혈관질환·심한 이상지질혈증 가족력 등 위험요인이 있으면 더 젊은 나이에도 적어도 4–6년마다 공복 지질검사(총콜레스테롤·TG·HDL-C·LDL-C·non-HDL-C)(p.31). 소아청소년: 9–11세와 17–21세에 비공복 non-HDL-C 로 모든 소아청소년 선별검사 고려(IIa, B), 위험인자가 있으면 2–8세·12–16세에도 고려(IIa, B)(p.161).'
  kmle_rule: KMLE 문항·정리본은 20세 이상 성인 4–6년마다, 소아 9–11세·17–21세 선별검사의 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 모든 성인 선별검사와 9–11세 소아 선별검사(Harrison)를 적용하고, 이 장에 없는 성인 시작 나이·간격은 Harrison 근거로 단정하지 않는다.
  verified: text
