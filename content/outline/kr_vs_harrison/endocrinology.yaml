- id: diff.endo.dyslipidemia.ldl-190
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3249]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.35, p.43
  diff_type: same
  topic: LDL-C 190 mg/dL 이상 — 이차 원인 확인과 치료
  harrison_says: LDL-C >190 mg/dL 이면 중증 고콜레스테롤혈증으로 조기 ASCVD 위험이 있고, 이차 원인이 없으면 가족성 고콜레스테롤혈증(FH)을 고려한다(p.3249). FH 는 이차 원인 없이 LDL-C >190 mg/dL 인 고콜레스테롤혈증에 근거한 임상 진단이며 갑상선기능저하증·신증후군·폐쇄성 간질환을 배제한다(p.3243).
  kr_says: LDL-C ≥190 mg/dL 이면 담도폐쇄·신증후군·갑상선기능저하증·임신·glucocorticoid·cyclosporin 투약력 등 다른 원인을 확인·교정(I, B). 이차 원인이 없으면 위험 정도와 상관없이 스타틴 투약(I, A).
  kmle_rule: KMLE 문항·정리본은 LDL-C ≥190 mg/dL 에서 이차 원인 확인 후 위험도와 무관하게 스타틴을 시작하는 KSoLA 2022 기준을 적용한다(경계값 190 은 '이상').
  usmle_rule: USMLE 문항은 LDL-C >190 mg/dL 을 중증 고콜레스테롤혈증으로 보고 이차 원인 배제 후 FH 를 의심해 치료하는 Harrison 기준을 적용한다.
