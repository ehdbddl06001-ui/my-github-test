  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.35, p.38–39
  diff_type: threshold
  topic: 죽상경화성 심혈관질환(ASCVD) 환자의 LDL-C 목표
  harrison_says: ASCVD 가 확립된 환자는 LDL-C 가 70 mg/dL 초과인 한 LDL-C 를 낮추는 약물치료가 근거로 뒷받침되며 필요하면 병용요법을 쓴다(p.3250). ASCVD 환자나 고위험으로 판단된 환자에게 고강도 스타틴을 권한다(p.3251). 관상동맥질환과 다른 ASCVD 를 목표치로 나누지 않는다.
  kr_says: '관상동맥질환 = 초고위험군: 이차 예방으로 LDL-C 55 mg/dL 미만 그리고 기저치보다 50% 이상 감소(I, A). 죽상경화성 허혈뇌졸중·일과성 뇌허혈발작·말초동맥질환·경동맥질환·복부대동맥류 = 고위험군: LDL-C 70 mg/dL 미만 그리고 기저치보다 50% 이상 감소(I, A). 급성심근경색증은 기저 LDL-C 와 상관없이 바로 스타틴(I, A).'
  kmle_rule: KMLE 문항·정리본은 관상동맥질환 LDL-C <55 mg/dL·50% 이상 감소, 뇌혈관·말초동맥·경동맥질환·복부대동맥류 <70 mg/dL·50% 이상 감소의 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 ASCVD 환자에게 고강도 스타틴, LDL-C 가 70 mg/dL 초과로 남으면 병용요법을 더하는 Harrison(미국식) 기준을 적용한다.
