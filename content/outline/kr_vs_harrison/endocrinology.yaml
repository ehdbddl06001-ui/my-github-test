- id: diff.endo.diabetes.hba1c-target
  slot: h404
  h22_chapter: 416
  h22_cite: '[[harrison-22: 416장 p.3208]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:594
  diff_type: threshold
  topic: 성인 당뇨병 일반 혈당 조절 목표(HbA1c)
  harrison_says: ADA 는 심한 저혈당 없이 정상에 가깝게를 목표로 하며, 대부분의 사람에서 목표 HbA1c 는 <7%, 일부 환자에서는 더 엄격한 ≤6.5% 이다. 인지 장애·저혈당 인지 저하·제한된 기대여명이면 <7.5% 또는 8% 가 적절하다.
  kr_says: 성인 제2형 당뇨병의 일반 혈당 조절 목표는 HbA1c <6.5%, 성인 제1형 당뇨병은 HbA1c <7.0% 이다. 신체·정신·사회 상태, 기대여명, 동반질환 중증도, 저혈당 위험에 따라 개별화한다.
  kmle_rule: KMLE 문항·정리본은 성인 제2형 당뇨병 일반 목표 HbA1c <6.5%(제1형은 <7.0%)를 적용한다.
  usmle_rule: USMLE 문항은 대부분의 성인에서 HbA1c <7% 를 일반 목표로 적용한다.
