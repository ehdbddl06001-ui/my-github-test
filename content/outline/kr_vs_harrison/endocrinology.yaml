  h22_cite: '[[harrison-22: 419장 p.3250]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.35, p.37, p.42–43
  diff_type: algorithm
  topic: 일차 예방 위험 분류와 스타틴 시작 기준(당뇨병 포함)
  harrison_says: 임상적 CVD 가 없는 40세 초과 환자는 ASCVD pooled cohort 위험 계산기로 10년 절대위험을 구하고, 10년 위험 >7.5% 이면 LDL-C 수치와 상관없이 스타틴을 고려한다. 경계 위험이면 apoB·Lp(a)·hs-CRP, 남자 >40세·여자 >50세에서는 관상동맥 칼슘 점수로 추가 층화한다(p.3250).
  kr_says: '계산기가 아니라 위험군과 주요 위험인자 수(남자 ≥45세·여자 ≥55세, 조기 관상동맥질환 가족력, 고혈압, 흡연, HDL-C <40 mg/dL; HDL-C ≥60 mg/dL 이면 하나를 뺀다)로 나눈다. 당뇨병: 유병기간 10년 이상이거나 주요 위험인자·표적장기손상 동반 시 LDL-C <70 mg/dL(I, B), 표적장기손상이나 위험인자 3개 이상이면 <55 mg/dL 선택적 고려(IIa, B), 유병기간 10년 미만·위험인자 없음은 <100 mg/dL(I, A). 중등도 위험군(위험인자 2개 이상)은 생활습관 교정 뒤에도 LDL-C ≥130 mg/dL 이면 스타틴, 저위험군(1개 이하)은 ≥160 mg/dL 이면 스타틴. 2018 ACC/AHA 의 10년 위험 7.5% 기준은 아시아인에게 적용하기 어려운 한계가 있다고 적는다(p.36–37).'
  kmle_rule: KMLE 문항·정리본은 위험인자 수와 당뇨병 하위군으로 위험군을 정하고 LDL-C 목표(<55·<70·<100·<130·<160 mg/dL)를 고르는 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 pooled cohort 계산기 10년 ASCVD 위험 >7.5% 를 스타틴 고려 기준으로 삼고 경계 위험은 CAC·apoB·Lp(a)·hs-CRP 로 층화하는 Harrison 기준을 적용한다.
