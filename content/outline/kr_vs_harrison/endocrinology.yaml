  diff_type: same
  topic: 생활습관 교정이 기본, 약물은 보조
  harrison_says: 비만 치료는 항상 생활습관 관리로 시작하며 BMI 위험 범주에 따라 약물치료나 비만수술을 더한다. 첫 감량 목표는 6개월에 8–10%. 약물을 쓸 때도 환자가 생활습관 프로그램에 참여해야 한다(p.3191).
  kr_says: 식이·신체활동·행동치료를 포함한 생활습관 교정이 비만 관리의 근간이며 약물치료는 이에 더하는 보조 요법이다(Class I, Level A).
  kmle_rule: KMLE 문항·정리본은 생활습관 교정을 먼저 하고 약물은 보조로 더한다는 원칙을 적용한다(양쪽 같음).
  usmle_rule: USMLE 문항은 생활습관 관리로 시작하고 약물·수술을 BMI 범주에 따라 더한다는 원칙을 적용한다.
