  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:661
  diff_type: threshold
  topic: 당뇨병 환자의 LDL 콜레스테롤 목표
  harrison_says: 'ADA 권고: ① ASCVD 가 있으면 고강도 스타틴(atorvastatin 40–80 mg 또는 rosuvastatin 20–40 mg)으로 LDL 50% 넘게 감소 + <55 mg/dL ② 40–75세 ASCVD 없음은 중등도 강도 스타틴 ③ 40–75세 ASCVD 위험인자가 있으면 고강도 스타틴으로 LDL 50% 감소 + <70 mg/dL ④ 그 상태로 최대 스타틴에도 LDL ≥70 mg/dL 이면 ezetimibe 나 PCSK9 억제제 추가 고려.'
