- id: diff.endo.dyslipidemia.ezetimibe-add
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3251]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.83, p.87
  diff_type: same
  topic: 스타틴 일차 약제 · ezetimibe 추가
  harrison_says: LDL-C 를 낮추는 약물치료에서 스타틴이 일차 약제다(p.3250). ezetimibe 는 스타틴에 더해 LDL-C 를 더 낮추는 2차 선택지로 여겨지며, 스타틴에 더하면 스타틴 단독보다 주요 심혈관 사건이 유의하게 줄었다. 단독요법은 스타틴 불내성과 일부 sitosterolemia 에만 쓴다(p.3251).
  kr_says: 스타틴은 고콜레스테롤혈증 치료의 일차 선택 약제(I, A). 내약 가능한 최대 용량의 스타틴으로도 목표 LDL-C 에 도달하지 못하면 병용요법으로 ezetimibe 사용을 권고(I, B)(p.83). 스타틴을 투여할 수 없거나 내약성이 나쁘면 담즙산 결합수지·ezetimibe·PCSK9 억제제를 고려하고 병용할 수 있다(IIa, B)(p.87).
  kmle_rule: KMLE 문항·정리본은 스타틴 최대 내약 용량으로 목표 미달 시 ezetimibe 를 더하는 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 스타틴 다음 2차 추가 약제로 ezetimibe 를 고르는 Harrison 기준을 적용한다.
  verified: text
- id: diff.endo.dyslipidemia.pcsk9-add
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3251]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.83, p.88
  diff_type: algorithm
  topic: PCSK9 억제제 추가 기준
  harrison_says: PCSK9 항체는 FH 또는 ASCVD 환자에서 스타틴(± ezetimibe)만으로 LDL-C 가 받아들일 만한 수준으로 내려가지 않을 때 2차(스타틴에 추가) 또는 3차(스타틴+ezetimibe 에 추가) 약제로 쓴다. LDL-C 를 약 60% 낮추고 2주마다 피하주사한다(p.3251).
  kr_says: 죽상경화성 심혈관질환 환자에서 최대 가용 용량의 스타틴과 ezetimibe 를 병용하여도 LDL-C 가 목표에 도달하지 않으면 PCSK9 억제제 병용을 고려(IIa, A)(p.83). 본문은 '스타틴 단독 또는 에제티미브를 병용하여도' 목표 미달이면 병용할 수 있다고 적는다(IIa, A)(p.88). 비싼 약가로 사용에 제약이 있고 일차 예방에서는 효과가 아직 검증되지 않았다(p.88).
  kmle_rule: KMLE 문항·정리본은 ASCVD 환자에서 최대 용량 스타틴+ezetimibe 후에도 목표 미달일 때 PCSK9 억제제를 더하는 KSoLA 2022 순서를 적용한다.
  usmle_rule: USMLE 문항은 FH 또는 ASCVD 에서 스타틴(± ezetimibe)으로 부족하면 PCSK9 억제제를 2차·3차로 더하는 Harrison 기준을 적용한다.
  verified: text
- id: diff.endo.dyslipidemia.statin-intensity
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3251]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.87
  diff_type: first_line
  topic: 스타틴 시작 용량(강도)
  harrison_says: ASCVD 가 있거나 ASCVD 고위험으로 판단된 환자에게 고강도 스타틴을 쓰는 것이 현재 권고다(p.3251).
  kr_says: 한국인을 포함한 아시아인은 같은 용량에서 LDL-C 강하 효과가 더 커서 외국, 특히 미국 치료지침의 용량보다 적은 용량으로 시작할 수 있고, 목표에 도달하지 못하면 증량한다(I, A). 용량은 위험도별 LDL-C 목표에 도달하도록 조절한다.
  kmle_rule: KMLE 문항·정리본은 위험도별 LDL-C 목표에 맞춰 스타틴 용량을 조절하고 더 적은 용량으로 시작할 수 있다는 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 ASCVD·고위험 환자에게 고강도 스타틴을 고르는 Harrison 기준을 적용한다.
