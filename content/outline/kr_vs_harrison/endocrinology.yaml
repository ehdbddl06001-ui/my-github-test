- id: diff.endo.diabetes.initial-combination-metformin
  slot: h404
  h22_chapter: 416
  h22_cite: '[[harrison-22: 416장 p.3214–3215]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:643-645
  diff_type: algorithm
  topic: 제2형 당뇨병 첫 약제와 초기 병용요법 기준
  harrison_says: 첫 약제 선택은 고혈당 정도와 개별 목표로 정한다. 경도 고혈당(공복 126–199 mg/dL)은 경구약 하나에 잘 반응하고, 중등도(공복 200–250 mg/dL)는 대개 경구약 둘 이상이나 인슐린이 필요하다. ADA/EASD·IDF·AACE 알고리즘은 효과·알려진 부작용·낮은 비용 때문에 metformin 을 첫 치료로 제시한다. 두 약으로 조절되지 않으면(HbA1c 3개월마다 재평가) 기저 인슐린을 포함한 세 번째 약을 고려한다(p.3215).
  kr_says: 단일 경구 혈당강하제는 대개 HbA1c 를 약 1.0% 낮추므로, 기저 HbA1c 가 목표보다 1.5% 이상 높으면 병용요법을 권한다(p.643). 진단 때 HbA1c 7.5% 이상이거나 최대 용량 단독요법 3개월 안에 목표에 이르지 못하면 즉시 병용요법을 시작한다(p.645). 금기나 이상반응이 없으면 2제 병용은 metformin 부터 시작한다(p.645).
  kmle_rule: KMLE 문항·정리본은 진단 때 HbA1c ≥7.5%(또는 목표보다 ≥1.5% 높음)면 처음부터 병용요법, 병용의 바탕은 metformin 이라는 대한당뇨병학회 기준을 적용한다.
  usmle_rule: USMLE 문항은 metformin 을 첫 치료로 하고 고혈당 정도(공복혈당 구간)에 따라 약을 더하는 Harrison/ADA 흐름을 적용한다.
  verified: text
- id: diff.endo.diabetes.severe-hyperglycemia-insulin
  slot: h404
  h22_chapter: 416
  h22_cite: '[[harrison-22: 416장 p.3214]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:641
  diff_type: algorithm
  topic: 심한 고혈당에서 첫 치료로 인슐린
  harrison_says: 공복혈당 >250 mg/dL 인 심한 고혈당은 경구약으로 정상 혈당에 이르기 어렵다. 심한 고혈당(공복 250–300 mg/dL)이거나 고혈당 증상이 있으면 인슐린을 첫 치료로 쓸 수 있고, 조절되면 끊을 수 있다.
  kr_says: 체중 감소·다음·다뇨 같은 과이화(hypercatabolic) 증상을 동반한 심한 고혈당에서는 인슐린 치료를 시작한다(전문가 의견). 수치 기준은 권고문에 두지 않는다.
  kmle_rule: KMLE 문항·정리본은 과이화 증상(체중 감소·다음·다뇨)을 동반한 심한 고혈당이면 인슐린으로 시작한다는 기준을 적용한다.
  usmle_rule: USMLE 문항은 공복혈당 250–300 mg/dL 의 심한 고혈당 또는 증상성 고혈당에서 인슐린을 첫 치료로 쓸 수 있다는 기준을 적용한다.
  verified: text
- id: diff.endo.diabetes.comorbidity-drug-choice
  slot: h405
  h22_chapter: 417
  h22_cite: '[[harrison-22: 417장 p.3228]]'
  kr_guideline_id: kr-kda-diabetes-2025
  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:641
  diff_type: same
  topic: 심부전·만성콩팥병·죽상경화성 심혈관질환 동반 시 약제 선택
  harrison_says: 제2형 당뇨병과 ASCVD 가 있으면 심혈관 위험 감소 노력에 SGLT-2 억제제나 GLP-1 수용체 작용제를 포함한다. 당뇨병성 CKD 나 심부전이 있거나 가능성이 높으면 SGLT-2 억제제가 우선이다(p.3228). CKD·eGFR >20 이면 ACE 억제제/ARB 를 유지하며 알부민뇨 정도와 무관하게 SGLT-2 억제제를 더한다(p.3226).
  kr_says: 심부전이 있으면 HbA1c 와 무관하게 심장 이득이 입증된 SGLT2 억제제를 우선 권하고, 알부민뇨나 eGFR 감소가 있으면 HbA1c 와 무관하게 콩팥 이득이 입증된 SGLT2 억제제를 우선 쓰며, ASCVD 가 있으면 심혈관 이득이 입증된 GLP-1 RA 나 SGLT2 억제제를 우선 쓴다. 금기·부작용이 없으면 유지한다.
  kmle_rule: KMLE 문항·정리본은 심부전·CKD(알부민뇨·eGFR 감소)면 SGLT2 억제제, ASCVD 면 GLP-1 RA 또는 SGLT2 억제제를 HbA1c 와 무관하게 우선한다는 기준을 적용한다.
  usmle_rule: USMLE 문항도 같은 기준(HF·CKD → SGLT-2 억제제 우선, ASCVD → SGLT-2 억제제 또는 GLP-1RA)을 적용한다.
  verified: text
- id: diff.endo.diabetes.bp-target
