  kr_cite: 2024 비만 진료지침(대한비만학회 제9판) J Obes Metab Syndr 2025;34:322-343, p.329 권고 2 · p.324
  diff_type: threshold
  topic: 비만 약물치료 시작 BMI 기준
  harrison_says: '식이·신체활동 치료가 실패한 환자 중 BMI 30 kg/m2 이상 또는 비만 관련 질환이 있는 BMI 27 kg/m2 이상에서 보조 약물치료를 고려한다(표 414-4: 27–29.9 는 동반질환 있을 때, 30 이상은 모두).'
  kr_says: 식이·신체활동·행동치료만으로 충분히 감량하지 못한 BMI 25 kg/m2 이상 성인에서 약물치료를 고려할 수 있다(Class IIa, Level B). 제2형 당뇨병·고혈압·이상지질혈증·심혈관질환·MASLD·OSA·다낭난소증후군·골관절염 등 비만 관련 동반질환이 있으면 BMI 23 kg/m2 이상에서 고려한다. 30/27 기준은 미국 FDA 허가에서 온 것이며 아시아인은 더 낮은 BMI에서 위험이 커서 낮췄다고 설명한다.
  kmle_rule: KMLE 문항·정리본은 생활습관 교정 실패 시 BMI 25 이상, 동반질환이 있으면 23 이상에서 약물치료를 고려하는 대한비만학회 제9판 기준을 적용한다.
  usmle_rule: USMLE 문항은 BMI 30 이상 또는 동반질환이 있는 27 이상에서 약물치료를 고려하는 기준을 적용한다.
