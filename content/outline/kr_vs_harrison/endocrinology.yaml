  kr_cite: 2025 당뇨병 진료지침(대한당뇨병학회 제9판) Diabetes Metab J 2025;49:673
  diff_type: same
  topic: 당뇨병콩팥병 선별(소변 알부민·eGFR)
  harrison_says: 선별은 무작위 소변 알부민/크레아티닌비(UACR)와 eGFR 을 함께 본다. 알부민뇨 선별은 제1형은 발병 5년 뒤, 제2형은 진단 때 시작해 매년 한다. 높은 UACR 은 3–6개월 동안 2–3번 확인한다.
  kr_says: 당뇨병 진단 때와 그 뒤 적어도 매년 소변 알부민 배설과 eGFR 을 평가한다.
  kmle_rule: KMLE 문항·정리본은 제2형 당뇨병 진단 때부터 매년 소변 알부민(UACR)과 eGFR 을 평가하는 기준을 적용한다.
  usmle_rule: USMLE 문항은 제2형은 진단 때부터 매년, 제1형은 발병 5년 뒤부터 매년 UACR·eGFR 을 보고, 높은 UACR 은 3–6개월에 2–3번 확인하는 기준을 적용한다.
