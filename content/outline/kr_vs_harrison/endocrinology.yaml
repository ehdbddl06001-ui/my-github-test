- id: diff.endo.dyslipidemia.severe-htg-500
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3250]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.36, p.44, p.83
  diff_type: same
  topic: 중증 고중성지방혈증(TG 500 mg/dL) — 췌장염 예방 약물
  harrison_says: TG >500 mg/dL 이면 췌장염 위험을 줄이려 개입하는 것이 일반적으로 적절한 진료로 여겨진다. 적극적 생활습관 관리에도 공복 TG >500 mg/dL 이 지속되면 약물치료 대상이며 주된 두 약군은 fibrate 와 omega-3 지방산(어유)이다. fibrate 는 흔히 일차 치료로 쓰이고 어유도 일차 치료나 fibrate 와 병용이 가능하다. ASCVD 위험이 높으면 스타틴도 쓴다(p.3250).
  kr_says: 'TG ≥500 mg/dL 이면 이차 원인과 유전적 문제를 확인(I, A). 지속적으로 500 mg/dL 이상이면 췌장염 예방을 위해 피브린산 유도체나 오메가-3 지방산 등의 약물치료 시작을 고려(IIa, A)(p.36). 약물요법 권고안: TG 500 mg/dL 이상이면 급성췌장염 예방을 위한 즉각적인 약물치료와 생활습관 개선 시작(I, A), 지속 500 mg/dL 이상이면 피브린산 유도체(IIa, A)·오메가-3 지방산(IIa, A) 고려(p.83).'
  kmle_rule: KMLE 문항·정리본은 TG ≥500 mg/dL 에서 췌장염 예방을 위해 fibrate 또는 오메가-3 지방산을 쓰는 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 생활습관 교정 뒤에도 공복 TG >500 mg/dL 이면 fibrate 또는 fish oil 로 췌장염을 예방하는 Harrison 기준을 적용한다.
