  diff_type: same
  topic: 당뇨병 환자의 혈압 목표
  harrison_says: 당뇨병 환자의 혈압 목표는 <130/80 mmHg 이고, ASCVD 나 CKD 진행 위험이 높으면 더 낮을 수도 있다. 진료 때마다 혈압을 재고 가정 혈압 측정을 권한다.
  kr_says: 당뇨병 환자의 목표 혈압은 <130/80 mmHg 이다. 혈압 ≥120/80 mmHg 이면 생활습관 교정을 한다. 가정 혈압이나 활동 혈압을 측정한다.
  kmle_rule: KMLE 문항·정리본은 당뇨병 환자 혈압 목표 <130/80 mmHg 를 적용한다.
  usmle_rule: USMLE 문항도 <130/80 mmHg 를 적용한다.
