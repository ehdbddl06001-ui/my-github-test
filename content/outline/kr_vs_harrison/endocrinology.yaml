- id: diff.endo.dyslipidemia.diagnostic-thresholds
  slot: h407
  h22_chapter: 419
  h22_cite: '[[harrison-22: 419장 p.3249]]'
  kr_guideline_id: kr-ksola-dyslipidemia-2022
  kr_cite: 이상지질혈증 진료지침 제5판(2022, 한국지질·동맥경화학회) p.32–33
  diff_type: threshold
  topic: 이상지질혈증 분류 수치
  harrison_says: '따로 분류표를 두지 않고 진단 절에서 수치를 쓴다: TG >150 mg/dL 이면 공복혈당·HbA1c 로 당뇨병 배제, LDL-C >160 mg/dL 이면 TSH 로 갑상선기능저하증 배제, 공복 TG >500 mg/dL = 중증 고중성지방혈증, LDL-C >190 mg/dL = 중증 고콜레스테롤혈증, 혼합 고지혈증은 TG >150·LDL-C >130 mg/dL 에 흔히 HDL-C 저하(남자 <40, 여자 <50 mg/dL)(p.3249).'
  kr_says: '표 2-1 한국인의 이상지질혈증 분류 기준: LDL-C 매우 높음 ≥190, 높음 160–189, 경계 130–159, 정상 100–129, 적정 <100; 총콜레스테롤 높음 ≥240, 경계 200–239, 적정 <200; TG 매우 높음 ≥500, 높음 200–499, 경계 150–199, 적정 <150; HDL-C 낮음 <40, 높음 ≥60 mg/dL(p.33). 이 분류는 개인 위험도를 감안하지 않은 것이라 치료의 근거나 목표로 쓰지 않는다(p.32).'
  kmle_rule: KMLE 문항·정리본은 표 2-1 분류(LDL-C ≥160 높음, TG ≥200 높음, HDL-C <40 낮음 — 남녀 같은 기준)를 적용하되 치료 결정은 위험군별 목표로 한다는 KSoLA 2022 기준을 적용한다.
  usmle_rule: USMLE 문항은 HDL-C 저하를 남자 <40·여자 <50 mg/dL 로, 중증을 TG >500·LDL-C >190 mg/dL 로 보는 Harrison 기준을 적용한다.
