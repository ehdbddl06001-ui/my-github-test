  harrison_says: 'p.2227: Those with PEFR >60% of predicted will frequently respond to β2-agonists alone. If they fail to respond in 1–2 h, intravenous corticosteroids should be administered. ... Failure to achieve PEFR >60% or persistent severe tachypnea over 4–6 h should prompt consideration of admission to the hospital. p.2224: OCSs are also used to treat asthma exacerbations, frequently starting at a dose of 40–60 mg/d of prednisone or equivalent with a rapid taper over 1–2 weeks.'
  kr_says: 응급실 내원 당시 폐기능이 자신의 최고치(혹은 예측치)의 25% 미만이거나 치료 후에도 40% 미만인 환자들은 입원이 권고된다. 치료 후 40-60%이면 위험인자와 이후 치료 가능 여부를 고려하여 귀가를 시킬 수 있고, 60% 이상이면 귀가가 권고된다(p.130–131). 성인 효과적 용량은 prednisolone 1 mg/kg/일, 최대 50 mg/일, 경구스테로이드는 5-7일 투여(p.133). 입원 환자는 prednisolone 50 mg 1회 혹은 hydrocortisone 200 mg/일 분할; 5-7일 사용이 10-14일과 비슷하며, ICS를 지속하면 서서히 감량할 필요는 없다(p.136).
