  harrison_says: In patients symptomatic on moderate- to high-dose ICS/LABA, generally with two or more exacerbations that require OCS per year and with an eosinophil count of ≥300/μL (unless they are on chronic OCS), IL-5–active drugs reduce exacerbations by about half or more. ... In patients on chronic OCS, they reduce the need for OCSs regardless of circulating eosinophil count.
