  kr_says: '1단계: 필요시 저용량 흡입스테로이드-formoterol 사용을 권고한다(1안). 또는 필요시 SABA를 사용하며 사용시마다 저용량 흡입스테로이드도 사용하는 것을 권고한다(2안). 흡입속효성베타작용제 단독치료는 권고되지 않는다(p.99). 권장되지 않는 치료: 성인에서 흡입속효성베타작용제 단독 치료는 권고되지 않음(p.100). ICS-SABA 증상완화제는 국내에는 아직 도입되지 않았다(p.97). 별도 권고 등급 표기 없음.'
  kmle_rule: KMLE 문항·정리본은 1단계에서도 SABA 단독을 오답으로 두고, 필요시 저용량 ICS-formoterol(1안) 또는 SABA 사용 때마다 저용량 ICS 동시 사용(2안)을 정답으로 적용한다(ICS-SABA 복합제는 국내 미도입).
  usmle_rule: USMLE 문항은 GINA식 필요시 저용량 ICS-formoterol을 선호 답으로 하되, 해리슨 표가 NAEPP 선택지로 남긴 1단계 PRN SABA도 허용되는 선택지로 다룬다.
