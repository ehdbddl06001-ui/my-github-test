  harrison_says: Reversibility has been newly defined as ≥10% increase in the FEV1 percent of predicted (e.g., 60% predicted to 70% predicted) at least 15 min after administration of a β2-agonist or after several weeks of corticosteroid therapy. Many continue to use the prior definition of a 12% increase in the baseline FEV1 with a minimum 200-mL change.
  kr_says: '표 3-4 천식의 진단 기준: Salbutamol 200-400 mcg 흡입 10-15분 후 FEV1의 증가 ≥12%이면서 ≥200 ml(≥15%이면서 ≥400 ml 증가한 경우 더 신뢰). 검사 전 SABA 최소 4시간, 하루 2번 LABA 24시간, 하루 1번 LABA 36시간 이상 중단. 반응이 12% 미만이어도 천식을 완전히 배제할 수 없다(p.51). 별도 권고 등급 표기 없음.'
  kmle_rule: KMLE 문항·정리본은 기관지확장제 반응 양성을 FEV1 ≥12% 그리고 ≥200 mL 증가로 적용한다(예측치 대비 ≥10% 정의는 쓰지 않는다).
  usmle_rule: USMLE 문항은 FEV1 ≥12% 및 ≥200 mL 증가를 가역성 기준으로 적용하고, 해리슨 22판이 새 정의로 적은 예측치 % ≥10% 증가는 보조 지식으로만 둔다.
