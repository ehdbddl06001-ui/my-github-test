  harrison_says: 'p.2256: ''Dual bronchodilators are recommended as first-line treatments in patients with symptoms and/or increased exacerbation risk.'' ''ICS are recommended as part of the initial treatment regimen for eosinophil counts above 300. ICS are never used alone in COPD''. 그림 303-6A(p.2257): GROUP E ''LABA + LAMA*, consider LABA+LAMA+ICS* if blood eos ≥300''.'
  kr_says: 'p.78: 고위험군 ''흡입지속성베타-2작용제와 흡입지속성항콜린제 복합제의 사용을 일차치료로 권장한다.'' p.79: ''고위험군 환자 중 혈액 호산수 수치가 300 개/μL 이상인 환자는 일차치료로 흡입지속성베타-2작용제/흡입지속성항콜린제/흡입스테로이드 복합제 사용을 일차치료로 권장한다.'' p.56 KQ5: 고위험군·호산구 >300/uL 에서 LAMA+LABA 보다 triple therapy 권고(근거수준 Moderate, 권고수준 Strong).'
  kmle_rule: KMLE 문항·정리본은 고위험군 초기 약물을 LABA+LAMA, 혈중 호산구 ≥300/μL 이면 ICS+LABA+LAMA 삼제로 적용한다.
  usmle_rule: USMLE 문항은 GOLD E 초기 약물을 LABA+LAMA, blood eos ≥300 이면 LABA+LAMA+ICS 로 적용한다.
