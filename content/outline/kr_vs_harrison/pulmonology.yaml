  topic: LDCT 폐암검진 대상(나이·갑년)
  harrison_says: USPSTF(2021) 기준으로 50–80세, 20갑년 이상 흡연력이 있는 현재 흡연자 또는 최근 15년 이내 금연한 과거 흡연자에게 매년 LDCT 검진을 권고한다.
  kr_says: 국가폐암검진 대상은 만 54세 이상 만 74세 이하 남녀 중 폐암발생고위험군 — 30갑년[하루 평균 담배소비량(갑) × 흡연기간(년)] 이상의 흡연력을 가진 현재 흡연자(및 보건복지부장관 고시자). 흡연력은 해당연도 전 2년 내 일반건강검진 문진표 또는 건강보험 금연치료 참여 문진표로 확인한다. (국가암검진 프로그램 — 권고등급 표기 없음)
  kmle_rule: KMLE 문항·정리본은 국가폐암검진 기준(만 54–74세, 30갑년 이상 현재 흡연자, 저선량흉부CT)을 적용한다.
  usmle_rule: USMLE 문항은 USPSTF 2021 기준(50–80세, ≥20 pack-years, 현재 흡연 또는 15년 이내 금연)을 적용한다.
  verified: text
- id: diff.pulm.lung-cancer.screening-interval
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.618]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암검진 질지침(보건복지부·국립암센터, 2021) p.13
  diff_type: screening
  topic: LDCT 폐암검진 주기
  harrison_says: NLST·NELSON 두 시험이 고위험군에서 매년 CT 검진을 뒷받침했고, USPSTF 기준 대상자에게 annual LDCT 검진이 권고된다.
  kr_says: 국가폐암검진 주기는 2년. 폐암검진 권고안(2015, 매년)과는 차이가 있으나 이탈리아 연구에서 1년과 2년 간격이 유의한 차이가 없었고, NELSON 연구에서 음성 결과 후 1년 이상 유의한 소견이 거의 없었던 점, 비용효과성을 고려해 결정했다.
  kmle_rule: KMLE 문항·정리본은 국가폐암검진 주기 2년을 적용한다(2015 학회 권고안의 '매년'과 구분).
  usmle_rule: USMLE 문항은 annual LDCT 를 적용한다.
  verified: text
- id: diff.pulm.lung-cancer.screening-quit-years
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.618]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암검진 질지침(보건복지부·국립암센터, 2021) p.12, p.14
  diff_type: screening
  topic: 과거 흡연자(금연 연수) 포함 여부
  harrison_says: NLST 는 55–74세, ≥30갑년, 과거 흡연자는 15년 이내 금연자를 대상으로 했고, USPSTF 2021 기준도 '최근 15년 이내 금연한 과거 흡연자'를 포함한다.
  kr_says: '폐암검진 권고안(국립암센터, 2015): 30갑년 이상 흡연력이 있는(금연 후 15년이 경과한 과거흡연자는 제외) 55–74세 고위험군에게 저선량흉부CT 검진을 매년 시행할 것을 권고(권고등급 B). 흉부X선·객담 세포진·혈청 종양표지자 검진은 시행하지 말 것(권고등급 D). 반면 국가폐암검진(국가암검진 프로그램 표 1 주석)의 고위험군 정의는 30갑년 이상의 흡연력을 가진 ''현재 흡연자''다.'
  kmle_rule: KMLE 문항·정리본에서 국가검진 대상은 30갑년 이상 '현재 흡연자'로, 학회 권고안(2015)은 금연 15년 미만 과거 흡연자 포함·매년·권고등급 B 로 구분해 쓴다.
  usmle_rule: USMLE 문항은 15년 이내 금연한 former smoker 를 대상에 포함하는 USPSTF 2021 기준을 적용한다.
  verified: text
- id: diff.pulm.lung-cancer.screening-positive-lung-rads
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.618]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암검진 질지침(보건복지부·국립암센터, 2021) p.90, p.95
  diff_type: algorithm
  topic: 검진 CT 양성 판정·결절 추적 기준
  harrison_says: NLST 에서는 LDCT 에서 어느 직경이든 ≥4 mm 비석회화 결절이 있으면 '양성'으로 분류했다(양성자 중 위양성률 LDCT 96.4%). 83장은 Lung-RADS 범주를 다루지 않는다.
  kr_says: '저선량흉부CT 결과는 Lung-RADS version 1.1 로 판정한다. 범주 1, 2, 2b = 검진 음성, 범주 3, 4A, 4B, 4X = 검진 양성. 판정구분: 범주 2 = 1년 후 정기검사, 범주 3 = 6개월 내 추적검사, 범주 4A = 3개월 내 추적검사, 범주 4B·4X = 추가검사, S = 결절 외 의미 있는 소견.'
  kmle_rule: KMLE 문항·정리본은 국가폐암검진 Lung-RADS v1.1 범주별 사후관리(3 → 6개월, 4A → 3개월, 4B·4X → 추가검사)를 적용한다.
  usmle_rule: USMLE 문항은 Lung-RADS 범주에 따른 추적(ACR)으로 답하되, NLST 의 ≥4 mm 양성 정의와 높은 위양성률을 배경 지식으로 둔다.
  verified: text
- id: diff.pulm.lung-cancer.biomarker-testing-scope
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.620]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.98
  diff_type: algorithm
  topic: 비소세포폐암 유전자 검사 범위·국내 EGFR 빈도
  harrison_says: 바이오마커 검사는 진단 시 시행하는 것이 이상적이며, 대부분의 지침이 진행성 NSCLC 전체에 권고하고 편평세포암은 '고려'한다. EGFR 변이는 북미 NSCLC 의 10–15%(p.627), 비흡연 폐암은 여성·동아시아인에 더 흔하다(p.618).
  kr_says: 'EGFR, ALK, ROS1, BRAF 검사는 반드시 시행되어야 하며, NTRK, MET, RET, HER2, KRAS 는 앞의 넷이 음성일 때 또는 큰 패널에 포함해 시행할 것을 권장. 국내 데이터에서 EGFR 돌연변이는 선암종의 40%, 편평상피세포암종의 9%. (진료 알고리즘 p.31: 선암 등은 EGFR·ALK category 1, 편평세포암은 분자검사를 ''고려'')'
  kmle_rule: KMLE 문항·정리본은 비소세포폐암 진단 시 EGFR·ALK·ROS1·BRAF 를 필수 검사로 두고, 국내 선암 EGFR 변이 약 40% 를 적용한다.
  usmle_rule: USMLE 문항은 진행성 NSCLC(특히 비편평) 전체에 broad molecular profiling + PD-L1 을 적용하고, EGFR 빈도는 북미 10–15% 로 본다.
  verified: text
- id: diff.pulm.lung-cancer.egfr-first-line-osimertinib
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.627]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.176
  diff_type: same
  topic: EGFR(엑손 19 결손·L858R) 진행성 NSCLC 1차 치료
  harrison_says: 엑손 19 결손·L858R 이 EGFR 변이의 약 90%. Osimertinib 은 무작위 3상에서 1세대 EGFR TKI(erlotinib·gefitinib)와 항암화학요법보다 PFS·OS 가 우월했다.
  kr_says: 엑손 19 결손(45%)·L858R(40%)은 EGFR-TKI 에 민감. NCCN 지침을 따라 osimertinib 을 preferred first-line EGFR-TKI 로 권고하고, erlotinib(± bevacizumab/ramucirumab)·afatinib·dacomitinib·gefitinib 은 other recommended. 엑손 20 삽입은 1·2세대 TKI 에 내성.
  kmle_rule: KMLE 문항·정리본은 EGFR 엑손 19 결손·L858R 진행성 NSCLC 의 1차 선호 약을 osimertinib 으로 한다.
  usmle_rule: USMLE 문항도 osimertinib 을 1차 선호 EGFR TKI 로 한다.
  verified: text
- id: diff.pulm.lung-cancer.lazertinib-korea
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.627]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.202
  diff_type: first_line
  topic: lazertinib 의 자리(T790M 획득 내성)
  harrison_says: EGFR TKI 3상 표(Table 83-11)에 MARIPOSA(amivantamab/lazertinib vs osimertinib, 1차) 가 실려 있다. T790M 이후 치료로서 lazertinib 은 본문에 없다.
  kr_says: T790M 양성이면 osimertinib 이 권고되며(category 1) erlotinib·gefitinib·dacomitinib·afatinib 은 중단. 2023년 현재 NCCN 에 등재되지 않았지만 우리나라에서는 T790M 양성 획득 내성 환자에서 lazertinib 도 osimertinib 과 동등한 자격으로 권고된다.
  kmle_rule: KMLE 문항·정리본은 1·2세대 EGFR TKI 후 T790M 양성 진행 시 osimertinib 또는 lazertinib 을 동등한 선택으로 적용한다.
  usmle_rule: USMLE 문항은 T790M 양성 진행 시 osimertinib 을 답으로 한다(lazertinib 은 amivantamab 병용 1차 맥락에서만 등장).
  verified: text
- id: diff.pulm.lung-cancer.adjuvant-osimertinib
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.625]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.158, p.164
  diff_type: algorithm
  topic: 절제된 EGFR 변이 NSCLC 보조 osimertinib 대상
  harrison_says: 엑손 19 결손·L858R 양성 NSCLC 에서 항암화학요법 유무와 관계없이 3년간 보조 osimertinib 이 DFS 를 개선했고 OS 이득도 보고됐다. FDA 등은 절제된 IB–IIIA 기 EGFR 변이 NSCLC 에 승인.
  kr_says: Osimertinib 80 mg 매일 — 완전절제된(R0) IB–IIIA 기 EGFR 변이(exon 19 deletion, L858R) 비소세포폐암 환자 중 이전에 보조항암치료를 받았거나 platinum 을 포함하는 항암치료가 어려운 경우에 사용한다(NCCN 추천 인용). 수술 검체 또는 초기 진단 시 생검 검체로 분자검사 가능.
  kmle_rule: KMLE 문항·정리본은 완전절제 IB–IIIA 기 EGFR(엑손 19 결손·L858R) NSCLC 에서 보조항암치료 후(또는 platinum 불가 시) osimertinib 을 적용한다.
  usmle_rule: USMLE 문항은 resected stage IB–IIIA EGFR-mutant NSCLC 에 adjuvant osimertinib(3년, ± chemotherapy)을 적용한다.
  verified: text
- id: diff.pulm.lung-cancer.neoadjuvant-perioperative-io
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.625]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.159, p.164
  diff_type: algorithm
  topic: 절제 가능 NSCLC 수술 전·수술 전후 면역치료
  harrison_says: '수술 전 nivolumab + 항암화학요법 3주기가 IB–IIIA 기 절제 가능 NSCLC 에 승인(CheckMate 816: pCR 24%, EFS HR 0.63). 수술 전 화학면역요법 후 수술 후 면역치료를 잇는 perioperative pembrolizumab + 항암화학요법도 II–IIIB 기에 승인(KEYNOTE-671, OS·EFS 이득).'
  kr_says: 'Nivolumab + platinum-doublet 은 절제 가능한(4 cm 이상이거나 림프절 양성) NSCLC 의 신보조항암치료로 사용할 수 있다. 면역관문억제제를 수술 전에 사용하는 경우 수술 후에는 사용할 수 없다. (CheckMate 816 대상: 4 cm 이상 또는 림프절 양성, EGFR·ALK 이상 없음, pCR 24% vs 2.2%)'
  kmle_rule: KMLE 문항·정리본은 절제 가능 NSCLC(4 cm 이상 또는 림프절 양성)의 수술 전 nivolumab + 백금 2제를 적용하고, 수술 전 면역치료를 받았으면 수술 후 면역치료는 쓰지 않는다.
  usmle_rule: USMLE 문항은 neoadjuvant nivolumab + chemotherapy(stage IB–IIIA) 와 perioperative pembrolizumab(stage II–IIIB, KEYNOTE-671) 을 모두 선택지로 인정한다.
  verified: text
- id: diff.pulm.lung-cancer.stage3-durvalumab
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.626]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.161
  diff_type: same
  topic: 절제 불가 III기 NSCLC 항암방사선 후 공고요법
  harrison_says: 임상적으로 뚜렷한 bulky 종격동 림프절 침범 환자의 표준은 동시 항암방사선치료 후 1년간 durvalumab 공고 면역치료.
  kr_says: 절제 불가능 III기 NSCLC 에서 백금 기반 동시 항암방사선치료 후 진행이 없고 PS 0–1 이면 PACIFIC 결과에 따라 PD-L1 발현과 상관없이 durvalumab 공고요법을 권고. durvalumab 을 받는 환자에게 항암치료 공고요법 2–4주기 추가는 권하지 않는다.
  kmle_rule: KMLE 문항·정리본은 절제 불가 III기 NSCLC 에서 동시 항암방사선치료 후 durvalumab 공고요법을 적용한다.
  usmle_rule: USMLE 문항도 concurrent chemoradiation → durvalumab consolidation(1년)을 적용한다.
  verified: text
- id: diff.pulm.lung-cancer.es-sclc-chemo-io
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.630]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.227
  diff_type: first_line
  topic: 확장병기 소세포폐암 1차 치료와 국내 급여
  harrison_says: 백금(cisplatin 또는 carboplatin) + etoposide 에 PD-L1 억제제 atezolizumab(IMpower133) 또는 durvalumab(CASPIAN)을 더하면 항암화학요법 단독보다 PFS·OS 가 우월해 병용이 선호된다.
  kr_says: 현재 가장 추천되는 일차 치료는 atezolizumab + etoposide + carboplatin 또는 durvalumab + etoposide + carboplatin/cisplatin. 2022년 현재 우리나라에서는 atezolizumab + EC 4주기 후 atezolizumab 을 최대 2년간 유지하는 치료가 요양급여 적용을 받고 있다.
  kmle_rule: KMLE 문항·정리본은 확장병기 SCLC 1차로 백금 + etoposide + atezolizumab(또는 durvalumab)을 적용하고, 국내 급여는 atezolizumab + EC 4주기 → atezolizumab 유지(최대 2년)로 쓴다.
  usmle_rule: USMLE 문항은 platinum + etoposide + atezolizumab 또는 durvalumab 을 적용한다(급여 조건은 다루지 않는다).
  verified: text
- id: diff.pulm.lung-cancer.sclc-sensitive-relapse-cutoff
  slot: h78
  h22_chapter: 83
  h22_cite: '[[harrison-22: 83장 p.630]]'
  kr_guideline_id: kr-kalc-lung-cancer
  kr_cite: 폐암 진료지침 3판(대한폐암학회, 2023) p.228
  diff_type: threshold
  topic: 재발 SCLC 감수성/저항성 구분 기준
  harrison_says: 첫 치료 후 3개월 이내 재발 = chemotherapy-resistant disease, 3개월 넘어 재발 = sensitive disease.
  kr_says: 마지막 항암치료 후 6개월 이내 진행 = 불응성(refractory)·저항성(resistant), 반응률 10% 이하. 6개월 이상 경과 후 진행 = 감수성(sensitive), 반응률 약 25%, 기존 EP·EC 재투여가 선호. ESMO 는 3개월을 기준으로 제시하기도 한다. 6개월 이내 진행 시 NCCN(2022)은 topotecan·lurbinectedin·임상시험을 우선 추천; lurbinectedin 은 2022년 9월 국내 허가.
  kmle_rule: KMLE 문항·정리본은 6개월 기준(6개월 이상 경과 후 재발 = 감수성 → 백금 + etoposide 재투여)을 적용한다.
  usmle_rule: USMLE 문항은 Harrison 의 3개월 기준(>3개월 = sensitive)을 적용한다.
