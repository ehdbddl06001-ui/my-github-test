  slot: h292
  h22_chapter: 303
  h22_cite: '[[harrison-22: 303장 p.2256]]'
  kr_guideline_id: kr-katrd-copd-2024
  kr_cite: COPD 진료지침 2024 개정(대한결핵및호흡기학회) p.56, p.78-79
