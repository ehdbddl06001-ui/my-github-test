  harrison_says: '그림 303-5 GOLD ABE Assessment Tool: 악화 ''≥2 moderate exacerbations or ≥1 leading to hospitalization'' = E; ''0 or 1 moderate exacerbations (not leading to hospitalization)'' 이면 증상으로 A(mMRC 0–1, CAT <10) / B(mMRC ≥2, CAT ≥10).'
  kr_says: '그림 2-3 COPD 종합평가: ''저위험군: 위험 낮음. 지난 해 악화가 없었거나 한 번인 경우이다. 고위험군: 위험 높음. 지난 해에 2회 이상 급성악화가 있었거나 입원할 정도로 심한 악화가 1회 이상 있었던 경우이다.'' — 증상(mMRC·CAT)으로 군을 나누지 않음. 권고 등급 표기 없음.'
