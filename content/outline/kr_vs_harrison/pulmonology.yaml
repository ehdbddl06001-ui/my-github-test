  harrison_says: 'p.2254: GOLD 는 FEV1 %예측치 기준을 써 왔고 ''The American Thoracic Society and European Respiratory Society have recently advocated grading severity ... using population-defined Z-scores (Table 303-1)''. 표 303-1(p.2255): GOLD mild FEV1 ≥80% / moderate ≥50% but <80% / severe ≥30% but <50% / very severe <30% (모두 FEV1/FVC <0.7); ERS/ATS 는 FEV1/FVC <LLN 과 zFEV1 (> –1.645 / –1.65~–2.5 mild / –2.51~–4 moderate / < –4.1 severe).'
  kr_says: '''GOLD 1은 FEV1≥80%이고 GOLD 2는 50%≤FEV1＜80%이며, GOLD 3는 30%≤FEV1＜50%, GOLD 4는 FEV1＜30%이다. 분류기준은 속효성기관지확장제(예: 살부타몰 400μg)를 흡입한 후 측정한 FEV1이다.'' Z-점수·LLN 중증도 분류는 제시하지 않음 — 권고 등급 표기 없음.'
  kmle_rule: KMLE 문항·정리본은 기관지확장제 후 FEV1 %예측치로 GOLD 1(≥80%)·2(50~79%)·3(30~49%)·4(<30%)를 나눈다(Z-점수 분류는 쓰지 않는다).
  usmle_rule: USMLE 문항은 GOLD FEV1 %predicted 등급을 기본으로 하되, ATS/ERS 의 LLN·Z-score 등급이 따로 있음을 구분한다.
