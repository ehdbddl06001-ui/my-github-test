- id: diff.pulm.tuberculosis.ltbi-regimen-preference
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1402]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.334, p.337
  diff_type: first_line
  topic: 잠복결핵감염 치료 처방의 우선순위
  harrison_says: 'TPT 처방(Table 183-6): isoniazid 6 or 9 months, rifapentine plus isoniazid 3 months(주 1회 isoniazid 900 mg + rifapentine 900 mg), isoniazid plus rifampin 3 months, rifampin alone 4 months, rifapentine plus isoniazid 1 month(13세 초과), levofloxacin 6 months. ''The most widely used has been that based on isoniazid alone at a daily dose of 5 mg/kg (up to 300 mg/d) for 9 months.'' 3HP는 ''as effective as the standard 9-month isoniazid regimen''이며 완료율이 더 높고(82% vs 69%) 간독성이 적다(0.4% vs 2.7%). 3HP는 2세 미만 소아·임신부에는 권고하지 않는다.'
  kr_says: 잠복결핵감염 표준치료는 리팜핀을 포함한 단기요법인 리팜핀 4개월 요법(4R, IA), 3개월 이소니아지드/리팜핀 요법(3HR, IIA)을 권고하나, 이소니아지드 9개월 요법(9H, IB)도 선택적으로 고려할 수 있다(p.334). 국내에는 아직 리파펜틴이 도입되지 않아 4R·3HR 을 주치료처방으로 우선 권고하고 약제 상호작용·부작용이 우려되는 환자 등에서 9H 등을 선택적으로 고려하며, 9H 를 완료할 수 없으면 6H 를 고려할 수 있으나 치료효과가 낮을 수 있다(p.337-338).
  kmle_rule: KMLE 문항·정리본은 잠복결핵감염 1차 처방을 4R 또는 3HR(9H 는 선택적 대안)로 하고, 리파펜틴 처방(3HP·1HP)은 국내 미도입이라 정답으로 두지 않는다.
  usmle_rule: USMLE 문항은 3HP·4R·3HR 을 짧은 1차 TPT 로, 6–9H 를 대안으로 보는 해리슨(WHO·CDC) 기준을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.ltbi-test-choice-bcg
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1394]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.324-326
  diff_type: algorithm
  topic: 정상 면역 성인의 잠복결핵 검사 선택(TST vs IGRA)과 BCG
  harrison_says: In the United States, an IGRA is preferred to the TST for most persons over the age of 5 years who are being screened for TB infection. ... the TST is preferred for TB infection testing of children aged <5 years. In Canada and some European countries, a two-step approach for those with positive TSTs—i.e., an initial TST followed by an IGRA—is often recommended. However, a TST may boost an IGRA response if the interval between the two tests exceeds 3 days.
  kr_says: 영아 때 BCG를 1회 접종한 정상 면역 성인은 TST 또는 IGRA로 잠복결핵감염을 진단하고, BCG를 2회 이상 또는 영아 이후 추가 접종 받은 정상 면역 성인은 IGRA 단독으로 진단한다(IIA, p.324). BCG 접종력이 불확실하면 IGRA 단독(p.326). BCG 2회 이상 접종 성인이 TST 양성이면 IGRA 를 추가할 수 있으나 TST 후 2–4주부터 boosting 이 생기므로 1주일 정도 이내 간격으로 시행하고, TST 15mm 이상이면 IGRA 추가 없이 잠복결핵감염으로 진단할 수 있다(p.325).
  kmle_rule: KMLE 문항·정리본은 BCG 접종 횟수로 검사를 고르는 국내 흐름(영아 1회 → TST 또는 IGRA, 2회 이상·불확실 → IGRA 단독)을 적용한다.
  usmle_rule: USMLE 문항은 5세 초과는 IGRA 우선, 5세 미만은 TST 우선이라는 해리슨(미국) 기준을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.ltbi-immunocompromised-tst-cutoff
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1401]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.324, p.327
  diff_type: threshold
  topic: 면역저하 성인의 잠복결핵 검사 순서와 TST 양성 기준
  harrison_says: 'Table 183-5: HIV-infected persons ≥5 mm; recent contacts ≥5 mm; organ transplant recipients ≥5 mm; fibrotic lesions consistent with old TB ≥5 mm; persons who are immunosuppressed—e.g., due to the use of glucocorticoids or tumor necrosis factor α inhibitors ≥5 mm; recent immigrants, injection drug users, high-risk congregate settings, children <5 years ≥10 mm; low-risk persons ≥15 mm. (p.1394) for individuals at high risk of progression to active TB (e.g., PLWH), either test—or, to optimize sensitivity, both tests—may be used.'
  kr_says: 면역저하 성인에서는 IGRA 단독 혹은 IGRA, TST 병합검사법을 사용해서 잠복결핵감염을 진단한다(IIA, p.324). TST 를 먼저 검사하는 것은 위음성 가능성이 높아 권고하지 않으며, IGRA 양성이면 바로 진단하고 음성이면 TST 를 추가한다. 이때 TST는 BCG 접종력에 관계없이 경결 크기 10mm를 기준으로 해서 양성 여부를 판단한다(HIV 감염인은 5mm 기준)(p.327).
  kmle_rule: KMLE 문항·정리본은 면역저하 성인에서 IGRA 먼저(음성이면 TST 추가)·TST 10mm(HIV 만 5mm) 기준을 적용한다.
  usmle_rule: USMLE 문항은 HIV·장기이식·스테로이드/TNF 억제제·최근 접촉자 모두 TST ≥5 mm 를 양성으로 보는 해리슨 Table 183-5 기준을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.ltbi-testing-targets
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1402]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.299
  diff_type: screening
  topic: 잠복결핵감염 검사 대상자
  harrison_says: The WHO recommends systematic testing for infection and TPT for ... adults, adolescents and children older than 12 months living with HIV; infants with HIV aged <12 months who are contacts of persons with TB; all household contacts of patients with infectious pulmonary TB including children <5 years of age; patients with silicosis, patients starting anti-TNF treatment, patients on dialysis, and patients preparing for organ or hematologic transplantation. In addition, testing and TPT may be considered for ... prisoners, health care workers, recent immigrants from high-TB-burden countries, and homeless persons who use drugs.
  kr_says: '시행한다: 전염성 결핵 환자의 접촉자(IA), HIV 감염인(IA), 장기 이식으로 면역억제제 복용 중·예정자(IA), TNF 길항제 치료 예정(IA), 그 밖의 생물학적 제제·소분자 억제제 치료 예정(IIA), 과거 결핵치료력 없이 흉부X선에서 자연 치유된 결핵병변(IA), 규폐증(IA). 권고한다: 장기간 스테로이드 사용 자가면역 질환자(IIB), 투석 중인 말기콩팥병(IIB), 혈액암(IIB), 의료기관 종사자(IIB). 일부 고위험군 중심으로 고려한다: 당뇨병(IIC), 고형암(IIC), 위절제술 시행·예정자(IIC).'
  kmle_rule: KMLE 문항·정리본은 국내 3단계(시행 IA·IIA / 권고 IIB / 고려 IIC) 대상 목록을 적용한다 — 당뇨병·고형암·위절제는 '고려' 대상이다.
  usmle_rule: USMLE 문항은 HIV·가족 접촉자·규폐증·anti-TNF·투석·이식 예정자를 검사·TPT 대상으로 보는 해리슨(WHO) 목록을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.ltbi-mdr-contact
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1403]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.342-343
  diff_type: first_line
  topic: 다제내성·단독내성 결핵 접촉자의 잠복결핵 치료
  harrison_says: Drug selection should be based on the drug susceptibility profile of the index case. WHO recommends daily levofloxacin for 6 months in people exposed to MDR-TB. Some studies are currently investigating the role of delamanid and bedaquiline as TPT.
  kr_says: 아직 무작위 대조군 연구가 없어 진행 중인 6개월 레보플록사신 연구(V-QUIN MDR, TB-CHAMP)·델라마니드 연구(PHOENIx) 결과에 따라 추후 권고가 결정될 수 있다. 따라서 다제내성결핵 접촉자의 잠복결핵감염인 경우 전문가에게 의뢰하는 것이 바람직하다. 또한 다제내성결핵 감염자는 치료 여부와 관계없이 최소 2년간 추적하여 발병 여부를 감시하여야 한다(p.342). 이소니아지드 단독 내성 환자의 접촉자는 4R로 치료하고, 리팜핀 단독 내성 환자의 접촉자는 9H로 치료할 수 있다(p.343).
  kmle_rule: KMLE 문항·정리본은 다제내성결핵 접촉 잠복결핵은 전문가 의뢰 + 최소 2년 추적, INH 단독내성 접촉자는 4R, RIF 단독내성 접촉자는 9H 를 적용한다.
  usmle_rule: USMLE 문항은 MDR-TB 접촉자 TPT 로 levofloxacin 6개월(WHO)을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.ds-tb-continuation-ethambutol
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1395]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.43-44
  diff_type: algorithm
  topic: 감수성결핵 표준처방과 유지기 에탐부톨
  harrison_says: 'The treatment regimen of choice for virtually all forms of drug-susceptible TB in adults consists of a 2-month initial (intensive) phase of isoniazid, rifampin, pyrazinamide, and ethambutol followed by a 4-month continuation phase of isoniazid and rifampin (2HRZE/4HR). ... Treatment should be given daily throughout the course. Table 183-4: Intolerance to Z — 2 HRE / 7 HR.'
  kr_says: '감수성결핵 치료의 표준처방은 2HRZE/4HR이다. 약제감수성검사 결과 이소니아지드 및 리팜핀에 감수성 결핵으로 확인된 경우에는 에탐부톨을 중단할 수 있다(IIB, p.43). 감수성 결과가 확보되기 전까지 4제(HRZE)로 시작하고 HR 감수성이 확인된 시점부터 에탐부톨을 중단하나, 약제감수성검사 결과가 확인되지 않았거나 균음성 결핵인 경우에는 에탐부톨을 치료 종료 시까지 사용한다. 표4: 감수성결핵이 추정되는 경우 우선권고안 HRZE 2개월 → HRE 4개월, 치료 시작 시점에 감수성 확인 시 HRZ 2개월 → HR 4개월; 피라진아미드를 못 쓰면 9HRE. 국내는 치료 전기간 매일 복용을 권고한다(p.44).'
  kmle_rule: KMLE 문항·정리본은 감수성 결과가 없거나 균음성이면 유지기까지 에탐부톨을 쓰고(HRZE 2개월 → HRE 4개월), HR 감수성 확인 시 에탐부톨을 끊는 국내 흐름을 적용한다.
  usmle_rule: USMLE 문항은 2HRZE/4HR(유지기 HR)을 표준으로 하는 해리슨 기준을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.ds-tb-4month-rifapentine-moxifloxacin
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1396]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.45-46
  diff_type: first_line
  topic: 감수성결핵 4개월 리파펜틴-목시플록사신 단기요법
  harrison_says: Study 31/A5349 showed that a 4-month daily regimen that included isoniazid, pyrazinamide (for the first 2 months only), rifapentine at a daily dose of 1200 mg, and moxifloxacin at a daily dose of 400 mg was noninferior to the standard 6-month regimen ... This option (2HPMZ/2HPM) is now recommended by the WHO and CDC as an alternative for patients aged 12 years or older, including PLWH ... should not be used ... in patients with body weight <40 kg; children aged <12 years; ... severe extrapulmonary or disseminated forms of TB; PLWH with a CD4+ count of <100/μL, pregnant, breastfeeding or postpartum women.
  kr_says: Study 31/A5439에서 2HPMZ/2HPM 이 6개월 표준요법과 비교하여 효과에 있어 열등하지 않음이 입증되어 세계보건기구는 2022년 4개월 단기치료요법을 조건부 권장사항으로 권고하였다. 그러나 국내에서는 2016년 리파펜틴 임상연구가 아나필락시스 사례로 조기 종료되었고, 현재 국내에서는 리파펜틴이 도입되지 않았고 안전성에 대한 우려가 해소되지 않아 세계보건기구에서 권고한 4개월 단기요법을 수용하기 어렵다(p.46).
  kmle_rule: KMLE 문항·정리본은 감수성결핵 치료를 6개월 표준처방으로만 두고 4개월 2HPMZ/2HPM 은 국내 미수용 처방으로 다룬다.
  usmle_rule: USMLE 문항은 12세 이상(40 kg 이상, 중증 폐외·임신 제외)에서 2HPMZ/2HPM 을 대안으로 인정하는 해리슨(WHO·CDC) 기준을 적용한다.
  verified: text
- id: diff.pulm.tuberculosis.mdr-fq-susceptible-short-regimen
  slot: h178
  h22_chapter: 183
  h22_cite: '[[harrison-22: 183장 p.1399]]'
  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.103-104, p.110
  diff_type: first_line
  topic: 퀴놀론 감수성 다제내성결핵의 단기요법 선택
  harrison_says: 'the WHO is now recommending four approaches to treat MDR/RR-TB: (1) a 6-month, fully oral regimen composed of bedaquiline, pretomanid, linezolid (600 mg) and moxifloxacin; (2) a 6-month oral regimen consisting of bedaquiline, delamanid, and linezolid (600 mg), plus levofloxacine and clofazimine; (3) different 9-months oral bedaquiline-containing regimens; and (4) an individualized longer regimen of at least 18 months’ duration. ... 9-month regimens ... in order of preference: (i) BLMZ; (ii) BLLfxCfzZ; and (iii) BDLLfxZ.'
  kr_says: 6개월 BPaLM 요법 또는 9개월 MDR-END 요법(레보플록사신, 델라마니드, 리네졸리드, 피라진아미드)을 사용하는 것을 권고한다(IA). 18-20개월 장기요법은 이 둘에 적합하지 않은 환자에게 사용한다(IA)(p.103). 두 요법 중 우선 사용을 권고하는 요법은 따로 없다. 9개월 베다퀼린 포함 단기요법은 국내 기저 내성률이 높아(적합 환자 25%) 퀴놀론 감수성 다제내성결핵의 표준 치료로는 권고하지 않으며, 전체 약제 내성이 배제되면 시작할 수 있다(p.104, p.110).
  kmle_rule: KMLE 문항·정리본은 퀴놀론 감수성 MDR-TB 의 1차를 6개월 BPaLM 또는 9개월 MDR-END(국내 연구 처방)로 하고, 9개월 베다퀼린 포함 요법은 표준이 아니라고 본다.
  usmle_rule: USMLE 문항은 BPaLM·BDLLfxCfz(6개월) → 9개월 베다퀼린 포함 요법 → 18개월 이상 개별 요법 순의 해리슨(WHO 2024) 기준을 적용한다 — MDR-END 는 해리슨에 없다.
