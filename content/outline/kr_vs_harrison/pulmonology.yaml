  kr_guideline_id: kr-kdca-tb-2024
  kr_cite: 결핵 진료지침 제5판(2024, 결핵진료지침 개정위원회·질병관리청) p.374, p.383-384
  diff_type: threshold
  topic: 전염성 소실·격리 해제 기준
  harrison_says: The primary way to prevent TB is to diagnose and isolate infectious cases rapidly and to administer appropriate treatment until patients are rendered noninfectious (usually 2–4 weeks after the start of proper treatment). (p.1403) respiratory isolation of persons with suspected TB until they are proven to be noninfectious.
  kr_says: 격리 치료 중인 결핵환자의 격리 해제를 위해서는 최소 2주간 효과적인 항결핵제로 치료를 시행하여야 하고, 임상적으로 호전을 보여야 하며, 도말 양성 결핵환자는 3회 추구 객담 도말검사에서 항산균이 검출되지 않거나 배양검사에서 음성이 확인되어야 한다(IIIA, p.383) — 연속 3회 이상(8시간 이상 간격, 최소 한 번은 아침 객담)(p.384). 임상소견이 호전되어 퇴원 가능하면 도말 음전 전이라도 조건(전담간호사 연계, 집에 6세 미만 소아·면역억제 환자 없음, 환기되는 독립 공간)을 만족하면 재택 격리치료 할 수 있다(IIIB, p.384). 전염성 소실 시기는 2주 이상 효과적인 항결핵제 복용 + 호흡기 증상 소실 + 객담 도말 음전(p.374).
  kmle_rule: KMLE 문항·정리본은 격리 해제를 '효과적 치료 2주 이상 + 임상 호전 + (도말 양성이면) 연속 3회 도말 음성 또는 배양 음성'으로 적용한다.
  usmle_rule: USMLE 문항은 적절한 치료 시작 후 대개 2–4주에 비전염성이 된다는 해리슨 서술과 '비전염성이 증명될 때까지 호흡기 격리' 원칙을 적용한다.
