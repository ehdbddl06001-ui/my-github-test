- id: diff.pulm.copd.ltot-criteria
  slot: h292
  h22_chapter: 303
  h22_cite: '[[harrison-22: 303장 p.2256]]'
  kr_guideline_id: kr-katrd-copd-2024
  kr_cite: COPD 진료지침 2024 개정(대한결핵및호흡기학회) p.110
  diff_type: threshold
  topic: 장기 산소요법 기준 — PaO2·Hct·시간 명시 여부
  harrison_says: '''For patients with resting hypoxemia (resting O2 saturation ≤88% in any patient or ≤89% with signs of pulmonary arterial hypertension, right heart failure, or erythrocytosis), the use of O2 has been demonstrated to have a significant impact on mortality. Patients meeting these criteria should be on continuous oxygen supplementation because the mortality benefit is proportional to the number of hours per day oxygen is used.'''
  kr_says: '''장기간 산소투여(하루 15시간 이상)는 생존율 향상을 보였다.'' 적용: ''(1) 고탄산혈증 여부와 관계없이 동맥혈산소분압(PaO2)이 최소 55 mmHg 이하이거나 산소포화도(SaO2)가 88% 이하; 혹은 (2) 동맥혈산소분압이 55 mmHg와 60 mmHg 사이거나 산소포화도가 89%이면서 폐고혈압, 울혈성심부전을 암시하는 말초부종, 혹은 적혈구증가증 (적혈구용적률＞55%)이 보이는 경우'' — ''안정상태에서 3주 동안 두 차례 반복하여 측정'', 2-3개월 후 재평가. 권고 등급 표기 없음.'
  kmle_rule: KMLE 문항·정리본은 PaO2 ≤55 mmHg 또는 SaO2 ≤88%, 또는 PaO2 55~60 mmHg·SaO2 89% + 폐고혈압·말초부종·적혈구증가증(Hct >55%)이면 하루 15시간 이상 장기 산소요법을 적용한다.
  usmle_rule: USMLE 문항은 resting SaO2 ≤88%(또는 PAH·우심부전·적혈구증가증 동반 시 ≤89%)에서 continuous O2 를 적용한다.
  verified: text
