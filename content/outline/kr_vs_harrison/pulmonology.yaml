  kr_cite: 천식 진료지침 2026(대한결핵및호흡기학회 6차 개정) p.150–152
  diff_type: threshold
  topic: 항 IgE(omalizumab) 대상 IgE 기준
  harrison_says: In asthma, anti-IgE has been tested in patients with a circulating IgE ≥30 IU/mL and a positive skin test or RAST to a perennial allergen. It is generally used in patients not responsive to moderate- to high-dose ICS/LABA. ... patients with an exhaled nitric oxide approximately ≥20 ppb or circulating eosinophils ≥260/μL have the greatest response.
  kr_says: 급여인정 기준은 성인 및 12세 이상 청소년 중증 알레르기성 천식 환자 중 고용량 ICS-LABA와 LAMA를 병용 투여하였음에도 조절되지 않는 경우로, 총 IgE 수치가 76 IU/mL 이상, 통년성 알레르기 항원에 대한 in vitro 검사 또는 피부 반응 검사 양성, FEV1 예측치 80% 미만, 치료 시작 전 12개월 이내 전신 스테로이드가 필요한 급성 악화 2회 이상을 모두 만족해야 한다. 16주에 반응이 없다면 중단을 고려한다. 말초혈액 호산구 260/μl 또는 FeNO 20 ppb 이상일 경우 좋은 반응을 보였다.
