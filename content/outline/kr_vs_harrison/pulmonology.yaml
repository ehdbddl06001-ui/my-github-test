  harrison_says: 'Table 183-5 footnote a: Tuberculin-negative contacts, especially children, should receive prophylaxis for 2–3 months after contact ends and should then undergo repeat tuberculin skin testing (TST). Those whose results remain negative should discontinue prophylaxis. HIV-infected contacts should receive a full course of treatment regardless of TST results. (p.1402) infants and children <5 years of age who were in contact with infectious cases should be offered TPT even in the absence of a positive test for TB infection.'
