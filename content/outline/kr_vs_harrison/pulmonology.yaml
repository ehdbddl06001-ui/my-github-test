  harrison_says: '''Patients with moderate or severe exacerbations are usually treated with 5–7 days of antibiotics, even in the absence of data implicating a specific pathogen.'' 항생제 선택은 ''local patterns of antibiotic susceptibility'' 와 환자 상태에 근거.'
  kr_says: '''호흡곤란 악화, 가래양의 증가, 화농성 객담의 증가, 3가지 주요증상 중에 3가지를 모두 만족시키는 경우, 또는 객담의 화농성 증가를 포함한 2가지를 만족하는 경우, 또는 기계호흡이 필요한 경우에서 항생제를 처방하여야 한다. 항생제의 치료 기간은 5-7일을 권고하며, 외래에서 치료하는 환자의 경우 5일 이내의 치료를 권고한다.'' 초기 경험적 치료는 aminopenicillin-clavulanic acid, 3세대 cephalosporin; 65세 이상·FEV1 50% 미만·잦은 악화·심장질환 동반 시 fluoroquinolone 고려. 권고 등급 표기 없음.'
