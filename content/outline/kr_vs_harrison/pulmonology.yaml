# 폐암 검진 항목(screening-*)의 국내 원문은 폐암검진 질지침(보건복지부·국립암센터, 2021) — kr-kalc-lung-cancer 트랙의 drive_files 에 있다.
# 천식 중증 생물학적 제제 기준(IgE ≥76, 호산구 ≥300/≥400, 연 3~4회 악화)은 국내 급여 기준이며 지침 본문(p.153 주1~4)이 임상시험 기준(연 2회)과 다르다고 지적한다.
