  topic: 초기 약물 — 저위험(증상 적음)에서 LABA+LAMA vs 기관지확장제 하나
  harrison_says: '그림 303-6A Initial Pharmacological Treatment: ''GROUP A — A bronchodilator''; ''GROUP B — LABA + LAMA*''; ''GROUP E — LABA + LAMA*, consider LABA+LAMA+ICS* if blood eos ≥300''.'
  kr_says: '''1. 저위험군 환자(지난 1년 동안 급성악화가 1회 이하이면서 입원할 정도로 심한 악화가 없었던 환자) 흡입지속성베타-2작용제와 흡입지속성항콜린제 복합제를 일차 치료로 권장한다.'' ''CAT 점수 10점 미만의 환자에게서 ... 복합제를 일차 치료제로 권장하는 근거는 아직 부족하다.'' 그림 3-3(p.79): 저위험군 = LABA+LAMA(호산구와 무관). (p.56 KQ1·KQ2: 저위험군에서 질병 진행 억제·증상 호전 목적의 기관지확장제 사용은 ''권고 보류''(근거수준 Low, 권고수준 Weak)).'
  kmle_rule: KMLE 문항·정리본은 저위험군 안정기 COPD 의 초기 약물을 증상 정도와 무관하게 LABA+LAMA 복합제로 적용한다.
  usmle_rule: USMLE 문항은 GOLD Group A = 기관지확장제 하나(LABA 또는 LAMA), Group B = LABA+LAMA 로 적용한다.
