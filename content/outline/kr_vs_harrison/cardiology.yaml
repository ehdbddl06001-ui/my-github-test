  kmle_rule: KMLE 문항·정리본은 초기 2제 병용을 '80세 이하 2기 또는 고위험 1기'에서 고려(IIa)하고, 80세 이상·노쇠는 단일제로 시작한다고 쓴다.
  usmle_rule: USMLE 문항은 대부분의 환자(특히 SBP 가 목표보다 20 mmHg 이상 높을 때)에서 초기 2제 병용(이뇨제 또는 CCB + ACEI/ARB, 가능하면 단일정)을 쓴다.
