- id: diff.cardio.heart-failure.ef-classification
  slot: h257
  h22_chapter: 264
  h22_cite: '[[harrison-22: 264장 p.1977]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 1 Korean Circ J 2023;53:197
  diff_type: same
  topic: 박출률에 따른 심부전 분류 기준
  harrison_says: HFrEF 는 EF ≤40%, HFpEF 는 EF ≥50%, HFmrEF 는 EF 41–49%로 나눈다(p.1977). 같은 장 p.1978 은 HFmrEF 를 'EF between 40 and 50%' 로 적고, AHA/ACC/HFSA 지침은 HFmrEF 분류에 자발적 또는 유발된 좌심실 충만압 상승의 증거를 요구한다고 덧붙인다.
  kr_says: LVEF ≤40% 는 HFrEF, 41–49% 는 HFmrEF, ≥50% 는 HFpEF 로 정의한다(Table 1). HFrEF·HFmrEF 는 추가 증거가 필요 없고, HFpEF 만 나트륨이뇨펩타이드 상승 또는 이완기능장애·충만압 상승을 시사하는 좌심실 구조·기능 이상을 추가로 요구한다.
