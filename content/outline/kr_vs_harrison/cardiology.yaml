  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 1 Korean Circ J 2023;53:202
  diff_type: algorithm
  topic: BNP 수치로 약 용량 조절하기
  harrison_says: 나트륨이뇨펩타이드는 만성 심부전의 중증도·예후 판단에 쓰고 '안정된 외래 환자에서 약물 치료의 최적 용량을 정하는 데 도움이 될 수 있다(may help to guide optimal dosing)' (p.1985).
  kr_says: BNP·NT-proBNP 는 중증도·예후 평가에 유용(Class I, LOE A)하지만, 치료 약물 용량 변경을 위한 BNP·NT-proBNP 측정은 도움이 되지 않을 수 있다(Class III, LOE B).
  kmle_rule: KMLE 문항·정리본은 BNP 를 예후·중증도 지표로만 쓰고 BNP 수치에 맞춘 용량 조절은 권고하지 않는다(Class III).
  usmle_rule: USMLE 문항은 BNP 를 진단·예후 지표로 출제하고, BNP 유도 용량 조절을 정답 근거로 쓰지 않는다(해리슨은 '도움이 될 수 있다' 수준).
  verified: text
- id: diff.cardio.heart-failure.hfpef-diagnostic-score
  slot: h257
  h22_chapter: 264
  h22_cite: '[[harrison-22: 264장 p.1977]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 1 Korean Circ J 2023;53:209
  diff_type: algorithm
  topic: HFpEF 진단 기준과 점수 알고리듬
  harrison_says: HFpEF 진단은 호흡곤란·체액 저류의 비심장 원인을 배제해야 해서 더 어렵다고만 적고(p.1977), H2FPEF·HFA-PEFF 같은 점수 알고리듬이나 이완기 부하검사는 제시하지 않는다.
  kr_says: HFpEF 는 ①심부전 증상·징후 ②LVEF ≥50% ③좌심실 이완기능장애·충만압 상승에 맞는 구조·기능 이상의 객관적 증거(NT-proBNP·BNP 상승 포함) 셋을 모두 충족해야 한다. H2FPEF·HFA-PEFF 점수가 도움이 되며, HFA-PEFF 는 ≥5점이면 HFpEF, 2–4점이면 이완기 부하검사 또는 침습적 혈역학 평가(동율동 주요 기준 NT-proBNP >220 또는 BNP >80 pg/mL).
  kmle_rule: KMLE 문항·정리본은 HFpEF 진단에 세 기준(증상·징후 + LVEF ≥50% + 구조·기능 이상/NP 상승)과 H2FPEF·HFA-PEFF 점수를 적용한다.
  usmle_rule: USMLE 문항은 EF 보존 + 이완기능장애·충만압 상승 증거 + 비심장 원인 배제로 판단한다(점수 계산은 해리슨 범위 밖).
  verified: text
- id: diff.cardio.heart-failure.arni-first-line
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1995]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:219-220
  diff_type: first_line
  topic: HFrEF 의 첫 RAS 억제제 — ARNI 대 ACEI
  harrison_says: 지침은 ACEI·ARB 에 견디는 증상성 HFrEF 환자를 ARNI 로 바꾸도록 권하고, ACEI/ARB 를 써 본 적 없는 de novo 심부전에서 처음부터 ARNI 를 쓰는 것도 혈압이 충분하면 '적절할 수 있다(may also be appropriate)' 는 자료가 나오고 있다. 혈관부종 병력은 금기, ACEI 에서 바꿀 때 36시간 간격(p.1995).
  kr_says: HFrEF 에서 ARNI 를 표준 치료로 권고하고, 견디지 못하거나 쓸 수 없을 때 ACEI(Class I, LOE A), 둘 다 안 되면 ARB(Class I, LOE A). ACEI·ARB 로 안정적이어도 ARNI 로 교체(Class I, LOE B). 'ARNI 는 현재 ACEI 보다 우선하는 1차 치료로 권고된다(Class I)', 급성 악화로 입원한 신규 진단·ACEI/ARB 미사용 환자에도 1차로 쓸 수 있다. ACEI 에서 바꿀 때 36시간 휴약(p.220).
  kmle_rule: KMLE 문항·정리본은 HFrEF 의 RAS 억제제 1차를 ARNI 로 하고, ACEI 는 ARNI 를 못 쓸 때, ARB 는 둘 다 못 쓸 때로 적용한다.
  usmle_rule: USMLE 문항은 ACEI/ARB 를 견디는 증상성 HFrEF 에서 ARNI 로의 교체를 정답으로 하고, ACEI 에서 바꿀 때 36시간 휴약을 적용한다.
  verified: text
- id: diff.cardio.heart-failure.gdmt-pillars-sequence
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1994]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:218-220
  diff_type: same
  topic: HFrEF 네 기둥 약제와 시작 순서
  harrison_says: RAAS 차단제(ARNI 포함)·베타차단제·SGLT2 억제제가 약물치료의 기둥이고(p.1992), 지침은 SGLT2 억제제를 ARNI·베타차단제·MRA 와 함께 기초 치료로 본다(p.1996). 베타차단제와 ACEI 중 무엇을 먼저 시작할지는 CIBIS III 에서 결과 차이가 없어 '어느 것을 먼저 시작하는지는 별로 중요하지 않고' 둘 다 제때 목표 용량까지 올리는 것이 중요하다(p.1994). 베타차단제는 carvedilol·bisoprolol·metoprolol succinate 로 한정.
  kr_says: ARNI 또는 ACEI(불내성 시 ARB)·베타차단제·MRA·SGLT2 억제제가 HFrEF 의 표준 치료(Class I, LOE A, p.218). Figure 1 은 네 약을 나란히 두고 목표·최대 내약 용량까지 점차 증량한다. 고용량 ACEI·ARB 가 꼭 필요하지 않으며 저용량 ACEI 중이라도 베타차단제를 빨리 더하라고 권한다(p.220). 사망률 감소가 입증된 베타차단제는 bisoprolol·carvedilol·metoprolol 서방정(Class I, LOE A), 70세 이상 nebivolol(Class IIa).
  kmle_rule: KMLE 문항·정리본은 네 약제를 모두 쓰는 것을 표준으로 하고, 고정된 시작 순서를 정답 근거로 삼지 않는다(두 출처 같음).
  usmle_rule: USMLE 문항도 네 기둥 병용과 생존 이득이 입증된 세 베타차단제만 쓰는 것을 적용하며, 시작 순서는 묻지 않는다.
  verified: text
- id: diff.cardio.heart-failure.hfmref-hfpef-treatment
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1987]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:223-224
  diff_type: algorithm
  topic: HFmrEF·HFpEF 의 약물 치료와 권고 등급
  harrison_says: HFpEF 에서 사망률을 확실히 낮춘 약은 없고, MRA·ARB·ARNI 의 입원 감소 효과는 주로 LVEF <0.60 에 국한돼 많은 이가 HFmrEF 를 HFrEF 와 같은 약으로 치료하자고 권한다. SGLT2 억제제 시험이 HFmrEF·HFpEF 에서 심혈관 사망·입원 감소를 뒷받침하고, ARNI·GLP-1 작용제(비만)는 일부 HFpEF 에서 이득 가능(p.1987). 미국·유럽 지침은 SGLT2 억제제를 EF 와 무관한 기초 치료로 받아들였다(p.1988). spironolactone 은 TOPCAT 기준 HFpEF 에 약한 권고(p.1988).
  kr_says: 'HFmrEF·HFpEF 를 한 묶음으로: 동반질환 선별·치료(Class I, LOE C), 울혈 시 이뇨제(Class I, LOE C), SGLT2 억제제(empagliflozin·dapagliflozin) 당뇨 유무와 무관하게(Class I, LOE B), ARNI(Class IIa, LOE B), MRA(Class IIa, LOE C), ARB·ACEI(Class IIb, LOE C), 베타차단제(Class IIb, LOE C).'
  kmle_rule: KMLE 문항·정리본은 HFmrEF·HFpEF 의 예후 개선 약 1차를 SGLT2 억제제(Class I)로 하고, ARNI·MRA 는 IIa, ACEI/ARB·베타차단제는 IIb 로 적용한다.
  usmle_rule: USMLE 문항은 HFpEF 에서 SGLT2 억제제 + 울혈 시 이뇨제 + 동반질환(고혈압·AF·비만) 조절을 정답으로 하고, 사망률을 낮춘다고 입증된 약이 없음을 적용한다.
  verified: text
- id: diff.cardio.heart-failure.icd-primary-prevention
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1999]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:225
  diff_type: threshold
  topic: 1차 예방 ICD 의 EF 기준과 원인별 등급
  harrison_says: NYHA II–III 이고 LVEF <35% 이면 원인과 무관하게 예방적 ICD 대상이고, 심근경색 후 최적 치료에도 LVEF ≤30% 이면 증상이 없어도 ICD 가 적절하다. 비허혈성(DANISH)에서는 장기 사망 감소가 유의하지 않았고 60세 미만에서 이득. 심근경색 40일 이내 이식은 이득 없음(2차 예방 제외). 기대여명 <6개월·이식 비대상 NYHA IV 는 신중히(p.1999).
  kr_says: 허혈성 NYHA II–III, ≥3개월 GDMT 후 LVEF ≤35%, 1년 넘는 생존 기대 시 ICD 권고(Class I, LOE A). 비허혈성은 같은 조건에서 '합리적'(Class IIa, LOE A). 심근경색 40일 이내 ICD 는 권고하지 않음(Class III, LOE A). 약물에 반응 없는 NYHA IV 는 CRT·VAD·이식 후보가 아니면 권고하지 않음(Class III, LOE C).
  kmle_rule: KMLE 문항·정리본은 ≥3개월 GDMT 후 LVEF ≤35% · NYHA II–III · 1년 넘는 생존 기대를 ICD 기준으로 하고, 허혈성 Class I · 비허혈성 Class IIa 로 구분한다.
  usmle_rule: USMLE 문항은 최적 약물치료 후 LVEF ≤35% · NYHA II–III 을 원인과 무관하게 ICD 대상으로 하고, 심근경색 후 LVEF ≤30% 는 무증상이어도 ICD, 심근경색 40일 이내는 제외를 적용한다.
  verified: text
- id: diff.cardio.heart-failure.crt-qrs-criteria
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1999]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:226
  diff_type: threshold
  topic: CRT 의 QRS 폭·LBBB 기준
  harrison_says: 경증 증상 HFrEF 에서 CRT 이득은 대부분 QRS >149 ms 이고 LBBB 모양인 환자에서 나온다. RBBB 우세·AF·측벽 흉터·ADHF 에서는 이득이 불확실하고, 좁은 QRS 의 비동기는 좋은 표적이 아니다(p.1999). 130–149 ms 구간별 등급은 제시하지 않는다.
  kr_says: 'Figure 2(동율동, GDMT 에도 증상 지속): LBBB & LVEF ≤35% 에서 QRS ≥150 ms Class I (LOE A), 130–149 ms ''Class II'' (LOE B); non-LBBB & LVEF ≤35% 에서 QRS ≥150 ms Class IIa (LOE B), 130–149 ms Class IIb (LOE B). AF 에서 LVEF ≤35% · QRS ≥130 ms Class IIb. 방실차단으로 심실조율 ≥20% 예상되는 LVEF <40% 는 Class I (LOE A).'
  kmle_rule: KMLE 문항·정리본은 동율동 · LBBB · QRS ≥150 ms · LVEF ≤35% · GDMT 에도 증상 지속을 CRT Class I 로 적용하고, 130–149 ms 와 non-LBBB 는 낮은 등급으로 본다.
  usmle_rule: USMLE 문항은 LVEF ≤35% 에 QRS ≥150 ms LBBB 를 CRT 의 가장 확실한 대상으로 적용한다.
  verified: text
- id: diff.cardio.heart-failure.iron-deficiency
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1998]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 3 Korean Circ J 2023;53:437
  diff_type: algorithm
  topic: 심부전 철 결핍의 정의와 정맥 철분 치료 근거
  harrison_says: CONFIRM-HF 의 철 결핍 정의는 ferritin <100 ng/mL, 또는 100–300 ng/mL 이면서 transferrin saturation <20%. ferric carboxymaltose 는 기능·증상·QOL 을 개선하나 장기 임상 결과 이득은 분명하지 않다 — AFFIRM-AHF(LVEF <50%)·IRONMAN 은 경계선, HEART-FID(LVEF ≤40%)는 1차 복합 결과 이득 없음. 이득은 증상, 아마도 입원 감소에 한정. 경구 철분은 효과 없고, 조혈 자극제(darbepoetin, RED-HF)는 실망스러운 결과(p.1998).
  kr_says: 절대 철 결핍 ferritin <100 ng/mL, 기능적 철 결핍 ferritin 100–299 ng/mL 이면서 TSAT <20%. 철 결핍성 빈혈 심부전에 정맥 철분(ferric carboxymaltose) 합리적(Class IIa, LOE A). LVEF <50% 이고 최근 급성 심부전으로 입원한 철 결핍 환자에 정맥 철분이 심부전 입원 감소에 도움(Class IIa, LOE B). 원인 미상 빈혈에 조혈 자극제 권고 안 함(Class III, LOE B).
  kmle_rule: KMLE 문항·정리본은 ferritin <100 또는 100–299 ng/mL + TSAT <20% 를 철 결핍으로 정의하고, 정맥 ferric carboxymaltose(Class IIa)를 적용하며 조혈 자극제는 쓰지 않는다.
  usmle_rule: USMLE 문항은 같은 정의로 철 결핍을 찾아 경구가 아닌 정맥 철분으로 증상·기능 개선을 노리고, 사망률 감소를 근거로 들지 않는다.
  verified: text
