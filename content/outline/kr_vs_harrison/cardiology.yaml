  harrison_says: 항응고하지 않은 환자에서 발병 48 h 이내 TEE·심장 CT 없이 전환하는 것은 흔한 관행이다(색전 병력·류마티스 승모판 협착·좌심방 확대 HCM 같은 고위험 제외). 48 h 초과·모름이면 전환 전 3주 이상 항응고 후 전환하고 이후 최소 4주 유지, 또는 TEE/CT 로 혈전을 배제한 뒤 전환하고 최소 4주 항응고. 장기 항응고는 CHA2DS2-VASc 로 정한다.
  kr_says: '그림 10: 조기 율동 전환 최적 후보군 = 「혈전 색전증 과거력이 없고 AF 발생 12 시간 이내」 또는 「AF발생 24 시간내 CHA2DS2-VASc ≤1 (남) 또는 ≤2 (여)」. 48 시간 이후 전환은 치료적 경구 항응고제 3 주 이상(TEE 로 혈전 없으면 3주 이내 가능). 전환 후 CHA2DS2-VASc 0(남)/1(여)는 단기간(4 주), ≥1(남)/≥2(여)는 장기간 경구 항응고. 본문 p.62: 지속 12 시간 이내이고 뇌졸중 위험이 매우 낮을 때(남 0, 여 1)는 4 주 항응고의 이점이 확인되지 않아 개인 특성에 따라 선택적.'
