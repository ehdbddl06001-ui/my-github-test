  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 1 Korean Circ J 2023;53:202
  diff_type: algorithm
  topic: BNP 수치로 약 용량 조절하기
  harrison_says: 나트륨이뇨펩타이드는 만성 심부전의 중증도·예후 판단에 쓰고 '안정된 외래 환자에서 약물 치료의 최적 용량을 정하는 데 도움이 될 수 있다(may help to guide optimal dosing)' (p.1985).
  kr_says: BNP·NT-proBNP 는 중증도·예후 평가에 유용(Class I, LOE A)하지만, 치료 약물 용량 변경을 위한 BNP·NT-proBNP 측정은 도움이 되지 않을 수 있다(Class III, LOE B).
  kmle_rule: KMLE 문항·정리본은 BNP 를 예후·중증도 지표로만 쓰고 BNP 수치에 맞춘 용량 조절은 권고하지 않는다(Class III).
  usmle_rule: USMLE 문항은 BNP 를 진단·예후 지표로 출제하고, BNP 유도 용량 조절을 정답 근거로 쓰지 않는다(해리슨은 '도움이 될 수 있다' 수준).
  verified: text
- id: diff.cardio.heart-failure.hfpef-diagnostic-score
  slot: h257
  h22_chapter: 264
  h22_cite: '[[harrison-22: 264장 p.1977]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 1 Korean Circ J 2023;53:209
  diff_type: algorithm
  topic: HFpEF 진단 기준과 점수 알고리듬
  harrison_says: HFpEF 진단은 호흡곤란·체액 저류의 비심장 원인을 배제해야 해서 더 어렵다고만 적고(p.1977), H2FPEF·HFA-PEFF 같은 점수 알고리듬이나 이완기 부하검사는 제시하지 않는다.
  kr_says: HFpEF 는 ①심부전 증상·징후 ②LVEF ≥50% ③좌심실 이완기능장애·충만압 상승에 맞는 구조·기능 이상의 객관적 증거(NT-proBNP·BNP 상승 포함) 셋을 모두 충족해야 한다. H2FPEF·HFA-PEFF 점수가 도움이 되며, HFA-PEFF 는 ≥5점이면 HFpEF, 2–4점이면 이완기 부하검사 또는 침습적 혈역학 평가(동율동 주요 기준 NT-proBNP >220 또는 BNP >80 pg/mL).
  kmle_rule: KMLE 문항·정리본은 HFpEF 진단에 세 기준(증상·징후 + LVEF ≥50% + 구조·기능 이상/NP 상승)과 H2FPEF·HFA-PEFF 점수를 적용한다.
  usmle_rule: USMLE 문항은 EF 보존 + 이완기능장애·충만압 상승 증거 + 비심장 원인 배제로 판단한다(점수 계산은 해리슨 범위 밖).
  verified: text
- id: diff.cardio.heart-failure.arni-first-line
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1995]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:219-220
  diff_type: first_line
  topic: HFrEF 의 첫 RAS 억제제 — ARNI 대 ACEI
  harrison_says: 지침은 ACEI·ARB 에 견디는 증상성 HFrEF 환자를 ARNI 로 바꾸도록 권하고, ACEI/ARB 를 써 본 적 없는 de novo 심부전에서 처음부터 ARNI 를 쓰는 것도 혈압이 충분하면 '적절할 수 있다(may also be appropriate)' 는 자료가 나오고 있다. 혈관부종 병력은 금기, ACEI 에서 바꿀 때 36시간 간격(p.1995).
  kr_says: HFrEF 에서 ARNI 를 표준 치료로 권고하고, 견디지 못하거나 쓸 수 없을 때 ACEI(Class I, LOE A), 둘 다 안 되면 ARB(Class I, LOE A). ACEI·ARB 로 안정적이어도 ARNI 로 교체(Class I, LOE B). 'ARNI 는 현재 ACEI 보다 우선하는 1차 치료로 권고된다(Class I)', 급성 악화로 입원한 신규 진단·ACEI/ARB 미사용 환자에도 1차로 쓸 수 있다. ACEI 에서 바꿀 때 36시간 휴약(p.220).
  kmle_rule: KMLE 문항·정리본은 HFrEF 의 RAS 억제제 1차를 ARNI 로 하고, ACEI 는 ARNI 를 못 쓸 때, ARB 는 둘 다 못 쓸 때로 적용한다.
  usmle_rule: USMLE 문항은 ACEI/ARB 를 견디는 증상성 HFrEF 에서 ARNI 로의 교체를 정답으로 하고, ACEI 에서 바꿀 때 36시간 휴약을 적용한다.
  verified: text
- id: diff.cardio.heart-failure.gdmt-pillars-sequence
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1994]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:218-220
  diff_type: same
  topic: HFrEF 네 기둥 약제와 시작 순서
  harrison_says: RAAS 차단제(ARNI 포함)·베타차단제·SGLT2 억제제가 약물치료의 기둥이고(p.1992), 지침은 SGLT2 억제제를 ARNI·베타차단제·MRA 와 함께 기초 치료로 본다(p.1996). 베타차단제와 ACEI 중 무엇을 먼저 시작할지는 CIBIS III 에서 결과 차이가 없어 '어느 것을 먼저 시작하는지는 별로 중요하지 않고' 둘 다 제때 목표 용량까지 올리는 것이 중요하다(p.1994). 베타차단제는 carvedilol·bisoprolol·metoprolol succinate 로 한정.
  kr_says: ARNI 또는 ACEI(불내성 시 ARB)·베타차단제·MRA·SGLT2 억제제가 HFrEF 의 표준 치료(Class I, LOE A, p.218). Figure 1 은 네 약을 나란히 두고 목표·최대 내약 용량까지 점차 증량한다. 고용량 ACEI·ARB 가 꼭 필요하지 않으며 저용량 ACEI 중이라도 베타차단제를 빨리 더하라고 권한다(p.220). 사망률 감소가 입증된 베타차단제는 bisoprolol·carvedilol·metoprolol 서방정(Class I, LOE A), 70세 이상 nebivolol(Class IIa).
  kmle_rule: KMLE 문항·정리본은 네 약제를 모두 쓰는 것을 표준으로 하고, 고정된 시작 순서를 정답 근거로 삼지 않는다(두 출처 같음).
  usmle_rule: USMLE 문항도 네 기둥 병용과 생존 이득이 입증된 세 베타차단제만 쓰는 것을 적용하며, 시작 순서는 묻지 않는다.
  verified: text
- id: diff.cardio.heart-failure.hfmref-hfpef-treatment
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1987]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:223-224
  diff_type: algorithm
  topic: HFmrEF·HFpEF 의 약물 치료와 권고 등급
  harrison_says: HFpEF 에서 사망률을 확실히 낮춘 약은 없고, MRA·ARB·ARNI 의 입원 감소 효과는 주로 LVEF <0.60 에 국한돼 많은 이가 HFmrEF 를 HFrEF 와 같은 약으로 치료하자고 권한다. SGLT2 억제제 시험이 HFmrEF·HFpEF 에서 심혈관 사망·입원 감소를 뒷받침하고, ARNI·GLP-1 작용제(비만)는 일부 HFpEF 에서 이득 가능(p.1987). 미국·유럽 지침은 SGLT2 억제제를 EF 와 무관한 기초 치료로 받아들였다(p.1988). spironolactone 은 TOPCAT 기준 HFpEF 에 약한 권고(p.1988).
  kr_says: 'HFmrEF·HFpEF 를 한 묶음으로: 동반질환 선별·치료(Class I, LOE C), 울혈 시 이뇨제(Class I, LOE C), SGLT2 억제제(empagliflozin·dapagliflozin) 당뇨 유무와 무관하게(Class I, LOE B), ARNI(Class IIa, LOE B), MRA(Class IIa, LOE C), ARB·ACEI(Class IIb, LOE C), 베타차단제(Class IIb, LOE C).'
  kmle_rule: KMLE 문항·정리본은 HFmrEF·HFpEF 의 예후 개선 약 1차를 SGLT2 억제제(Class I)로 하고, ARNI·MRA 는 IIa, ACEI/ARB·베타차단제는 IIb 로 적용한다.
  usmle_rule: USMLE 문항은 HFpEF 에서 SGLT2 억제제 + 울혈 시 이뇨제 + 동반질환(고혈압·AF·비만) 조절을 정답으로 하고, 사망률을 낮춘다고 입증된 약이 없음을 적용한다.
  verified: text
- id: diff.cardio.heart-failure.icd-primary-prevention
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1999]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:225
  diff_type: threshold
  topic: 1차 예방 ICD 의 EF 기준과 원인별 등급
  harrison_says: NYHA II–III 이고 LVEF <35% 이면 원인과 무관하게 예방적 ICD 대상이고, 심근경색 후 최적 치료에도 LVEF ≤30% 이면 증상이 없어도 ICD 가 적절하다. 비허혈성(DANISH)에서는 장기 사망 감소가 유의하지 않았고 60세 미만에서 이득. 심근경색 40일 이내 이식은 이득 없음(2차 예방 제외). 기대여명 <6개월·이식 비대상 NYHA IV 는 신중히(p.1999).
  kr_says: 허혈성 NYHA II–III, ≥3개월 GDMT 후 LVEF ≤35%, 1년 넘는 생존 기대 시 ICD 권고(Class I, LOE A). 비허혈성은 같은 조건에서 '합리적'(Class IIa, LOE A). 심근경색 40일 이내 ICD 는 권고하지 않음(Class III, LOE A). 약물에 반응 없는 NYHA IV 는 CRT·VAD·이식 후보가 아니면 권고하지 않음(Class III, LOE C).
  kmle_rule: KMLE 문항·정리본은 ≥3개월 GDMT 후 LVEF ≤35% · NYHA II–III · 1년 넘는 생존 기대를 ICD 기준으로 하고, 허혈성 Class I · 비허혈성 Class IIa 로 구분한다.
  usmle_rule: USMLE 문항은 최적 약물치료 후 LVEF ≤35% · NYHA II–III 을 원인과 무관하게 ICD 대상으로 하고, 심근경색 후 LVEF ≤30% 는 무증상이어도 ICD, 심근경색 40일 이내는 제외를 적용한다.
  verified: text
- id: diff.cardio.heart-failure.crt-qrs-criteria
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1999]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:226
  diff_type: threshold
  topic: CRT 의 QRS 폭·LBBB 기준
  harrison_says: 경증 증상 HFrEF 에서 CRT 이득은 대부분 QRS >149 ms 이고 LBBB 모양인 환자에서 나온다. RBBB 우세·AF·측벽 흉터·ADHF 에서는 이득이 불확실하고, 좁은 QRS 의 비동기는 좋은 표적이 아니다(p.1999). 130–149 ms 구간별 등급은 제시하지 않는다.
  kr_says: 'Figure 2(동율동, GDMT 에도 증상 지속): LBBB & LVEF ≤35% 에서 QRS ≥150 ms Class I (LOE A), 130–149 ms ''Class II'' (LOE B); non-LBBB & LVEF ≤35% 에서 QRS ≥150 ms Class IIa (LOE B), 130–149 ms Class IIb (LOE B). AF 에서 LVEF ≤35% · QRS ≥130 ms Class IIb. 방실차단으로 심실조율 ≥20% 예상되는 LVEF <40% 는 Class I (LOE A).'
  kmle_rule: KMLE 문항·정리본은 동율동 · LBBB · QRS ≥150 ms · LVEF ≤35% · GDMT 에도 증상 지속을 CRT Class I 로 적용하고, 130–149 ms 와 non-LBBB 는 낮은 등급으로 본다.
  usmle_rule: USMLE 문항은 LVEF ≤35% 에 QRS ≥150 ms LBBB 를 CRT 의 가장 확실한 대상으로 적용한다.
  verified: text
- id: diff.cardio.heart-failure.iron-deficiency
  slot: h258
  h22_chapter: 265
  h22_cite: '[[harrison-22: 265장 p.1998]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 3 Korean Circ J 2023;53:437
  diff_type: algorithm
  topic: 심부전 철 결핍의 정의와 정맥 철분 치료 근거
  harrison_says: CONFIRM-HF 의 철 결핍 정의는 ferritin <100 ng/mL, 또는 100–300 ng/mL 이면서 transferrin saturation <20%. ferric carboxymaltose 는 기능·증상·QOL 을 개선하나 장기 임상 결과 이득은 분명하지 않다 — AFFIRM-AHF(LVEF <50%)·IRONMAN 은 경계선, HEART-FID(LVEF ≤40%)는 1차 복합 결과 이득 없음. 이득은 증상, 아마도 입원 감소에 한정. 경구 철분은 효과 없고, 조혈 자극제(darbepoetin, RED-HF)는 실망스러운 결과(p.1998).
  kr_says: 절대 철 결핍 ferritin <100 ng/mL, 기능적 철 결핍 ferritin 100–299 ng/mL 이면서 TSAT <20%. 철 결핍성 빈혈 심부전에 정맥 철분(ferric carboxymaltose) 합리적(Class IIa, LOE A). LVEF <50% 이고 최근 급성 심부전으로 입원한 철 결핍 환자에 정맥 철분이 심부전 입원 감소에 도움(Class IIa, LOE B). 원인 미상 빈혈에 조혈 자극제 권고 안 함(Class III, LOE B).
  kmle_rule: KMLE 문항·정리본은 ferritin <100 또는 100–299 ng/mL + TSAT <20% 를 철 결핍으로 정의하고, 정맥 ferric carboxymaltose(Class IIa)를 적용하며 조혈 자극제는 쓰지 않는다.
  usmle_rule: USMLE 문항은 같은 정의로 철 결핍을 찾아 경구가 아닌 정맥 철분으로 증상·기능 개선을 노리고, 사망률 감소를 근거로 들지 않는다.
  verified: text
- id: diff.cardio.acs.p2y12-choice
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2112]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:783-784
  diff_type: first_line
  topic: DAPT 의 P2Y12 억제제 선택 — 강력 P2Y12 우선 여부
  harrison_says: 퇴원 뒤 권고 항혈소판 요법은 저용량(75–100 mg/d) 아스피린 + P2Y12 억제제이고 'prasugrel or ticagrelor is favored over clopidogrel', 출혈 위험이 높지 않으면 12개월(p.2112). prasugrel·ticagrelor 는 clopidogrel 보다 허혈 사건을 더 줄이지만 둘 다 출혈을 늘린다(p.2110).
  kr_says: 권고문은 'aspirin and P2Y12 receptor inhibitor' 12개월 DAPT(Strong, Moderate)이며 어느 P2Y12 억제제를 먼저 쓸지는 정하지 않는다(Table 6 p.783). 동아시아인(한국인 포함)은 허혈 위험보다 출혈 위험이 상대적으로 높고 prasugrel·ticagrelor 사용 증가로 출혈 위험이 커진다고 적는다(p.784).
  kmle_rule: KMLE 문항·정리본은 '아스피린 + P2Y12 억제제 12개월' 을 정답으로 두고, 강력 P2Y12 를 반드시 골라야 하는 보기 구도를 만들지 않는다(한국 지침은 약제 우선순위를 정하지 않음).
  usmle_rule: USMLE 문항은 출혈 고위험이 아니면 aspirin + prasugrel 또는 ticagrelor(clopidogrel 보다 우선)를 적용한다.
  verified: text
- id: diff.cardio.acs.dapt-12-months
  slot: h275
  h22_chapter: 286
  h22_cite: '[[harrison-22: 286장 p.2126]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:783
  diff_type: same
  topic: ACS 뒤 DAPT 기본 기간 12개월
  harrison_says: STEMI 뒤 아스피린 + P2Y12 길항제(clopidogrel·prasugrel·ticagrelor) DAPT 를 출혈 고위험이나 출혈 합병증이 없으면 12개월 권고(p.2126). NSTE-ACS 도 장기 항응고 적응증이 없으면 'preferably for 12 months'(285장 p.2110).
  kr_says: ACS 환자에서 허혈 사건 예방을 위해 아스피린 + P2Y12 억제제 DAPT 를 12개월 권고(Strong, LOE Moderate). 3–6개월 DAPT 뒤 아스피린 단독과 비교한 메타분석에서 12개월 DAPT 는 사건 차이 없이 전체 출혈만 38% 늘었다(p.782) — 그래도 12개월 DAPT 의 이득이 출혈 위험보다 크다고 판단(p.783).
  kmle_rule: KMLE 문항·정리본은 ACS 뒤 기본 DAPT 기간 12개월을 적용한다(두 출처 같음).
  usmle_rule: USMLE 문항은 출혈 고위험이 아니면 DAPT 12개월을 적용한다.
  verified: text
- id: diff.cardio.acs.dapt-de-escalation
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2112]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:783-785
  diff_type: algorithm
  topic: DAPT 단계적 감량(de-escalation) 대상·시점
  harrison_says: 항응고 중이 아닌 출혈 고위험·허혈 저위험 환자에서 3–6개월 DAPT 뒤 아스피린을 끊고 P2Y12 단독, 또는 아스피린은 유지하며 '3 months' 에 prasugrel·ticagrelor → clopidogrel 로 전환. 'De-escalation of DAPT is not recommended in the first 30 days following ACS'(p.2112).
  kr_says: 사건 없는 ACS 환자에서 발병 1–3개월 뒤 DAPT 감량을 고려할 수 있다(Weak, Moderate). 방법 셋 — ① 강력 P2Y12 → clopidogrel 전환 ② prasugrel 10 → 5 mg ③ 아스피린 조기 중단 + P2Y12 단독. P2Y12 조기 중단 후 아스피린 단독은 감량에 포함하지 않는다(Table 6 p.783). 출혈 고위험 여부와 무관하게 사건 없는 환자 대상이며, 근거에는 1개월 뒤 무유도 전환(TALOS-AMI)·1개월 뒤 prasugrel 감량(HOST-REDUCE-POLYTECH ACS) 같은 한국 RCT 가 들어 있다(p.785).
  kmle_rule: KMLE 문항·정리본은 사건 없는 ACS 환자의 1–3개월 뒤 감량(세 방법 중 하나)을 '고려 가능' 으로 두고, P2Y12 를 끊고 아스피린만 남기는 보기는 오답으로 본다.
  usmle_rule: USMLE 문항은 출혈 고위험·허혈 저위험 환자에 한해 감량하고, 첫 30일 안의 감량은 오답으로 본다.
  verified: text
- id: diff.cardio.acs.prasugrel-dose
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2110]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:783-785
  diff_type: algorithm
  topic: prasugrel 유지 용량 — 10 mg 와 5 mg 감량
  harrison_says: prasugrel 은 PCI 가 예정된 ACS 에서 관상동맥 해부를 안 뒤 부하 60 mg, 이어 10 mg/d. 뇌졸중·TIA 병력이나 출혈 고위험이면 금기(p.2110). 5 mg 감량 전략은 언급하지 않는다.
  kr_says: DAPT 감량 방법의 하나로 'Reducing the dose of prasugrel from 10 mg to 5 mg'(Table 6 p.783, Figure 4 p.784; Weak, Moderate). 근거는 1개월 뒤 무유도로 10 → 5 mg 로 줄인 한국 HOST-REDUCE-POLYTECH ACS 시험(p.785). 동아시아인 시작 용량 자체를 따로 정하지는 않는다.
  kmle_rule: KMLE 문항·정리본은 사건 없는 ACS 환자에서 1–3개월 뒤 prasugrel 10 → 5 mg 감량을 허용되는 감량 방법으로 본다.
  usmle_rule: USMLE 문항은 prasugrel 60 mg 부하 → 10 mg/d 와 뇌졸중·TIA 병력 금기를 적용한다.
  verified: text
- id: diff.cardio.acs.extended-dapt-high-ischemic-risk
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2111]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:783
  diff_type: threshold
  topic: 12개월 넘는 DAPT 연장 — 허혈 고위험·출혈 고위험 정의
  harrison_says: 12개월 넘는 DAPT 는 좌주간부·근위 LAD·근위 분지 스텐트, 재발 MI, 스텐트 혈전증 같은 고위험에서 선호(p.2111). 이전 MI·당뇨·정맥 이식편·심부전 등 허혈 고위험이면서 출혈 저위험이면 최대 3년 DAPT 가 이롭고, ticagrelor 는 1년 뒤 60 mg bid 로 줄인다(p.2112). 출혈 고위험의 점수 기준은 제시하지 않는다.
  kr_says: 허혈 고위험·출혈 저위험 ACS 에서 12개월 넘는 DAPT 연장을 고려할 수 있다(Weak, Moderate). 허혈 고위험 = 나이 ≥65세·당뇨·MI 재발·다혈관 질환·만성 콩팥병. 출혈 고위험 = PRECISE-DAPT 점수 ≥25 또는 ARC-HBR 기준 충족(Table 6 p.783).
  kmle_rule: KMLE 문항·정리본은 허혈 고위험(≥65세·당뇨·MI 재발·다혈관·CKD)이면서 출혈 저위험일 때만 DAPT 연장을 '고려' 로 두고, 출혈 고위험은 PRECISE-DAPT ≥25 또는 ARC-HBR 로 판단한다.
  usmle_rule: USMLE 문항은 이전 MI·당뇨·복잡 스텐트 등 허혈 고위험 + 출혈 저위험에서 DAPT 연장(ticagrelor 60 mg bid)을 적용한다.
  verified: text
- id: diff.cardio.acs.after-12-months-monotherapy
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2112]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:784
  diff_type: first_line
  topic: 12개월 뒤 단일 항혈소판제 — 아스피린 또는 clopidogrel
  harrison_says: 12개월 뒤에는 'antiplatelet monotherapy with a single antiplatelet' 를 이어 간다. 장기 완전 용량 항응고 적응증이 있으면 항혈소판제 없이 항응고제만 장기간(p.2112). 단일제의 종류는 정하지 않는다.
  kr_says: '기본 전략 도표: 첫 12개월 DAPT(아스피린 + P2Y12 억제제), ''Beyond the first 12 months – Aspirin or clopidogrel monotherapy''(Figure 4 p.784).'
  kmle_rule: KMLE 문항·정리본은 12개월 뒤 단일 항혈소판제로 아스피린 또는 clopidogrel 을 모두 정답으로 인정한다.
  usmle_rule: USMLE 문항은 12개월 뒤 단일 항혈소판제(보통 아스피린) 유지를 적용한다.
  verified: text
- id: diff.cardio.acs.ldl-target
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2112]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:773
  diff_type: same
  topic: ACS 뒤 고강도 스타틴과 LDL-C 목표
  harrison_says: PCI 전 조기 고강도 스타틴(atorvastatin 80 mg/d·rosuvastatin 40 mg/d)을 시작해 이어 간다(p.2110). 장기 관리 목표 'LDL-C <55 mg/dL'(p.2112). 최대 내약 스타틴에 반응이 부족하면(LDL-C 감소 <50%) ezetimibe 10 mg·PCSK9 억제제 추가(p.2110).
  kr_says: ACS 환자에게 고강도 스타틴 권고(Strong, LOE Low), 입원 초기 조기 투여. 'LDL-C levels are reduced to below 55 mg/dL and by at least 50% from the baseline' 을 확인한다(Table 3 p.773).
  kmle_rule: KMLE 문항·정리본은 ACS 뒤 고강도 스타틴과 LDL-C <55 mg/dL 및 기저치 대비 ≥50% 감소를 함께 목표로 적용한다(두 출처 같음).
  usmle_rule: USMLE 문항은 고강도 스타틴과 LDL-C <55 mg/dL 목표를 적용한다.
  verified: text
- id: diff.cardio.acs.nonstatin-add-on-stepwise
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2112]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:773-775
  diff_type: algorithm
  topic: 목표 미달 시 비스타틴 추가 순서(ezetimibe → PCSK9)
  harrison_says: 집중 지질 강하 = 고강도 스타틴, ezetimibe, 필요하면 PCSK9 억제제 또는 bempedoic acid 를 더해 LDL-C <55 mg/dL(p.2112). 재측정 시점이나 보험 기준은 없다.
  kr_says: '목표 LDL-C 미달이면 비스타틴 병용 권고(Strong, Low). 국내에서 쓸 수 있는 비스타틴은 ezetimibe·PCSK9 억제제(Table 3 p.773). 도표: 고강도 스타틴 → 1–2개월 뒤 목표 미달이면 ezetimibe 추가 → 다시 1–2개월 뒤 미달이면 PCSK9 억제제 추가. 국내 PCSK9 억제제 급여는 최대 내약 스타틴 + ezetimibe 뒤 LDL-C >70 mg/dL 일 때(Figure 1 p.775). 국내 심장내과 의사 52% 는 <55 mg/dL 목표에 동의하지 않았다(p.775).'
  kmle_rule: KMLE 문항·정리본은 고강도 스타틴 → 1–2개월 뒤 목표 미달 시 ezetimibe → 그래도 미달 시 PCSK9 억제제 순서를 적용한다(bempedoic acid 는 국내 선택지로 쓰지 않는다).
  usmle_rule: USMLE 문항은 고강도 스타틴에 ezetimibe, 필요하면 PCSK9 억제제(또는 bempedoic acid)를 더하는 순서를 적용한다.
  verified: text
- id: diff.cardio.acs.ace-inhibitor-indication
  slot: h275
  h22_chapter: 286
  h22_cite: '[[harrison-22: 286장 p.2121]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:777-778
  diff_type: threshold
  topic: ACS 뒤 ACE 억제제·ARB 적응증
  harrison_says: ACE 억제제는 STEMI 뒤 사망을 줄이고 고위험(전벽·이전 경색·전반적 LV 기능 저하)에서 이득이 가장 크지만, 혈역학적으로 안정된 모든 STEMI(수축기 >100 mmHg)에 선택 없이 써도 단기 이득이 있다(p.2121). 임상 심부전·LV 기능 저하·큰 국소 벽운동 이상·고혈압이면 무기한 지속. ARB 는 ACE 억제제 불내성 + 심부전 징후일 때(p.2122).
  kr_says: LVEF ≤40% 또는 심부전이 있는 ACS 에 ACE 억제제 권고(Strong, Moderate). LVEF >40% 는 고려 가능(Weak, Low). ARB 는 LVEF ≤40%·심부전에서 ACE 억제제 대안으로 고려(Weak, Low). 사용 전 LVEF 측정 권고(Table 4 p.777). 동아시아인의 ACE 억제제 마른기침 상대위험 2.7배라 한국인에게 ARB 대체를 고려할 수 있다(p.778).
  kmle_rule: KMLE 문항·정리본은 LVEF ≤40% 또는 심부전이면 ACE 억제제(강한 권고), LVEF >40% 는 '고려' 로 두고, 마른기침이면 ARB 로 바꾼다.
  usmle_rule: USMLE 문항은 혈역학적으로 안정된(SBP >100) STEMI 에 ACE 억제제를 시작하고, 불내성 + 심부전이면 ARB 를 적용한다.
  verified: text
- id: diff.cardio.acs.mra-indication
  slot: h275
  h22_chapter: 286
  h22_cite: '[[harrison-22: 286장 p.2122]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:777-779
  diff_type: threshold
  topic: MI 뒤 MRA 추가 기준
  harrison_says: 장기 MRA(spironolactone·eplerenone)는 치료 용량 ACE 억제제를 이미 쓰고, LVEF ≤40% 이며, 증상성 심부전 또는 당뇨가 있고, 크레아티닌(남 ≥2.5·여 ≥2.0 mg/dL)·칼륨(≥5.0 mEq/L) 금기가 없는 STEMI 에 처방(p.2122).
  kr_says: 심부전이 있는 ACS 에 MRA 추가 권고(Strong, LOE High). 특히 LVEF ≤40% 에서 권고하되 LVEF 기준은 권고문이 아니라 임상 고려사항으로 내렸다. 기저 칼륨 상승·신기능 저하는 신중히(Table 4 p.777; LVEF 삭제 이유 p.779). 당뇨는 기준에 없다.
  kmle_rule: KMLE 문항·정리본은 '심부전이 있는 ACS' 를 MRA 추가 적응증으로 두고(특히 LVEF ≤40%), 고칼륨·신기능 저하를 금기 판단 단서로 쓴다.
  usmle_rule: USMLE 문항은 ACE 억제제 사용 중 LVEF ≤40% + 증상성 심부전 또는 당뇨, Cr·K 기준 충족 시 eplerenone/spironolactone 을 적용한다.
  verified: text
- id: diff.cardio.acs.beta-blocker-preserved-ef
  slot: h275
  h22_chapter: 286
  h22_cite: '[[harrison-22: 286장 p.2121]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:780-781
  diff_type: threshold
  topic: ACS 뒤 경구 베타차단제 — 박출률 보존 환자
  harrison_says: STEMI 뒤 경구 베타차단제는 금기(심부전·심한 LV 기능 저하·심차단·기립성 저혈압·천식)가 아니면 대부분에 유용하고, 예후가 아주 좋은 환자(연 사망 <1%, <55세, 이전 MI 없음, 정상 심실 기능 등)는 이득이 적을 수 있다(p.2121). 급성 심부전·저박출·쇼크 위험이 없으면 첫 24시간 안에 경구 시작(p.2118).
  kr_says: LVEF ≤40% ACS 에 경구 베타차단제 권고(Strong, Moderate). 박출률 보존·심부전 근거 없는 ACS 는 고려 가능(Weak, Very Low). 금기 — 급성 심부전 징후(폐부종)·쇼크 저혈압·서맥·반응성 기도 질환. 사용 전 LVEF 측정 권고(Table 5 p.781). 박출률 보존 환자의 사용·기간 근거는 아직 결론이 없다(p.780).
  kmle_rule: KMLE 문항·정리본은 LVEF ≤40% 면 경구 베타차단제(강한 권고), 박출률 보존·심부전 없음은 '고려' 로 두고, 폐부종·쇼크·서맥·반응성 기도 질환을 금기로 쓴다.
  usmle_rule: USMLE 문항은 금기가 없으면 STEMI 뒤 24시간 안 경구 베타차단제를 대부분 환자에게 적용한다.
  verified: text
- id: diff.cardio.acs.oac-antithrombotic
  slot: h274
  h22_chapter: 285
  h22_cite: '[[harrison-22: 285장 p.2111]]'
  kr_guideline_id: kr-ksc-acs
  kr_cite: 2024 대한심근경색증학회·한국보건의료연구원 급성관상동맥증후군 약물치료 지침 Korean Circ J 2024;54:783,788
  diff_type: algorithm
  topic: 경구 항응고 적응증이 있는 ACS — 삼제 → 이제 요법
  harrison_says: 경구 항응고 중인 AF 환자가 PCI 를 받으면 아스피린을 퇴원 뒤 또는 늦어도 PCI 1개월에 끊고 P2Y12 억제제 + DOAC 를 1년, 이후 대부분 항응고제 단독(p.2111). 같은 장 p.2112 는 아스피린을 퇴원 시 또는 1주에 끊고 항응고제 + clopidogrel 을 12개월까지 이어 간다고 적는다.
  kr_says: 장기 경구 항응고 적응증이 있는 출혈 고위험 ACS 에 이제 요법(NOAC + P2Y12 억제제)을 우선 고려할 수 있다(Weak, Very Low) — 삼제(warfarin + P2Y12 + 아스피린)보다 출혈을 줄인다(Table 6 p.783). 아스피린 중단 시점은 권고하지 않고 ESC 2023 의 1주 뒤 이제 전환(Class I)을 소개만 한다(p.788).
  kmle_rule: KMLE 문항·정리본은 항응고 적응증이 있는 ACS 에서 삼제보다 NOAC + P2Y12 억제제 이제 요법을 고르고, 아스피린 중단의 정확한 날짜를 묻지 않는다.
  usmle_rule: USMLE 문항은 아스피린을 퇴원 시(늦어도 1주~1개월)에 끊고 DOAC + clopidogrel 을 12개월, 이후 항응고제 단독을 적용한다.
  verified: text
- id: diff.cardio.vte.postop-prophylaxis-risk-tiers
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2164]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 한국 정맥혈전 예방 권고안 제2판(한국혈전지혈학회, 2013) p.17–18, p.21–22
  diff_type: algorithm
  topic: 수술 후 VTE 예방 — 위험 단계별 기계적 vs 약물 예방
  harrison_says: 'Table 290-7: 고위험 비정형외과 수술은 UFH 5000 U SC bid/tid · enoxaparin 40 mg 매일 · dalteparin 2500/5000 U 매일. 기계적 예방(간헐적 공기 압박 · 압박 스타킹)은 ''Anticoagulation contraindicated'' 칸에만 놓인다. ''Low-dose UFH or LMWH is the most common form of in-hospital prophylaxis.'''
  kr_says: '건강보험심사평가원 증상성 VTE 발생률로 4단계 — 최저위험(0–0.5%) · 저위험(0.5–1.5%) · 중위험(1.5–3.0%) · 고위험(>3%)(p.17). 표 1-6: 최저위험 = 조기보행 · 적극적 운동, 저위험 = 압박 스타킹 혹은 간헐적 공기 압박법, 중위험 = 기계적 예방 또는 LMWH · UFH 등, 고위험 = 항응고 약물(p.18). 권고: 최저위험군 ''적극적인 예방 방법은 권고되지 않는다(2B)'', 저위험군 ''비약물적 예방 방법이 권고되며 약물요법은 권고되지 않는다(2B)'', 고위험군은 항응고요법을 적극 추천하고 ''간헐적 공기 압박법 등과 같은 비약물요법의 단독 사용은 권고되지 않는다(2B)''(p.21–22).'
  kmle_rule: KMLE 문항·정리본은 국내 4단계 기준을 적용한다 — 저위험 수술은 기계적 예방만(약물 ✗), 중위험은 기계적 또는 약물, 고위험은 항응고 약물(기계적 단독 ✗).
  usmle_rule: USMLE 문항은 Harrison Table 290-7 기준을 적용한다 — 입원·고위험 수술 환자는 저용량 UFH 또는 LMWH, 기계적 예방은 항응고 금기일 때.
  verified: text
- id: diff.cardio.vte.korean-lower-incidence-major-ortho
  slot: h117
  h22_chapter: 122
  h22_cite: '[[harrison-22: 122장 p.940]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 한국 정맥혈전 예방 권고안 제2판(한국혈전지혈학회, 2013) p.2, p.17
  diff_type: threshold
  topic: 한국인 VTE 발생률 — 고관절·슬관절 치환술 위험 단계
  harrison_says: '''Significant risk is incurred by major orthopedic, abdominal, or neurologic surgeries.'' 일반 인구 발생: ''DVT or pulmonary embolism (PE) occurs in ∼1–2 individuals per 1000 each year''(p.939).'
  kr_says: '''한국인에서의 고관절 수술 후 VTE 발생빈도는 8.7-10.4%로 서양의 50-60%에 비해 낮다… 증상을 동반한 경우 역시 0-0.9%로 1-2%의 서양의 자료에 비해 낮다. 따라서 한국인에서의 고관절 수술의 VTE 예방위험 정도는 서양인 보다 적어도 한 단계 낮다''(p.2). 표 1-5 에서 고관절·슬관절 전치환술·골반골절수술은 ''중위험'', 고령·전신마취·혈전증 기왕력·암 등이 동반되어야 ''고위험''(p.17).'
  kmle_rule: KMLE 문항·정리본은 한국인 VTE 위험을 서양보다 한 단계 낮게 본다 — TKA/THA 단독은 중위험(기계적 또는 약물 예방), 추가 위험인자가 있어야 고위험.
  usmle_rule: USMLE 문항은 major orthopedic surgery 를 significant(고위험) VTE 위험으로 보고 약물 예방을 기본으로 한다.
  verified: text
- id: diff.cardio.vte.major-ortho-prophylaxis-options
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2164]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 한국 정맥혈전 예방 권고안 제2판(한국혈전지혈학회, 2013) p.52–53
  diff_type: first_line
  topic: 주요 정형외과 수술 예방 — 약제 선택과 기계적 예방의 자리
  harrison_says: 'Table 290-7 Major orthopedic surgery: Aspirin 81 mg twice daily · Rivaroxaban 10 mg daily(수술 후 6–10시간) · Dabigatran 110 mg 첫날 후 220 mg · Apixaban 2.5 mg bid(12–24시간) · Warfarin(INR 2.0) · Enoxaparin 40 mg · Dalteparin · Fondaparinux 2.5 mg. 기계적 예방은 ''Anticoagulation contraindicated'' 칸.'
  kr_says: '''주요 정형외과 수술을 시행받는 환자에서 최소 10-14일 간의 아래와 같은 예방 방법을 권고한다(Grade 2A). TKA/THA: LMWH; 폰다파리눅스; Dabigatran, apixaban, 리바록사반; 저용량 UFH; 와파린; 아스피린; 또는 기계적 압박요법*''(*출혈 위험이 높은 경우). ''고령, 전신마취, 이전의 혈전증의 기왕력, 암과 같은 추가적인 혈전 발생의 위험인자가 있는 경우는 LMWH; 폰다파리눅스; dabigatran, apixaban, 리바록사반; 저용량 UFH; 와파린 등을 사용할 것을 권고한다(Grade 2B)''(p.53). 본문: 한국은 수술 후 VTE 유병률이 낮아 출혈 합병증을 ''서양보다 좀 더 강조'', 아스피린은 고위험인자가 없는 환자에서 고려(p.52).'
  kmle_rule: KMLE 문항·정리본은 TKA/THA 예방을 최소 10–14일, 추가 위험인자가 없으면 아스피린도 선택지, 추가 위험인자(고령·전신마취·VTE 기왕력·암)가 있으면 항응고 약물로 쓴다.
  usmle_rule: USMLE 문항은 Harrison Table 290-7 의 약제(아스피린 81 mg bid · DOAC · LMWH 등)를 쓰고 기계적 예방은 항응고 금기일 때로 둔다.
  verified: text
- id: diff.cardio.vte.medical-inpatient-prophylaxis
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2164]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 한국 정맥혈전 예방 권고안 제2판(한국혈전지혈학회, 2013) p.77
  diff_type: algorithm
  topic: 내과 입원 환자 예방 — 일률적 약물 예방 여부
  harrison_says: 'Table 290-7: ''Medically ill patients, especially if immobilized, with a history of prior VTE, with an indwelling central venous catheter, or with cancer (but without active gastroduodenal ulcer, major bleeding within 3 months, or platelet count <50,000)'' → UFH 5000 U bid/tid · enoxaparin 40 mg · dalteparin · fondaparinux 2.5 mg.'
  kr_says: '''한국인에 대한 약물적 예방 방법에 동반하는 출혈성 합병증의 빈도가 확실하지 않은 현 시점에서는 우리보다 VTE 발생빈도가 훨씬 높은 서구의 권고안에 따라 일률적으로 약물적 예방 방법의 사용을 권장하는 것은 바람직하지 않다… 서양에서의 권고안보다 한 단계 강도를 낮춘 VTE 예방 권고안이 바람직할 것으로 생각된다.'' 권고: 울혈성 심부전 · 심근경색 · 뇌경색 · 침상안정이 필요한 전이암 · VTE 병력 등 위험인자 ≥1 → 출혈 위험 평가 후 적극적 예방(2C); VTE·혈전호발소인 기왕력이 있는 전이암은 출혈 위험이 없는 한 약물적 예방(2A).'
  kmle_rule: KMLE 문항·정리본은 내과 입원 환자에서 위험인자와 출혈 위험을 평가한 뒤 예방법을 고르고, 서양 기준보다 한 단계 낮은 강도로 본다(일률적 약물 예방 ✗).
  usmle_rule: USMLE 문항은 부동·VTE 병력·중심정맥관·암이 있는 내과 입원 환자에 출혈 금기가 없으면 저용량 UFH·LMWH·fondaparinux 를 쓴다.
  verified: text
- id: diff.cardio.vte.provoked-terminology
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2163]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:7, 9
  diff_type: terminology
  topic: 유발(provoked) / 비유발(unprovoked) 구분
  harrison_says: '''We should no longer classify VTE as "provoked" or "unprovoked," given that many types of provoked VTE have a similar recurrence rate to unprovoked VTE once anticoagulation is discontinued.'' Table 290-5(ESC 2019): provoked/unprovoked 용어는 더 이상 지지되지 않는다. Table 290-6: 재발 위험 저(<3%/년, major surgery/trauma) · 중(3–8%, minor surgery·입원 내과 질환·임신/에스트로겐·장거리 비행·IBD·자가면역·''No identifiable risk factor (formerly called "unprovoked")'') · 고(>8%, active cancer · APS).'
  kr_says: provoked/unprovoked 구분을 그대로 쓴다 — 'the general anticoagulant treatment period for postoperative VTE is 3 months because of the low risk of recurrence, but is prolonged to 6 months for unprovoked VTE'(p.7). 'Recommendations for the treatment of provoked proximal DVT includes 3 months of anticoagulant therapy. In patients with an unprovoked proximal DVT, extended anticoagulant therapy (at least 3 months and potentially indefinite) is preferred'(p.9).
  kmle_rule: KMLE 문항·정리본은 국내 권고의 유발/비유발(provoked/unprovoked) 구분으로 치료 기간을 판단한다.
  usmle_rule: USMLE 문항은 Harrison(ESC 2019)처럼 재발 위험 범주(저·중·고)와 위험인자 종류로 판단하고 provoked/unprovoked 를 결정 근거로 쓰지 않는다.
  verified: text
- id: diff.cardio.vte.duration-minor-transient
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2163]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:7, 9
  diff_type: algorithm
  topic: 항응고 기간 — 비유발·경미한 일시적 위험인자
  harrison_says: 'Table 290-5: ''Extended oral anticoagulation without an end date should be considered for patients with a first episode of PE and: a. No identifiable risk factor b. A persistent risk factor c. A minor transient or reversible risk factor.'''
  kr_says: '수술 후 VTE 3개월, 비유발 VTE 6개월로 연장, 재발 고위험 일부에서 연장 치료 고려(p.7). PE: ''The recommended treatment duration for PE is usually 6 months but may range from 3 months in patients with a transient risk factor to indefinite in patients with ongoing major risk factors (e.g., cancer, recurrent unprovoked PE)''(p.9). 비유발 근위부 DVT는 연장 치료 선호, 출혈 고위험이면 3개월(p.9).'
  kmle_rule: KMLE 문항·정리본은 일시적 위험인자 VTE 3개월, PE 보통 6개월, 지속 위험인자(암·재발 비유발)는 무기한으로 쓴다.
  usmle_rule: USMLE 문항은 첫 PE 라도 위험인자 없음·지속 위험인자·경미한 일시적 위험인자이면 종료일 없는 연장 항응고를 고려한다(Harrison Table 290-5).
