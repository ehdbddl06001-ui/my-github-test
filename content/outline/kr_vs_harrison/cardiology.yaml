# 급성관상동맥증후군은 2024 대한심근경색증학회·한국보건의료연구원 약물치료 지침(대한심장학회 단독 ACS 지침은 없다).
# 정맥혈전색전증 국내 원문은 한국혈전지혈학회 예방 권고안 제2판(2013)과 대한혈액학회 치료 권고 개정(Blood Res 2021) — 둘 다 kr-ksth-vte 로 묶고 kr_cite 로 구분한다.
# 해리슨 288장 p.2147 당뇨병 목표 「<130/90」은 Doc 표기 그대로이며 인쇄본 오탈자 가능성이 있다(항목 usmle_rule 참고).
