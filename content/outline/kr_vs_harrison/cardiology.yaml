- id: diff.cardio.vte.cancer-associated-agent
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2163]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:10
  diff_type: first_line
  topic: 암 연관 VTE — 약제
  harrison_says: '''For patients with cancer and VTE, prescribe LMWH as monotherapy or a DOAC in the absence of a gastrointestinal cancer, and continue extended-duration anticoagulation until the patient is declared cancer-free. The National Comprehensive Cancer Network guidelines endorse treatment of VTE with apixaban or edoxaban.'''
  kr_says: '''LMWH was previously the standard treatment for CAT… Recently, a Korean phase IV study with rivaroxaban and 2 phase III trials comparing DOACs to LMWH in patients with CAT reported comparable efficacies with slightly increased bleeding risk for DOACs. Based on the results of these 2 randomized controlled trials, the latest guidelines included rivaroxaban and edoxaban as options for VTE treatment.'' 위장관암에서 DOAC 를 피하라는 구분은 없다. 시작을 막는 요인: 짧은 기대여명 · 심한 혈소판감소 등 출혈 고위험.'
  kmle_rule: KMLE 문항·정리본은 암 연관 VTE 에 LMWH 또는 rivaroxaban·edoxaban 을 선택지로 쓰고, DOAC 는 출혈이 약간 많다는 점을 단다.
  usmle_rule: USMLE 문항은 LMWH 또는 DOAC(위장관암이 아닐 때 — NCCN 은 apixaban·edoxaban)를 쓰고 암이 없어질 때까지 연장 항응고한다.
  verified: text
- id: diff.cardio.vte.isolated-distal-dvt
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2161]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:9 · 한국 정맥혈전 예방 권고안 제2판(한국혈전지혈학회, 2013) p.20
  diff_type: algorithm
  topic: 고립 원위부(종아리) DVT — 항응고 vs 연속 초음파 관찰
  harrison_says: ISOLATED CALF DVT 절은 권고 없이 GARFIELD-VTE 등록 결과만 적는다 — 'Almost all isolated calf DVT patients received anticoagulation, and nearly half were anticoagulated for at least 1 year.'
  kr_says: '2021: 증상이 없고 재발·진행 고위험 특징(부동 · 활동성 암 · 비유발)이 없으며 출혈 위험이 높으면 ''항응고 없이 하지 DVT 연속 선별검사로 관찰할 수 있다''; 급성 증상 · 고위험 특징이 있고 출혈 위험이 없으면 항응고 권고(p.9). 2013: 심한 증상과 혈전 진행 위험인자(D-dimer 양성 · 광범위 · 근위부 근접 · 가역적 유발인자 없음 · 악성종양 · VTE 과거력 · 입원)가 없으면 ''2주 동안 하지정맥초음파를 이용하여 … 정기적으로 관찰하는 것이 권고된다''(p.20).'
  kmle_rule: KMLE 문항·정리본은 증상·진행 위험인자가 없는 고립 원위부 DVT 에 2주 연속 초음파 관찰을 선택지로 두고, 증상·위험인자가 있으면 표준 항응고로 쓴다.
  usmle_rule: USMLE 문항은 Harrison 이 관찰 전략을 권고로 다루지 않으므로 고립 종아리 DVT 의 관찰 전략을 Harrison 근거로 출제하지 않는다(Harrison 은 대부분이 항응고를 받았다는 등록 자료만 제시).
  verified: text
- id: diff.cardio.vte.ivc-filter
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2163]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:8–9, 12 · 한국 정맥혈전 예방 권고안 제2판(한국혈전지혈학회, 2013) p.20
  diff_type: algorithm
  topic: 하대정맥 필터 적응증
  harrison_says: '''The two principal indications for insertion of an inferior vena cava filter are (1) active bleeding that precludes anticoagulation and (2) recurrent venous thrombosis despite intensive anticoagulation. Prevention of PE in patients who are not candidates for anticoagulation is a much "softer" indication… In most situations, place a retrievable rather than a permanent filter.'''
  kr_says: '2021: ''An inferior vena cava (IVC) filter can be considered in patients with DVT to prevent PE when anticoagulation is contraindicated (e.g., bleeding), but the general use of IVC filters or permanent indwelling hardware should be avoided''(p.8); 근위부 DVT 에서 활동성 출혈 · 혈소판 <50,000 · 이전 뇌내출혈이면 IVC 필터가 바람직(p.9). 항응고 중 재발(초기 실패)은 필터가 아니라 VKA·DOAC → LMWH 전환, LMWH 는 25–33% 증량(p.12). 2013: 특수한 경우를 제외하고 영구 유치형 필터 권고되지 않음, 회수 가능 필터 권고(p.20).'
  kmle_rule: KMLE 문항·정리본은 IVC 필터를 항응고 금기(출혈 등)에만 두고, 항응고 중 재발은 LMWH 전환·증량으로 처리한다. 영구 필터는 피한다.
  usmle_rule: USMLE 문항은 IVC 필터의 주 적응증을 항응고를 막는 활동성 출혈과 강화 항응고에도 재발한 VTE 두 가지로 보고, 회수형 필터를 쓴다.
  verified: text
- id: diff.cardio.vte.pregnancy-pe-diagnosis
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2159]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:11
  diff_type: algorithm
  topic: PE 진단 알고리즘 — 임신부 · D-dimer
  harrison_says: Wells 점수로 임상 가능성 → DVT 저가능성·PE 저-중가능성은 D-dimer 단독, 정상이면 영상 불필요; 고가능성은 D-dimer 건너뛰고 영상. D-dimer 는 '…the second or third trimester of pregnancy' 등에서 상승해 비특이적. 50세 초과 저·중간 가능성 PE 의심은 연령 보정 상한(나이 × 10 ng/mL). 임신용 진단 규칙(YEARS)은 언급하지 않는다.
  kr_says: 진단은 권고 범위 밖이라고 밝힌다('The diagnosis or prophylaxis of VTE is beyond the scope of our recommendation', p.7). 다만 임신부 PE 의심에는 'A recently published pregnancy-adapted YEARS algorithm for the diagnosis of suspected PE can be used to rule out PE safely; in a prospective study, 32–65% of patients avoided unnecessary CTPA scanning, with the highest efficiency during the 1st trimester (Fig. 2)'(p.11).
  kmle_rule: KMLE 문항·정리본은 임신부 PE 의심에서 pregnancy-adapted YEARS 알고리즘으로 CTPA 를 줄일 수 있다고 쓰고, 일반 성인 진단 알고리즘(Wells·D-dimer)은 국내 치료 권고 범위 밖이므로 Harrison 을 따른다.
  usmle_rule: USMLE 문항은 Wells → D-dimer(50세 초과 연령 보정) → 영상 순서를 쓰고, 임신 2·3삼분기 D-dimer 는 비특이적이라고 본다.
  verified: text
- id: diff.cardio.vte.pregnancy-anticoagulant
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2163]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:11
  diff_type: same
  topic: 임신·수유 중 항응고제 — DOAC 금지
  harrison_says: '''DOACs should not be prescribed during pregnancy or breastfeeding.'''
  kr_says: '''VKA is contraindicated due to the risk of fetal malformations. The safety of DOACs is not supported by the literature… LMWH is preferred over UFH in terms of convenience.'' 수유: ''UFH, LMWH, and VKA are considered safe anticoagulants, while DOACs are not yet recommended because of insufficient data.'''
  kmle_rule: KMLE 문항·정리본은 임신 중 VTE 를 LMWH 로 치료하고 DOAC 는 임신·수유 중 쓰지 않는다(국내 권고는 VKA 도 임신 중 금기).
  usmle_rule: USMLE 문항은 같은 기준 — 임신·수유 중 DOAC 는 쓰지 않는다.
  verified: text
- id: diff.cardio.vte.pe-thrombolysis-unstable
  slot: h279
  h22_chapter: 290
  h22_cite: '[[harrison-22: 290장 p.2164]]'
  kr_guideline_id: kr-ksth-vte
  kr_cite: 대한혈액학회 VTE 치료 권고 개정 Blood Res 2021;56:8–9
  diff_type: same
  topic: PE 혈전용해 — 혈역학적 불안정에 한정
  harrison_says: '''For massive PE, the U.S. Food and Drug Administration has approved systemically administered 100 mg of recombinant tissue plasminogen activator (tPA) (alteplase) prescribed as a continuous intravenous infusion over 2 h.'' ''For patients with submassive PE who have preserved systolic blood pressure but moderate or severe RV dysfunction, use of fibrinolysis remains controversial.'''
  kr_says: '''as the risk of bleeding increases, this method should be considered only in cases of hemodynamically unstable PE''(p.8). 불안정 PE 메타분석의 사망 감소는 ''mainly accounted for by studies including hemodynamically unstable patients''; 혈역학적으로 안정된 PE 는 항응고가 기본(p.9).'
  kmle_rule: KMLE 문항·정리본은 전신 혈전용해를 혈역학적으로 불안정한 PE 에만 쓴다.
  usmle_rule: USMLE 문항은 같은 기준 — massive(저혈압) PE 에 alteplase 100 mg 2시간, 정상 혈압 + RV 기능 저하(submassive)는 논란.
  verified: text
