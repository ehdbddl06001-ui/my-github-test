items:
- id: diff.cardio.hypertension.diagnostic-threshold
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2134]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.21–22
  diff_type: threshold
  topic: 고혈압 진단 역치(진료실 혈압)
  harrison_says: ACC/AHA 분류(Table 288-1)를 따른다 — Stage 1 hypertension 130–139 or 80–89 mmHg, Stage 2 hypertension ≥140 or ≥90 mmHg. 즉 진료실 혈압 130/80 mmHg 이상부터 고혈압이다. 두 번 이상 방문에서 두 번 이상 잰 평균으로 분류한다("average of two or more readings at two or more visits").
  kr_says: 수축기혈압 140 mmHg 이상 또는 이완기혈압 90 mmHg 이상을 '고혈압'으로 분류한다(표1). ACC/AHA 2017·2025 는 130/80 이상을 고혈압으로 정의하지만 ESH 2023·ESC 2024·JSH 2025 와 마찬가지로 2026 개정판도 140/90 기준을 그대로 유지하였다.
  kmle_rule: KMLE 문항·정리본은 진료실 혈압 140/90 mmHg 이상을 고혈압으로 진단한다(130–139/80–89 는 고혈압이 아니라 고혈압전단계).
  usmle_rule: USMLE 문항은 ACC/AHA 기준으로 130/80 mmHg 이상(Stage 1)부터 고혈압으로 본다.
  verified: text
- id: diff.cardio.hypertension.bp-categories
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2134]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.21
  diff_type: terminology
  topic: 혈압 범주 이름과 경계(정상 위 구간 · 1·2기)
  harrison_says: Normal BP <120 and <80; Elevated BP 120–129 and <80; Stage 1 hypertension 130–139 or 80–89; Stage 2 hypertension ≥140 or ≥90 (Table 288-1). SBP·DBP 범주가 다르면 높은 쪽을 택한다.
  kr_says: 정상혈압 <120 그리고 <80; 주의혈압 120~129 그리고 <80; 고혈압전단계 130~139 또는 80~89; 1기 고혈압 140~159 또는 90~99; 2기 고혈압 ≥160 또는 ≥100; 수축기단독고혈압 ≥140 그리고 <90; 이완기단독고혈압 <140 그리고 ≥90 (표1). 두 기준이 상이하면 더 높은 범주를 적용한다(p.22).
  kmle_rule: KMLE 문항·정리본은 정상혈압/주의혈압/고혈압전단계/1기(140–159/90–99)/2기(≥160/≥100) 다섯 범주를 쓴다 — 'Elevated BP'=주의혈압, ACC/AHA 'Stage 1'(130–139/80–89)=고혈압전단계, 2기는 160/100 부터.
  usmle_rule: USMLE 문항은 Normal/Elevated/Stage 1(130–139 or 80–89)/Stage 2(≥140 or ≥90) 네 범주를 쓴다.
  verified: text
- id: diff.cardio.hypertension.isolated-diastolic
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2134]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.21
  diff_type: terminology
  topic: 이완기단독고혈압(IDH) 분류
  harrison_says: 따로 범주를 두지 않는다. Table 288-1 의 Stage 1·2 가 'or' 기준이고 "When the SBP and DBP readings are in different categories of BP, the higher classification should be chosen" — 수축기 <130 이어도 이완기 80–89 면 Stage 1, ≥90 이면 Stage 2 고혈압이다. 단독 수축기 고혈압(isolated systolic hypertension)은 노년의 맥압 증가로 흔하다고만 기술한다(p.2135).
  kr_says: '2026 개정에서 혈압 분류에 이완기단독고혈압을 새로 추가함(p.10 신규추가항목). 수축기혈압 140 mmHg 미만이면서 이완기혈압만 90 mmHg 이상으로 상승한 경우를 ''이완기단독고혈압(isolated diastolic hypertension)''으로 한다(표1: <140 그리고 ≥90).'
  kmle_rule: KMLE 문항·정리본은 수축기 <140 이면서 이완기 ≥90 mmHg 를 '이완기단독고혈압'으로 부른다(이완기 80–89 는 고혈압전단계).
  usmle_rule: USMLE 문항은 IDH 를 별도 범주로 묻지 않고, 높은 쪽 범주 원칙에 따라 이완기 80–89 는 Stage 1, ≥90 은 Stage 2 로 분류한다.
  verified: text
- id: diff.cardio.hypertension.drug-initiation
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2140–2141]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.62–65
  diff_type: algorithm
  topic: 약물치료 시작 기준(위험도별)
  harrison_says: 'Stage 2(≥140 or ≥90)는 비약물+약물 병행. Stage 1(130–139 or 80–89)은 대부분 비약물치료지만 CVD 병력 또는 ASCVD 고위험(10년 위험 ≥10%, 또는 표현형: stage 1 HTN and age ≥65, or DM, or CKD)이면 약물을 더한다(Fig. 288-3, p.2141). 저위험 stage 1 은 6개월 비약물치료 후 <130/80 미달이면 약 추가가 reasonable(p.2143).'
  kr_says: 2기 고혈압은 생활요법과 동시에 약물치료(I, A, p.65). 중위험군 또는 고위험군 1기 고혈압은 생활요법과 약물치료 병행(I, A, p.64). 심혈관질환(관상동맥질환·말초혈관질환·복부대동맥류·심부전)이 동반된 고혈압전단계는 약물치료 고려(IIa, B); 당뇨병·만성콩팥병·고혈압성 장기손상이 있는 고위험 고혈압전단계는 3개월 생활요법 후에도 130/80 mmHg 이상이면 약물치료 고려(IIb, B)(권고8, p.62). 저위험군은 3개월 비약물치료 후 미조절 시 약물 고려(IIa, B, p.80).
  kmle_rule: KMLE 문항·정리본은 140/90 이상에서 위험도에 따라 약을 시작하고(중·고위험 1기·2기 즉시), 130–139/80–89(고혈압전단계)는 심혈관질환 동반 시만 약물 고려, 당뇨·CKD·장기손상 고위험은 3개월 생활요법 뒤 130/80 이상이면 약물 고려로 쓴다.
  usmle_rule: USMLE 문항은 Stage 1(130–139/80–89)이라도 임상 CVD·10년 ASCVD ≥10%·DM·CKD·65세 이상이면 약을 시작하고, 저위험 Stage 1 은 생활요법 후 재평가한다.
  verified: text
- id: diff.cardio.hypertension.general-target
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2146]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.65–66
  diff_type: threshold
  topic: 일반 고혈압 환자의 목표혈압
  harrison_says: '"an SBP/DBP treatment goal of 130/80 mmHg in adults with hypertension, as recommended in the ACC/AHA BP guideline, seems reasonable." 임상 진료에서 만나는 고혈압 환자는 거의 모두 ASCVD 고위험이라 위험도로 목표를 나누지 않는다.'
  kr_says: 저위험군 및 중위험군 고혈압 환자는 140/90 mmHg 미만으로 조절(권고12, I, A, p.65). 고위험군(무증상 장기손상 또는 위험인자 3개 이상)과 심혈관질환 동반 환자는 130/80 mmHg 미만(권고13, I, A, p.66). 특별한 경우가 아니면 일반적인 목표혈압은 140/90 미만(표13).
  kmle_rule: KMLE 문항·정리본은 합병증 없는 저·중위험 고혈압의 목표를 <140/90 mmHg, 고위험·심혈관질환·당뇨·CKD·뇌졸중 동반 시 <130/80 mmHg 로 쓴다.
  usmle_rule: USMLE 문항은 위험도와 무관하게 대부분의 성인 고혈압 목표를 <130/80 mmHg 로 쓴다.
  verified: text
- id: diff.cardio.hypertension.elderly-target
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2146–2148]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.67, p.109
  diff_type: threshold
  topic: 노인(≥65세) 고혈압 목표혈압
  harrison_says: '"noninstitutionalized community-dwelling older adults, arbitrarily defined as ≥65 years, where the goal should be to achieve an SBP <130 mmHg." 동반질환이 많고 기대여명이 짧으면 임상 판단·환자 선호로 정한다. p.2148 에도 "desired SBP goal of <130 mmHg".'
  kr_says: 노인고혈압 환자는 수축기혈압 140 mmHg 미만(권고14, I, A, p.67; 이완기 60 mmHg 이상 유지). 지역사회 65세 이상 노인 SBP <140(I, A); 심혈관질환·만성콩팥병 동반 고위험 노인은 SBP <130 고려 가능(IIb, B); 노쇠·85세 이상·기대여명 3년 이내·증상성 기립성저혈압은 개별화(IIb, C)(권고43, p.109).
  kmle_rule: KMLE 문항·정리본은 65세 이상 노인의 목표를 수축기 <140 mmHg 로 쓰고, CVD·CKD 동반 고위험 노인만 <130 을 '고려할 수 있다'(IIb)로 쓴다.
  usmle_rule: USMLE 문항은 지역사회 거주 65세 이상 노인의 목표를 SBP <130 mmHg 로 쓴다.
  verified: text
- id: diff.cardio.hypertension.diabetes-ckd-target
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2147]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.67–69
  diff_type: threshold
  topic: 당뇨병·만성콩팥병 동반 고혈압 목표
  harrison_says: '당뇨병: "The recommended antihypertensive treatment target is an SBP/DBP <130/90 mmHg"(원문 그대로 — 이 장의 다른 곳과 ACC/AHA 는 130/80). ACEI 또는 ARB 포함 권고, 대부분 이뇨제 필요. 콩팥병 절은 따로 목표 수치를 주지 않고 ACEI/ARB 중심, eGFR <30 에서도 chlorthalidone 효과(CLICK)를 기술한다.'
  kr_says: 당뇨병 동반 고혈압은 130/80 mmHg 미만(권고15, I, A, p.67 — 2022년의 저위험 당뇨 140/90 구분을 없앰). 만성콩팥병은 견딜 수 있다면 130/80 mmHg 미만(I, A); 표준화된 혈압측정법으로 측정한 경우 수축기 120 mmHg 미만 고려(IIa, B)(권고17, p.69).
  kmle_rule: KMLE 문항·정리본은 당뇨병 동반 고혈압 목표를 <130/80 mmHg, CKD 는 <130/80 mmHg(표준화 측정 시 SBP <120 고려)로 쓴다.
  usmle_rule: USMLE 문항은 당뇨·CKD 동반 고혈압 목표를 <130/80 mmHg 로 쓴다(해리슨 당뇨 절의 '<130/90' 은 인용하지 않는다).
  verified: text
- id: diff.cardio.hypertension.cvd-target-same
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2146–2147]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.66
  diff_type: same
  topic: 심혈관질환 동반 고혈압 목표 <130/80
  harrison_says: 'PATIENTS WITH CVD: ACEI·ARB·베타차단제를 흔히 쓰고 "In general, the standard treatment goal of SBP/DBP <130/80 mmHg is indicated if well tolerated."'
  kr_says: 심혈관질환, 즉 관상동맥질환·말초혈관질환·복부대동맥류·심부전이 동반된 환자에서는 혈압을 130/80 mmHg 미만으로 조절할 것을 권고한다(권고13, I, A).
  kmle_rule: KMLE 문항·정리본은 관상동맥질환 등 심혈관질환 동반 고혈압의 목표를 <130/80 mmHg 로 쓴다.
  usmle_rule: USMLE 문항도 CVD 동반 고혈압의 목표를 <130/80 mmHg 로 쓴다.
  verified: text
- id: diff.cardio.hypertension.first-line-drugs
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2143–2144]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.81–84
  diff_type: first_line
  topic: 1차 항고혈압제 계열 · 이뇨제 선택
  harrison_says: '"diuretics, CCBs, and ACEIs or ARBs, alone or in combination, are used for initial drug therapy in patients without a compelling indication for use of a beta blocker." 베타차단제는 head-to-head 에서 열등(특히 뇌졸중) — Table 288-4 에서 ''Other Drugs''로 적응증(IHD·HF) 있을 때만. 이뇨제는 "chlorthalidone or indapamide are preferred over shorter acting agents such as hydrochlorothiazide".'
  kr_says: RAS 억제제, 베타차단제, 칼슘통로차단제, 이뇨제를 고혈압 치료의 1차 약제로 권고(권고28, I, A, p.81). 베타차단제는 적응증(협심증·심근경색 후·HFrEF·심방세동·심박수 조절)이 있으면 초기·병용 사용 권고(I, A); 노인에서는 특별한 적응증이 있을 때만(p.82). 티아지드계 이뇨제는 하이드로클로로티아지드·클로르탈리돈·인다파미드 중 선택 고려(권고29, IIa, B, p.84 — DCP 결과로 2022년의 thiazide-like 선호를 폐지). ARNI 를 고혈압 치료약제로 새로 포함(p.82).
  kmle_rule: KMLE 문항·정리본은 1차 약제를 RAS 억제제(ACEI/ARB)·베타차단제·CCB·이뇨제 네 계열로 쓰고, 티아지드는 HCTZ·클로르탈리돈·인다파미드 어느 것이나 1차로 인정한다.
  usmle_rule: USMLE 문항은 1차 약제를 thiazide(-like) 이뇨제·CCB·ACEI/ARB 세 계열로 쓰고, 베타차단제는 강제 적응증이 있을 때만, 이뇨제는 chlorthalidone 을 선호한다.
  verified: text
- id: diff.cardio.hypertension.initial-combination
  slot: h277
  h22_chapter: 288
  h22_cite: '[[harrison-22: 288장 p.2145–2146]]'
  kr_guideline_id: kr-ksh-hypertension-2026
  kr_cite: 2026 고혈압 진료지침(대한고혈압학회 제6판) p.81–82
  diff_type: algorithm
  topic: 초기 병용요법 · 단일제형복합제
  harrison_says: 'Fig. 288-4: "Initial combination drug therapy in most patients, especially in black adults and those with an average SBP >20 mmHg above treatment goal — diuretic or CCB combined with ACEI or ARB — single-pill combinations preferred, if feasible"; 단독요법은 평균 혈압이 130/80 에 가까운 일부 stage 1 에만. 미조절 시 이뇨제+CCB+ACEI/ARB 3제, 이어 MRA.'
