  kmle_rule: 'KMLE 문항·정리본은 좌심방이 폐색술을 「장기 항응고 금기(예: 원인 교정 불가 뇌출혈)」 환자의 대안(IIb)으로만 두고, 항응고 가능한 환자의 1차 선택으로 두지 않는다.'
  usmle_rule: USMLE 문항은 고위험 혈전색전 + 장기 항응고의 심각한 출혈 위험(항응고 부적합) 환자에서 LAA occlusion(Watchman)을 고려하는 기준을 적용한다.
