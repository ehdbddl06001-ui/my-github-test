- id: diff.cardio.heart-failure.improved-ef-terminology
  slot: h257
  h22_chapter: 264
  h22_cite: '[[harrison-22: 264장 p.1977]]'
  kr_guideline_id: kr-kshf-hf-2022
  kr_cite: 대한심부전학회 2022 심부전 진료지침 Part 2 Korean Circ J 2023;53:218
  diff_type: terminology
  topic: 치료 뒤 EF 가 좋아진 HFrEF 의 이름과 정의
  harrison_says: GDMT 후 EF 가 정상 범위로 좋아진 HFrEF 를 'HF with recovered EF (HFrecEF)' 라 부른다. 증상이 없어진 환자에서 질병 조절 치료를 끊으면 최대 절반이 6개월 안에 증상·EF 저하가 재발한다(p.1977). 숫자 기준(>40%, 10%p 상승 등)은 제시하지 않는다.
  kr_says: 추적 EF >40%, 이전보다 10% 넘게 개선, 또는 ≥50% 로 개선된 경우 'HF with recovered EF' 로 분류할 수 있으나 '회복' 이라는 말은 부적절할 수 있어 독립 질환군이 아니라 '개선된(improved)' 상태로 보고 표준 치료를 계속한다. GDMT 후 LVEF 가 >40% 로 좋아져도 GDMT 유지 권고(Class I, LOE B). 분류표(Part 1 Table 1)에는 HFimpEF 칸이 따로 없다.
  kmle_rule: KMLE 문항·정리본은 EF 가 >40% 로 좋아진 HFrEF 를 '개선된 HFrEF' 로 보고 GDMT 를 계속한다(중단 보기는 오답).
  usmle_rule: USMLE 문항은 'HF with recovered/improved EF' 용어를 쓰되 판단은 같다 — GDMT 를 끊지 않는다.
