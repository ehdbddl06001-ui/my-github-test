- id: diff.cardio.atrial-fibrillation.laa-occlusion
  slot: h251
  h22_chapter: 258
  h22_cite: '[[harrison-22: 258장 p.1951]]'
  kr_guideline_id: kr-khrs-afib-2024
  kr_cite: 2024 대한부정맥학회 심방세동 진료지침 PART 1 p.39-40
  diff_type: algorithm
  topic: 좌심방이 폐색술의 대상과 권고 강도
  harrison_says: 경피적 좌심방이 폐색·결찰 기구는 와파린에 비열등해 보이며, 혈전색전 위험은 높지만 장기 경구 항응고의 심각한 출혈 위험이 있는 환자에게 고려한다. Watchman 은 와파린과 비슷한 뇌졸중 예방에 주요 출혈(특히 출혈성 뇌졸중)·전체 사망 감소가 더해지고, 직접 작용 항응고제에도 비열등해 보인다.
