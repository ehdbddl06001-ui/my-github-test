  harrison_says: '"Limited experience with apixaban and rivaroxaban demonstrates safety and efficacy in patients undergoing chronic hemodialysis for end-stage kidney disease." dabigatran·rivaroxaban·apixaban 은 신배설이라 중등도 신기능 저하에서 용량 조절이 필요하다.'
