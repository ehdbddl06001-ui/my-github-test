  kr_cite: 2024 대한부정맥학회 심방세동 진료지침 PART 1 p.42, p.45, p.47
  diff_type: threshold
  topic: 심박수 조절 목표와 약제(디곡신의 자리)
  harrison_says: 적절한 심박수 조절 = 안정 시 <80 beats/min, 가벼운 운동 시 <100 beats/min. 어렵다면 증상이 없고 심실 기능이 정상일 때 안정 시 110 까지 허용; 영구 AF 에서 관대한 조절(<110)은 엄격한 조절과 효과가 같고 달성이 쉽다(p.1950). 급성 조절은 β차단제·verapamil·diltiazem; digoxin 은 추가 약으로 쓸 수 있으나 만성 사용에서 사망 증가 근거가 있어 사용이 줄었다(p.1949).
  kr_says: 「초기 안정시 심박동수를 110 회/분 이하로 관대하게 심박수를 유지할 것을 추천한다」(IIa, B, p.47). 좌심실 박출률 40 % 이상은 베타차단제·디곡신·베라파밀·딜티아젬이 1차 선택(I, B), 40 % 미만은 베타차단제 그리고/또는 디곡신(I, B). 급성기에는 베타차단제와 딜티아젬/베라파밀을 디곡신보다 우선 선택한다(p.45).
  kmle_rule: KMLE 문항·정리본은 초기 목표를 안정 시 110회/분 이하(관대한 조절, IIa)로 두고, LVEF ≥40 % 는 β차단제·디곡신·베라파밀·딜티아젬, LVEF <40 % 는 β차단제 ± 디곡신(비DHP CCB 제외)을 적용한다.
  usmle_rule: USMLE 문항은 해리슨의 「안정 시 <80, 가벼운 운동 시 <100, 무증상·정상 LV 면 <110 허용」 목표와 β차단제·비DHP CCB 우선(digoxin 은 저혈압·HF 의 보조) 기준을 적용한다.
