  diff_type: threshold
  topic: 나트륨이뇨펩타이드로 심부전 배제하는 기준값
  harrison_says: BNP·NT-proBNP 는 진단의 '보조 도구' 로, 외래 호흡곤란 환자에서 특히 임상적 불확실성이나 폐질환 동반 시 결정에 도움이 된다(p.1985). 매우 낮은 BNP·NT-proBNP 는 비만이 아닌 환자에서 심부전 배제에 도움이 된다(p.1986). 구체적 배제 기준값은 제시하지 않으며, 비만에서 위음성, 나이·여성·CKD·AF·PE·PAH 에서 상승을 경고한다.
  kr_says: '의심 심부전에서 BNP·NT-proBNP 를 진단·배제의 첫 검사로 측정(Class I, LOE A, p.202). 비급성: BNP <35 pg/mL 또는 NT-proBNP <125 pg/mL 이면 음성예측도 0.94–0.98 로 배제 가능, 응급실 급성 심부전: BNP <100 pg/mL 또는 NT-proBNP <300 pg/mL 로 배제(p.203, 급성 진단 도표 Figure 3 p.201).'
