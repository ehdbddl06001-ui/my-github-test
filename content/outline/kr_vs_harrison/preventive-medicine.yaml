- id: diff.prev.screening.gastric-egd-40-74
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 위암 검진 권고안 2026(국립암센터 외) p.8
  diff_type: screening
  topic: 위암 검진 — 한국은 40~74세 2년마다 위내시경, 해리슨(USPSTF 표)에는 항목 없음
  harrison_says: 표 6-4 'Screening Tests Recommended by the U.S. Preventive Services Task Force for Average-Risk Adults' 에 위암(gastric cancer) 검진 항목이 없다(유방·자궁경부·대장·폐암만 실림). 6장 본문에도 위암 검진 권고는 없다.
  kr_says: '권고문: ''평균적인 위험을 가진 40-74세 무증상 성인을 대상으로 2년 간격의 위내시경(EGD) 검사를 통한 위암 선별검사를 권고한다.'' — 근거수준 중증도, 권고등급 강하게 권고. 고위험군(CDH1 변이·위암 과거력·가족력 등)은 대상이 아니며 개별 판단.'
  kmle_rule: KMLE 문항·정리본은 평균 위험 40~74세 무증상 성인에게 2년마다 위내시경 검진(강하게 권고)을 적용한다.
  usmle_rule: USMLE 문항은 USPSTF 평균 위험 성인 권고에 위암 검진이 없음을 적용한다(미국 일반인 대상 위내시경 검진은 권고 항목이 아니다).
  verified: text
- id: diff.prev.screening.gastric-ugi-not-recommended
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 위암 검진 권고안 2026(국립암센터 외) p.8
  diff_type: first_line
  topic: 위암 검진 검사 — 위장조영(UGI)은 조건부 권고하지 않음
  harrison_says: 표 6-4 에 위암 검진 항목 자체가 없어 UGI·EGD 중 무엇을 쓰라는 서술이 없다.
  kr_says: '권고문: ''평균적인 위험을 가진 무증상 성인에게 위장조영촬영 검사를 통한 위암 선별검사는 일반적으로 권고하지 않는다. 단, 위내시경검사의 시행에 제한이 있는 경우 위장조영검사를 시행할 수 있다.'' — 근거수준 매우 낮음, 권고등급 조건부 권고하지 않음. 고려사항: ''60세 이상에서는 위장조영촬영검사에 따른 위암 사망률 감소 효과에 대한 근거가 부족하므로…'' (요약 p.5: 국가암검진은 2002년부터 40세 이상에게 2년마다 EGD나 UGI 를 제공해 왔다 — 권고안과 사업은 다르다).'
  kmle_rule: KMLE 문항·정리본은 위암 검진의 1차 검사로 위내시경을 쓰고, 위장조영은 내시경이 어려울 때만 쓰는 대안(조건부 권고하지 않음)으로 적용한다.
  usmle_rule: USMLE 문항은 평균 위험 성인의 위암 선별검사를 권고 항목으로 다루지 않는다.
  verified: text
- id: diff.prev.screening.colorectal-colonoscopy-45
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 대장암 검진 권고안 2025(국립암센터 외) p.10
  diff_type: same
  topic: 대장암 검진 — 45세 시작, 대장내시경 10년 간격
  harrison_says: '표 6-4 Colorectal cancer: ''Colonoscopy (or occult blood testing combined with sigmoidoscopy)'' 45–75, ''Every 10 years''. 표 6-7(p.41): ''Begin colorectal cancer screening at age 45 or 50''.'
  kr_says: '권고문: ''45-74세 무증상 성인을 대상으로 10년 간격의 대장내시경 검사를 통한 대장암 선별검사를 권고한다.'' — 근거수준 중등도, 권고등급 조건부 권고. (끝 나이는 74세, 해리슨 표는 75세)'
  kmle_rule: KMLE 문항·정리본은 45~74세 무증상 성인에게 10년마다 대장내시경(조건부 권고)을 적용한다.
  usmle_rule: USMLE 문항은 45~75세 평균 위험 성인에게 colonoscopy 10년 간격을 적용한다.
  verified: text
- id: diff.prev.screening.colorectal-fit-and-stool-dna
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 대장암 검진 권고안 2025(국립암센터 외) p.10
  diff_type: screening
  topic: 대장암 대변검사 — FIT 1~2년 vs 분변 DNA 검사 권고 보류
  harrison_says: '표 6-4: ''Fecal occult blood testing'' 45–75 ''Every year'', ''Fecal immunochemical-DNA'' 45–75 ''Every 1–3 years'', ''Sigmoidoscopy'' 45–75 ''Every 5 years''. p.40: ''one patient may prefer the ease of preparation and less time disruption of a DNA-based stool test''.'
  kr_says: '권고문: ''45-74세 무증상 성인을 대상으로 1-2년 간격의 면역화학적 대변잠혈검사(FIT)를 통한 대장암 선별검사를 권고한다.'' — 근거수준 낮음, 조건부 권고. ''분변 DNA(stool DNA)검사를 통한 대장암 선별검사를 시행하는 것은 이득과 위해의 크기를 비교평가할 만한 근거가 불충분하다.'' — 매우 낮음, 권고 보류. CT 대장조영술도 권고 보류. (구불결장경은 권고문에 없음)'
  kmle_rule: KMLE 문항·정리본은 대장암 대변검사로 FIT 1~2년 간격(조건부 권고)을 적용하고, 분변 DNA 검사·CT 대장조영술은 권고 보류(I)로 적용한다.
  usmle_rule: USMLE 문항은 FOBT/FIT 매년, FIT-DNA 1~3년, sigmoidoscopy 5년, colonoscopy 10년을 모두 인정되는 선택지로 적용한다.
  verified: text
- id: diff.prev.screening.liver-surveillance-target
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 간암 검진 권고안 2026(국립암센터 외) p.9
  diff_type: screening
  topic: 간암 검진 — 고위험군(간경변·40세 이상 B·C형 간염) 6개월마다 초음파 + AFP
  harrison_says: '표 6-4(USPSTF 평균 위험 성인)에 간암 검진 항목은 없고 ''Hepatitis C — Anti-HCV antibody followed by confirmatory PCR, 18–79, Once'' 만 있다. 표 6-7(p.41) 25–44세: ''Assess for chronic alcohol abuse, risk factors for viral hepatitis, or other risks for development of chronic liver disease''. 간암 감시 대상·간격은 6장에 없다(간암 장에서 따로 대조 필요).'
  kr_says: '''간암 발생 고위험군은 간경변증, 만성 B형 간염, 만성 C형 간염 환자로 한다. 간경변증 환자 또는 40세 이상의 만성 B형 간염, 만성 C형 간염 환자를 대상으로 6개월 간격의 간초음파와 혈청알파태아단백 검사를 통한 간암 검진을 권고한다.'' — 근거수준 중등도, 권고등급 조건부 권고. 고려사항: ''간 섬유화가 진행되지 않은 만성 C형 간염 환자는 … 검진 대상에서 제외할 수 있다'', ''AFP 는 정량검사를 권고하며 ng/mL로 보고한다''.'
  kmle_rule: KMLE 문항·정리본은 간경변증 또는 40세 이상 만성 B·C형 간염 환자에게 6개월마다 간초음파 + 혈청 AFP(조건부 권고)를 적용한다.
  usmle_rule: USMLE 문항은 간암 감시를 평균 위험 성인 검진(USPSTF 표)이 아니라 고위험군 감시로 다루며, 6장 표에서는 HCV 항체 1회 선별(18~79세)만 적용한다.
  verified: text
- id: diff.prev.screening.liver-ct-mri-inconclusive
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 간암 검진 권고안 2026(국립암센터 외) p.9
  diff_type: first_line
  topic: 간암 검진 검사 — CT·MRI 는 권고 보류
  harrison_says: 6장(표 6-4·6-7)에는 간암 감시 영상 검사 선택에 관한 서술이 없다 — 대조 보류(간암 장 확인 필요).
  kr_says: '''간암 고위험군을 대상으로 CT, MRI를 이용한 간암 검진을 시행하는 것은 이득과 위해의 크기를 비교평가할만한 근거가 불충분하다.'' — 근거수준 매우 낮음, 권고등급 권고보류. 위해: ''CT와 MRI는 조영제 부작용으로 인한 중등도의 위해가 있을 수 있으며, 특히 CT의 경우 … 저선량 방사선 피폭의 위해도''.'
  kmle_rule: KMLE 문항·정리본은 간암 검진의 기본 검사를 초음파 + AFP 로 두고, CT·MRI 검진은 권고 보류(I)로 적용한다.
  usmle_rule: USMLE 문항은 6장 근거만으로 간암 감시 영상 선택을 정하지 않는다(간암 장 대조 후 확정).
  verified: pending
- id: diff.prev.screening.breast-age-range
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 유방암 검진 권고안 2015(국립암센터 외) p.3
  diff_type: screening
  topic: 유방촬영술 검진 연령 — 한국 40~69세 vs USPSTF (40?) 50~75세, 둘 다 2년
  harrison_says: '표 6-4 Breast cancer: ''Mammography with or without clinical breast examination'', ''Women (40?) 50–75'', ''Every 2 years''. 표 6-7(p.41): 25–44세 ''Consider individualized breast cancer screening with mammography at age 40'', 45–64세 ''Begin mammography screening by age 50''.'
  kr_says: '''40-69세 무증상 여성을 대상으로 유방촬영술을 이용한 유방암 검진을 2년마다 시행할 것을 권고한다(권고등급 B).'' ''70세 이상에서 유방촬영술을 이용한 유방암 검진은 개인별 위험도에 대한 임상적 판단과 수검자의 선호도를 고려하여 선택적으로 시행할 것을 권고한다(권고등급 C).'''
  kmle_rule: KMLE 문항·정리본은 40~69세 무증상 여성에게 2년마다 유방촬영술(B), 70세 이상은 선택적 시행(C)을 적용한다.
  usmle_rule: USMLE 문항은 해리슨 표 6-4 대로 (40)50~75세 2년마다 mammography 를 적용한다.
  verified: text
- id: diff.prev.screening.breast-ultrasound-cbe
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 유방암 검진 권고안 2015(국립암센터 외) p.3
  diff_type: screening
  topic: 유방 초음파·임상유방진찰 — 한국은 둘 다 권고등급 I
  harrison_says: '표 6-4: ''Mammography with or without clinical breast examination''. p.37: 유방 MRI 는 BRCA 변이 여성의 검진 권고에 포함되지만 ''considered to incur too much harm for women at average cancer risk''. 유방 초음파 검진은 6장에 없다.'
  kr_says: '''유방초음파검사 단독 또는 유방촬영술과 병행하여 유방초음파검사를 유방암 검진으로 시행하는 것을 권고하거나 반대할만한 근거는 불충분하다(권고등급 I).'' ''임상유방진찰 단독 또는 유방촬영술과 병행하여 … 근거는 불충분하다(권고등급 I).'''
  kmle_rule: KMLE 문항·정리본은 유방 초음파·임상유방진찰 검진을 권고등급 I(근거 불충분)로 적용하고, 평균 위험 여성의 검진 검사는 유방촬영술로 둔다.
  usmle_rule: USMLE 문항은 평균 위험 여성 검진을 mammography(± clinical breast exam)로 하고, MRI 는 BRCA 등 고위험군에만 적용한다.
  verified: text
- id: diff.prev.screening.cervical-start-stop
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 자궁경부암 검진 권고안 2015(국립암센터 외) p.5
  diff_type: threshold
  topic: 자궁경부 세포검사 — 시작 20세 vs 21세, 끝 75세 vs 65세, 간격 3년은 같음
  harrison_says: '표 6-4 Cervical cancer: ''Pap smear'', ''Women 21–65'', ''Every 3 years''. 표 6-7(p.41): ''Pap smear for cervical cancer screening after age 21''.'
  kr_says: '''만 20세 이상의 무증상 여성을 대상으로 자궁경부세포도말검사(Pap smear) 또는 액상세포도말검사(LBC)를 이용한 자궁경부암 선별검사를 3년 간격으로 시행할 것을 권고한다(권고등급 A).'' ''최근 10년 이내에 자궁경부암 검진에서 연속 3번 이상 음성으로 확인된 경우 75세 이상에서 자궁경부암 선별검사를 권고하지 않는다(권고등급 D).'' 특수상황: 전자궁절제술 후 권고하지 않음(기왕증 있으면 시행), HPV 백신 접종·임신과 관계없이 지속.'
  kmle_rule: KMLE 문항·정리본은 만 20세 이상 여성에게 3년마다 세포검사(A)를 적용하고, 최근 10년 3회 연속 음성이면 75세 이상에서 중단(D)으로 적용한다.
  usmle_rule: USMLE 문항은 21~65세 Pap smear 3년 간격을 적용한다.
  verified: text
- id: diff.prev.screening.cervical-hpv-testing
  slot: prev.screening
  h22_chapter: 6
  h22_cite: '[[harrison-22: 6장 p.39]]'
  kr_guideline_id: kr-ncc-cancer-screening-2025
  kr_cite: 한국 자궁경부암 검진 권고안 2015(국립암센터 외) p.5
  diff_type: algorithm
  topic: HPV 검사 — 한국 2015 는 병행검사 C·단독 I, USPSTF 는 30~65세 HPV 음성 시 5년
  harrison_says: '표 6-4: ''Pap smear and/or HPV testing'', ''Women 30–65'', ''Every 5 years if HPV negative''.'
  kr_says: '''자궁경부 세포검사 … 와 함께 인유두종바이러스 검사를 동시에 시행하는 것은 개인별 위험도에 대한 임상적 판단과 수검자의 선호도를 고려하여 선택적으로 시행할 것을 권고한다(권고등급 C).'' ''자궁경부암 선별검사로 인유두종바이러스 검사를 단독 시행하는 것은 … 근거가 불충분하다(권고등급 I).'''
