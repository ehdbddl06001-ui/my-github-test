  topic: 퇴치 대상 감염병 1례 — 즉시 보고(디프테리아는 한국 제1급)
  harrison_says: '''As of 2024, the United States had eliminated indigenous transmission of measles, rubella, poliomyelitis, and diphtheria.'' ''Detection of a case of disease that has been targeted for eradication or elimination is considered a sentinel event … Therefore, such episodes must be promptly reported to public health authorities.'''
  kr_says: 'p.4 제1급감염병 18종에 ''17. 디프테리아'' 포함(홍역·풍진·폴리오는 제2급). p.17 제1급: ''발생 및 사망신고: 즉시 신고 — 감염병환자등(감염병환자, 의사환자, 병원체보유자)을 진단한 경우''. p.9: 디프테리아 환자 ○·의사환자 ○.'
  kmle_rule: KMLE 문항·정리본은 디프테리아를 제1급감염병으로 의심 단계에서 즉시 신고(유선 통보 후 신고서)로 적용한다.
  usmle_rule: USMLE 문항은 elimination 대상 질환(measles·rubella·polio·diphtheria) 1례를 sentinel event 로 보고 즉시 public health authority 에 보고한다.
