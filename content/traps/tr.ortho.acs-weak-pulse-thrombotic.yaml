# 함정 계열 — 규칙: /gen-kmle 「함정 계열」 · 필드: schemas/frontmatter.md 「함정 계열 등록부」 · 검사: python pipelines/traps.py check
id: tr.ortho.acs-weak-pulse-thrombotic
title: "골절 뒤 약해진 원위 맥박 — 혈전·혈관 처치로 끌림"
status: active
found: 2026-09-29
found_note: >-
  외부 문항과 비교(2026-09-29) — 경골 골절 뒤 부은 종아리에서 발등동맥이 약하게 만져지고 오답이 모두 혈전·혈관 처치인 문항.
  MedKOS 구획증후군 7문항(kmle-2026-0024·0220·0448·0673·0960·1185, usmle-2026-0126)은 모두 「맥박 촉지」 판이라 이 함정이 없었다.
  외부 문항 원문은 싣지 않는다.
exams: [kmle, usmle]
objectives: [cn.ortho.acute-compartment-syndrome.fasciotomy]
topics: [Orthopedics, General Surgery, Surgery]
related: [tr.ortho.acs-palpable-pulse-reassurance]
cue:
  text: "골절·고정 뒤 붓고 아픈 다리에서 원위 맥박(발등동맥·뒤정강동맥)이 약하거나 만져지지 않는다"
  patterns:
    - '(맥박|동맥)[^.。]{0,15}(약하|약해|약한|희미|만져지지\s*않|촉지되지\s*않|소실)'
    - '(diminished|weak|faint|decreased|absent|thready)[^.]{0,25}pulse'
    - 'pulses?[^.]{0,25}(diminished|weak|faint|decreased|absent|not palpable|nonpalpable|1\+)'
lure:
  family: "혈전·혈관 폐색으로 보고 하는 처치"
  examples: ["헤파린·저분자량헤파린", "카테터 혈전용해", "혈관풍선확장술", "혈전·색전제거술", "간헐적 공기압박", "CT 혈관조영술"]
  patterns:
    - '헤파린|항응고|혈전\s*용해|풍선|혈전\s*제거|색전\s*제거|공기\s*압박|혈관\s*(조영|재건|우회)'
    - 'heparin|anticoagula|thromboly|angioplasty|thrombectomy|embolectomy|pneumatic compression|angiograph|revasculari|bypass'
  min: 2
truth:
  family: "구획 감압"
  answer: "응급 근막절개술"
  patterns: ['근막\s*절개', 'fasciotomy']
why: >-
  구획증후군에서 맥박 소실·느린 재충혈은 늦게 나타나는 징후이고, 가장 먼저 오는 것은 손상에 비해 과도한 통증이다 [[shadgan-2010]].
  혈전을 녹이거나 막힌 혈관을 여는 처치는 올라간 구획 내압을 낮추지 못한다 — 구획증후군이 진단되면 곧바로 감압한다 [[boast-cs-2025]].
discriminators:
  - "통증: 손상에 비해 과도하고 시간이 갈수록 심해지며 진통제에 잘 듣지 않는다 → 구획증후군 [[shadgan-2010]]"
  - "맥박 소실·느린 재충혈: 구획증후군에서는 늦은 징후이고, 그것이 두드러지면 혈관 손상을 먼저 의심한다 [[shadgan-2010]]"
  - "급성 동맥 폐색: 1시간 안에 심한 통증·저림·감각 저하·냉감, 원위 맥박 소실·창백·청색증·피부 온도 저하 [[harrison-21: 281장 p.2111]]"
  - "원인: 색전(심방세동 등)·제자리 혈전·박리·외상 → 동맥 폐색 [[harrison-21: 281장 p.2110]] / 골절·둘레 붕대·석고 → 구획증후군 [[shadgan-2010]]"
  - "수치: 이완기 혈압 − 구획 내압 ≤ 30 mmHg → 감압 [[shadgan-2010]] [[mcqueen-1996]] — 혈압이 낮으면 같은 구획압에서도 이 차이가 줄어든다"
  - "CK·근색소 상승은 근육 손상을 반영할 뿐 구획증후군을 특정하지 않는다 [[shadgan-2010]]"
mirror:
  when: >-
    원위 맥박이 약하거나 없는데 판정 소견이 동맥 쪽을 가리킬 때 — 심방세동 등 색전원이 있고 1시간 안에 갑자기 시작한 심한 통증·저림·냉감,
    원위 맥박 소실·창백·청색증·피부 온도 저하 → 급성 하지 허혈: 헤파린 정주 후 카테터 혈전용해·혈전제거 또는 수술적 혈전색전제거
    [[harrison-21: 281장 p.2110–2111]]. 외상 뒤 맥박 소실·느린 재충혈이 두드러지면 혈관 손상 평가가 먼저다 [[shadgan-2010]].
  answer: "헤파린 정주 후 색전제거술"
write_notes:
  - "trap 쪽은 맥박을 「약하게 만져진다」로 쓴다 — 맥박 소실·느린 재충혈이 두드러지면 혈관 손상이 먼저라 단일 정답이 흔들린다 [[shadgan-2010]]. 발은 따뜻하게, 재충혈은 정상 범위로, 가능하면 도플러 동맥 신호를 자료로 준다."
  - "trap 쪽에 구획증후군 단서를 둘 이상 둔다 — 진통제에 듣지 않는 통증·수동 신전 통증·단단한 구획·감각 저하 [[long-2019]]. 이완기 혈압과 구획 내압(차이 ≤ 30)을 자료로 주면 판단이 한 단계 는다."
  - "mirror 쪽은 trap 과 겉모습(다리 통증 + 약하거나 없는 맥박)을 같게 두고 발생 속도·피부색·온도·색전원으로 가른다. 근막절개술을 오답으로 넣는다."
  - "간헐적 공기압박은 밖에서 압력을 더한다 — 하지 수술 뒤 구획증후군의 요인으로 거론된다 [[beraldo-2006]]. trap 쪽 오답으로 쓸 수 있다."
want: {trap: 1, mirror: 1}
