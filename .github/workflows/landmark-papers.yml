name: Landmark papers (weekly)

# 파트(주제)별 '꼭 봐야 하는' 고인용 랜드마크 논문을 인용수로 랭킹해 Markdown 카드로
# 커밋하고, 같은 실행 안에서 Google Drive 백업까지 끝낸다(scrape-papers.yml 과 대칭).
#
# 최신 논문(scrape-papers)은 매일 바뀌지만, 인용수는 하루 단위로 의미 있게 변하지
# 않는다. 그래서 이 워크플로는 주간 주기로 돈다.
#
# Drive 백업 사전 준비는 scrape-papers.yml 주석과 동일(Secret 'RCLONE_CONF_BASE64').
# Secret이 없으면 백업 단계는 건너뛴다(스크랩·커밋은 정상 진행).

on:
  schedule:
    - cron: "0 21 * * 1"   # 매주 월요일 21:00 UTC (KST 화 06:00)
  workflow_dispatch:
    inputs:
      max:
        description: "주제당 저장할 상위 편수"
        default: "12"
      min_citations:
        description: "최소 인용수 하한선"
        default: "1000"
      max_run:
        description: "이번 실행에서 저장할 상한(균형 예산)"
        default: "60"
      pool:
        description: "주제당 후보 풀 크기(크게 잡을수록 하한선을 안 낮추고도 더 많이 확보)"
        default: "400"
      since_year:
        description: "이 연도 이후만(비우면 제한 없음)"
        default: ""
      dry_run:
        description: "true 면 저장·커밋 없이 랭킹만 (진단용)"
        default: "false"
      debug_icite:
        description: "true 면 iCite 원본 응답을 찍는다(형식 변경 진단)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: landmark-papers
  cancel-in-progress: false

jobs:
  landmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Regression tests (인용지표 위장 실패 방지)
        run: python pipelines/test_landmark.py

      - name: Rank landmark papers (iCite) → Markdown cards
        run: |
          OPTS=""
          if [ -n "${{ github.event.inputs.since_year }}" ]; then
            OPTS="$OPTS --since-year ${{ github.event.inputs.since_year }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            OPTS="$OPTS --dry-run"
          fi
          if [ "${{ github.event.inputs.debug_icite }}" = "true" ]; then
            OPTS="$OPTS --debug-icite"
          fi
          # --target-ratio 0.5: '논문 탭의 절반은 랜드마크'를 저장된 코퍼스에서 역산한다.
          # 최신 스크랩이 매일 늘어나므로 고정 편수로는 비율이 안 맞는다(자기 균형).
          python pipelines/scrape_landmark_papers.py \
            --max "${{ github.event.inputs.max || '12' }}" \
            --min-citations "${{ github.event.inputs.min_citations || '1000' }}" \
            --pool "${{ github.event.inputs.pool || '400' }}" \
            --target-ratio 0.5 \
            --max-run "${{ github.event.inputs.max_run || '60' }}" \
            $OPTS

      - name: Validate frontmatter
        run: python pipelines/indexer.py --check

      - name: Rebuild web bundle (docs/papers.js)
        run: python pipelines/export_papers_web.py

      - name: Commit new landmark papers
        run: |
          git config user.name  "medkos-bot"
          git config user.email "medkos-bot@users.noreply.github.com"
          # 상태 파일(seen_papers 등)은 content 파생물로 전환되어 삭제·gitignore 됨 — content와 번들만 커밋
          git add content/papers docs/papers.js
          if git diff --cached --quiet; then
            echo "새 랜드마크 논문 없음 — 커밋 생략"
          else
            git commit -m "랜드마크 논문: $(date -u +%Y-%m-%d) 파트별 고인용 논문 자동 정리"
            for i in 1 2 3 4; do
              git push origin HEAD:main && break || { echo "push 실패, ${i}회차 재시도"; sleep $((2**i)); }
            done
          fi

      - name: Backup content to Google Drive
        if: github.event.inputs.dry_run != 'true'
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          if [ -z "$RCLONE_CONF_BASE64" ]; then
            echo "RCLONE_CONF_BASE64 secret 미설정 — Google Drive 백업 건너뜀"
            exit 0
          fi
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          echo "rclone 원격 확인:"; rclone listremotes
          rclone sync content/ gdrive:MedKOS/content/ \
            --drive-use-trash=true --fast-list --verbose
