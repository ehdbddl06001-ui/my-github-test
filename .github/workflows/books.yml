# 과별 누적 PDF 학습서 → Google Drive (매일)
#
# 순서: 드라이브 수신함의 학습 기록(.json) 가져오기 → state/learning_sync/events.json 에 합치기(덧붙이기만)
#       → 출처 개정 확인(check_sources.py) → 바뀐 책만 PDF 생성·검증(build_books.py)
#       → 검증을 통과한 책만 드라이브 최신본 갱신(같은 파일 ID) + archive/ 날짜·버전 사본 → 기록 커밋.
# 바뀐 것이 없으면 아무것도 만들지 않는다. 한 책이 실패하면 그 책의 이전 PDF 는 그대로 두고
# state/books/last_run.json 에 원인·재시도 대상을 남긴다(다음 실행이 다시 시도 — 되풀이해도 같은 결과).
#
# 시간: 매일 06:30 KST(= 21:30 UTC). 바꾸려면 아래 cron 만 고친다. 수동 실행: Actions ▸ 이 워크플로 ▸ Run workflow.
# 비밀: RCLONE_CONF_BASE64(드라이브 백업과 같은 시크릿). 폴더 ID 는 pipelines/books_config.yaml.
# 시크릿이 없으면 PDF 는 만들고 검증하되 업로드는 하지 않고 「설정 필요」로 남긴다 — 올렸다고 쓰지 않는다.
name: Study books (daily PDF → Drive)

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "바뀐 것이 없어도 모든 책을 다시 만든다"
        type: boolean
        default: false
      only:
        description: "이 책만(예: 소아청소년과). 비우면 전부"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: study-books
  cancel-in-progress: false

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (PDF · 한글 글꼴 · rclone)
        run: |
          pip install pyyaml markdown pymupdf playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-nanum
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config (from secret)
        id: rclone
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          if [ -z "$RCLONE_CONF_BASE64" ]; then
            echo "::warning::RCLONE_CONF_BASE64 가 없어 드라이브 업로드·수신함을 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Tests (정리본·도식·학습 상태 JS/Python 일치·PDF 렌더·드라이브 보호)
        env:
          PYTHONIOENCODING: utf-8
        run: python pipelines/test_learning_books.py && python pipelines/test_sync_key.py

      - name: Check source revisions
        continue-on-error: true
        run: python pipelines/check_sources.py

      - name: Build · validate · upload
        env:
          PYTHONIOENCODING: utf-8
          FORCE: ${{ inputs.force }}
          ONLY: ${{ inputs.only }}          # 입력값은 환경변수로만 넘긴다(셸에 직접 끼워 넣지 않음)
          UPLOAD: ${{ steps.rclone.outputs.ok }}
        run: |
          ARGS=()
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$UPLOAD" = "true" ]; then ARGS+=(--upload); fi
          python pipelines/build_books.py "${ARGS[@]}"

      - name: Commit state (manifest · run log · merged learning events · source checks)
        if: always()
        run: |
          git config user.name "medkos-bot"
          git config user.email "medkos-bot@users.noreply.github.com"
          git add state/books state/source_checks.json state/learning_sync 2>/dev/null || true
          if git diff --cached --quiet; then echo "기록 변경 없음"; exit 0; fi
          git commit -m "학습서: $(python -c "import json;r=json.load(open('state/books/last_run.json',encoding='utf-8'));print(r.get('result'),'built',len(r.get('built',[])),'upload',(r.get('upload') or {}).get('result','-'))")"
          # 앱 동기화 커밋과 겹치면 push 가 거절된다 — 다시 받아 얹고 다시 민다(2026-09-22, wrong-sync 와 같은 규칙)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [ "$i" = 5 ] && exit 1
            echo "push 경합 — ${i}번째 재시도"; sleep $((i * 3))
          done
