# 코드 시험 — PR 이 열리거나 고쳐질 때마다(2026-11-10)
#
# 왜: 코드 시험은 매일 한 번 도는 학습서 작업(books.yml)의 관문으로만 돌았다. PR 을 병합할 때는 아무 시험도 돌지 않아
# 깨진 코드가 main 에 들어간 뒤 다음 날 학습서가 멈춰야 알 수 있었다. 여기서는 같은 시험을 병합 전에 돌린다.
# 실제 콘텐츠 전수 검사(test_content.py)는 넣지 않는다 — 루틴이 쓴 정리본 하나가 코드 PR 을 막지 않게.
name: Code tests (PR)

on:
  pull_request:
    paths:
      - "pipelines/**"
      - "docs/*.js"
      - "docs/*.html"
      - "functions/**"
      - "schemas/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (books.yml 과 같은 구성 — PDF · 한글 글꼴)
        run: |
          pip install pyyaml markdown pymupdf playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-nanum

      - name: Frontmatter contract
        env:
          PYTHONIOENCODING: utf-8
        run: python pipelines/indexer.py --check

      - name: Tests (books.yml 관문과 같은 묶음)
        env:
          PYTHONIOENCODING: utf-8
        run: python pipelines/test_learning_books.py && python pipelines/test_sync_key.py && python pipelines/test_traps.py && python pipelines/test_harrison_cite.py && (cd pipelines && python -m unittest test_english_terms)

      - name: Tests (어느 워크플로에도 없던 것 — 출제 설계 · 상태)
        env:
          PYTHONIOENCODING: utf-8
        run: python pipelines/test_question_design.py && python pipelines/test_state.py
