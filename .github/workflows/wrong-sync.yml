# 웹/PWA 오답 동기화 → 오답노트 .md 자동 생성
#
# Cloudflare Pages Function(/api/wrong)이 핸드폰·PC 의 오답을 state/wrong_sync/<exam>.json 에
# 커밋하면, 이 워크플로가 그 JSON 을 사람이 읽는 오답노트(kmle/오답노트/웹동기화.md 등)로
# 만들어 같은 브랜치에 커밋한다. 봇 커밋은 paths 필터(state/wrong_sync/**)에 걸리지 않아
# 되풀이되지 않는다.
name: Wrong-answer sync → 오답노트

on:
  push:
    branches: [main]
    paths: ["state/wrong_sync/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wrong-sync
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render 오답노트 from sync JSON
        run: python pipelines/import_wrong_sync.py
      - name: Commit if changed
        run: |
          git config user.name "medkos-bot"
          git config user.email "medkos-bot@users.noreply.github.com"
          git add kmle/오답노트 usmle/오답노트
          if git diff --cached --quiet; then
            echo "오답노트 변경 없음"; exit 0
          fi
          git commit -m "오답노트 갱신: 웹 동기화 반영"
          # 앱 동기화는 오답(/api/wrong)과 학습 기록(/api/learning)을 거의 동시에 main 에 커밋한다 —
          # pull 과 push 사이에 main 이 움직이면 「cannot lock ref」로 거절된다(2026-09-22 21:20 실측).
          # 그때는 다시 받아 얹고 다시 민다(최대 5번, 간격을 늘려 가며).
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push 경합 — ${i}번째 재시도"; sleep $((i * 3))
          done
          exit 1
