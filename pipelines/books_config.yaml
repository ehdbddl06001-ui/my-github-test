# 과별 누적 PDF 학습서 설정 — build_books.py · books.yml 이 읽는다.
# 비밀값(rclone 토큰)은 여기 두지 않는다 — GitHub 시크릿 RCLONE_CONF_BASE64 / PC 의 %APPDATA%\rclone\rclone.conf.

title: "MedKOS 과별 학습서"
web_base: "https://ehdbddl06001-ui.github.io/my-github-test/"   # 문항·정리본 교차 링크(?q= · ?concept=)
out_dir: "build/books"                                            # 로컬 산출물(git 무시)
template_version: 11                                              # 판형을 바꾸면 올린다 → 모든 책 재생성(2 = A4 가로 2단, 3 = 표 안 근거 줄바꿈으로 축소 인쇄 해결, 4 = 단 아래 빈 공간 기준으로 배치 탐색, 5 = 단 사이 세로줄 제거(전체 너비 표를 가로지름) — 2026-09-18, 6 = 단원 순서를 기본틀(해리슨 서술 순서)로 · 차례에 절 머리글 — 2026-09-21, 7 = 모든 정리본을 싣는다(학습서_검증 통합) — 2026-09-22, 8 = 도식 층 배치 다시 짬(선 겹침·교차·바깥 통로 제거, 라벨을 판단 노드 아래로) — 2026-09-25, 9 = 정리본 그림(심전도·조직·영상 사진, 데이터 라벨·근거·출처 캡션) — 2026-09-27, 10 = A4 세로 2단(해리슨식)·진짜 표·넓은 도식 두 단 폭+좁은 띠 검사·목차 쪽 분리·english(한글) — 2026-09-27, 11 = 긴 「한눈에」는 쪽을 넘길 수 있게(제목+학습 목표만 붙임)·배치 탐색에 도식 아래 여백·한 단 전환·그림 축소 — 2026-09-28)

# 한 권에 넣을 최대 단원 수. 넘으면 「1권·2권」으로 나눈다(단원 제목순으로 안정적으로 자른다).
volume_max_units: 40

# 학습서에 넣는 기준. 오답은 항상 넣고, 아래 표시가 있으면 맞힌 문항의 목표도 넣는다.
include_flags: [guessed, not_understood, confused, want_note]
# 오답과 연결되지 않은 정리본(빈칸 채우기 등)도 과별 책에 싣는다 — 2026-09-22 「학습서」·「학습서_검증」 통합
include_all_concepts: true
include_later: true            # 「나중에 복습 — 저장하고 계속」

# 글꼴(한글 임베드). 앞에서부터 있는 것을 쓴다. PC(윈도우) · GitHub Actions(ubuntu, fonts-nanum) 둘 다.
fonts:
  regular: ["C:/Windows/Fonts/NanumGothic.ttf", "/usr/share/fonts/truetype/nanum/NanumGothic.ttf"]
  bold: ["C:/Windows/Fonts/NanumGothicBold.ttf", "/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf"]

# Google Drive — 폴더 ID 로만 가리킨다(같은 이름의 다른 폴더를 건드리지 않게).
drive:
  remote: "gdrive"
  folder_id: "1kf0ISi3zM2WJXxLI4Mu5zQQtoCfxyxp3"   # 내 드라이브 › MedKOS › 학습서 (2026-09-18 생성). 학습서 폴더(최신본은 같은 파일 ID 로 갱신). 비우면 업로드하지 않고 「설정 필요」로 보고한다
  inbox_folder_id: "1mf5XVnWZ228-qa_7i7RskGM6Z2cT64Ov"   # 내 드라이브 › MedKOS › 학습기록. 앱에서 내보낸 학습 기록(.json)을 두는 폴더 — 읽기만 한다
  archive: true          # 새 판이 나오면 archive/ 에 날짜·버전 사본을 남긴다(이미 있으면 건너뜀)

# 과목(문항·정리본 frontmatter 의 topic) → 책. 없는 과목은 topic 이름 그대로 책이 된다.
books:
  Internal Medicine: 내과 총론
  Cardiology: 순환기내과
  Pulmonology: 호흡기내과
  Gastroenterology: 소화기내과
  Nephrology: 신장내과
  Endocrinology: 내분비내과
  Hematology: 혈액종양내과
  Hematology-Oncology: 혈액종양내과
  Infectious Disease: 감염내과
  Rheumatology: 류마티스내과
  Allergy: 알레르기내과
  Neurology: 신경과
  Psychiatry: 정신건강의학과
  Pediatrics: 소아청소년과
  Obstetrics & Gynecology: 산부인과
  Obstetrics and Gynecology: 산부인과      # 정리본 5개가 이 표기를 쓴다 — 없으면 영어 이름의 책이 따로 생긴다(2026-11-15)
  General Surgery: 외과
  Surgery: 외과
  Orthopedics: 정형외과
  Dermatology: 피부과
  Ophthalmology: 안과
  Emergency Medicine: 응급의학과
  Otorhinolaryngology: 이비인후과
  ENT: 이비인후과
  Urology: 비뇨의학과
  Preventive Medicine: 예방의학
  Epidemiology: 예방의학
  # 기초의학은 학문별 책으로 나눈다(2026-11-21 사용자 결정 — 그 전에는 여섯 과목이 「기초의학」 한 권이었다).
  Physiology: 생리학
  Pathology: 병리학
  Pharmacology: 약리학
  Biochemistry: 생화학·유전
  Genetics: 생화학·유전
  Microbiology: 미생물학
  Immunology: 면역학
  Anatomy: 해부·조직·발생
  Histology: 해부·조직·발생
  Embryology: 해부·조직·발생

# 학문 꼬리표(정리본 frontmatter `discipline`) → 학문별 책. 기초 정리본(`layer: basic`)은 이 책에 실리고,
# 임상 책에 실린 정리본이 `discipline` 을 달고 있으면 그 학문 책의 목차 쪽에 「다른 책에 실린 단원」으로만 적힌다.
disciplines:
  physiology: 생리학
  pathology: 병리학
  pharmacology: 약리학
  biochemistry: 생화학·유전
  genetics: 생화학·유전
  microbiology: 미생물학
  immunology: 면역학
  anatomy: 해부·조직·발생
  histology: 해부·조직·발생
  embryology: 해부·조직·발생

# 학문 → 대조할 전공 교과서(드라이브 `교과서/`). `readable: false` 면 아직 읽을 수 없다 — 그 학문의 기초 정리본은
# `textbook_check: pending` 으로 두고 해리슨 22판으로 쓴다. 여기에 없는 학문은 `textbook_check: unavailable`.
# 장별 문서 · 읽기 도구는 2단계에서 붙는다(그때 readable 을 true 로).
textbooks:
  pathology:    {id: robbins-basic-10, title: "Robbins Basic Pathology, 10th ed.", year: 2017, readable: false}
  pharmacology: {id: katzung-14, title: "Katzung Basic & Clinical Pharmacology, 14th ed.", year: 2018, readable: false}
  histology:    {id: junqueira-13, title: "Junqueira's Basic Histology, 13th ed.", year: 2013, readable: false}
  physiology:   {id: guyton-ko, title: "Guyton and Hall 의학생리학(한글판)", readable: false, note: "스캔본 — 글자층 없음"}
